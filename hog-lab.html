<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d08">
<title>hedgepig · animation lab</title>
<style>
  :root{ --ink:#eaf6e4; --shadow:#050d08; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#070f0a;color:var(--ink);
    font-family:"Helvetica Neue",Inter,-apple-system,system-ui,sans-serif;}
  header{
    position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:12px 18px;background:rgba(5,13,8,.86);
    border-bottom:1px solid rgba(200,228,180,.12);
    backdrop-filter:blur(8px);
  }
  h1{
    font-size:11px;font-weight:300;letter-spacing:.42em;text-indent:.42em;
    text-transform:uppercase;margin:0;color:rgba(234,246,228,.9);
  }
  h1 b{font-weight:300;color:#c9e57a}
  .ctl{display:flex;align-items:center;gap:8px;
    font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(206,226,198,.6);}
  input[type=range]{width:110px;accent-color:#c9e57a}
  button{
    font:inherit;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    background:rgba(200,228,180,.08);color:rgba(226,242,206,.9);
    border:1px solid rgba(200,228,180,.22);border-radius:2px;
    padding:5px 11px;cursor:pointer;
  }
  button:hover{background:rgba(200,228,180,.16)}
  button.on{background:#c9e57a;color:#0a1a0e;border-color:#c9e57a}
  #grid{
    display:grid;gap:1px;background:rgba(200,228,180,.09);
    padding-top:52px;min-height:100%;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  }
  .stall{position:relative;background:#0d1a11;min-height:280px}
  .stall canvas{display:block;width:100%;height:100%}
  .stall .tag{
    position:absolute;left:12px;top:10px;pointer-events:none;
    font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(206,226,198,.5);text-shadow:0 1px 8px #000;
  }
  .stall .note{
    position:absolute;left:12px;bottom:10px;right:12px;pointer-events:none;
    font-size:9px;letter-spacing:.06em;color:rgba(206,226,198,.3);
  }

<body>
<header>
  <h1>hedgepig<b> · </b>animation lab</h1>
  <label class="ctl">speed <input id="spd" type="range" min="0" max="200" value="100"></label>
  <label class="ctl">size <input id="scl" type="range" min="40" max="220" value="100"></label>
  <button id="pause">pause</button>
  <button id="step">step</button>
  <button id="bones">bones</button>
  <button id="three" class="on">3d</button>
</header>
<div id="grid"></div>
<script>
(() => {
"use strict";

/* ─────────────────────────────────────────────────────────────────────────
   A bench rig for the hedgepig, away from the grass. Each stall runs one
   independent copy in a fixed state, so a change can be judged side by side
   at a size you can actually see.

   The drawing code below is a WORKING COPY of drawHog() from index.html.
   Iterate here, then port the finished function back. Nothing else in the
   game depends on this file.
   ───────────────────────────────────────────────────────────────────────── */

const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a + (b-a)*t;
const wrapAng = a => Math.atan2(Math.sin(a), Math.cos(a));

// soft radial sprite, as the game builds its glows
function glow(rgb){
  const s = 128, c = document.createElement("canvas");
  c.width = c.height = s;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0,   "rgba("+rgb+",0.9)");
  g.addColorStop(.45, "rgba("+rgb+",0.18)");
  g.addColorStop(1,   "rgba("+rgb+",0)");
  x.fillStyle = g; x.fillRect(0,0,s,s);
  return c;
}
const SP_MAGIC = glow("238,226,186");

/* ── the head rig ──────────────────────────────────────────────────────
   His features sit on a head sphere rather than being painted flat on a
   profile. `az` runs round the vertical axis: 0 points straight along his
   snout, +90° points straight out at the camera. Adding the head's yaw to
   every feature turns the whole face on the front of the head — the snout
   swings round and foreshortens, the far eye comes into view, the near one
   slides across. The body never has to move for him to look at something.

   z is the camera-facing component: positive is the near side, negative is
   round the back and hidden.
   ────────────────────────────────────────────────────────────────────── */
// Proportions taken from a real hedgehog: the spine dome is most of the animal
// and hoods forward over a SMALL pale face tucked underneath it. The face is
// cream, the short muzzle is dark, and the ears sit low at the sides of the
// head near eye level — not up on top.
const HEAD = { x:15.5, y:8, rx:9.6, ry:8.6 };

/* Taken off assets/logo/hedgepig-logo-badge.jpg, which is the character.
   Two masses only: a DARK spiny mantle over the back, and ONE cream mass
   that is face, chest and belly together. The cream is not a head — give
   him a pale sphere for a head and he reads as a seal in a wig. */
const C = {
  creamHi: "#f8f2e4",     // lit top of the cream mass
  cream:   "#ecdfc8",
  creamLo: "#d2bc9b",     // where the belly turns under
  mantleHi:"#4b3623",     // the mass under the coat. It is the SHADOW between
  mantleLo:"#221809",     // the quills, so it must be DARKER than they are —
                          // lighter, and every gap in the coat reads as bald.
  quillDk: "#46331f",     // the needles. Mostly dark — the mass reads brown
  quillLt: "#dccdae",     // and only a minority are tipped pale
  muzzle:  "#e7d4b5",     // pale, barely warmer than the face
  nose:    "#241b19",     // the only dark thing on his face
  blush:   "rgba(224,146,134,.30)",
  ear:     "#4a3628",
  limb:    "#bda07c",     // short pale legs, as the underside is pale
  paw:     "#8b6e50",
};

function facePt(az, el, yaw, pitch, rr){
  const A = az + yaw, E = el + pitch, ce = Math.cos(E);
  return {
    x: HEAD.x + HEAD.rx * (rr||1) * ce * Math.cos(A),
    y: HEAD.y - HEAD.ry * (rr||1) * Math.sin(E),
    z: ce * Math.sin(A)
  };
}
// How visible a feature is as it comes round the edge of the head. This MUST
// start at z = 0: anything on the far hemisphere is behind the head, and a ramp
// that reaches into negative z draws it straight through his skull.
const faceVis = z => clamp(z/.26, 0, 1);
/* faceVis is for features on the SIDES of his head — an eye, an ear — which
   come into view as they swing round toward the lens. Features on the FRONT of
   his face (the snout, and the mouth under it) are a different case: side-on
   their normals point straight across the view, depth 0, and they are perfectly
   visible. Gating those on faceVis put his nose at 40% and lost his mouth
   entirely in profile, which is the commonest view there is. They hide only
   once they have turned AWAY. */
const frontVis = z => clamp((z + .55)/.40, 0, 1);

const AZ_EYE = 1.30, EL_EYE = .52;      // well above and behind the muzzle, on the cream
const RR_EYE = .80;
const AZ_EAR = 2.15, EL_EAR = .62;      // top-BACK of the head. Near 90° it projects
                                        // onto the middle of his face beside the eye.
const RR_EAR = 1.50;                    // OUTSIDE the head, and drawn BEFORE it, so the
                                        // sphere buries all but the tip. An ear reads as an
                                        // ear by poking out of the head's outline; sitting
                                        // whole on the cream it is just a second eye.
const SNOUT_R = 1.12;                   // SHORT. Past about 1.25 he reads as an anteater.

/* ── the head on its own spring ─────────────────────────────────────────
   The head is not welded to the body. It has mass, so it lags a turn, and
   it overshoots on the way back. That last part is the whole point: an
   exponential lerp cannot overshoot, and the difference between "smoothly
   interpolated" and "alive" is almost entirely the settle.

   Two springs and one trailing mass:
     yaw   — where he is looking, round the vertical axis
     pitch — nose up or down
     hlag  — how far the head sits behind or ahead of where the body has
             got to, in hog-local px along his snout

   The caller sets two inputs before calling, and updateLook consumes both:
     h.turn — radians the BODY rotated this frame
     h.acc  — change in his speed, px/s²
   ────────────────────────────────────────────────────────────────────── */
const HEAD_K = 78, HEAD_D = 11;    // ~1.4Hz, damping ratio .62 — a visible settle
const PITCH_K = 54, PITCH_D = 10;
const LAG_S = .088, LG_K = 90, LG_D = 12;   // turn lag: 22° behind at full turn rate
const HL_K = 120, HL_D = 13, HL_F = .14;

/* ── he watches your pointer ───────────────────────────────────────────
   Given where the pointer is relative to him, in his own units, this is the
   head yaw that puts his snout on it. The snout's screen-x component is
   cos(hy + th) and its depth is sin(hy + th); the pointer is effectively at
   the camera plane, so we want the solution with depth >= 0, and acos
   returns exactly that branch.

   The clamp is his neck. Past about 1.35 rad he cannot follow, and what he
   does instead is strain as far round as he can, which is the right thing
   for him to do anyway.

   It sets only the spring TARGETS, so he still lags, overshoots and settles
   onto you rather than snapping to you.
   ────────────────────────────────────────────────────────────────────── */
function lookAt(h, dx, dy, th){
  const r = Math.hypot(dx, dy) || 1;
  h.yawT   = clamp(wrapAng(Math.acos(clamp(dx/r, -1, 1)) - th), -1.35, 1.35);
  h.pitchT = clamp(Math.atan2(-dy, Math.max(7, Math.abs(dx))), -.50, .55);
  h.lookLock = .5;                  // and he stops glancing idly about
}

function updateLook(h, dt){
  h.lookLock = Math.max(0, (h.lookLock || 0) - dt);
  h.lookT -= dt;
  if (h.lookT <= 0 && h.lookLock <= 0){    // not while he is watching you
    h.lookT = lerp(.9, 2.8, Math.random());
    const r = Math.random();
    /* Head yaw is BODY-relative — 0 is straight along his own snout. To look
       at the lens he must turn his head by his own heading, which is why the
       first branch reads h.hd: a hedgehog walking at you is already looking
       at you and need not turn at all. Camera-relative gaze was wrong; it
       counter-rotated his head every time his body turned. */
    h.yawT   = r < .26 ? clamp(wrapAng(h.hd), -1.35, 1.35)  // straight at you
             : r < .52 ? lerp(-.85, -.25, Math.random())    // away, over his shoulder
             :           lerp(-.45,  .45, Math.random());   // a glance round
    h.pitchT = h.dip > .5 ? lerp(-.44, -.10, Math.random()) // nose in the grass
                          : lerp(-.22,  .40, Math.random());
  }

  /* The body swings under the head and the head holds its bearing, so a body
     turn shows up as the OPPOSITE turn in his head's body-relative yaw. The
     dir term is because his rig azimuth is measured camera-ward, not
     screen-ward: turning toward the lens is a falling heading when he faces
     right and a rising one when he faces left.

     The lag is its own spring, and it is driven by the turn RATE rather than
     by adding the turn straight onto the yaw. Added as a position the spring
     ends a sustained turn carrying the whole restoring velocity, and the head
     whipped 17-22° PAST where it should have stopped — a wobble, not a settle.
     Driven as a rate target it holds 22° behind through the turn and comes
     back overshooting by about a degree. */
  const rate = (h.turn || 0) / Math.max(dt, 1/240);
  h.turn = 0;
  const lagT = clamp(-rate * LAG_S, -.62, .62);
  h.lagV += (LG_K*(lagT - h.lag) - LG_D*h.lagV) * dt;
  h.lag  += h.lagV * dt;

  // the ears flick: occasional and fast. Anything else can poke h.flick to 1
  // (being called, taking a hit) and it will read as the ear reacting.
  h.earT -= dt;
  if (h.earT <= 0){ h.earT = lerp(1.4, 4.5, Math.random()); h.flick = 1; }
  h.flick = Math.max(0, h.flick - dt*6.5);

  h.yawV   += (HEAD_K *(h.yawT   - h.yaw)   - HEAD_D *h.yawV)   * dt;
  h.yaw    += h.yawV * dt;
  h.pitchV += (PITCH_K*(h.pitchT - h.pitch) - PITCH_D*h.pitchV) * dt;
  h.pitch  += h.pitchV * dt;

  // A mass on a spring inside an accelerating body: it falls behind as he
  // sets off and carries on forward as he pulls up.
  h.hlagV += (-(h.acc || 0)*HL_F - HL_K*h.hlag - HL_D*h.hlagV) * dt;
  h.hlag   = clamp(h.hlag + h.hlagV*dt, -4, 4);
  h.acc = 0;
}

/* ── one hedgepig ─────────────────────────────────────────────────────── */
function makeHog(){
  return {
    dir:1, walk:0, gait:0, dip:0, curl:0, arrive:0, shiver:0,
    blink:0, blinkT:2.4, hd:Math.PI/2, x:0,   // 90° = profile, facing right
    yaw:0, pitch:0, yawT:0, pitchT:0, lookT:0,
    yawV:0, pitchV:0, hlag:0, hlagV:0, lag:0, lagV:0, turn:0, acc:0, spdPrev:0, flick:0, earT:1.2, lookLock:0
  };
}

let showBones = false;
const quality = 1;    // the game's adaptive scaler; here he is always full detail

// A faithful copy of the current in-game drawing, parameterised so the rig can
// drive several at once. `t` is that stall's own clock.
function drawHog(ctx, hog, t, K, cx, cy){
  const c = hog.curl, g = hog.gait * (1 - c), d = hog.dip * (1 - c);
  const a = 1;

  const p     = hog.walk;
  const bob   = Math.sin(p*2)*2.1*g + Math.sin(t*2.1)*0.8*(1-g);
  const pitch = Math.sin(p*2 + .7)*.05*g - hog.arrive*.06;
  const sqz   = 1 + Math.sin(p*2 + 1.3)*.055*g;
  const shiv  = hog.shiver * (Math.sin(t*34)*1.5 + Math.sin(t*23.3)*.9);

  /* ── the snuffle ──────────────────────────────────────────────────────
     A hedgehog sniffing is not a jittering dot. It is a TRAIN OF DISCRETE
     SNIFFS, and the whole muzzle moves on each one — snout, nose, whiskers
     together — because they are all one piece of him.

     `sniff` is that train: squaring a half-rectified sine gives separate
     pulses with a rest between, rather than a continuous buzz. It is fed
     into the head rig's pitch and yaw further down, so the muzzle works and
     the nose only flares on top of it. Sliding the nose across a muzzle
     that never moved was what read as a twitching speck. */
  const sniffR  = 6.5 + d*4.5;                                  // sniffs/sec
  const sniff   = Math.pow(Math.max(0, Math.sin(t*sniffR)), 2);  // 0..1, in pulses
  const jitter  = Math.sin(t*27)*.5 + Math.sin(t*41)*.3;         // fine tremor on top
  const noseTw  = (.10 + d*.35) * jitter + hog.shiver*Math.sin(t*30)*.5;
  const headDip = d*4.6;
  const headSw  = d*Math.sin(t*1.7)*2.4;
  const eyeH    = 1 - hog.blink*.92;

  /* ── the ears ─────────────────────────────────────────────────────────
     They FLICK. They do not bob: a constant sine on the ear's y was a 3px
     ear sliding up and down for ever, which is the first thing you notice
     and the last thing an ear does. A flick is fast, occasional, and it is
     a ROTATION — so it is applied as one, not as a translation. */
  const earTilt = hog.flick*.55 + c*-.45 + (hog.gait > .5 ? -.12 : 0);
  const earSq   = 1 - hog.flick*.22;

  ctx.save();
  ctx.translate(cx + shiv, cy);
  ctx.scale(hog.dir * K, K);
  ctx.translate(0, bob);
  ctx.rotate(pitch + c*.25);

  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = a * (.09 + .05*Math.sin(t*3.2));
  ctx.drawImage(SP_MAGIC, -80, -84, 160, 160);
  ctx.globalCompositeOperation = "source-over";

  ctx.globalAlpha = a*.32; ctx.fillStyle = "#02100a";
  ctx.beginPath(); ctx.ellipse(0, 19, 28 + c*4, 6.5, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = a;

  const legUp = 1 - c;
  function leg(x0, ph, base){
    if (legUp < .05) return;
    const sw = Math.max(0, Math.sin(ph));
    const fx = x0 + Math.cos(ph)*3.4*g;
    const fy = (base - sw*3.0*g) * legUp;
    ctx.strokeStyle = C.limb; ctx.lineWidth = 4.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, 13*legUp); ctx.lineTo(fx, fy - 1); ctx.stroke();
    ctx.fillStyle = C.paw;
    ctx.beginPath(); ctx.ellipse(fx + .8, fy, 3.0, 2.4, 0, 0, TAU); ctx.fill();
  }
  leg(-12, p + Math.PI, 20.5);
  leg(  9, p,           20.5);
  leg( -7, p,           22.0);
  leg( 14, p + Math.PI, 22.0);

  /* ── the cream mass ───────────────────────────────────────────────────
     Face, chest and belly in ONE shape. There is deliberately no separate
     pale head: in the reference the cream of his face runs straight down
     into his chest, and the mantle is laid over the top of it. A pale
     sphere for a head is what made him read as a seal. The head rig below
     only uses HEAD as a coordinate frame for the features. */
  const bgc = ctx.createLinearGradient(0, -15, 0, 21);
  bgc.addColorStop(0,   C.creamHi);
  bgc.addColorStop(.60, C.cream);
  bgc.addColorStop(1,   C.creamLo);
  ctx.fillStyle = bgc;
  ctx.beginPath(); ctx.ellipse(1.5, 5.5, 24.5, 14*sqz, -.03, 0, TAU); ctx.fill();

  /* ── the spiny mantle ─────────────────────────────────────────────────
     The mass that IS his back. It runs from over his brow, round the top,
     and all the way DOWN to the ground at the rump — that lower sweep is
     the whole difference between a mantle and a wig. It is dark brown;
     only a minority of needles are tipped pale. Four passes: dark needles
     for the silhouette, the mantle fill, fine streaks for texture, then
     the pale tips. */
  const a0 = lerp(-4.25, -4.95, c);      // sweeping down round the rump
  const a1 = lerp(-0.12,  1.33, c);      // right over the brow, never across it
  const mx = -4*(1-c), my = -4*(1-c);
  const drx = lerp(23, 21.5, c), dry = lerp(17.5, 21.5, c);

  // Needles rake toward his rump rather than radiating dead straight, which
  // is the difference between a hedgehog and a sunburst.
  function quill(ang, rx, ry, len, wid, col, rake){
    const ta = ang + (rake || 0);
    const bx = mx + Math.cos(ang)*rx,  by = my + Math.sin(ang)*ry;
    const tx = mx + Math.cos(ta)*(rx+len), ty = my + Math.sin(ta)*(ry+len)*.94;
    const nx = -Math.sin(ang)*wid, ny = Math.cos(ang)*wid;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(bx + nx, by + ny); ctx.lineTo(tx, ty); ctx.lineTo(bx - nx, by - ny);
    ctx.closePath(); ctx.fill();
  }
  // u = 0 at the rump, 1 at the brow. The rump needles are the longest, as
  // they are on a real hedgehog and in the badge.
  const qlen = u => lerp(11.6, 6.8, u*u);
  const RAKE = -.16 * (1 - c);

  // 1. dark needles, fine and dense — this pass is the silhouette
  for (let i=0;i<92;i++){
    const u = i/91, wob = Math.sin(p*2 + i*.55)*.035*g;
    quill(lerp(a0, a1, u) + wob, drx*.97, dry*.97,
          (qlen(u) + Math.sin(i*1.9)*1.9) * (1 + c*.18), 1.25 + c*.7, C.quillDk, RAKE);
  }

  /* 2. the mantle itself. NOT an ellipse: an arc round the back and top,
        closed by a diagonal front edge running from the brow down and back
        to behind his front leg. Drawn as an ellipse it bulged forward in a
        convex arc across the middle of him and read as a beetle's shell. */
  const bx0 = mx + Math.cos(a1)*drx*.98, by0 = my + Math.sin(a1)*dry*.98;   // brow
  const rx0 = mx + Math.cos(a0)*drx*.98, ry0 = my + Math.sin(a0)*dry*.98;   // rump
  const dg = ctx.createLinearGradient(0, my - dry, 0, my + dry);
  dg.addColorStop(0,   C.mantleHi);
  dg.addColorStop(1,   C.mantleLo);
  ctx.fillStyle = dg;
  ctx.beginPath();
  ctx.ellipse(mx, my, drx*.98, dry*.98, 0, a1, a0, true);
  ctx.quadraticCurveTo((bx0 + rx0)/2 + 9, (by0 + ry0)/2 + 5, bx0, by0);
  ctx.closePath(); ctx.fill();

  // 3. fine streaks inside it, running out to the rim so they read as
  //    needles lying along the mantle and not as marks painted on a dome
  for (let i=0;i<44;i++){
    const u = i/43;
    const ang = lerp(a0 + .05, a1 - .05, u) + Math.sin(p*2 + i*.9)*.045*g;
    const r0 = .42 + (i%4)*.11;
    ctx.strokeStyle = i%3 ? C.quillDk : C.quillLt;
    ctx.globalAlpha = a * (i%3 ? .30 : .12);
    ctx.lineWidth = 1.1; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(mx + Math.cos(ang)*drx*r0,  my + Math.sin(ang)*dry*r0);
    ctx.lineTo(mx + Math.cos(ang)*drx*.99, my + Math.sin(ang)*dry*.99);
    ctx.stroke();
  }
  ctx.globalAlpha = a;

  // 4. the pale tips — every third needle only, so the mass stays brown
  for (let i=0;i<18;i++){
    const u = i/17, wob = Math.sin(p*2 + i*.62)*.04*g;
    quill(lerp(a0 + .06, a1 - .06, u) + wob, drx*.99, dry*.99,
          (qlen(u)*.62 + Math.sin(i*2.6)*1.2) * (1 + c*.18), 1.1, C.quillLt, RAKE);
  }

  // He pulls his head IN as he curls, and it is gone well before the ball has
  // closed. Fading cream over dark brown only gives grey, and fading on 1-c
  // left a translucent grey ghost of a face lying over the spines for the whole
  // middle of the curl. So he stays opaque and is pulled in to nothing; the
  // alpha only catches the last of it.
  const fa = clamp((1 - c*1.85)*1.7, 0, 1);
  if (fa > .02){
    ctx.globalAlpha = a * fa;

    // Every sniff tips the whole muzzle up and swings it a little, so snout,
    // nose and whiskers work as one piece. This is the snuffle; the nose's own
    // flare below is only the top note on it.
    const sniffP = sniff * (.055 + d*.115) + jitter*(.008 + d*.020)
                 + hog.shiver*Math.sin(t*26)*.03;
    const sniffY = Math.sin(t*sniffR*.5) * (.03 + d*.075);
    const yaw   = hog.yaw + hog.lag + sniffY + d*Math.sin(t*1.3)*.16;
    // the trailing head also noses down as it is thrown forward, and lifts as
    // it is left behind — one spring, read twice
    const hEl   = hog.pitch + sniffP + headDip*.012 - hog.hlag*.030;
    const cy2 = Math.cos(yaw), sy2 = Math.sin(yaw);

    ctx.save();
    // hlag slides the face under the hood, so the dome stays put and only his
    // head moves — which is what a small face under a big spine mass does
    ctx.translate(headSw*.4 + hog.hlag, headDip*.5 + Math.abs(hog.hlag)*.18);
    // retracting the head: scaling about the body origin draws it back and up
    // into the ball, which is what he actually does. Never let this reach 0.
    if (c > .005) ctx.scale(1 - c*.85, 1 - c*.85);

    // ── the cheek. Filled with the SAME gradient as the chest, so there is
    //    no seam and no separate head — it only guarantees cream under the
    //    features when he pitches his head about, and it is what cuts the
    //    round of his head out of the mantle.
    ctx.fillStyle = bgc;
    ctx.beginPath();
    ctx.ellipse(HEAD.x + sy2*1.4, HEAD.y - 1, HEAD.rx*(1 + Math.abs(sy2)*.10), HEAD.ry*.96,
                -.04, 0, TAU);
    ctx.fill();

    // ── the ears, ON the cream and drawn AFTER the cheek fill. Under it they
    //    were painted over, and out at rr > 1 they landed on the mantle and
    //    were dark on dark — either way they were simply not there.
    for (const side of [-1, 1]){
      const e2 = facePt(side*AZ_EAR, EL_EAR, yaw, hEl, RR_EAR);
      const v2 = faceVis(e2.z) * (side < 0 ? .8 : 1);
      if (v2 <= .02) continue;
      const sc = .82 + .18*Math.max(0, e2.z);
      ctx.globalAlpha = a * fa * v2;
      // kept dark and plain: a bright inner here reads as a second eye
      ctx.fillStyle = side < 0 ? "#3a2a1e" : C.ear;
      ctx.beginPath();
      // an angled OVAL, half buried in the mantle. Drawn round and out on
      // the cream it read as a second eye sitting beside the real one.
      ctx.ellipse(e2.x, e2.y, 2.15*sc*earSq, 3.5*sc, -.34 + earTilt*side, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = a * fa;

    // ── the muzzle: short, and barely warmer than the face. The contrast on
    //    his face comes from the nose alone.
    const tip = facePt(0, -.16, yaw, hEl, SNOUT_R);
    const bse = facePt(0, -.16, yaw, hEl, .26);
    const dx = tip.x - bse.x, dy = tip.y - bse.y;
    const slen = Math.hypot(dx, dy);
    ctx.save();
    ctx.translate((tip.x + bse.x)/2, (tip.y + bse.y)/2);
    ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = C.muzzle;
    ctx.beginPath(); ctx.ellipse(0, 0, Math.max(4.2, slen*.5 + 2.2), 2.9, 0, 0, TAU); ctx.fill();
    ctx.restore();

    // ── the cheek blush, which is a surprising amount of the charm. Placed
    //    off the EYE, not off the head, so it can never land on the muzzle.
    const bl = facePt(AZ_EYE*.80, EL_EYE - .62, yaw, hEl, .95);
    if (bl.z > .04){
      ctx.globalAlpha = a * fa * clamp(bl.z*2.4, 0, 1);
      ctx.fillStyle = C.blush;
      ctx.beginPath(); ctx.ellipse(bl.x, bl.y, 3.2, 2.2, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = a * fa;
    }

    // ── the nose. It rides on the muzzle rather than sliding about on it, and
    //    FLARES on each sniff — a wet nose working is a change of shape, not a
    //    change of position. It squashes wider than it is tall as it opens.
    const near = .5 + .5*Math.max(0, sy2);
    const fl   = sniff * (.30 + d*.34);
    const nx2 = tip.x + noseTw*.35*cy2, ny2 = tip.y - fl*.9;
    const nr  = 1.8 + near*.7;
    ctx.fillStyle = C.nose;
    ctx.beginPath();
    ctx.ellipse(nx2, ny2, nr*(1 + fl*.34), nr*.88*(1 - fl*.14), .1, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.ellipse(nx2 - nr*.3, ny2 - nr*.4, nr*.34, nr*.26, -.3, 0, TAU); ctx.fill();

    // ── his mouth, tucked under the nose. Narrows as he turns to face you.
    ctx.strokeStyle = "rgba(74,52,40,.80)"; ctx.lineWidth = 1.15; ctx.lineCap = "round";
    const mw = 3.1 * Math.abs(cy2) + 1.4;
    ctx.beginPath();
    ctx.moveTo(nx2 - mw, ny2 + nr*1.5);
    ctx.quadraticCurveTo(nx2, ny2 + nr*2.4, nx2 + mw, ny2 + nr*1.5);
    ctx.stroke();

    // whiskers — short and fine. Long straight ones read as fishing line.
    ctx.globalAlpha = a * fa * .17;
    ctx.strokeStyle = "rgba(246,240,228,1)"; ctx.lineWidth = .55;
    for (let side=-1; side<=1; side+=2)
      for (let i=0;i<2;i++){
        const spread = (i - .5) * 2.2 + side*1.1;
        const reach  = 7 * (.45 + .55*Math.abs(cy2)) * (1 + sniff*.28);
        ctx.beginPath();
        ctx.moveTo(nx2, ny2 + 1);
        ctx.quadraticCurveTo(nx2 + cy2*reach*.5 + side*1.8, ny2 + spread + 1.6,
                             nx2 + cy2*reach + side*Math.abs(sy2)*4.5, ny2 + spread*1.7);
        ctx.stroke();
      }
    ctx.globalAlpha = a * fa;

    // ── eyes: small, round, glossy black on the cream
    function eye(az, far){
      const e = facePt(az, EL_EYE, yaw, hEl, RR_EYE);
      const v = faceVis(e.z) * (far ? .82 : 1);
      if (v <= .02) return;
      const sc = (.74 + .26*Math.max(0, e.z)) * (far ? .94 : 1);
      ctx.globalAlpha = a * fa * v;
      ctx.fillStyle = "#120c0b";
      ctx.beginPath(); ctx.ellipse(e.x, e.y, 1.78*sc, 2.0*sc*eyeH, 0, 0, TAU); ctx.fill();
      if (eyeH > .35){
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.beginPath(); ctx.arc(e.x + .60*sc, e.y - .68*sc, .66*sc, 0, TAU); ctx.fill();
      }
      // the brow crease — small, but it is most of what makes him look sweet
      ctx.strokeStyle = "rgba(74,54,42,.30)"; ctx.lineWidth = .8*sc;
      ctx.beginPath(); ctx.arc(e.x, e.y, 2.5*sc, -2.5, -1.0); ctx.stroke();
      ctx.globalAlpha = a * fa;
    }
    eye(-AZ_EYE, 1);
    eye( AZ_EYE, 0);

    ctx.restore();

    // ── the hood. In the reference the spines come down over the brow, so a
    //    short arc of them is redrawn HERE, after the face, to overlap it.
    //    Without this the face reads as painted on top of the dome.
    ctx.globalAlpha = a * fa;
    for (let i=0;i<16;i++){
      const t2 = i/15;
      // crowns the top of his head only — push the end of this arc past about
      // -0.22 and the quills start raking down across his face
      const ang = lerp(-1.45, -0.16, t2) + Math.sin(p*2 + i*.62)*.04*g;
      quill(ang, drx*.90, dry*.90, 6.4 + Math.sin(i*2.2)*1.7, 1.5,
            i%3 ? C.quillDk : C.quillLt, -.10);
    }
    ctx.globalAlpha = a;
  }

  if (hog.shiver > .35){
    ctx.globalAlpha = a * hog.shiver * (.35 + .3*Math.sin(t*11));
    ctx.strokeStyle = "rgba(198,226,246,1)"; ctx.lineWidth = 1.5;
    for (let i=0;i<2;i++){
      ctx.beginPath(); ctx.arc(-6, -6, 30 + i*7, -2.5, -1.6); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}


/* ═══ the hedgepig in three dimensions ═════════════════════════════════════
   He is geometry now rather than an arrangement of shapes. A body ellipsoid,
   a head sphere, and a coat of quills rooted on the ellipsoid's surface with
   real outward normals — projected orthographically and drawn back to front,
   painter's algorithm.

   Why bother:

   - Every 2D version only worked from one angle. The mantle's front edge had
     to be hand-drawn as a diagonal that is only right in profile; here it is
     a PLANE through his body, and correct from everywhere for nothing.
   - Quills pointing at the lens foreshorten to stubs while the ones on the
     rim stay long spikes. That contrast is what makes a quill coat read at
     all, and it is the one thing a 2D fan of triangles can never do — it can
     only ever draw the rim and then paint "texture" on the middle, which is
     precisely why he kept reading as a smooth loaf with a fringe.
   - Turning is free and continuous. `ctx.scale(dir,1)` and its instant
     mirror flip are gone, which was improvement #1 on the list.
   - Real normals mean real shading, so he has form instead of a gradient.

   Orthographic on purpose: §1 of the handover says the field has no
   perspective falloff, so neither does he.

   Model space: +x along his snout, +y up, +z across him. Canvas y is down,
   so screen y = -y. Ground is y = -20.5.
   ═════════════════════════════════════════════════════════════════════════ */
const BODY = { a:26, b:16.5, c:19.5 };       // semi-axes: fore-aft, up, across
const HD_R = 9.4;                            // head sphere radius. Bigger than
                                             // this and nose-on he is all head.
const HD_C = { x:20.0, y:-1.7, z:0 };        // where the head sits on him
const GROUND = -20.5;

// The mantle boundary is a plane cutting forward-and-down. Quills root
// OUTSIDE it; the cream face-chest-belly is the part inside. This single
// constant replaces the hand-tuned diagonal path of the 2D version.
const MN = { x:.821, y:-.571, z:0 };
const MK0 = .30;                             // 0 = half of him, higher = more coat

// A golden-angle spiral over the sphere: even, deterministic, and it never
// tiles — which §5 of the handover asks of anything procedural.
const QUILLS = (() => {
  const out = [], N = 340, ga = Math.PI*(3 - Math.sqrt(5));
  for (let i=0;i<N;i++){
    const ny = 1 - (i/(N-1))*2, rr = Math.sqrt(Math.max(0, 1 - ny*ny));
    const th = ga*i;
    const n = { x:Math.cos(th)*rr, y:ny, z:Math.sin(th)*rr };
    const jit = (Math.sin(i*12.9898)*.5 + .5);
    out.push({
      n,
      d: n.x*MN.x + n.y*MN.y + n.z*MN.z,     // which side of the mantle plane
      lf: (.78 + jit*.46),                    // length jitter
      // Do NOT pick these off i: a regular pick over a golden-angle spiral IS
      // phyllotaxis, and it drew a pinecone. Hashed, so they scatter.
      pale: (Math.sin(i*78.233)*.5 + .5) < .62,
      wob: (Math.sin(i*4.1)*.5 + .5) * 6.3     // phase, so the coat is not one mass
    });
  }
  return out;
})();

/* Shading is precomputed into a small table. Building a colour string per
   quill per frame would be ~250 string allocations a frame, and §6 of the
   handover records killing exactly that pattern for a real win. */
const QSHADE = 10;
const QCOL = [[70,51,31], [214,199,168], [124,104,76], [58,42,26]].map(rgb =>
  Array.from({length:QSHADE}, (_, s) => {
    const k = .52 + .48*(s/(QSHADE-1));
    return "rgb(" + Math.round(rgb[0]*k) + "," + Math.round(rgb[1]*k) + "," +
                    Math.round(rgb[2]*k) + ")";
  }));
const L3 = { x:-.30, y:.86, d:.41 };          // light: up, a little front-left

// a point on the head sphere. az 0 is along the snout, +az swings toward the
// lens; el is up. Returns a UNIT direction in model space, so it doubles as
// the outward normal for visibility.
function hRot(v, hy, hp){
  const cp = Math.cos(hp), sp = Math.sin(hp);
  const px = v.x*cp - v.y*sp, py = v.x*sp + v.y*cp;
  const cy = Math.cos(hy), sy = Math.sin(hy);
  return { x: px*cy - v.z*sy, y: py, z: px*sy + v.z*cy };
}

/* The badge has spines over the crown of his head, not just on his back, and
   a bald cream head with one dark ear on it is most of what still read as
   wrong. These root on the HEAD sphere and ride its yaw and pitch. */
const HQUILLS = (() => {
  const out = [], N = 110, ga = Math.PI*(3 - Math.sqrt(5));
  for (let i=0;i<N;i++){
    const ny = 1 - (i/(N-1))*2, rr = Math.sqrt(Math.max(0, 1 - ny*ny));
    const th = ga*i;
    const n = { x:Math.cos(th)*rr, y:ny, z:Math.sin(th)*rr };
    if (n.x*MN.x + n.y*MN.y + n.z*MN.z > -.34) continue;  // crown and nape ONLY:
                                                          // past this it rakes his face
    let dx = n.x - .40, dy = n.y - .06, dz = n.z;         // raked back off the brow
    const dl = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
    const jit = Math.sin(i*12.9898)*.5 + .5;
    out.push({ n, dir:{ x:dx/dl, y:dy/dl, z:dz/dl },
               len: (3.2 + jit*2.2),
               pale: (Math.sin(i*78.233)*.5 + .5) < .30 });
  }
  return out;
})();

function headDir(az, el, hy, hp){
  const ce = Math.cos(el);
  const lx = ce*Math.cos(az), ly = Math.sin(el), lz = ce*Math.sin(az);
  const cp = Math.cos(hp), sp = Math.sin(hp);          // pitch, about across
  const px = lx*cp - ly*sp, py = lx*sp + ly*cp;
  const cy = Math.cos(hy), sy = Math.sin(hy);          // yaw, about up
  return { x: px*cy - lz*sy, y: py, z: px*sy + lz*cy };
}

function drawHog3(ctx, hog, t, K, cx, cy){
  const c = hog.curl, g = hog.gait*(1 - c), d = hog.dip*(1 - c);
  const a = 1;

  const p    = hog.walk;
  const bob  = Math.sin(p*2)*2.1*g + Math.sin(t*2.1)*0.8*(1-g);
  const lean = Math.sin(p*2 + .7)*.05*g - hog.arrive*.06;
  const sqz  = 1 + Math.sin(p*2 + 1.3)*.055*g;
  const shiv = hog.shiver * (Math.sin(t*34)*1.5 + Math.sin(t*23.3)*.9);

  const sniffR = 6.5 + d*4.5;
  const sniff  = Math.pow(Math.max(0, Math.sin(t*sniffR)), 2);
  const jitter = Math.sin(t*27)*.5 + Math.sin(t*41)*.3;
  const eyeH   = 1 - hog.blink*.92;
  const earTilt = hog.flick*.55 + c*-.45;
  const earSq   = 1 - hog.flick*.22;

  // ── the one rotation. th = 0 is profile facing right, +90° is nose-on.
  //    hog.hd is his heading: 0 walks toward the lens, +90° walks right.
  const th = Math.PI/2 - hog.hd;
  const ct = Math.cos(th), st = Math.sin(th);
  const PX = q => q.x*ct - q.z*st;            // screen x
  const PD = q => q.x*st + q.z*ct;            // depth, + is toward the lens

  // body axes: he rounds up into a ball as he curls, and breathes
  const A = lerp(BODY.a, 21.5, c), B = lerp(BODY.b, 21.5, c)*sqz,
        Cc = lerp(BODY.c, 21.5, c);
  const MK = lerp(MK0, 1.01, c);              // curled, the coat closes over him

  ctx.save();
  ctx.translate(cx + shiv, cy + bob);
  ctx.rotate(lean);
  ctx.scale(K, K);

  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = a * (.09 + .05*Math.sin(t*3.2));
  ctx.drawImage(SP_MAGIC, -80, -84, 160, 160);
  ctx.globalCompositeOperation = "source-over";

  ctx.globalAlpha = a*.32; ctx.fillStyle = "#02100a";
  ctx.beginPath(); ctx.ellipse(0, -GROUND - 1.5, 27 + c*4, 6.5, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = a;

  /* ── the coat. One pass over the quills, projected and depth-sorted. The
        far half is drawn, then the body, then the near half — so the far
        quills show only where they stick out past his outline, which is the
        jagged silhouette, and the near ones lie over his back as stubs. */
  const qs = [];
  // The adaptive scaler thins HIS coat before it thins the field: the grass is
  // the thing you are looking at, and §6's budget has no room for a coat that
  // costs more than the meadow it stands in.
  const thin = quality < .72;
  for (let i=0;i<QUILLS.length;i++){
    if (thin && (i & 1)) continue;
    const Q = QUILLS[i];
    if (Q.d > MK) continue;
    const n = Q.n;
    const px = A*n.x, py = B*n.y, pz = Cc*n.z;             // root, on the surface
    // the true outward normal of an ellipsoid is the gradient, not the radius
    let gx = n.x/A, gy = n.y/B, gz = n.z/Cc;
    const gl = Math.sqrt(gx*gx + gy*gy + gz*gz) || 1;
    gx /= gl; gy /= gl; gz /= gl;
    // raked toward his rump, and the whole coat stirs as he trots
    const stir = Math.sin(p*2 + Q.wob)*.055*g;
    let dx = gx - .58 + stir, dy = gy - .16, dz = gz;
    const dl = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
    dx /= dl; dy /= dl; dz /= dl;
    const len = lerp(12.6, 6.0, (n.x + 1)/2) * Q.lf * (1 + c*.16);
    const tx = px + dx*len, ty = py + dy*len, tz = pz + dz*len;

    const bX = px*ct - pz*st, bD = px*st + pz*ct;
    const tX = tx*ct - tz*st, tD = tx*st + tz*ct;
    // lit off the quill's own direction, in screen space
    const wX = dx*ct - dz*st, wD = dx*st + dz*ct;
    const lit = Math.max(0, wX*L3.x + dy*L3.y + wD*L3.d);
    qs.push({ bX, bY:-py, tX, tY:-ty, D:(bD + tD)*.5,
              s:(lit*(QSHADE - 1))|0, pale:Q.pale, rim: Math.abs(wD) < .62 });
  }
  qs.sort((u, v) => u.D - v.D);

  const bgc = ctx.createLinearGradient(0, -B, 0, B*1.15);
  bgc.addColorStop(0,   C.creamHi);
  bgc.addColorStop(.60, C.cream);
  bgc.addColorStop(1,   C.creamLo);

  /* ── whether you can see his head at all ──────────────────────────────
     His head sphere sits INSIDE the body ellipsoid — (20.4/26)² + (1.6/16.5)²
     is 0.62, comfortably within it — so the two interpenetrate, and that is
     the one case the painter's algorithm cannot sort. Depth-testing the head
     against the body puts his face behind his own flank in profile, where
     the head's depth is exactly zero.

     What is actually true is that the only visible part of his head is the
     bit that PROTRUDES out of the front of him, and you stop seeing that
     protrusion as it turns away from the lens. So the whole face group fades
     on how much his snout axis points toward you: full in profile and
     nose-on, gone by the time he has his back to you. The features already
     hide themselves individually on their own normals; this is the mass they
     sit on. Before it, you could see his whole face straight through him. */
  const headVis = clamp((st + .55)/.40, 0, 1);
  const fa = clamp((1 - c*1.85)*1.7, 0, 1) * headVis;

  function drawFace(){
    if (fa <= .02) return;
    ctx.globalAlpha = a * fa;
    const rt = 1 - c*.85;                       // he pulls his head in as he curls
    const hc = { x: HD_C.x*rt + hog.hlag, y: HD_C.y*rt - d*3.4, z: HD_C.z };
    const hcX = hc.x*ct - hc.z*st;

    // head yaw is BODY-relative now, which is what an animal's neck is. The
    // gaze aim from updateLook is converted where it is set.
    const hy = hog.yaw + hog.lag + Math.sin(t*sniffR*.5)*(.03 + d*.075)
             + d*Math.sin(t*1.3)*.16;
    const hp = hog.pitch + sniff*(.055 + d*.115) + jitter*(.008 + d*.020)
             - hog.hlag*.030 - d*.34 + hog.shiver*Math.sin(t*26)*.03;

    const R = HD_R*rt;
    const HP = (dir, rr) => ({
      X: (hc.x + R*rr*dir.x)*ct - (hc.z + R*rr*dir.z)*st,
      Y: -(hc.y + R*rr*dir.y),
      D:  (hc.x + R*rr*dir.x)*st + (hc.z + R*rr*dir.z)*ct,
      n:  dir.x*st + dir.z*ct                   // the normal's depth: is it facing us
    });

    // ── the coat over his crown. Built here rather than in the body list
    //    because it rides the head's own yaw and pitch.
    const crown = [];
    for (const Q of HQUILLS){
      const rn = hRot(Q.n, hy, hp), rd = hRot(Q.dir, hy, hp);
      const bx = hc.x + R*rn.x, by = hc.y + R*rn.y, bz = hc.z + R*rn.z;
      const l  = Q.len * rt;
      const tx = bx + rd.x*l, ty = by + rd.y*l, tz = bz + rd.z*l;
      const wX = rd.x*ct - rd.z*st, wD = rd.x*st + rd.z*ct;
      crown.push({
        bX: bx*ct - bz*st, bY: -by, tX: tx*ct - tz*st, tY: -ty,
        D: (bx*st + bz*ct + tx*st + tz*ct)*.5,
        s: (Math.max(0, wX*L3.x + rd.y*L3.y + wD*L3.d)*(QSHADE - 1))|0,
        pale: Q.pale
      });
    }
    crown.sort((u, v) => u.D - v.D);
    // above his eyeline only. Below it they are debris stuck to his cheek,
    // which is exactly what the old 2D hood did when drawn here.
    const brow = crown.filter(q => q.bY < -hc.y - R*.30);
    function crownQuills(list, from, to){
      for (let i=from;i<to;i++){
        const q = list[i];
        let vx = q.tX - q.bX, vy = q.tY - q.bY;
        let vl = Math.hypot(vx, vy);
        if (vl < 1.1){ const k = 1.1/(vl || 1); vx *= k; vy *= k; vl = 1.1; }
        const nx = -vy/vl*1.35, ny = vx/vl*1.35;
        ctx.fillStyle = QCOL[q.pale ? 1 : 3][q.s];
        ctx.beginPath();
        ctx.moveTo(q.bX + nx, q.bY + ny);
        ctx.lineTo(q.bX + vx, q.bY + vy);
        ctx.lineTo(q.bX - nx, q.bY - ny);
        ctx.closePath(); ctx.fill();
      }
    }
    /* ALL of the crown coat goes down before his head, so the cream of his
       face covers the roots and only the tips show as a fringe round the top
       of his head. Drawn after the face — as the 2D hood was — they landed on
       his cheek and read as debris stuck to it, not as spines. */
    crownQuills(crown, 0, crown.length);

    // ears, BEFORE the head sphere so it buries all but the tip
    for (const side of [-1, 1]){
      const e = HP(headDir(side*AZ_EAR, EL_EAR, hy, hp), 1.0);
      const v = faceVis(e.n) * (side < 0 ? .8 : 1);
      if (v <= .02) continue;
      const sc = .82 + .18*Math.max(0, e.n);
      ctx.globalAlpha = a * fa * v;
      ctx.fillStyle = side < 0 ? "#3a2a1e" : C.ear;
      ctx.beginPath();
      ctx.ellipse(e.X, e.Y, 2.30*sc*earSq, 2.95*sc, -.34 + earTilt*side, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = a * fa;

    // a sphere projects to a circle, whatever the rotation
    ctx.fillStyle = bgc;
    ctx.beginPath(); ctx.arc(hcX, -hc.y, R, 0, TAU); ctx.fill();


    // the muzzle: a short cone along his snout, drawn as the projected axis.
    // When the snout points away it is behind his own head, so everything hung
    // off it — muzzle, nose, mouth, whiskers — goes with it. Without this his
    // nose sat on the back of his head as he walked away.
    const tipD = headDir(0, -.16, hy, hp);
    const snD = tipD.x*st + tipD.z*ct;
    const snV = frontVis(snD);
    const tip = HP(tipD, SNOUT_R), bse = HP(tipD, .26);
    const mdx = tip.X - bse.X, mdy = tip.Y - bse.Y;
    const slen = Math.hypot(mdx, mdy);
    if (snV > .02){
    ctx.globalAlpha = a * fa * snV;
    ctx.save();
    ctx.translate((tip.X + bse.X)/2, (tip.Y + bse.Y)/2);
    ctx.rotate(Math.atan2(mdy, mdx));
    ctx.fillStyle = C.muzzle;
    ctx.beginPath(); ctx.ellipse(0, 0, Math.max(4.2, slen*.5 + 2.2), 2.9, 0, 0, TAU); ctx.fill();
    ctx.restore();

    // the blush, hung off the eye so it can never land on the snout
    const bl = HP(headDir(AZ_EYE*.80, EL_EYE - .62, hy, hp), .95);
    if (bl.n > .04){
      ctx.globalAlpha = a * fa * clamp(bl.n*2.4, 0, 1);
      ctx.fillStyle = C.blush;
      ctx.beginPath(); ctx.ellipse(bl.X, bl.Y, 3.2, 2.2, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = a * fa;
    }

    // the nose. It flares on each sniff rather than sliding about.
    const fl = sniff*(.30 + d*.34);
    const nX = tip.X + jitter*(.10 + d*.35)*.35, nY = tip.Y - fl*.9;
    const nr = 1.8 + .7*(.5 + .5*Math.max(0, tipD.x*st + tipD.z*ct));
    ctx.fillStyle = C.nose;
    ctx.beginPath();
    ctx.ellipse(nX, nY, nr*(1 + fl*.34), nr*.88*(1 - fl*.14), .1, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.ellipse(nX - nr*.3, nY - nr*.4, nr*.34, nr*.26, -.3, 0, TAU); ctx.fill();

    // mouth, and whiskers. Both narrow as his snout turns toward the lens,
    // which now falls out of the projection instead of being faked.
    const fore = Math.abs(tipD.x*ct - tipD.z*st);       // how side-on the snout is

    /* ── his mouth. It is a point ON the head sphere, and the line lies ACROSS
          the projected snout axis, bowing outward away from his head. Drawn in
          screen space — a horizontal arc hung off the nose at a fixed offset
          down the frame — it slid off the side of his muzzle every time he
          pitched his head to sniff or turned, and stuck out into nothing. Now
          it cannot leave his face, and it narrows and fades round the side of
          its own accord. */
    const mo = HP(headDir(0, -.62, hy, hp), .98);
    const mv = frontVis(mo.n);
    if (mv > .02){
      const ax = slen > .001 ? mdx/slen : 1, ay = slen > .001 ? mdy/slen : 0;
      const cxp = -ay, cyp = ax;                       // across the snout
      const mow = 2.4*fore + 1.15;
      const bowX = (mo.X - hcX)*.17, bowY = (mo.Y + hc.y)*.17;   // outward, off the head
      ctx.globalAlpha = a * fa * snV * mv;
      ctx.strokeStyle = "rgba(74,52,40,.78)"; ctx.lineWidth = 1.1; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(mo.X - cxp*mow, mo.Y - cyp*mow);
      ctx.quadraticCurveTo(mo.X + bowX, mo.Y + bowY, mo.X + cxp*mow, mo.Y + cyp*mow);
      ctx.stroke();
      ctx.globalAlpha = a * fa * snV;
    }

    ctx.globalAlpha = a * fa * .17;
    ctx.strokeStyle = "rgba(246,240,228,1)"; ctx.lineWidth = .55;
    for (let side=-1; side<=1; side+=2)
      for (let i=0;i<2;i++){
        const spread = (i - .5)*2.2 + side*1.1;
        const reach  = 7*(.45 + .55*fore)*(1 + sniff*.28);
        ctx.beginPath();
        ctx.moveTo(nX, nY + 1);
        ctx.quadraticCurveTo(nX + (mdx/(slen||1))*reach*.5 + side*1.8, nY + spread + 1.6,
                             nX + (mdx/(slen||1))*reach + side*1.4, nY + spread*1.7);
        ctx.stroke();
      }
    }                                  // ── end of the snout group
    ctx.globalAlpha = a * fa;

    // eyes. Both are real points on the sphere, so the far one comes past the
    // snout of its own accord as he turns.
    for (const side of [-1, 1]){
      const e = HP(headDir(side*AZ_EYE, EL_EYE, hy, hp), RR_EYE);
      const v = faceVis(e.n) * (side < 0 ? .82 : 1);
      if (v <= .02) continue;
      const sc = (.74 + .26*Math.max(0, e.n)) * (side < 0 ? .94 : 1);
      ctx.globalAlpha = a * fa * v;
      ctx.fillStyle = "#120c0b";
      ctx.beginPath(); ctx.ellipse(e.X, e.Y, 1.78*sc, 2.0*sc*eyeH, 0, 0, TAU); ctx.fill();
      if (eyeH > .35){
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.beginPath(); ctx.arc(e.X + .60*sc, e.Y - .68*sc, .66*sc, 0, TAU); ctx.fill();
      }
      ctx.strokeStyle = "rgba(74,54,42,.30)"; ctx.lineWidth = .8*sc;
      ctx.beginPath(); ctx.arc(e.X, e.Y, 2.5*sc, -2.5, -1.0); ctx.stroke();
      ctx.globalAlpha = a * fa;
    }

    crownQuills(brow, 0, brow.length);        // and the spines over his brow
    ctx.globalAlpha = a;
  }




  function quills(from, to){
    for (let i=from;i<to;i++){
      const q = qs[i];
      let vx = q.tX - q.bX, vy = q.tY - q.bY;
      let vl = Math.hypot(vx, vy);
      // a quill aimed at the lens foreshortens to nothing; keep a stub, or it
      // degenerates and vanishes instead of reading as a cut-off spine
      if (vl < 2.2){ const k = 2.2/(vl || 1); vx *= k; vy *= k; vl = 2.2; }
      const nx = -vy/vl*2.00, ny = vx/vl*2.00;      // half-width at the root
      ctx.fillStyle = QCOL[q.pale ? 2 : 0][q.s];
      ctx.beginPath();
      ctx.moveTo(q.bX + nx, q.bY + ny);
      ctx.lineTo(q.bX + vx, q.bY + vy);
      ctx.lineTo(q.bX - nx, q.bY - ny);
      ctx.closePath(); ctx.fill();
      // the band: pale tip over a dark base. Only where the quill is long
      // enough in SCREEN space to show one — on a foreshortened quill the
      // overlay is just a fat pale blob, and a few hundred of those read as
      // scales on a pinecone.
      if (q.pale && vl > 4.2 && q.rim){
        ctx.fillStyle = QCOL[1][q.s];
        ctx.beginPath();
        ctx.moveTo(q.bX + vx*.54 + nx*.48, q.bY + vy*.54 + ny*.48);
        ctx.lineTo(q.bX + vx, q.bY + vy);
        ctx.lineTo(q.bX + vx*.54 - nx*.48, q.bY + vy*.54 - ny*.48);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  let split = 0;
  while (split < qs.length && qs[split].D <= 0) split++;
  quills(0, split);

  // ── legs, sorted the same way. Depth does the near/far pairing now, so
  //    there is no draw-order rule to get wrong and no colour trick needed.
  const legs = [];
  if (c < .82){
    const up = 1 - c/.82;
    for (const [lx, lz, ph] of [[11.5,  Cc*.52, p], [-11.5,  Cc*.52, p + Math.PI],
                                [11.5, -Cc*.52, p + Math.PI], [-11.5, -Cc*.52, p]]){
      const sw = Math.max(0, Math.sin(ph));
      const hipY = -(-B*.62), footY = -(GROUND + sw*3.2*g)*up + (1 - up)*-B*.5;
      const fx = lx + Math.cos(ph)*3.4*g;
      legs.push({ D: lx*st + lz*ct,
                  hX: lx*ct - lz*st, hY: hipY,
                  fX: fx*ct - lz*st, fY: footY });
    }
  }
  /* All four legs go down BEFORE the body, so only the part below his belly
     ever shows. Sorting them against the body instead painted the near pair
     across his chest — the "legs through his body" fault of §10, which the
     depth sort reintroduced the moment it was given the chance. */
  legs.sort((u, v) => u.D - v.D);
  for (const L of legs){
    const near = L.D > 0;
    ctx.strokeStyle = near ? C.limb : "#a5895f";
    ctx.lineWidth = 4.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(L.hX, L.hY); ctx.lineTo(L.fX, L.fY - 1); ctx.stroke();
    ctx.fillStyle = near ? C.paw : "#7a6046";
    ctx.beginPath(); ctx.ellipse(L.fX + .8, L.fY, 3.0, 2.4, 0, 0, TAU); ctx.fill();
  }

  /* ── his body. An ellipsoid under a rotation about the vertical axis
        projects to an axis-aligned ellipse exactly, so this is one fill and
        no approximation: the half-width is sqrt(a²cos²θ + c²sin²θ). */
  const bw = Math.sqrt(A*A*ct*ct + Cc*Cc*st*st);
  ctx.fillStyle = bgc;
  ctx.beginPath(); ctx.ellipse(0, 0, bw, B, 0, 0, TAU); ctx.fill();

  /* ── the dark mass under the coat. Without this the cream body shows
        between the quills and he reads as an artichoke: 250 narrow needles
        nowhere near cover an ellipsoid. Rather than fill the true mantle
        region — a plane section of an ellipsoid, which projects to an awkward
        composite of curve and silhouette — it is the body ellipse shifted
        along the boundary plane's own normal. Which means it is correct from
        every angle for one fill: back-and-up in profile, straight up when he
        is nose-on, over all of him from behind. The ragged quill roots hide
        the seam, which is what they do on the animal too. */
  const off = 7.6 * (1 - c*.75);
  const mgc = ctx.createLinearGradient(0, -B, 0, B*.6);
  mgc.addColorStop(0, C.mantleHi);
  mgc.addColorStop(1, C.mantleLo);
  // CLIPPED to his body. Offset back-and-up, the mass reaches ~3px past the
  // top of his silhouette, and what you saw was a smooth brown crescent
  // hanging behind his head with no coat on it.
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, bw, B, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = mgc;
  ctx.beginPath();
  ctx.ellipse(-MN.x*off*ct + MN.z*off*st, MN.y*off, bw*.94, B*.94, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  /* The near half of the coat goes down BEFORE his face. Drawn after it, any
     quill on this side that happened to overlap his head was painted straight
     over his eye — §10's "the quills were once drawn last, over everything,
     which buried his ear and eye". Only the crown hood belongs on top, and
     that is drawn from inside the face block. */
  quills(split, qs.length);
  drawFace();

  if (hog.shiver > .35){
    ctx.globalAlpha = a * hog.shiver * (.35 + .3*Math.sin(t*11));
    ctx.strokeStyle = "rgba(198,226,246,1)"; ctx.lineWidth = 1.5;
    for (let i=0;i<2;i++){
      ctx.beginPath(); ctx.arc(-6, -6, 30 + i*7, -2.5, -1.6); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ── the stalls ───────────────────────────────────────────────────────── */
const STALLS = [
  { tag:"amble",    note:"slow walk — the everyday gait",
    set:(h,dt)=>{ h.gait=1; h.dip=0; h.walk += dt*3.2; } },
  { tag:"scurry",   note:"fast walk — same cycle, faster",
    set:(h,dt)=>{ h.gait=1; h.dip=0; h.walk += dt*9.0; } },
  { tag:"snuffling",note:"at rest — nose down, rummaging",
    set:(h,dt)=>{ h.gait=0; h.dip=1; } },
  { tag:"start / stop", note:"sets off, arrives, waits — the head trails and settles",
    set:(h,dt,t)=>{ const ph=(t*.5)%1; const go = ph<.55;
      h.gait = lerp(h.gait, go?1:0, 1-Math.exp((go?-7:-9)*dt));
      h.dip  = lerp(h.dip, go?0:1, 1-Math.exp(-5.5*dt));
      h.arrive = go?0:Math.max(0,1-((ph-.55)*6));
      h.walk += dt*6*h.gait; } },
  { tag:"turning",  note:"steers right round through nose-on — no mirror flip any more",
    set:(h,dt,t)=>{ h.gait=1; h.walk += dt*5;
      const hd2 = t*.85;                                // walks a slow full circle
      h.turn += wrapAng(hd2 - h.hd); h.hd = hd2; } },
  { tag:"curled",   note:"hit — curls into a ball and unrolls",
    set:(h,dt,t)=>{ const on = Math.sin(t*.7)>0;
      h.curl = lerp(h.curl, on?1:0, 1-Math.exp((on?-9:-6)*dt));
      h.gait = 0; h.dip = 0; } },
  { tag:"shivering",note:"deep snow — cold, breath showing",
    set:(h,dt)=>{ h.gait=0; h.dip=.4; h.shiver=1; } },
  { tag:"looking about", note:"face turns on the front of the head — he glances round and sniffs",
    set:(h,dt)=>{ h.gait=0; h.dip=.25; } },
  { tag:"face-on", note:"body walked straight at the lens — both eyes, snout foreshortened",
    set:(h,dt,t)=>{ h.gait=1; h.dip=.1; h.walk += dt*3.4; h.hd = 0;
      h.yawT = 0; h.pitchT = .05; h.lookT = 9; } },
  { tag:"walking away", note:"back to the lens — his face must be BEHIND his body, not through it",
    set:(h,dt,t)=>{ h.gait=1; h.dip=0; h.walk += dt*3.4; h.hd = Math.PI; h.lookT = 9;
      h.yawT = Math.sin(t*.4)*.8; h.pitchT = .05; } },
  { tag:"yaw sweep", note:"body held still, head turned right across him and back",
    set:(h,dt,t)=>{ h.gait=0; h.dip=.2;
      h.yawT = Math.sin(t*.55)*1.35; h.pitchT = Math.sin(t*.37)*.3; h.lookT = 9; } },
];

const grid = document.getElementById("grid");
const stalls = STALLS.map(S => {
  const el = document.createElement("div");
  el.className = "stall";
  el.innerHTML = '<canvas></canvas><div class="tag">'+S.tag+
                 '</div><div class="note">'+S.note+'</div>';
  grid.appendChild(el);
  const cv = el.querySelector("canvas");
  return { S, el, cv, ctx: cv.getContext("2d"), hog: makeHog(), t: Math.random()*4 };
});

/* Every stall watches the pointer, even when it is nowhere near that stall —
   eleven of him all turning to follow you at once is the quickest way to see
   whether the tracking is right at every body angle. */
let mouse = null;
window.addEventListener("mousemove", e => { mouse = { x:e.clientX, y:e.clientY }; });
window.addEventListener("mouseout",  e => { if (!e.relatedTarget) mouse = null; });

let DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  for (const s of stalls){
    const r = s.el.getBoundingClientRect();
    s.cv.width  = Math.max(1, Math.round(r.width  * DPR));
    s.cv.height = Math.max(1, Math.round(r.height * DPR));
    s.w = r.width; s.h = r.height;
    s.left = r.left; s.top = r.top;      // cached: a rect read per stall per
                                         // frame would thrash layout

  }
}
window.addEventListener("resize", resize);
window.addEventListener("scroll", resize, {passive:true});

const elSpd = document.getElementById("spd");
const elScl = document.getElementById("scl");
const btnPause = document.getElementById("pause");
const btnStep  = document.getElementById("step");
const btnBones = document.getElementById("bones");
let paused = false, stepOnce = false, use3d = true;
btnPause.onclick = () => { paused = !paused; btnPause.classList.toggle("on", paused);
                           btnPause.textContent = paused ? "play" : "pause"; };
btnStep.onclick  = () => { stepOnce = true; };
btnBones.onclick = () => { showBones = !showBones; btnBones.classList.toggle("on", showBones); };
const btnThree = document.getElementById("three");
btnThree.onclick = () => { use3d = !use3d; btnThree.classList.toggle("on", use3d); };

let last = performance.now();
function frame(now){
  let dt = clamp((now - last)/1000, 0.0005, 0.05);
  last = now;
  const rate = elSpd.value/100;
  if (paused && !stepOnce) dt = 0; else if (paused) dt = 1/60;
  stepOnce = false;
  dt *= rate;

  const K = (elScl.value/100) * 2.6;

  for (const s of stalls){
    s.t += dt;
    // blink is shared behaviour, not per-stall
    s.hog.blinkT -= dt;
    if (s.hog.blinkT <= 0){ s.hog.blinkT = lerp(2.2, 5.5, Math.random()); s.hog.blink = 1; }
    s.hog.blink = Math.max(0, s.hog.blink - dt*7);
    // before updateLook, so a stall that drives the gaze itself still wins
    if (mouse && !paused)
      lookAt(s.hog, (mouse.x - (s.left + s.w*.5))/K,
                    (mouse.y - (s.top  + s.h*.62))/K,
                    Math.PI/2 - s.hog.hd);
    updateLook(s.hog, dt);
    s.S.set(s.hog, dt, s.t);
    // feed the head spring what the body just did. Set AFTER the stall has run,
    // so it is consumed on the next frame — the same one-frame lag the game has.
    const spd = s.hog.gait * 300;
    s.hog.acc = (spd - s.hog.spdPrev) / Math.max(dt, 1/240);
    s.hog.spdPrev = spd;

    const x = s.ctx;
    x.setTransform(DPR,0,0,DPR,0,0);
    x.clearRect(0,0,s.w,s.h);
    // a hint of ground so the feet have something to sit on
    const g = x.createLinearGradient(0, s.h*.4, 0, s.h);
    g.addColorStop(0, "rgba(18,34,22,0)");
    g.addColorStop(1, "rgba(24,46,28,.85)");
    x.fillStyle = g; x.fillRect(0, s.h*.4, s.w, s.h*.6);
    x.strokeStyle = "rgba(200,228,180,.10)"; x.lineWidth = 1;
    x.beginPath(); x.moveTo(0, s.h*.62 + 19*K); x.lineTo(s.w, s.h*.62 + 19*K); x.stroke();

    (use3d ? drawHog3 : drawHog)(x, s.hog, s.t, K, s.w*.5, s.h*.62);
  }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
