<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d08">
<title>hedgepig · animation lab</title>
<style>
  :root{ --ink:#eaf6e4; --shadow:#050d08; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#070f0a;color:var(--ink);
    font-family:"Helvetica Neue",Inter,-apple-system,system-ui,sans-serif;}
  header{
    position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:12px 18px;background:rgba(5,13,8,.86);
    border-bottom:1px solid rgba(200,228,180,.12);
    backdrop-filter:blur(8px);
  }
  h1{
    font-size:11px;font-weight:300;letter-spacing:.42em;text-indent:.42em;
    text-transform:uppercase;margin:0;color:rgba(234,246,228,.9);
  }
  h1 b{font-weight:300;color:#c9e57a}
  .ctl{display:flex;align-items:center;gap:8px;
    font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(206,226,198,.6);}
  input[type=range]{width:110px;accent-color:#c9e57a}
  button{
    font:inherit;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    background:rgba(200,228,180,.08);color:rgba(226,242,206,.9);
    border:1px solid rgba(200,228,180,.22);border-radius:2px;
    padding:5px 11px;cursor:pointer;
  }
  button:hover{background:rgba(200,228,180,.16)}
  button.on{background:#c9e57a;color:#0a1a0e;border-color:#c9e57a}
  #grid{
    display:grid;gap:1px;background:rgba(200,228,180,.09);
    padding-top:52px;min-height:100%;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  }
  .stall{position:relative;background:#0d1a11;min-height:280px}
  .stall canvas{display:block;width:100%;height:100%}
  .stall .tag{
    position:absolute;left:12px;top:10px;pointer-events:none;
    font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(206,226,198,.5);text-shadow:0 1px 8px #000;
  }
  .stall .note{
    position:absolute;left:12px;bottom:10px;right:12px;pointer-events:none;
    font-size:9px;letter-spacing:.06em;color:rgba(206,226,198,.3);
  }
</style>
</head>
<body>
<header>
  <h1>hedgepig<b> · </b>animation lab</h1>
  <label class="ctl">speed <input id="spd" type="range" min="0" max="200" value="100"></label>
  <label class="ctl">size <input id="scl" type="range" min="40" max="220" value="100"></label>
  <button id="pause">pause</button>
  <button id="step">step</button>
  <button id="bones">bones</button>
</header>
<div id="grid"></div>
<script>
(() => {
"use strict";

/* ─────────────────────────────────────────────────────────────────────────
   A bench rig for the hedgepig, away from the grass. Each stall runs one
   independent copy in a fixed state, so a change can be judged side by side
   at a size you can actually see.

   The drawing code below is a WORKING COPY of drawHog() from index.html.
   Iterate here, then port the finished function back. Nothing else in the
   game depends on this file.
   ───────────────────────────────────────────────────────────────────────── */

const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a + (b-a)*t;
const wrapAng = a => Math.atan2(Math.sin(a), Math.cos(a));

// soft radial sprite, as the game builds its glows
function glow(rgb){
  const s = 128, c = document.createElement("canvas");
  c.width = c.height = s;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0,   "rgba("+rgb+",0.9)");
  g.addColorStop(.45, "rgba("+rgb+",0.18)");
  g.addColorStop(1,   "rgba("+rgb+",0)");
  x.fillStyle = g; x.fillRect(0,0,s,s);
  return c;
}
const SP_MAGIC = glow("238,226,186");

/* ── the head rig ──────────────────────────────────────────────────────
   His features sit on a head sphere rather than being painted flat on a
   profile. `az` runs round the vertical axis: 0 points straight along his
   snout, +90° points straight out at the camera. Adding the head's yaw to
   every feature turns the whole face on the front of the head — the snout
   swings round and foreshortens, the far eye comes into view, the near one
   slides across. The body never has to move for him to look at something.

   z is the camera-facing component: positive is the near side, negative is
   round the back and hidden.
   ────────────────────────────────────────────────────────────────────── */
// Proportions taken from a real hedgehog: the spine dome is most of the animal
// and hoods forward over a SMALL pale face tucked underneath it. The face is
// cream, the short muzzle is dark, and the ears sit low at the sides of the
// head near eye level — not up on top.
const HEAD = { x:16, y:10, rx:9.8, ry:8.4 };

const C = {
  quillTip:  "#e9dcc0",   // cream tips — most of what you see
  quillDark: "#4b3a29",   // the dark band below them
  quillMid:  "#9d8a68",
  domeHi:    "#c2ae8a",
  domeLo:    "#6a5942",
  face:      "#f0e8d8",   // pale cream, the strongest contrast on him
  faceLo:    "#d3c5ab",
  muzzle:    "#9b8b7c",   // grey-brown; the CONTRAST should come from the nose
  nose:      "#241b19",
  ear:       "#4e3d34",
  earIn:     "#8d6f64",
  belly:     "#8c7a63",
  limb:      "#5a4a3c",
};

function facePt(az, el, yaw, pitch, rr){
  const A = az + yaw, E = el + pitch, ce = Math.cos(E);
  return {
    x: HEAD.x + HEAD.rx * (rr||1) * ce * Math.cos(A),
    y: HEAD.y - HEAD.ry * (rr||1) * Math.sin(E),
    z: ce * Math.sin(A)
  };
}
// How visible a feature is as it comes round the edge of the head. This MUST
// start at z = 0: anything on the far hemisphere is behind the head, and a ramp
// that reaches into negative z draws it straight through his skull.
const faceVis = z => clamp(z/.26, 0, 1);

const AZ_EYE = 1.10, EL_EYE = .44;      // above and behind the muzzle, on the cream
const RR_EYE = .80;
const AZ_EAR = 2.35, EL_EAR = .52;      // back of the head; drawn behind the face
const RR_EAR = 1.30;                    // OUTSIDE the head, or the face hides them entirely
const SNOUT_R = 1.48;                   // long enough to read as a snout, not a disc

// He looks about and sniffs of his own accord.
function updateLook(h, dt){
  h.lookT -= dt;
  if (h.lookT <= 0){
    h.lookT = lerp(.9, 2.8, Math.random());
    const r = Math.random();
    h.yawT   = r < .26 ? lerp(.95, 1.45, Math.random())     // straight at you
             : r < .52 ? lerp(-.50, -.10, Math.random())    // away, over his shoulder
             :           lerp(.05,  .65, Math.random());    // a glance round
    h.pitchT = h.dip > .5 ? lerp(-.44, -.10, Math.random()) // nose in the grass
                          : lerp(-.22,  .40, Math.random());
  }
  h.yaw   = lerp(h.yaw,   h.yawT,   1 - Math.exp(-4.5*dt));
  h.pitch = lerp(h.pitch, h.pitchT, 1 - Math.exp(-3.8*dt));
}

/* ── one hedgepig ─────────────────────────────────────────────────────── */
function makeHog(){
  return {
    dir:1, walk:0, gait:0, dip:0, curl:0, arrive:0, shiver:0,
    blink:0, blinkT:2.4, hd:0, x:0,
    yaw:0, pitch:0, yawT:0, pitchT:0, lookT:0
  };
}

let showBones = false;

// A faithful copy of the current in-game drawing, parameterised so the rig can
// drive several at once. `t` is that stall's own clock.
function drawHog(ctx, hog, t, K, cx, cy){
  const c = hog.curl, g = hog.gait * (1 - c), d = hog.dip * (1 - c);
  const a = 1;

  const p     = hog.walk;
  const bob   = Math.sin(p*2)*2.1*g + Math.sin(t*2.1)*0.8*(1-g);
  const pitch = Math.sin(p*2 + .7)*.05*g - hog.arrive*.06;
  const sqz   = 1 + Math.sin(p*2 + 1.3)*.055*g;
  const shiv  = hog.shiver * (Math.sin(t*34)*1.5 + Math.sin(t*23.3)*.9);

  const sniff   = Math.sin(t*21) + Math.sin(t*31.7)*.55 + Math.sin(t*13.3)*.35;
  const noseTw  = (.45 + d*2.2) * sniff + hog.shiver*Math.sin(t*30)*1.2;
  const noseUp  = (.3 + d*1.1) * Math.sin(t*17.5);
  const headDip = d*4.6;
  const headSw  = d*Math.sin(t*1.7)*2.4;
  const ear     = Math.sin(t*6.5)*.7 + d*Math.sin(t*11)*1.6 + hog.shiver*Math.sin(t*26)*1.1;
  const eyeH    = 1 - hog.blink*.92;

  ctx.save();
  ctx.translate(cx + shiv, cy);
  ctx.scale(hog.dir * K, K);
  ctx.translate(0, bob);
  ctx.rotate(pitch + c*.25);

  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = a * (.09 + .05*Math.sin(t*3.2));
  ctx.drawImage(SP_MAGIC, -80, -84, 160, 160);
  ctx.globalCompositeOperation = "source-over";

  ctx.globalAlpha = a*.32; ctx.fillStyle = "#02100a";
  ctx.beginPath(); ctx.ellipse(0, 19, 28 + c*4, 6.5, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = a;

  const legUp = 1 - c;
  function leg(x0, ph, base){
    if (legUp < .05) return;
    const sw = Math.max(0, Math.sin(ph));
    const fx = x0 + Math.cos(ph)*3.8*g;
    const fy = (base - sw*3.2*g) * legUp;
    ctx.strokeStyle = C.limb; ctx.lineWidth = 5.2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, 12*legUp); ctx.lineTo(fx, fy - 1); ctx.stroke();
    ctx.fillStyle = C.limb;
    ctx.beginPath(); ctx.ellipse(fx + 1, fy, 4.0, 3.1, 0, 0, TAU); ctx.fill();
  }
  leg(-12, p + Math.PI, 20.5);
  leg(  9, p,           20.5);
  leg( -7, p,           22.0);
  leg( 14, p + Math.PI, 22.0);

  // ── the pale underside, showing between the dome and the ground
  ctx.fillStyle = C.belly;
  ctx.beginPath(); ctx.ellipse(-1, 10, 24, 8.5 * (1 + Math.sin(p*2 + 1.3)*.05*g), 0, 0, TAU); ctx.fill();

  /* ── the spine dome ───────────────────────────────────────────────────
     Most of the animal, and it hoods FORWARD over the head. Four passes:
     a dark under-layer that makes the silhouette prickly, the dome itself,
     a dense speckle of banded ticks, then cream tips round the rim. Short
     and dense, not long spikes — at this size the banding is what reads. */
  const a0 = lerp(-3.02, -Math.PI - .5, c);
  const a1 = lerp(-0.10,  Math.PI - .2, c);        // stops above the face, never across it
  const mx = -3*(1-c), my = -2.5*(1-c);
  const drx = lerp(29.5, 21, c), dry = lerp(17, 21, c);

  function quill(ang, rx, ry, len, wid, col){
    const bx = mx + Math.cos(ang)*rx,  by = my + Math.sin(ang)*ry;
    const tx = mx + Math.cos(ang)*(rx+len), ty = my + Math.sin(ang)*(ry+len)*.94;
    const nx = -Math.sin(ang)*wid, ny = Math.cos(ang)*wid;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(bx + nx, by + ny); ctx.lineTo(tx, ty); ctx.lineTo(bx - nx, by - ny);
    ctx.closePath(); ctx.fill();
  }

  // 1. dark under-layer, just proud of the dome
  for (let i=0;i<30;i++){
    const wob = Math.sin(p*2 + i*.55)*.035*g;
    quill(lerp(a0, a1, i/29) + wob, drx*.99, dry*.99,
          (8.5 + Math.sin(i*1.9)*2.6) * (1 - c*.35), 3.0 + c*.9, C.quillDark);
  }

  // 2. the dome
  const dg = ctx.createLinearGradient(0, my - dry, 0, my + dry);
  dg.addColorStop(0,   C.domeHi);
  dg.addColorStop(.62, C.quillMid);
  dg.addColorStop(1,   C.domeLo);
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.ellipse(mx, my, drx*.97, dry*.97, 0, 0, TAU); ctx.fill();

  // 3. banded speckle — this is the texture that makes him read as a hedgehog
  for (let i=0;i<52;i++){
    const t2 = i/51;
    const ang = lerp(a0 + .06, a1 - .06, t2) + Math.sin(p*2 + i*.9)*.045*g;
    const band = i % 3;
    const r0 = .30 + (i%5)*.10, r1 = r0 + .34;
    ctx.strokeStyle = band === 0 ? C.quillTip : (band === 1 ? C.quillDark : C.quillMid);
    ctx.lineWidth = band === 0 ? 2.6 : 2.0;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(mx + Math.cos(ang)*drx*r0, my + Math.sin(ang)*dry*r0);
    ctx.lineTo(mx + Math.cos(ang)*drx*r1, my + Math.sin(ang)*dry*r1);
    ctx.stroke();
  }

  // 4. cream tips round the rim
  for (let i=0;i<30;i++){
    const wob = Math.sin(p*2 + i*.62)*.04*g;
    quill(lerp(a0 + .04, a1 - .04, i/29) + wob + .03, drx*.90, dry*.90,
          (6.5 + Math.sin(i*2.6)*2.2) * (1 - c*.30), 2.5 + c*.8, i%4 ? C.quillTip : C.quillMid);
  }

  const fa = 1 - c;
  if (fa > .02){
    ctx.globalAlpha = a * fa;

    const sniffP = d * Math.sin(t*9.5)*.055 + hog.shiver*Math.sin(t*26)*.03;
    const yaw   = hog.yaw + d*Math.sin(t*1.3)*.16;
    const hEl   = hog.pitch + sniffP + headDip*.012;
    const cy2 = Math.cos(yaw), sy2 = Math.sin(yaw);

    ctx.save();
    ctx.translate(headSw*.4, headDip*.5);

    // ── both ears, behind the face
    for (const side of [-1, 1]){
      const e2 = facePt(side*AZ_EAR, EL_EAR, yaw, hEl, RR_EAR);
      const v2 = faceVis(e2.z) * (side < 0 ? .8 : 1);
      if (v2 <= .02) continue;
      const sc = .82 + .18*Math.max(0, e2.z);
      ctx.globalAlpha = a * fa * v2;
      // kept dark and plain: a bright inner here reads as a second eye
      ctx.fillStyle = side < 0 ? "#3a2d26" : C.ear;
      ctx.beginPath(); ctx.ellipse(e2.x, e2.y + ear, 3.5*sc, 3.9*sc, .12, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = a * fa;

    // ── the small pale face, tucked under the front of the dome
    const hg = ctx.createLinearGradient(0, HEAD.y - HEAD.ry, 0, HEAD.y + HEAD.ry);
    hg.addColorStop(0, C.face);
    hg.addColorStop(1, C.faceLo);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(HEAD.x + sy2*1.4, HEAD.y, HEAD.rx*(1 + Math.abs(sy2)*.12), HEAD.ry, -.04, 0, TAU);
    ctx.fill();
    // a taper toward the muzzle, so the face is a wedge and not a pale ball
    const tp = facePt(0, -.10, yaw, hEl, .78);
    ctx.beginPath(); ctx.ellipse(tp.x, tp.y, 6.4, 5.4, -.06, 0, TAU); ctx.fill();

    // ── short dark muzzle
    const tip = facePt(0, -.16, yaw, hEl, SNOUT_R);
    const bse = facePt(0, -.16, yaw, hEl, .30);
    const dx = tip.x - bse.x, dy = tip.y - bse.y;
    const slen = Math.hypot(dx, dy);
    ctx.save();
    ctx.translate((tip.x + bse.x)/2, (tip.y + bse.y)/2);
    ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = C.muzzle;
    ctx.beginPath(); ctx.ellipse(0, 0, Math.max(5.0, slen*.5 + 2.6), 3.5, 0, 0, TAU); ctx.fill();
    ctx.restore();

    // ── nose
    const near = .5 + .5*Math.max(0, sy2);
    const nsw  = 1 + Math.max(0, sniff)*.08*(.5 + d);
    const nx2 = tip.x + noseTw*.7*cy2, ny2 = tip.y + noseUp*.45;
    const nr = (2.0 + near*.8) * nsw;
    ctx.fillStyle = C.nose;
    ctx.beginPath(); ctx.ellipse(nx2, ny2, nr, nr*.88, .1, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.ellipse(nx2 - nr*.3, ny2 - nr*.4, nr*.34, nr*.26, -.3, 0, TAU); ctx.fill();

    // ── his mouth, tucked under the nose. Narrows as he turns to face you.
    ctx.strokeStyle = "rgba(62,44,36,.62)"; ctx.lineWidth = 1.0; ctx.lineCap = "round";
    const mw = 2.7 * Math.abs(cy2) + 1.3;
    ctx.beginPath();
    ctx.moveTo(nx2 - mw, ny2 + nr*1.5);
    ctx.quadraticCurveTo(nx2, ny2 + nr*2.4, nx2 + mw, ny2 + nr*1.5);
    ctx.stroke();

    // whiskers
    ctx.globalAlpha = a * fa * .20;
    ctx.strokeStyle = "rgba(246,240,228,1)"; ctx.lineWidth = .6;
    for (let side=-1; side<=1; side+=2)
      for (let i=0;i<3;i++){
        const spread = (i - 1) * 2.4 + side*1.2;
        const reach  = 11 * (.45 + .55*Math.abs(cy2));
        ctx.beginPath();
        ctx.moveTo(nx2, ny2 + 1);
        ctx.quadraticCurveTo(nx2 + cy2*reach*.5 + side*2.6, ny2 + spread + 2,
                             nx2 + cy2*reach + side*Math.abs(sy2)*7, ny2 + spread*1.7);
        ctx.stroke();
      }
    ctx.globalAlpha = a * fa;

    // ── eyes: small, round, glossy black on the pale face
    function eye(az, far){
      const e = facePt(az, EL_EYE, yaw, hEl, RR_EYE);
      const v = faceVis(e.z) * (far ? .82 : 1);
      if (v <= .02) return;
      const sc = (.74 + .26*Math.max(0, e.z)) * (far ? .94 : 1);
      ctx.globalAlpha = a * fa * v;
      ctx.fillStyle = "#120c0b";
      ctx.beginPath(); ctx.ellipse(e.x, e.y, 1.9*sc, 2.1*sc*eyeH, 0, 0, TAU); ctx.fill();
      if (eyeH > .35){
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.beginPath(); ctx.arc(e.x + .65*sc, e.y - .75*sc, .72*sc, 0, TAU); ctx.fill();
      }
      // the brow crease — small, but it is most of what makes him look sweet
      ctx.strokeStyle = "rgba(74,54,42,.34)"; ctx.lineWidth = .9*sc;
      ctx.beginPath(); ctx.arc(e.x, e.y, 2.9*sc, -2.5, -1.0); ctx.stroke();
      ctx.globalAlpha = a * fa;
    }
    eye(-AZ_EYE, 1);
    eye( AZ_EYE, 0);

    ctx.restore();

    // ── the hood. In the reference the spines come down over the brow, so a
    //    short arc of them is redrawn HERE, after the face, to overlap it.
    //    Without this the face reads as painted on top of the dome.
    ctx.globalAlpha = a * fa;
    for (let i=0;i<12;i++){
      const t2 = i/11;
      // crowns the top of his head only — push the end of this arc past about
      // -0.05 and the quills start raking down across his face
      const ang = lerp(-1.20, -0.06, t2) + Math.sin(p*2 + i*.62)*.04*g;
      quill(ang, drx*.88, dry*.88, 5.8 + Math.sin(i*2.2)*1.6, 2.4,
            i%3 ? C.quillTip : C.quillDark);
    }
    ctx.globalAlpha = a;
  }

  if (hog.shiver > .35){
    ctx.globalAlpha = a * hog.shiver * (.35 + .3*Math.sin(t*11));
    ctx.strokeStyle = "rgba(198,226,246,1)"; ctx.lineWidth = 1.5;
    for (let i=0;i<2;i++){
      ctx.beginPath(); ctx.arc(-6, -6, 30 + i*7, -2.5, -1.6); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ── the stalls ───────────────────────────────────────────────────────── */
const STALLS = [
  { tag:"amble",    note:"slow walk — the everyday gait",
    set:(h,dt)=>{ h.gait=1; h.dip=0; h.walk += dt*3.2; } },
  { tag:"scurry",   note:"fast walk — same cycle, faster",
    set:(h,dt)=>{ h.gait=1; h.dip=0; h.walk += dt*9.0; } },
  { tag:"snuffling",note:"at rest — nose down, rummaging",
    set:(h,dt)=>{ h.gait=0; h.dip=1; } },
  { tag:"start / stop", note:"sets off, arrives, waits, repeats",
    set:(h,dt,t)=>{ const ph=(t*.5)%1; const go = ph<.55;
      h.gait = lerp(h.gait, go?1:0, 1-Math.exp((go?-7:-9)*dt));
      h.dip  = lerp(h.dip, go?0:1, 1-Math.exp(-5.5*dt));
      h.arrive = go?0:Math.max(0,1-((ph-.55)*6));
      h.walk += dt*6*h.gait; } },
  { tag:"turning",  note:"changes facing — currently an instant mirror flip",
    set:(h,dt,t)=>{ h.gait=1; h.walk += dt*5; h.dir = Math.sin(t*.8)>0?1:-1; } },
  { tag:"curled",   note:"hit — curls into a ball and unrolls",
    set:(h,dt,t)=>{ const on = Math.sin(t*.7)>0;
      h.curl = lerp(h.curl, on?1:0, 1-Math.exp((on?-9:-6)*dt));
      h.gait = 0; h.dip = 0; } },
  { tag:"shivering",note:"deep snow — cold, breath showing",
    set:(h,dt)=>{ h.gait=0; h.dip=.4; h.shiver=1; } },
  { tag:"looking about", note:"face turns on the front of the head — he glances round and sniffs",
    set:(h,dt)=>{ h.gait=0; h.dip=.25; } },
  { tag:"face-on", note:"held front-on — both eyes, snout foreshortened at you",
    set:(h,dt,t)=>{ h.gait=0; h.dip=.1;
      h.yawT = 1.30; h.pitchT = .05; h.lookT = 9; } },
  { tag:"yaw sweep", note:"driven through the full turn, away to front-on",
    set:(h,dt,t)=>{ h.gait=0; h.dip=.2;
      h.yawT = -0.5 + 1.9*(0.5+0.5*Math.sin(t*.55)); h.pitchT = Math.sin(t*.37)*.3; h.lookT = 9; } },
];

const grid = document.getElementById("grid");
const stalls = STALLS.map(S => {
  const el = document.createElement("div");
  el.className = "stall";
  el.innerHTML = '<canvas></canvas><div class="tag">'+S.tag+
                 '</div><div class="note">'+S.note+'</div>';
  grid.appendChild(el);
  const cv = el.querySelector("canvas");
  return { S, el, cv, ctx: cv.getContext("2d"), hog: makeHog(), t: Math.random()*4 };
});

let DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  for (const s of stalls){
    const r = s.el.getBoundingClientRect();
    s.cv.width  = Math.max(1, Math.round(r.width  * DPR));
    s.cv.height = Math.max(1, Math.round(r.height * DPR));
    s.w = r.width; s.h = r.height;
  }
}
window.addEventListener("resize", resize);

const elSpd = document.getElementById("spd");
const elScl = document.getElementById("scl");
const btnPause = document.getElementById("pause");
const btnStep  = document.getElementById("step");
const btnBones = document.getElementById("bones");
let paused = false, stepOnce = false;
btnPause.onclick = () => { paused = !paused; btnPause.classList.toggle("on", paused);
                           btnPause.textContent = paused ? "play" : "pause"; };
btnStep.onclick  = () => { stepOnce = true; };
btnBones.onclick = () => { showBones = !showBones; btnBones.classList.toggle("on", showBones); };

let last = performance.now();
function frame(now){
  let dt = clamp((now - last)/1000, 0.0005, 0.05);
  last = now;
  const rate = elSpd.value/100;
  if (paused && !stepOnce) dt = 0; else if (paused) dt = 1/60;
  stepOnce = false;
  dt *= rate;

  const K = (elScl.value/100) * 2.6;

  for (const s of stalls){
    s.t += dt;
    // blink is shared behaviour, not per-stall
    s.hog.blinkT -= dt;
    if (s.hog.blinkT <= 0){ s.hog.blinkT = lerp(2.2, 5.5, Math.random()); s.hog.blink = 1; }
    s.hog.blink = Math.max(0, s.hog.blink - dt*7);
    updateLook(s.hog, dt);
    s.S.set(s.hog, dt, s.t);

    const x = s.ctx;
    x.setTransform(DPR,0,0,DPR,0,0);
    x.clearRect(0,0,s.w,s.h);
    // a hint of ground so the feet have something to sit on
    const g = x.createLinearGradient(0, s.h*.4, 0, s.h);
    g.addColorStop(0, "rgba(18,34,22,0)");
    g.addColorStop(1, "rgba(24,46,28,.85)");
    x.fillStyle = g; x.fillRect(0, s.h*.4, s.w, s.h*.6);
    x.strokeStyle = "rgba(200,228,180,.10)"; x.lineWidth = 1;
    x.beginPath(); x.moveTo(0, s.h*.62 + 19*K); x.lineTo(s.w, s.h*.62 + 19*K); x.stroke();

    drawHog(x, s.hog, s.t, K, s.w*.5, s.h*.62);
  }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
