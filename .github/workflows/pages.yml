name: pages

# Build and publish the site: v1 at the root, exactly as committed, and the
# BUILT v2 at /v2 — the v2 source html only works under the vite dev server,
# so the build step is what makes johnbr0phy.github.io/hedgepig/v2 real.
# The harness gates the deploy: a red smoke run publishes nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: install
        working-directory: v2
        run: npm ci
      - name: smoke harness
        working-directory: v2
        run: node smoke.js all
      - name: build v2
        working-directory: v2
        run: npm run build
      - name: assemble site
        run: |
          mkdir -p _site/v2
          cp index.html _site/
          cp -r assets _site/assets
          cp hog-lab.html hog-heads.html _site/ 2>/dev/null || true
          cp -r v2/dist/. _site/v2/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
