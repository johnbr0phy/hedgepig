  ctx.beginPath(); ctx.ellipse(-r*.92, r*.04, r*.2, r*.13, .3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*.86, r*.09, r*.16, r*.11, -.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#5c6b3a"; ctx.lineWidth = 2; ctx.lineCap = "round";
  for (let i=0;i<5;i++){
    const bx = -r*.5 + i*r*.25;
    ctx.beginPath();
    ctx.moveTo(bx, -r*.60);
    ctx.quadraticCurveTo(bx + 5, -r*.86, bx + 12, -r*.98);
    ctx.stroke();
  }
  ctx.restore();
}

const fields = [];
let curZone = -1, zoneT = 0;
function updateZone(dt){
  const z = segBiome(Math.floor((scrollY + H*.5)/SEG));
  if (z !== curZone){
    curZone = z;
    if (toastT <= 0 && zoneT <= 0){
      elToast.textContent = ZONE_NAME[z];
      elToast.classList.add("on");
      zoneT = 3.4;
    }
  }
  if (zoneT > 0){
    zoneT -= dt;
    if (zoneT <= 0 && toastT <= 0) elToast.classList.remove("on");
  }
}

function updateGame(dt){
  fields.length = 0;
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) elToast.classList.remove("on"); }

  updateCrumbs(dt);
  updateTracks(dt);
  // He must not set off before you have started him. drawHog() skips him until
  // GAME.started, so without this he walks the whole first leg invisibly.
  if (!GAME.started) return;
  if (GAME.state === "over"){ hog.curl = lerp(hog.curl, 1, 1 - Math.exp(-5*dt)); return; }

  const k = hogK();
  const afloat = lakeAt(hog.wy) > .5;
  /* Where his snout actually is, on screen, in his own units. The renderer
     projects his snout direction to (sin hd, cos hd) — across and down — so a
     +-1 sign cannot express it. Before the mirror flip went away,
     ctx.scale(hog.dir*k, k) made `hog.dir` right by construction; without it,
     everything that placed something AT his nose was placing it at
     x + dir*26k, which at hd = 0 or PI is 55px to one side of a nose drawn on
     his centreline. And hog.dir only updates while |sin(hd)| > .10, so walking
     straight at or away from the lens it holds a stale sign — it can be a full
     half-turn wrong. */
  const snoutX = Math.sin(hog.hd), snoutY = Math.cos(hog.hd);


  GAME.invuln = Math.max(0, GAME.invuln - dt);
  GAME.flash  = Math.max(0, GAME.flash - dt*2.2);

  hog.blinkT -= dt;
  if (hog.blinkT <= 0){ hog.blinkT = lerp(2.2, 5.5, Math.random()); hog.blink = 1; }
  hog.blink = Math.max(0, hog.blink - dt*7);

  // ── standing still, he breaks the snuffling loop with a shake or a stretch
  updateIdle(hog, dt);

  // ── he looks about, noses down to sniff, and watches your pointer
  if (hoverT > 0){
    hoverT -= dt;
    if (hover) lookAt(hog, (hover.x - hog.x)/k, (hover.y - hogY())/k,
                      Math.PI/2 - hog.hd);
  }
  updateLook(hog, dt);

  // ── he shivers where it is cold, and his breath shows
  hog.shiver = lerp(hog.shiver, clamp(snowCover*1.7 - .12, 0, 1), 1 - Math.exp(-2.4*dt));
  if (hog.shiver > .25){
    hog.breathT -= dt;
    if (hog.breathT <= 0){
      hog.breathT = lerp(1.1, 2.0, Math.random());
      for (let i=0;i<3 && motes.length<MOTE_MAX;i++)
        motes.push({ x: hog.x + snoutX*30*k, y: hogY() + 3*k + snoutY*10*k, z:1.15,
          r: lerp(2.4, 5.2, Math.random()), a: lerp(.18, .34, Math.random()),
          vx: snoutX*lerp(16, 44, Math.random()), vy: -lerp(6, 22, Math.random()),
          ph: Math.random()*TAU, life: lerp(.7, 1.4, Math.random()), sp: SP_MOTEA });
    }
  }

  // ── hurt: he curls up for a moment, then carries on
  if (GAME.state === "hurt"){
    GAME.stateT -= dt;
    hog.curl = lerp(hog.curl, 1, 1 - Math.exp(-9*dt));
    if (GAME.stateT <= 0){ GAME.state = "walk"; }
  } else {
    hog.curl = lerp(hog.curl, 0, 1 - Math.exp(-6*dt));
  }

  // ── He walks to the last place you called him, and then he stops.
  //    Any direction, including back the way he came.
  const aim = (crumbs.length && !crumbs[0].eaten) ? crumbs[0] : null;
  let moving = 0, gap = 0;
  if (aim && GAME.state === "walk"){
    const dx = aim.x - hog.x, dy = aim.wy - hog.wy;
    gap = Math.hypot(dx, dy);
    if (gap < 26*Math.max(k*.5, 1)){
      aim.eaten = 1;                                  // arrived: settle and snuffle
      hog.arrive = 1;
      for (let i2=0;i2<7;i2++) sparkle(aim.x + (Math.random()*2-1)*22, aim.wy - scrollY - 8, "244,246,190");
      rings.push({ x:aim.x, y:aim.wy - scrollY, r:5, max:70, a:.4, col:"226,240,178" });
    } else {
      moving = 1;
      const want = Math.atan2(dx, dy);                // full circle, not just downhill
      const turn = HOG_TURN * (1 - snowCover*.35) * dt;
      const swing = clamp(wrapAng(want - hog.hd), -turn, turn);
      hog.hd  += swing;
      hog.turn += swing;                              // what his head has to resist
    }
  }

  // he leans into a start and settles out of a stop rather than snapping
  hog.gait   = lerp(hog.gait, moving ? 1 : 0, 1 - Math.exp((moving ? -7 : -9)*dt));
  hog.arrive = Math.max(0, hog.arrive - dt*1.6);

  const spd  = hogSpd() * hog.gait * (1 - hog.curl*.94) * (afloat ? .78 : 1) * (1 - snowCover*.16);
  // ── the other input to the head spring. Set here, consumed by updateLook on
  //    the next frame — spd is not known until after gait has eased.
  hog.acc = (spd - hog.spdPrev) / dt;
  hog.spdPrev = spd;
  const step = Math.min(spd*dt, moving ? gap : spd*dt);   // never overshoot the target
  hog.x  += Math.sin(hog.hd) * step;
  hog.wy += Math.cos(hog.hd) * step;
  hog.x   = clamp(hog.x, 26, W - 26);
  hog.walk += step * .062;
  /* `hog.dir` is gone. It was a +-1 facing sign, and it existed because
     ctx.scale(hog.dir*k, k) mirrored the whole drawing by it. The 3D renderer
     turns him continuously instead, so nothing draws from a sign, and every
     remaining consumer wanted the projected snout below rather than a sign
     anyway. It also only updated while |sin(hd)| > .10, so walking straight at
     or away from the lens it held a stale value that could be a half-turn out. */

  // ── standing still, he puts his nose down and snuffles about
  hog.dip = lerp(hog.dip, (moving || afloat) ? 0 : 1, 1 - Math.exp(-5.5*dt));

  // ── the grass gives way around him
  const sy = hogY();
  if (!afloat && hog.under < .5){
    fields.push({ x:hog.x, y:sy + 6*k, r:56*k, s:1.15 });                        // his bulk
    const reach = (26 + hog.dip*8)*k;
    const nx = hog.x + snoutX*reach, ny = sy + (12 + hog.dip*5)*k + snoutY*reach*.34;
    fields.push({ x:nx, y:ny, r:40*k, s:.9 + hog.dip*.3 });                      // his nose
    if (spd > 20 && hog.curl < .5){
      hog.trackT -= spd * dt;
      if (hog.trackT <= 0){ hog.trackT = 15; dropTrack(); }
    }
    hog.puffT -= dt;
    if (hog.puffT <= 0 && (spd > 20 || hog.dip > .4)){
      hog.puffT = lerp(.12, .28, Math.random());
      snuffle(nx, ny);
    }
  }

  // ── under the road, if you aimed him at the culvert mouth
  const rSeg = Math.floor(hog.wy/SEG);
  if (segBiome(rSeg) === ROAD){
    const e = bandEdges(rSeg, ROAD), cx = crossX(rSeg)*W;
    if (hog.underT && (hog.wy > e[1] + 50 || hog.wy < e[0] - 50)) hog.underT = 0;
    // only at a mouth, either verge, never by wandering on from the middle
    const atMouth = (hog.wy > e[0] - 30 && hog.wy < e[0] + 80) ||
                    (hog.wy < e[1] + 30 && hog.wy > e[1] - 80);
    if (!hog.underT && atMouth && Math.abs(hog.x - cx) < 46*k){
      hog.underT = 1; hog.underX = cx;
      say("under the road", 1.8);
    }
    if (hog.underT){
      hog.x = lerp(hog.x, hog.underX, 1 - Math.exp(-7*dt));
    } else if (roadAt(hog.wy) < .1 && hog.wy < e[0] && hog.wy > e[0] - 900 && !hog.warned){
      hog.warned = 1;
      say("road ahead — find the tunnel", 2.6);
    }
  } else { hog.underT = 0; hog.warned = 0; }
  hog.under = lerp(hog.under, hog.underT, 1 - Math.exp(-9*dt));

  // ── hazards
  if (GAME.state === "walk" && GAME.invuln <= 0 && !afloat && hog.under < .5){
    collectHazards();
    for (const hz of hazBuf){
      const dx = (hog.x  - hz.x)  / (hz.rx + HOG_R*k*.42);
      const dy = (hog.wy - hz.wy) / (hz.ry + HOG_R*k*.34);
      if (dx*dx + dy*dy < 1){ hurt(hz.kind); break; }
    }
  }

  // ── the burrow at the end of the leg
  {
    const dgx = Math.abs(hog.x - GAME.goalX*W), dgy = Math.abs(hog.wy - GAME.goalWy);
    if (dgy < 54*k && dgx < 78*k){
      GAME.leg++;
      GAME.hearts = Math.min(3, GAME.hearts + 1);
      GAME.invuln = 2.2;
      hog.wy += LEG_GAP;
      newLeg(false);
      for (let i=0;i<26;i++) sparkle(hog.x + (Math.random()*2-1)*90*k, hogY() - Math.random()*70*k, "238,246,186");
      banner("leg " + (GAME.leg - 1) + " done", "on to " + NAMES[(GAME.leg - 1) % NAMES.length]);
      GAME.state = "leg"; GAME.stateT = 2.0;
    }
  }
  if (GAME.state === "leg"){
    GAME.stateT -= dt;
    if (GAME.stateT <= 0){ GAME.state = "walk"; clearBanner(); }
  }

  // a little glow when your finger is near him
  for (const p of ptrs.values()){
    if (Math.hypot(p.x - hog.x, p.y - sy) < 110*k*.6 && Math.random() < dt*30)
      sparkle(hog.x + (Math.random()*2-1)*30*k, sy - 16*k, "252,240,196");
  }
}

/* The camera is entirely yours — it never follows him. He walks off the bottom
   of the frame if you do not keep up, which is the game. All that is offered is
   a marker at the edge pointing to where he got to. */
function drawHogMark(){
  if (!GAME.started) return;
  const sy = hogY();
  const off = sy < 30 ? -1 : sy > H - 30 ? 1 : 0;
  if (!off) return;
  const y = off > 0 ? H - 26 : 26;
  const pulse = .5 + .28*Math.sin(time*4.4);
  const away = clamp((off > 0 ? sy - H : -sy) / (H*1.5), 0, 1);

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = (.42 + .3*pulse) * (1 - away*.45);
  ctx.drawImage(SP_TOUCH, hog.x - 44, y - 44, 88, 88);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = .78 * (1 - away*.4);
  ctx.fillStyle = "rgba(232,244,190,1)";
  ctx.beginPath();                              // a small chevron, pointing at him
  ctx.moveTo(hog.x, y + off*11);
  ctx.lineTo(hog.x - 9, y - off*5);
  ctx.lineTo(hog.x + 9, y - off*5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawHog(){
  if (!GAME.started || hog.fade <= .01) return;
  const afloat = lakeAt(hog.wy) > .5;
  const k = hogK();
  const sy = hogY();
  if (sy < -220 || sy > H + 220) return;

  let a = hog.fade * (1 - hog.under);
  if (a <= .01) return;
  if (GAME.invuln > 0 && GAME.state !== "leg") a *= .45 + .55*Math.abs(Math.sin(time*17));

  const c = hog.curl, g = hog.gait*(1 - c), d = hog.dip*(1 - c);

  const p    = hog.walk;
  /* the three idle actions. `shake` buzzes him and fluffs the coat, `up` lifts
     his nose off the ground, `arch` stretches him out long and low. Each is a
     hump over the action so it eases in and out rather than snapping. */
  const hump  = Math.sin(Math.PI*hog.actP);
  const shake = hog.act === 1 ? hump : 0;
  const up    = hog.act === 2 ? hump : 0;
  const arch  = hog.act === 3 ? hump : 0;

  const bob  = Math.sin(p*2)*2.1*g + Math.sin(time*2.1)*0.8*(1-g);
  const lean = Math.sin(p*2 + .7)*.05*g - hog.arrive*.06
             + shake*Math.sin(time*38)*.055 - arch*.12;
  const sqz  = 1 + Math.sin(p*2 + 1.3)*.055*g;
  const shiv = hog.shiver * (Math.sin(time*34)*1.5 + Math.sin(time*23.3)*.9)
             + shake * Math.sin(time*46)*2.2;                 // the shake

  const sniffR = 6.5 + d*4.5;
  const sniff  = Math.pow(Math.max(0, Math.sin(time*sniffR)), 2);
  const jitter = Math.sin(time*27)*.5 + Math.sin(time*41)*.3;
  const eyeH   = 1 - hog.blink*.92;
  const earTilt = hog.flick*.55 + c*-.45;
  const earSq   = 1 - hog.flick*.22;

  // ── the one rotation. th = 0 is profile facing right, +90° is nose-on.
  //    hog.hd is his heading: 0 walks toward the lens, +90° walks right.
  const th = Math.PI/2 - hog.hd;
  const ct = Math.cos(th), st = Math.sin(th);

  /* His boat and his shiver arcs are flat 2D art from before he was geometry,
     drawn in raw screen coordinates. They used to be mirrored for free by
     ctx.scale(hog.dir*k, k); without that they no longer follow him at all — at
     hd = -PI/2 he sailed backwards with the wake streaming off his prow, and the
     "two little arcs off his back" were drawn across his face, for a whole
     season, since hog.shiver follows snowCover. `faceSgn` mirrors them and
     `boatS` foreshortens the hull as he turns, which is as close to 3D as flat
     art is going to get.

     boatS is floored at .34 in magnitude because cos(th) passes through zero
     nose-on, and §4 is explicit: never let an animation parameter reach a scale
     factor unguarded. A frog once scaled to zero height that way. */
  const faceSgn = ct >= 0 ? 1 : -1;
  const boatS   = faceSgn * Math.max(.34, Math.abs(ct));

  // body axes: he rounds up into a ball as he curls, and breathes
  const A = lerp(BODY.a, 21.5, c), B = lerp(BODY.b, 21.5, c)*sqz,
        Cc = lerp(BODY.c, 21.5, c);
  const MK = lerp(MK0, 1.01, c);              // curled, the coat closes over him
  /* His projected half-width. An ellipsoid under a rotation about the vertical
     axis projects to an axis-aligned ellipse EXACTLY, half-width
     sqrt(a²cos²θ + c²sin²θ), so this is not an approximation. It runs 26 in
     profile down to 19.5 nose-on, which is why the ground shadow has to use it
     rather than a constant. */
  const bw = Math.sqrt(A*A*ct*ct + Cc*Cc*st*st);

  ctx.save();
  ctx.translate(hog.x + shiv, sy + bob);
  ctx.rotate(lean);
  ctx.scale(k, k);

  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = a * (.09 + .05*Math.sin(time*3.2) + GAME.flash*.5);
  ctx.drawImage(SP_MAGIC, -80, -84, 160, 160);
  ctx.globalCompositeOperation = "source-over";

  if (afloat){
    // his boat. Flat art from before he was geometry; boatS mirrors and
    // foreshortens it so he stops sailing backwards when he turns.
    ctx.translate(0, Math.sin(time*1.25 + hog.x*.004)*2.4 + 4);
    ctx.save(); ctx.scale(boatS, 1);
    ctx.globalAlpha = a*.34;
    ctx.strokeStyle = "rgba(190,224,222,1)"; ctx.lineWidth = 2;
    for (let i=0;i<3;i++){
      const wy2 = 22 + i*5;
      ctx.beginPath(); ctx.moveTo(-42 - i*14, wy2); ctx.lineTo(-72 - i*24, wy2 - 2); ctx.stroke();
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = "#432e1c";
    ctx.beginPath();
    ctx.moveTo(-42, 4);
    ctx.quadraticCurveTo(-48, 26, -14, 31);
    ctx.lineTo(26, 31);
    ctx.quadraticCurveTo(54, 26, 58, 2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(26,17,10,.45)"; ctx.lineWidth = 1.5;
    for (const py of [13, 21]){
      ctx.beginPath(); ctx.moveTo(-40, py); ctx.quadraticCurveTo(8, py + 6, 54, py - 3); ctx.stroke();
    }
    ctx.restore();
    ctx.translate(0, -9);
  } else {
    ctx.globalAlpha = a*.32; ctx.fillStyle = "#02100a";
    // tracks his projected half-width: fixed at 27 it overhung him by 15px a
  // side nose-on, where bw falls to 19.5, and grew as he turned
  ctx.beginPath();
  ctx.ellipse(0, -GROUND - 1.5, bw + 1.5 + c*2, 6.5, 0, 0, TAU);
  ctx.fill();
    ctx.globalAlpha = a;
  }

  /* ── the coat. One pass over the quills, projected and depth-sorted. The
        far half is drawn, then the body, then the near half — so the far
        quills show only where they stick out past his outline, which is the
        jagged silhouette, and the near ones lie over his back as stubs. */
  const qs = [];
  /* His coat thins CONTINUOUSLY with the frame budget, not in one step at some
     threshold. §6's adaptive scaler starts thinning grass the moment quality
     leaves 1.0, so a coat that only thins below some cutoff lets the meadow pay
     for him first — and the meadow is the thing you are actually looking at.

     Which quills go is decided by `pri`, a bit-reversal (van der Corput)
     sequence, and the choice of sequence matters far more than it looks. I
     first used the golden ratio's fractional part, reasoning that the quills
     are already in golden-angle order so it would thin evenly. It does the
     opposite: `i*phi mod 1` and the golden-angle azimuth `ga*i` are built on
     the SAME irrational, so the test correlates with azimuth and strips whole
     wedges of him bald. Measured over 24 regions of the sphere at quality .5:
     golden gave a retention spread of sd 0.497 with regions at 0.00, i.e.
     completely bare; bit-reversal gives sd 0.034, worst region 0.43. */
  for (let i=0;i<QUILLS.length;i++){
    if (quality < .995 && QUILLS[i].pri >= quality) continue;
    const Q = QUILLS[i];
    if (Q.d > MK) continue;
    const n = Q.n;
    const px = A*n.x, py = B*n.y, pz = Cc*n.z;             // root, on the surface
    // the true outward normal of an ellipsoid is the gradient, not the radius
    let gx = n.x/A, gy = n.y/B, gz = n.z/Cc;
    const gl = Math.sqrt(gx*gx + gy*gy + gz*gz) || 1;
    gx /= gl; gy /= gl; gz /= gl;
    /* Raked toward his rump, and a RIPPLE runs down him nose to tail on every
       footfall — improvement #6, "nose to rump". The crest sits where
       p*2 + n.x*2.7 = pi/2, so as p advances the crest's n.x DECREASES: it
       starts at his nose (n.x = +1) and runs back to his rump (n.x = -1).
       I had this term negative first, which sent the wave the other way,
       rump to nose — and the comment claimed nose to rump regardless. It
       spans 0.86 of a wavelength across his back, so there is one visible
       crest on him at a time rather than a corrugation. A little per-quill
       scatter keeps the wavefront off looking like a drawn line. */
    const rip = Math.sin(p*2 + Q.n.x*2.7 + Q.wob*.30);
    const stir = rip*.075*g;
    let dx = gx - .58 + stir, dy = gy - .16, dz = gz;
    const dl = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
    dx /= dl; dy /= dl; dz /= dl;
    const len = lerp(12.6, 6.0, (n.x + 1)/2) * Q.lf * (1 + c*.16) * (1 + rip*.05*g)
              * (1 + shake*.16 - arch*.06);        // fluffed / flattened
    const tx = px + dx*len, ty = py + dy*len, tz = pz + dz*len;

    const bX = px*ct - pz*st, bD = px*st + pz*ct;
    const tX = tx*ct - tz*st, tD = tx*st + tz*ct;
    // lit off the quill's own direction, in screen space
    const wX = dx*ct - dz*st, wD = dx*st + dz*ct;
    const lit = Math.max(0, wX*L3.x + dy*L3.y + wD*L3.d);
    qs.push({ bX, bY:-py, tX, tY:-ty, D:(bD + tD)*.5,
              s: clamp(((lit*(QSHADE - 1))|0) + Q.tn, 0, QSHADE - 1),
      pale:Q.pale, rim: Math.abs(wD) < .62 });
  }
  qs.sort((u, v) => u.D - v.D);

  const bgc = ctx.createLinearGradient(0, -B, 0, B*1.15);
  bgc.addColorStop(0,   C.creamHi);
  bgc.addColorStop(.60, C.cream);
  bgc.addColorStop(1,   C.creamLo);

  /* ── whether you can see his head at all ──────────────────────────────
     His head sphere sits INSIDE the body ellipsoid — (20.4/26)² + (1.6/16.5)²
     is 0.62, comfortably within it — so the two interpenetrate, and that is
     the one case the painter's algorithm cannot sort. Depth-testing the head
     against the body puts his face behind his own flank in profile, where
     the head's depth is exactly zero.

     What is actually true is that the only visible part of his head is the
     bit that PROTRUDES out of the front of him, and you stop seeing that
     protrusion as it turns away from the lens. So the whole face group fades
     on how much his snout axis points toward you: full in profile and
     nose-on, gone by the time he has his back to you. The features already
     hide themselves individually on their own normals; this is the mass they
     sit on. Before it, you could see his whole face straight through him. */
  /* ── how hidden his head is, and how ─────────────────────────────────────
     `hide` runs 0 (full view) to 1 (gone), and takes the worse of two causes:
     he is curling up, or he has turned his head away past the point where his
     own body covers it.

     It is spent on RETRACTION, not on alpha. Both causes used to fade the face
     group's globalAlpha, which composited cream over his own dark coat — so
     over the 42° of heading between hd 103° and 124°, and again for ~150ms on
     the way out of every thorn hit, you could see his quills through his cheek
     and the grass through the rest of his head. Measured: cheek luminance fell
     227 → 134 → 79 across that band while it should have stayed 227 or gone.
     It is the exact fault §"the head rig" of the handover already records —
     "never alpha-fade cream over dark brown, it only gives grey" — and I had
     fixed it once for the curl and then reintroduced it with headVis.

     So the head shrinks back into his body instead, and the alpha only catches
     the last tenth, by which point it is a quarter of its size. */
  const headVis = clamp((st + .55)/.40, 0, 1);
  const hide = clamp(Math.max(c*1.85, 1 - headVis), 0, 1);
  const fa   = clamp((1 - hide)*9, 0, 1);
  const rt0  = 1 - hide*.86;

  function drawFace(){
    if (fa <= .02) return;
    ctx.globalAlpha = a * fa;
    const rt = rt0;                             // retracted, see `hide` above
    const hc = { x: HD_C.x*rt + hog.hlag, y: HD_C.y*rt - d*3.4, z: HD_C.z };
    const hcX = hc.x*ct - hc.z*st;

    // head yaw is BODY-relative now, which is what an animal's neck is. The
    // gaze aim from updateLook is converted where it is set.
    const hy = hog.yaw + hog.lag + Math.sin(time*sniffR*.5)*(.03 + d*.075)
             + d*Math.sin(time*1.3)*.16;
    const hp = hog.pitch + up*.62 - arch*.30            // nose to the air / stretched
             + sniff*(.055 + d*.115) + jitter*(.008 + d*.020)
             - hog.hlag*.030 - d*.34 + hog.shiver*Math.sin(time*26)*.03;

    const R = HD_R*rt;
    const HP = (dir, rr) => ({
      X: (hc.x + R*rr*dir.x)*ct - (hc.z + R*rr*dir.z)*st,
      Y: -(hc.y + R*rr*dir.y),
      D:  (hc.x + R*rr*dir.x)*st + (hc.z + R*rr*dir.z)*ct,
      n:  dir.x*st + dir.z*ct                   // the normal's depth: is it facing us
    });

    // ── the coat over his crown. Built here rather than in the body list
    //    because it rides the head's own yaw and pitch.
    const crown = [];
    for (const Q of HQUILLS){
      const rn = hRot(Q.n, hy, hp), rd = hRot(Q.dir, hy, hp);
      const bx = hc.x + R*rn.x, by = hc.y + R*rn.y, bz = hc.z + R*rn.z;
      const l  = Q.len * rt;
      const tx = bx + rd.x*l, ty = by + rd.y*l, tz = bz + rd.z*l;
      const wX = rd.x*ct - rd.z*st, wD = rd.x*st + rd.z*ct;
      crown.push({
        bX: bx*ct - bz*st, bY: -by, tX: tx*ct - tz*st, tY: -ty,
        D: (bx*st + bz*ct + tx*st + tz*ct)*.5,
        s: (Math.max(0, wX*L3.x + rd.y*L3.y + wD*L3.d)*(QSHADE - 1))|0,
        pale: Q.pale
      });
    }
    crown.sort((u, v) => u.D - v.D);
    function crownQuills(list, from, to){
      for (let i=from;i<to;i++){
        const q = list[i];
        let vx = q.tX - q.bX, vy = q.tY - q.bY;
        let vl = Math.hypot(vx, vy);
        if (vl < 1.1){ const k = 1.1/(vl || 1); vx *= k; vy *= k; vl = 1.1; }
        const nx = -vy/vl*1.35, ny = vx/vl*1.35;
        ctx.fillStyle = QCOL[q.pale ? 1 : 3][q.s];
        ctx.beginPath();
        ctx.moveTo(q.bX + nx, q.bY + ny);
        ctx.lineTo(q.bX + vx, q.bY + vy);
        ctx.lineTo(q.bX - nx, q.bY - ny);
        ctx.closePath(); ctx.fill();
      }
    }
    /* ALL of the crown coat goes down before the head sphere, with NO pass
       over the face. Only what lies outside the head's own outline can then
       show, which is a spiky fringe round his crown and nothing on his face.

       There is no filter that makes an overlay pass safe. Filtered by depth,
       the front of the crown lands on his cheek and reads as debris stuck to
       it. Filtered by screen height instead, his NAPE gets through — because
       nose-on everything on his sagittal plane projects to X = 0, so the back
       of his head lands in the middle of his face. Which is exactly what "I
       can see the spines on his head through his head" was. */
    crownQuills(crown, 0, crown.length);

    /* ── ears, drawn BEFORE the head sphere ────────────────────────────
       Two bugs lived here at once.

       They used to pass a literal 1.0 for the radius, so RR_EAR — which the
       handover documents as load-bearing, "an ear reads as an ear by poking
       out of the head's outline" — was declared and never used. The ear sat
       ON the sphere and was then buried by it almost entirely.

       And they were gated on faceVis of their own surface normal. An ear
       PROTRUDES; it is not a patch on the surface whose normal decides
       whether you can see it. It is hidden when the head is in front of it,
       and drawing it before the sphere is precisely what makes the sphere
       hide it. The normal gate hid BOTH ears whenever he was nose-on, since
       at an azimuth behind the equator both normals point away — and nose-on
       is exactly the view where you should see the pair of them, one either
       side of his head.

       In profile the two coincide, because the z that separates them
       projects away. That costs one redundant fill and looks like the single
       ear it is. */
    for (const side of [-1, 1]){
      const e = HP(headDir(side*AZ_EAR, EL_EAR, hy, hp), RR_EAR);
      const far = e.n < 0;
      const sc = .88 + .12*Math.max(0, e.n);
      ctx.globalAlpha = a * fa * (far ? .82 : 1);
      ctx.fillStyle = far ? "#3a2a1e" : C.ear;
      // an angled OVAL: round and whole on the cream it read as a second eye
      ctx.beginPath();
      ctx.ellipse(e.X, e.Y, 2.30*sc*earSq, 2.95*sc, -.34 + earTilt*side, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = a * fa;

    // a sphere projects to a circle, whatever the rotation
    ctx.fillStyle = bgc;
    ctx.beginPath(); ctx.arc(hcX, -hc.y, R, 0, TAU); ctx.fill();


    // the muzzle: a short cone along his snout, drawn as the projected axis.
    // When the snout points away it is behind his own head, so everything hung
    // off it — muzzle, nose, mouth, whiskers — goes with it. Without this his
    // nose sat on the back of his head as he walked away.
    const tipD = headDir(0, -.16, hy, hp);
    const snD = tipD.x*st + tipD.z*ct;
    const snV = frontVis(snD);
    const tip = HP(tipD, SNOUT_R), bse = HP(tipD, .26);
    const mdx = tip.X - bse.X, mdy = tip.Y - bse.Y;
    const slen = Math.hypot(mdx, mdy);
    if (snV > .02){
    ctx.globalAlpha = a * fa * snV;
    ctx.save();
    ctx.translate((tip.X + bse.X)/2, (tip.Y + bse.Y)/2);
    ctx.rotate(Math.atan2(mdy, mdx));
    ctx.fillStyle = C.muzzle;
    ctx.beginPath(); ctx.ellipse(0, 0, Math.max(4.2, slen*.5 + 2.2), 2.9, 0, 0, TAU); ctx.fill();
    ctx.restore();

    // the blush, hung off the eye so it can never land on the snout
    const bl = HP(headDir(AZ_EYE*.80, EL_EYE - .62, hy, hp), .95);
    if (bl.n > .04){
      ctx.globalAlpha = a * fa * clamp(bl.n*2.4, 0, 1);
      ctx.fillStyle = C.blush;
      ctx.beginPath(); ctx.ellipse(bl.X, bl.Y, 3.2, 2.2, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = a * fa;
    }

    // the nose. It flares on each sniff rather than sliding about.
    const fl = sniff*(.30 + d*.34);
    const nX = tip.X + jitter*(.10 + d*.35)*.35, nY = tip.Y - fl*.9;
    const nr = 1.8 + .7*(.5 + .5*Math.max(0, tipD.x*st + tipD.z*ct));
    ctx.fillStyle = C.nose;
    ctx.beginPath();
    ctx.ellipse(nX, nY, nr*(1 + fl*.34), nr*.88*(1 - fl*.14), .1, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.ellipse(nX - nr*.3, nY - nr*.4, nr*.34, nr*.26, -.3, 0, TAU); ctx.fill();

    // mouth, and whiskers. Both narrow as his snout turns toward the lens,
    // which now falls out of the projection instead of being faked.
    const fore = Math.abs(tipD.x*ct - tipD.z*st);       // how side-on the snout is

    /* ── his mouth. It is a point ON the head sphere, and the line lies ACROSS
          the projected snout axis, bowing outward away from his head. Drawn in
          screen space — a horizontal arc hung off the nose at a fixed offset
          down the frame — it slid off the side of his muzzle every time he
          pitched his head to sniff or turned, and stuck out into nothing. Now
          it cannot leave his face, and it narrows and fades round the side of
          its own accord. */
    /* His mouth is three real points on the head sphere: a corner either side
       and the middle below them. Its width runs ACROSS his head, which is +-z
       in model space, so it projects to nearly nothing in profile and to its
       full width nose-on — and the projection does that for free.

       It used to be one point with a line struck perpendicular to the SCREEN
       snout axis, scaled by how side-on he was. That is inverted: it came out
       7 units long and near-vertical in profile — a 20px worm hanging off his
       snout at full scale — and 2.3 units, correctly horizontal, only nose-on.
       It survived because face-on is the one stall that shows it right. */
    const mL = HP(headDir(-.46, -.52, hy, hp), .99);
    const mR = HP(headDir( .46, -.52, hy, hp), .99);
    const mC = HP(headDir(  0, -.66, hy, hp), 1.02);
    if (frontVis(mC.n) > .02){
      ctx.globalAlpha = a * fa * snV * frontVis(mC.n);
      ctx.strokeStyle = "rgba(74,52,40,.78)"; ctx.lineWidth = 1.1; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(mL.X, mL.Y);
      ctx.quadraticCurveTo(mC.X + (mC.X - (mL.X + mR.X)/2),
                           mC.Y + (mC.Y - (mL.Y + mR.Y)/2), mR.X, mR.Y);
      ctx.stroke();
      ctx.globalAlpha = a * fa * snV;
    }

    ctx.globalAlpha = a * fa * .17;
    ctx.strokeStyle = "rgba(246,240,228,1)"; ctx.lineWidth = .55;
    for (let side=-1; side<=1; side+=2)
      for (let i=0;i<2;i++){
        const spread = (i - .5)*2.2 + side*1.1;
        const reach  = 7*(.45 + .55*fore)*(1 + sniff*.28);
        ctx.beginPath();
        ctx.moveTo(nX, nY + 1);
        ctx.quadraticCurveTo(nX + (mdx/(slen||1))*reach*.5 + side*1.8, nY + spread + 1.6,
                             nX + (mdx/(slen||1))*reach + side*1.4, nY + spread*1.7);
        ctx.stroke();
      }
    }                                  // ── end of the snout group
    ctx.globalAlpha = a * fa;

    // eyes. Both are real points on the sphere, so the far one comes past the
    // snout of its own accord as he turns.
    /* Which eye is the far one depends on `th`, not on the loop index. Keyed
       off `side` — as this was — his pupil only ever went properly black when
       he happened to be walking RIGHT: facing left it measured lum 52 against
       a paint value of 13, lighter than his own darkest quill, and nose-on
       both eyes came out mid-grey and did not even match each other. He read
       half-asleep in every view but one.

       And faceVis was being used as ALPHA on an opaque mark, so the pupil
       could not reach full black unless e.n >= .26 — near profile only. It is
       a hide/show test now: the foreshortening lives in `sc`, and the pupil
       stays opaque until it goes round the edge. */
    for (const side of [-1, 1]){
      const e = HP(headDir(side*AZ_EYE, EL_EYE, hy, hp), RR_EYE);
      const far = e.n < 0;
      if (e.n < -.06) continue;                  // round the back of his head
      const v = clamp((e.n + .06)/.10, 0, 1);    // a short edge fade, no more
      const sc = (.80 + .20*Math.max(0, e.n)) * (far ? .94 : 1);
      ctx.globalAlpha = a * fa * v * (far ? .90 : 1);
      ctx.fillStyle = "#120c0b";
      ctx.beginPath(); ctx.ellipse(e.X, e.Y, 1.78*sc, 2.0*sc*eyeH, 0, 0, TAU); ctx.fill();
      if (eyeH > .35){
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.beginPath(); ctx.arc(e.X + .60*sc, e.Y - .68*sc, .66*sc, 0, TAU); ctx.fill();
      }
      ctx.strokeStyle = "rgba(74,54,42,.30)"; ctx.lineWidth = .8*sc;
      ctx.beginPath(); ctx.arc(e.X, e.Y, 2.5*sc, -2.5, -1.0); ctx.stroke();
      ctx.globalAlpha = a * fa;
    }
    ctx.globalAlpha = a;
  }




  function quills(from, to){
    for (let i=from;i<to;i++){
      const q = qs[i];
      let vx = q.tX - q.bX, vy = q.tY - q.bY;
      const vl = Math.hypot(vx, vy);
      ctx.fillStyle = QCOL[q.pale ? 2 : 0][q.s];
      if (vl < 3.2){
        /* Aimed at the lens a quill is not a sliver, it is a DOT of its own
           cross-section. Drawn as a degenerate triangle it left a bare brown
           gap wherever many of them pointed at you at once — which nose-on is
           his entire rear coat, right in the middle of him. */
        ctx.beginPath();
        ctx.ellipse(q.bX + vx*.5, q.bY + vy*.5, 2.5, 2.1, 0, 0, TAU);
        ctx.fill();
        continue;
      }
      const nx = -vy/vl*1.55, ny = vx/vl*1.55;      // half-width at the root
      ctx.beginPath();
      ctx.moveTo(q.bX + nx, q.bY + ny);
      ctx.lineTo(q.bX + vx, q.bY + vy);
      ctx.lineTo(q.bX - nx, q.bY - ny);
      ctx.closePath(); ctx.fill();
      // the band: pale tip over a dark base. Only where the quill is long
      // enough in SCREEN space to show one — on a foreshortened quill the
      // overlay is just a fat pale blob, and a few hundred of those read as
      // scales on a pinecone.
      if (q.pale && vl > 4.2 && q.rim){
        ctx.fillStyle = QCOL[1][q.s];
        ctx.beginPath();
        ctx.moveTo(q.bX + vx*.54 + nx*.48, q.bY + vy*.54 + ny*.48);
        ctx.lineTo(q.bX + vx, q.bY + vy);
        ctx.lineTo(q.bX + vx*.54 - nx*.48, q.bY + vy*.54 - ny*.48);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  let split = 0;
  while (split < qs.length && qs[split].D <= 0) split++;
  quills(0, split);

  // ── legs, sorted the same way. Depth does the near/far pairing now, so
  //    there is no draw-order rule to get wrong and no colour trick needed.
  /* ── legs, jointed, with the feet PLANTED ───────────────────────────────
     Each leg has a stance and a swing. During the stance the foot stays put
     and travels backward under him at the rate he is going forward, so the
     body passes over a planted foot; during the swing it lifts and comes
     through. Before this the foot was a cosine offset about the hip, which
     means it slid along the ground the whole time — §10's "straight stubs
     whose feet slide", improvement #2.

     All of it is driven by hog.walk, which advances with DISTANCE rather than
     time, so it cannot moonwalk however fast or slow he is going.

     A FULLY planted foot is not reachable, and here is the arithmetic so that
     nobody tries to reach it by guessing. hog.walk advances .062 per world px,
     so one leg cycle is 2pi/.062 = 101 world px = 44 model units of travel, of
     which the stance is 62% = 27 units. To stay put the foot would have to
     travel all 27 of those backwards — on a leg 10 units long. STR would have
     to be 13.6 and the swing arc 27 units, nearly his whole body length.

     I tried STR = 7.2, which cuts the slide from 0.68 of his speed to 0.47 —
     and it looked WORSE, because a 14.4-unit arc reaches a foot almost under
     his own nose. Chasing a number that cannot be reached made him worse, so
     STR is 5.0: a 10-unit arc, about one leg length, and a slide of 0.62.

     The stance/swing shape is still worth having over the cosine it replaced,
     because the foot now dwells through the stance and snaps through the
     swing rather than sliding sinusoidally the whole way round.

     The real culprit is the stride RATE. 101px per cycle is a ~20cm stride at
     the field's ~500px/m, far too long for him. Halving it would plant the
     feet properly, but the body bob is locked to twice the leg rate and is
     already 5.9Hz at full pelt, so halving the stride doubles that to 11.8Hz
     and he buzzes. Fixing this properly means re-timing the whole gait, and
     probably slowing him down; it is not a tweak to STR.

     Diagonal trot: the far pair leads the near pair by half a stride. And the
     knee breaks backward on his front legs and forward on his hind ones,
     which is the zig-zag every quadruped has and reads as a joint even at
     four pixels.  */
  const legs = [];
  if (c < .82 && !afloat){
    const up = 1 - c/.82;
    const STR = 5.0, DUTY = .62;              // stride, and the share on the ground
    const tuck = y => lerp(B*.35, y, up);     // curled, they retract up into him
    for (const [lx, lz, ph, front] of [
           [ 11.5,  Cc*.52, p,           1], [-11.5,  Cc*.52, p + Math.PI, 0],
           [ 11.5, -Cc*.52, p + Math.PI, 1], [-11.5, -Cc*.52, p,           0]]){
      let u = (ph/TAU) % 1; if (u < 0) u += 1;
      let off, lift;
      if (u < DUTY){ off = STR*(1 - 2*(u/DUTY)); lift = 0; }        // planted
      else { const w = (u - DUTY)/(1 - DUTY);                        // swinging
             off = STR*(-1 + 2*w); lift = Math.sin(Math.PI*w)*3.4; }
      const fx = lx + off*g, lf = lift*g;
      const hipS  = tuck(B*.62);                       // screen y = -(model up)
      const footS = tuck(-GROUND - lf);
      const kneeX = (lx + fx)*.5 + (front ? -1.9 : 2.1)*g - lf*.16;
      legs.push({ D: lx*st + lz*ct,
                  hX: lx*ct - lz*st,    hY: hipS,
                  kX: kneeX*ct - lz*st, kY: (hipS + footS)*.5,
                  fX: fx*ct - lz*st,    fY: footS });
    }
  }
  legs.sort((u, v) => u.D - v.D);
  for (const L of legs){
    const near = L.D > 0;
    ctx.strokeStyle = near ? C.limb : "#a5895f";
    ctx.lineWidth = 4.4; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(L.hX, L.hY); ctx.lineTo(L.kX, L.kY); ctx.lineTo(L.fX, L.fY - 1);
    ctx.stroke();
    ctx.fillStyle = near ? C.paw : "#7a6046";
    ctx.beginPath(); ctx.ellipse(L.fX + .8, L.fY, 3.0, 2.4, 0, 0, TAU); ctx.fill();
  }

  // ── his body: one fill, and no approximation. See bw above.
  ctx.fillStyle = bgc;
  ctx.beginPath(); ctx.ellipse(0, 0, bw, B, 0, 0, TAU); ctx.fill();

  /* ── the dark mass under the coat. Without this the cream body shows
        between the quills and he reads as an artichoke: 250 narrow needles
        nowhere near cover an ellipsoid. Rather than fill the true mantle
        region — a plane section of an ellipsoid, which projects to an awkward
        composite of curve and silhouette — it is the body ellipse shifted
        along the boundary plane's own normal. Which means it is correct from
        every angle for one fill: back-and-up in profile, straight up when he
        is nose-on, over all of him from behind. The ragged quill roots hide
        the seam, which is what they do on the animal too. */
  const off = 7.6 * (1 - c*.75);
  const mgc = ctx.createLinearGradient(0, -B, 0, B*.6);
  mgc.addColorStop(0, C.mantleHi);
  mgc.addColorStop(1, C.mantleLo);
  // CLIPPED to his body. Offset back-and-up, the mass reaches ~3px past the
  // top of his silhouette, and what you saw was a smooth brown crescent
  // hanging behind his head with no coat on it.
  /* The mass is WIDENED by how nose-on he is, and only then. In profile the
     offset is mostly backwards, so the cream it leaves over is his chest, off
     to one side, which is what it should be. Nose-on the offset goes purely
     vertical and the leftover becomes LEFT-RIGHT SYMMETRIC and sits directly
     under his face: a cream horseshoe 36 units across — nearly twice his head —
     with tips rising 3.7 units ABOVE eye level. It read as an enormous open
     grin with his actual mouth lost inside it. A third mass, which is the
     thing the two-masses rule exists to prevent.

     Widening it everywhere would fix that and eat his profile chest (4.8 units
     of it left instead of 8.8). Scaling the widening by (1 - |ct|) fixes only
     the view that is broken. And nose-on is not an edge case: progress means
     increasing wy, which means walking DOWN the screen, which means hd near 0.
     Nose-on is his normal travelling attitude — the lab's stalls are mostly
     profile, and the game is mostly not. */
  const noseOn = 1 - Math.abs(ct);
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, bw, B, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = mgc;
  ctx.beginPath();
  ctx.ellipse(-MN.x*off*ct + MN.z*off*st, MN.y*off,
              bw*(.94 + .18*noseOn), B*(.94 + .08*noseOn), 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  /* The near half of the coat goes down BEFORE his face. Drawn after it, any
     quill on this side that happened to overlap his head was painted straight
     over his eye — §10's "the quills were once drawn last, over everything,
     which buried his ear and eye". Only the crown hood belongs on top, and
     that is drawn from inside the face block. */
  quills(split, qs.length);
  drawFace();

  if (afloat){
    ctx.save(); ctx.scale(boatS, 1);          // the gunwale, in front of him
    ctx.fillStyle = "#6b4c2e";
    ctx.beginPath();
    ctx.moveTo(-42, 13); ctx.quadraticCurveTo(6, 20, 58, 11);
    ctx.lineTo(58, 3); ctx.quadraticCurveTo(6, 12, -42, 5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  if (hog.shiver > .35 && !afloat){
    ctx.globalAlpha = a * hog.shiver * (.35 + .3*Math.sin(time*11));
    ctx.strokeStyle = "rgba(198,226,246,1)"; ctx.lineWidth = 1.5;
    ctx.save(); ctx.scale(faceSgn, 1);        // off his BACK, whichever way he faces
    for (let i=0;i<2;i++){
      ctx.beginPath(); ctx.arc(-6, -6, 30 + i*7, -2.5, -1.6); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
// the readout is now how far he has to go, not how far the camera has drifted
function updateMeter(dt){
  travelled = Math.max(0, hog.wy - GAME.startWy) / PX_PER_M;
  const togo = Math.max(0, GAME.goalWy - hog.wy) / PX_PER_M;
  if (frameId % 5 === 0){
    elDist.textContent = togo.toFixed(1);
    elUnit.textContent = "\u00a0m to go";
    elBar.style.width = (clamp(travelled / ((GAME.goalWy - GAME.startWy)/PX_PER_M), 0, 1)*100).toFixed(1) + "%";
  }
}

/* ─────────────────────────────  terrain  ─────────────────────────── */
// The world runs in bands. Meadow always sits between the odd stretches,
// so you never get two strange places back to back.
const SEG = 4400, XF = 1100;
const MEADOW = 0, DRY = 1, MUD = 2, LAKE = 3, FARM = 4, ROAD = 5, TOWN = 6, MGARD = 7, BGARD = 8,
      SNOW = 9, POOL = 10, AUTUMN = 11, NIGHT = 12, HENS = 13;

// meadow, parched grass, the lake, meadow again, the farm, its mud,
// the road, the edge of town, and back out into the fields
const WOOD = AUTUMN;
// POOL (the rock pool with the bubbles) was dropped: it read as an aquarium
// dropped into a meadow. Its code is still here but it is never reached.
const ORDER = [BGARD, WOOD, MGARD, LAKE, MUD, HENS, FARM, ROAD, TOWN, MEADOW];
const ZONE_NAME = ["long meadow","dry grass","the mire","the lake","the farmyard",
                   "the road","edge of town","mushroom garden","butterfly garden",
                   "the snowfield","the shore","the wood","the night meadow","the hen run"];
function segBiome(seg){ return seg <= 0 ? MEADOW : ORDER[(seg - 1) % ORDER.length]; }

const TER = [
  { dens:1,   len:1,   dry:0,   soil:0,   col:"90,74,46"  },
  { dens:.40, len:.76, dry:1,   soil:.40, col:"124,98,56" },
  { dens:.19, len:.64, dry:.5,  soil:1,   col:"54,44,34"  },
  { dens:.14, len:.62, dry:.2,  soil:.25, col:"48,52,48"  },
  { dens:.34, len:.50, dry:.8,  soil:.58, col:"110,88,54" },
  { dens:.30, len:.46, dry:.75, soil:.55, col:"78,72,62"  },
  { dens:.16, len:.38, dry:.45, soil:.60, col:"92,90,86"  },
  { dens:.58, len:.82, dry:.04, soil:.42, col:"54,46,38"  },
  { dens:.95, len:1.05,dry:.02, soil:.05, col:"88,78,50"  },
  { dens:.30, len:.50, dry:0,   soil:0,   col:"172,190,212" },  // snow
  { dens:.07, len:.40, dry:.1,  soil:0,   col:"150,136,112" },  // rock pool
  { dens:0,   len:.45, dry:.30, soil:0,   col:"112,60,28"   },  // the wood
  { dens:1,   len:1,   dry:0,   soil:0,   col:"60,68,80"    },  // night
  { dens:.20, len:.38, dry:.55, soil:0,   col:"124,98,62"   },  // hen run
];
function segAt(worldY){
  const f = worldY / SEG, seg = Math.floor(f), local = (f - seg)*SEG;
  const a = segBiome(seg);
  if (local > SEG - XF) return { a, b: segBiome(seg+1), t: (local - (SEG - XF))/XF, seg };
  return { a, b:a, t:0, seg };
}
function terAt(worldY, key){
  const m = segAt(worldY);
  return m.t ? lerp(TER[m.a][key], TER[m.b][key], m.t) : TER[m.a][key];
}
// a band of hard ground inside its zone, with a soft edge
function bandAt(worldY, kind){
  const f = worldY / SEG, seg = Math.floor(f);
  if (segBiome(seg) !== kind) return 0;
  const local = (f - seg)*SEG;
  const e = kind === LAKE ? 420 : 210;
  const a = kind === LAKE ? .17 : .25, z = kind === LAKE ? .85 : .77;
  return Math.min(clamp((local - SEG*a)/e, 0, 1), clamp((SEG*z - local)/e, 0, 1));
}
function bandEdges(seg, kind){
  const a = kind === LAKE ? .17 : .25, z = kind === LAKE ? .85 : .77;
  return [seg*SEG + SEG*a, seg*SEG + SEG*z];
}
const lakeAt = wy => bandAt(wy, LAKE);
const roadAt = wy => bandAt(wy, ROAD);
const townAt = wy => bandAt(wy, TOWN);
const hardAt = wy => Math.max(lakeAt(wy), roadAt(wy), townAt(wy));
let dryNow = 0, dryB = 0, gradeB = 0, lakeNow = 0;
let snowNow = 0, poolNow = 0, autumnNow = 0, nightNow = 0, henNow = 0, woodNow = 0;

// A full year takes 284m and a full day 209m, so the two drift against each
// other and against the 220m round of places. Nothing ever repeats exactly.
const YEAR = 62400, DAYLEN = 46000;
let seaW = [1,0,0,0], seasonQ = 0, snowCover = 0, leafFall = 0, leafSpring = 0;
function seaBlend(wy){ const f = mod(wy/(YEAR/4), 4), i = f|0; return [i, f - i]; }
function seaMix(wy, a){ const [i,t] = seaBlend(wy); return lerp(a[i], a[(i+1)%4], t); }
function winterAt(wy){ return seaMix(wy, [0,0,0,1]); }
function nightAt(wy){
  const p = mod(wy/DAYLEN, 1);
  return clamp((-Math.cos(p*TAU) - .22)/.78, 0, 1);
}
const SEA_LEN = [.86, 1.10, 1.00, .58];
const SEA_DEN = [.94, 1.06, .96, .55];
function updateSeasonGlobals(){
  const wy = scrollY + H*.5;
  const [i, t] = seaBlend(wy);
  seaW = [0,0,0,0]; seaW[i] = 1 - t; seaW[(i+1)%4] = t;
  snowCover  = clamp((seaW[3] - .16)/.5, 0, 1);
  snowNow    = clamp((seaW[3] - .08)/.5, 0, 1);
  leafFall   = 0;                       // set once we know if there are trees
  leafSpring = seaW[0] > seaW[2] ? 1 : 0;
  nightNow   = nightAt(wy);
  seasonQ    = Math.min(5, Math.floor(mod(wy/(YEAR/4), 4)/4*6));
}

/* ── bare soil, mud and straw showing through thin grass ── */
const SOIL_ROW = 620;
function soilCell(ci){
  const key = "so|" + ci;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(ci, 4471));
  const p = [];
  for (let i=0;i<7;i++) p.push({
    x: r()*1.2 - .1, y: r(), rx: lerp(38,170,r()), ry: lerp(14,52,r()),
    a: lerp(.16,.42,r()), rot: r()*TAU, pool: r() < .34, s: r()
  });
  c = { seen: frameId, p };
  cells.set(key, c);
  return c;
}
function drawSoil(){
  const c0 = Math.floor((scrollY - 260)/SOIL_ROW);
  const c1 = Math.floor((scrollY + H + 260)/SOIL_ROW);
  for (let ci=c0; ci<=c1; ci++){
    const wy = ci*SOIL_ROW;
    const m = segAt(wy);
    const soil = m.t ? lerp(TER[m.a].soil, TER[m.b].soil, m.t) : TER[m.a].soil;
    if (soil < .03) continue;
    const col = (m.t > .5 ? TER[m.b] : TER[m.a]).col;
    const wetLook = (m.t > .5 ? m.b : m.a) === MUD;
    const cell = soilCell(ci);
    for (const q of cell.p){
      const sy = wy + q.y*SOIL_ROW - scrollY;
      if (sy < -70 || sy > H + 70) continue;
      const sx = q.x*W;
      ctx.globalAlpha = q.a * soil;
      ctx.fillStyle = "rgba(" + col + ",1)";
      ctx.beginPath(); ctx.ellipse(sx, sy, q.rx, q.ry, q.rot, 0, TAU); ctx.fill();
      if (q.pool && wetLook){
        ctx.globalAlpha = .30 * soil;
        ctx.fillStyle = "rgba(16,26,28,1)";
        ctx.beginPath(); ctx.ellipse(sx, sy, q.rx*.6, q.ry*.5, q.rot, 0, TAU); ctx.fill();
        ctx.globalAlpha = .14 * soil * (1 + Math.sin(time*1.3 + q.s*9)*.3);
        ctx.fillStyle = "rgba(168,200,206,1)";
        ctx.beginPath(); ctx.ellipse(sx - q.rx*.12, sy - q.ry*.14, q.rx*.34, q.ry*.16, q.rot, 0, TAU); ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;
}

/* ─────────────────────────────  the lake  ────────────────────────── */
function lakeCell(seg){
  const key = "lk|" + seg;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(seg, 6607));
  const [top, bot] = bandEdges(seg, LAKE);
  const pads = [];
  for (let i=0;i<7;i++) pads.push({
    x: r()*1.1 - .05, y: lerp(top+120, bot-120, r()),
    rx: lerp(30,62,r()), rot: r()*TAU, sh: lerp(.34,.5,r())
  });
  const fish = [];
  const nf = 10 + (r()*8|0);
  for (let i=0;i<nf;i++){
    const sn = Math.pow(r(), 1.8);            // mostly fry, the odd big one
    fish.push({
      x: r()*W, y: lerp(top+180, bot-180, r()),
      ang: r()*TAU, sz: lerp(6, 36, sn), spd: lerp(74, 22, sn),
      ph: r()*TAU, turn: lerp(4, 1.2, sn), d: lerp(.35, 1, r()),
      jt: 0, cool: 0
    });
  }
  const frogs = [];
  const nfr = 4 + (r()*4|0);
  for (let i=0;i<nfr;i++){
    const onTop = r() < .5;
    const sz = lerp(24, 42, r());
    frogs.push({
      x: lerp(-20, W+20, r()),
      wy: (onTop ? top : bot) + (onTop ? -1 : 1)*lerp(20, 150, r()),
      sz, ph: r()*TAU, face: r() < .5 ? -1 : 1,
      jt: 0, cool: 0, vx: 0, vy: 0, idle: lerp(3, 18, r()),
      col: "hsl(" + (78 + r()*44).toFixed(0) + "," + (26 + r()*18).toFixed(0) + "%," + (24 + r()*14).toFixed(0) + "%)",
      dark: "hsl(" + (76 + r()*40).toFixed(0) + ",30%," + (13 + r()*7).toFixed(0) + "%)"
    });
  }
  const dragons = [];
  const nd = 2 + (r()*3|0);
  for (let i=0;i<nd;i++){
    const dx0 = r()*W, dy0 = lerp(top+140, bot-140, r());
    dragons.push({
      x: dx0, wy: dy0, tx: dx0, ty: dy0, hold: r()*1.5,
      sz: lerp(30, 44, r()), ph: r()*TAU,
      col: ["#2f6f8c","#2c7f6a","#7a3550","#4a5f9c"][(r()*4)|0]
    });
  }
  c = { seen: frameId, top, bot, pads, fish, frogs, dragons };
  cells.set(key, c);
  return c;
}

function splashDrops(x, y, n, spd){
  for (let i=0;i<n && motes.length<MOTE_MAX;i++){
    const a = -Math.PI*.5 + (Math.random()*2-1)*1.15;
    motes.push({
      x, y, z:1.25, r:lerp(.9,2.4,Math.random()), a:lerp(.5,.95,Math.random()),
      vx:Math.cos(a)*lerp(spd*.3, spd, Math.random()),
      vy:Math.sin(a)*lerp(spd*.4, spd, Math.random()),
      ph:Math.random()*TAU, life:lerp(.5,1.2,Math.random()), sp:SP_MOTEB
    });
  }
}

// Anything that stands up out of the ground is drawn after the low grass and
// before the tall grass, so blades pass in front of it rather than through it.
function drawShoreLife(dt){
  const s0 = Math.floor((scrollY - 400)/SEG), s1 = Math.floor((scrollY + H + 400)/SEG);
  for (let sg=s0; sg<=s1; sg++){
    if (segBiome(sg) !== LAKE) continue;
    const L = lakeCell(sg);
    for (const f of L.frogs) drawFrog(f, f.wy - scrollY, dt);
    for (const d of L.dragons) drawDragon(d, dt);
  }
}

function drawStanding(dt){
  drawBurrow();
  drawCrossings();
  drawThorns(dt);
  drawFarmObjects();
  drawSnowmen(dt);
  drawRobins(dt);
  drawCrabs(dt);
  drawSquirrels(dt);
  drawHens(dt);
  drawEggs();
  drawGardens(dt);
  drawPlantedMush(dt);
  drawShoreLife(dt);
}

function drawLake(dt){
  const s0 = Math.floor((scrollY - 400)/SEG), s1 = Math.floor((scrollY + H + 400)/SEG);
  for (let sg=s0; sg<=s1; sg++){
    if (segBiome(sg) !== LAKE) continue;
    const L = lakeCell(sg);
    const y0 = L.top - scrollY, y1 = L.bot - scrollY;
    if (y1 < -80 || y0 > H + 80) continue;
    const a = Math.max(y0, -60), b = Math.min(y1, H + 60);

    // body
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0,   "#0a1a18");
    g.addColorStop(.14, "#04171a");
    g.addColorStop(.5,  "#031216");
    g.addColorStop(.86, "#04171a");
    g.addColorStop(1,   "#0a1a18");
    ctx.fillStyle = g;
    ctx.fillRect(0, a, W, b - a);

    // sky and sun smeared on the surface
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = .10;
    ctx.drawImage(SP_SUN, W*.46, y0 - H*.1, W*.9, (b-a)*1.1);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    // ripples: one path, many dashes
    const rr = rng(hash2(sg, 99));
    ctx.strokeStyle = "rgba(150,196,200,1)";
    ctx.lineWidth = 1;
    ctx.lineCap = "round";
    ctx.globalAlpha = .16;
    ctx.beginPath();
    for (let y = Math.floor(a/9)*9; y < b; y += 9){
      const row = ((y + scrollY)/9)|0;
      const n = 3 + (hash2(row, sg) % 3);
      for (let i=0;i<n;i++){
        const seed = hash2(row*7 + i*131, sg) / 4294967296;
        const w2 = lerp(18, 86, seed);
        const drift = Math.sin(time*.7 + seed*11 + row*.09)*22;
        const x = mod(seed*W*1.4 + drift, W + 120) - 60;
        ctx.moveTo(x, y);
        ctx.lineTo(x + w2, y);
      }
    }
    ctx.stroke();

    // brighter glints
    ctx.strokeStyle = "rgba(226,244,236,1)";
    ctx.globalAlpha = .26;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    for (let y = Math.floor(a/26)*26; y < b; y += 26){
      const seed = hash2((((y + scrollY)/26)|0)*13, sg) / 4294967296;
      const fl = .5 + .5*Math.sin(time*2.2 + seed*17);
      if (fl < .45) continue;
      const x = mod(seed*W*1.7 + Math.sin(time*.5 + seed*7)*30, W + 90) - 45;
      ctx.moveTo(x, y); ctx.lineTo(x + lerp(10, 34, seed)*fl, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // fish
    const JD = 1.15;
    for (const f of L.fish){
      f.cool -= dt;
      const jumping = f.jt > 0;
      const u = jumping ? clamp(f.jt/JD, 0, 1) : 0;

      f.ang += Math.sin(time*.6 + f.ph)*dt*f.turn*.5;
      f.x += Math.cos(f.ang)*f.spd*dt*(jumping ? 1.9 : 1);
      f.y += Math.sin(f.ang)*f.spd*.5*dt*(jumping ? 1.9 : 1);
      if (f.x < -60){ f.x = -60; f.ang = Math.PI - f.ang; }
      if (f.x > W+60){ f.x = W+60; f.ang = Math.PI - f.ang; }
      if (f.y < L.top+120){ f.y = L.top+120; f.ang = -f.ang; }
      if (f.y > L.bot-120){ f.y = L.bot-120; f.ang = -f.ang; }
      const fy = f.y - scrollY;

      if (jumping){
        f.jt += dt;
        if (Math.random() < dt*26) splashDrops(f.x, fy - Math.sin(u*Math.PI)*(52 + f.sz*3.1), 1, 24);
        if (f.jt >= JD){
          f.jt = 0;
          rings.push({ x:f.x, y:fy, r:5, max:44 + f.sz*2.4, a:.8, col:"198,228,226" });
          splashDrops(f.x, fy, 7 + (f.sz*.3|0), 96);
        }
      } else if (f.cool <= 0 && fy > -40 && fy < H+40){
        const hit = (46 + f.sz*1.7) * (46 + f.sz*1.7);
        let got = null;
        for (const p of ptrs.values()){
          const dx = f.x - p.x, dy = fy - p.y;
          if (dx*dx + dy*dy < hit){ got = p; break; }
        }
        if (!got) for (const p of taps){
          const dx = f.x - p.x, dy = fy - p.y;
          if (dx*dx + dy*dy < hit){ got = p; break; }
        }
        if (got){
          f.jt = 0.0001; f.cool = 2.6;
          f.ang = Math.atan2(fy - got.y, f.x - got.x);   // bolts away from the finger
          rings.push({ x:f.x, y:fy, r:4, max:40 + f.sz*2.2, a:.85, col:"206,236,232" });
          splashDrops(f.x, fy, 6 + (f.sz*.3|0), 88);
        }
      }

      if (fy < -90 || fy > H+90) continue;
      const lift = jumping ? Math.sin(u*Math.PI)*(52 + f.sz*3.1) : 0;
      const pitch = jumping ? -Math.cos(u*Math.PI)*.85*(Math.cos(f.ang) < 0 ? -1 : 1) : 0;
      const sz = f.sz, wag = Math.sin(time*(jumping?16:7) + f.ph)*.34;
      ctx.save();
      ctx.translate(f.x, fy - lift);
      ctx.rotate(f.ang + pitch);
      if (jumping) ctx.scale(1 + u*.06, 1 + u*.06);
      ctx.globalAlpha = jumping ? 1 : .30 + .45*f.d;
      ctx.fillStyle = jumping ? "#16383a" : "#071c1e";
      ctx.beginPath(); ctx.ellipse(0, 0, sz, sz*.36, 0, 0, TAU); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-sz*.86, 0);
      ctx.lineTo(-sz*1.5, sz*.42 + wag*sz*.4);
      ctx.lineTo(-sz*1.5, -sz*.42 + wag*sz*.4);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = jumping ? .85 : (.10 + .22*f.d);
      ctx.strokeStyle = "rgba(196,230,220,1)";
      ctx.lineWidth = 1.1 + (jumping ? .8 : 0);
      ctx.beginPath();
      ctx.moveTo(-sz*.6, -sz*.2); ctx.quadraticCurveTo(0, -sz*.42, sz*.72, -sz*.1);
      ctx.stroke();
      if (jumping){
        ctx.globalAlpha = .5;
        ctx.fillStyle = "rgba(228,246,240,1)";
        ctx.beginPath(); ctx.ellipse(sz*.34, -sz*.12, sz*.26, sz*.1, 0, 0, TAU); ctx.fill();
      }
      ctx.restore();
      if (!jumping && f.d > .8 && Math.random() < dt*.5)
        rings.push({ x:f.x, y:fy, r:3, max:34, a:.34, col:"170,210,206" });
    }
    ctx.globalAlpha = 1;

    // lily pads
    for (const p of L.pads){
      const py = p.y - scrollY;
      if (py < -50 || py > H+50) continue;
      const px = p.x*W, sway = Math.sin(time*.5 + p.rot)*3;
      ctx.save();
      ctx.translate(px + sway, py);
      ctx.rotate(p.rot);
      ctx.fillStyle = "#0e2a1c";
      ctx.beginPath(); ctx.arc(0, 0, p.rx, p.sh, TAU + p.sh - .5); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = .22;
      ctx.fillStyle = "#3d7a52";
      ctx.beginPath(); ctx.arc(-p.rx*.2, -p.rx*.24, p.rx*.5, p.sh, TAU + p.sh - .5); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }


    // rain dimples the surface
    if (wet > .25 && Math.random() < dt*wet*34)
      rings.push({ x:Math.random()*W, y:lerp(a, b, Math.random()), r:2, max:26, a:.4, col:"186,220,222" });

    const ice = clamp((winterAt(L.top) - .25)/.55, 0, 1);
    if (ice > .02){
      ctx.globalAlpha = ice*.9;
      const ig = ctx.createLinearGradient(0, y0, 0, y1);
      ig.addColorStop(0,   "rgba(206,226,238,.95)");
      ig.addColorStop(.24, "rgba(178,204,220,.35)");
      ig.addColorStop(.5,  "rgba(150,180,198,.10)");
      ig.addColorStop(.76, "rgba(178,204,220,.35)");
      ig.addColorStop(1,   "rgba(206,226,238,.95)");
      ctx.fillStyle = ig;
      ctx.fillRect(0, a, W, b - a);
      ctx.strokeStyle = "rgba(232,244,252,.5)"; ctx.lineWidth = 1.6;
      const ir = rng(hash2(sg, 4111));
      for (let i=0;i<9;i++){
        const cx2 = ir()*W, cy2 = lerp(y0, y1, ir());
        ctx.beginPath();
        ctx.moveTo(cx2, cy2);
        for (let k=0;k<3;k++)
          ctx.lineTo(cx2 + (ir()*2-1)*70, cy2 + (ir()*2-1)*44);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // shoreline
    for (const [edge, dir] of [[y0,-1],[y1,1]]){
      if (edge < -120 || edge > H+120) continue;
      const sg2 = ctx.createLinearGradient(0, edge, 0, edge + dir*130);
      sg2.addColorStop(0, "rgba(24,30,26,.78)");
      sg2.addColorStop(1, "rgba(24,30,26,0)");
      ctx.fillStyle = sg2;
      ctx.fillRect(0, dir < 0 ? edge - 130 : edge, W, 130);
      ctx.globalAlpha = .30;
      ctx.strokeStyle = "rgba(198,222,206,1)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let x=0; x<=W; x+=10){
        const yy = edge + Math.sin(x*.021 + time*.9 + sg)*2.6;
        x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

/* ───────────────────────────  farmyard  ──────────────────────────── */
function farmCell(seg){
  const key = "fm|" + seg;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(seg, 3313));
  const base = seg*SEG;
  const fences = [];
  for (let i=0;i<2;i++) fences.push({
    y: base + SEG*lerp(.22 + i*.38, .34 + i*.38, r()),
    n: Math.ceil(W/430) + 3, lean: (r()*2-1)*.10, off: r()
  });
  const bales = [];
  for (let i=0;i<3;i++) bales.push({
    x: lerp(.10,.90,r()), y: base + SEG*lerp(.12,.88,r()),
    s: lerp(.8,1.3,r()), rot: (r()*2-1)*.16, seed: (r()*1e9)|0
  });
  const ruts = { x1: lerp(.18,.34,r()), x2: lerp(.62,.8,r()), amp: lerp(10,30,r()) };
  c = { seen: frameId, fences, bales, ruts };
  cells.set(key, c);
  return c;
}
function drawFarmGround(){
  const s0 = Math.floor((scrollY - 400)/SEG), s1 = Math.floor((scrollY + H + 400)/SEG);
  for (let sg=s0; sg<=s1; sg++){
    if (segBiome(sg) !== FARM) continue;
    const F = farmCell(sg);

    // wheel ruts
    ctx.globalAlpha = .3;
    ctx.strokeStyle = "rgba(38,30,22,1)";
    ctx.lineWidth = 13;
    ctx.lineCap = "round";
    for (const bx of [F.ruts.x1, F.ruts.x2]){
      ctx.beginPath();
      for (let y=-40; y<H+40; y+=40){
        const xx = bx*W + Math.sin((y + scrollY)*.0016)*F.ruts.amp;
        y === -40 ? ctx.moveTo(xx, y) : ctx.lineTo(xx, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

function drawFarmObjects(){
  const s0 = Math.floor((scrollY - 400)/SEG), s1 = Math.floor((scrollY + H + 400)/SEG);
  for (let sg=s0; sg<=s1; sg++){
    if (segBiome(sg) !== FARM) continue;
    const F = farmCell(sg);
    for (const f of F.fences){
      const fy = f.y - scrollY;
      if (fy < -90 || fy > H + 90) continue;
      const gap = 430, x00 = (f.off - 1)*gap;
      ctx.strokeStyle = "rgba(58,44,30,.92)";
      ctx.lineWidth = 9; ctx.lineCap = "butt";
      for (const wy2 of [-176, -100]){
        ctx.beginPath();
        for (let i=0;i<f.n-1;i++){
          const x0 = x00 + i*gap, x1 = x0 + gap;
          ctx.moveTo(x0, fy + wy2);
          ctx.quadraticCurveTo((x0+x1)/2, fy + wy2 + 9, x1, fy + wy2);
        }
        ctx.stroke();
      }
      for (let i=0;i<f.n;i++){
        const px = x00 + i*gap, ln = 244 + Math.sin(i*2.1 + f.off*9)*26;
        if (px < -60 || px > W + 60) continue;
        ctx.save();
        ctx.translate(px, fy);
        ctx.rotate(f.lean + Math.sin(i*1.7)*.05);
        ctx.fillStyle = "#3f2f20";
        ctx.beginPath();
        ctx.moveTo(-17, 0); ctx.lineTo(-13, -ln); ctx.lineTo(13, -ln); ctx.lineTo(17, 0);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#5c452e";
        ctx.fillRect(-13, -ln, 7, ln);
        ctx.fillStyle = "#2b1f14";
        ctx.fillRect(-14, -ln - 5, 28, 6);
        ctx.restore();
      }
    }

    const harvest = clamp(seaMix(sg*SEG + SEG*.5, [0,.15,1,.55])*1.5, 0, 1);
    for (const b of F.bales){
      const by = b.y - scrollY;
      if (by < -220 || by > H + 220 || harvest < .06) continue;
      ctx.globalAlpha = harvest;
      const rr = rng(b.seed);
      const bx = b.x*W, rx = 126*b.s, ry = 80*b.s, cap = ry*.55;
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(b.rot);

      ctx.globalAlpha = .45; ctx.fillStyle = "#04120b";
      ctx.beginPath(); ctx.ellipse(ry*.06, ry*.62, rx*1.02, ry*.30, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;

      const g2 = ctx.createLinearGradient(0, -ry, 0, ry);   // drum, lit from above
      g2.addColorStop(0,   "#d3aa60");
      g2.addColorStop(.40, "#ab8340");
      g2.addColorStop(1,   "#6a4f26");
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(-rx + cap, -ry);
      ctx.lineTo(rx - cap, -ry);
      ctx.quadraticCurveTo(rx, -ry, rx, -ry + cap);
      ctx.lineTo(rx, ry - cap);
      ctx.quadraticCurveTo(rx, ry, rx - cap, ry);
      ctx.lineTo(-rx + cap, ry);
      ctx.quadraticCurveTo(-rx, ry, -rx, ry - cap);
      ctx.lineTo(-rx, -ry + cap);
      ctx.quadraticCurveTo(-rx, -ry, -rx + cap, -ry);
      ctx.closePath(); ctx.fill();

      ctx.globalAlpha = .32;                                // straw
      for (let i=0;i<52;i++){
        const sx2 = lerp(-rx*.9, rx*.9, rr()), sy2 = (rr()*2 - 1)*ry*.84;
        const an = rr()*TAU, ln = lerp(5, 17, rr());
        ctx.strokeStyle = rr() < .5 ? "#e6c176" : "#61481f";
        ctx.lineWidth = lerp(1, 2.2, rr());
        ctx.beginPath();
        ctx.moveTo(sx2, sy2);
        ctx.lineTo(sx2 + Math.cos(an)*ln*.35, sy2 + Math.sin(an)*ln);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      ctx.strokeStyle = "rgba(46,34,16,.42)";               // net wrap
      ctx.lineWidth = 2.4;
      for (let i=-2;i<=2;i++){
        const cx2 = rx*(i/2.7);
        ctx.beginPath();
        ctx.moveTo(cx2, -ry*.97);
        ctx.quadraticCurveTo(cx2 + ry*.13, 0, cx2, ry*.97);
        ctx.stroke();
      }

      ctx.fillStyle = "#8d6c32";                            // the cut end
      ctx.beginPath(); ctx.ellipse(rx*.82, 0, rx*.19, ry*.97, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = "rgba(56,40,18,.45)"; ctx.lineWidth = 1.7;
      for (let i=1;i<=3;i++){
        ctx.beginPath();
        ctx.ellipse(rx*.82, 0, rx*.19*i/3.4, ry*.97*i/3.4, 0, 0, TAU);
        ctx.stroke();
      }

      ctx.globalAlpha = harvest*.28; ctx.fillStyle = "#eccb8a";   // lit crown
      ctx.beginPath(); ctx.ellipse(-rx*.10, -ry*.68, rx*.62, ry*.17, 0, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
}

/* ────────────────────  foreground undergrowth  ───────────────────── */
// Six kinds, each one built from its own seed: every cane, leaf, berry and
// frond count is drawn fresh, so no two instances share a silhouette.
// Everything here reaches in from the left or right edge, so its base is always
// off frame. Nothing fades in or out: a plant simply crosses and leaves.
const FGP_PAR = 1.62, FGP_ROW = 1700, BRB_ROW = 3000;

function fgCell(ci){
  const key = "fp|" + ci;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(ci, 2287));
  const items = [];
  const roll = r();
  const n = roll < .65 ? 0 : roll < .97 ? 1 : 2;
  for (let i=0;i<n;i++){
    const k = r();
    items.push({
      t: k < .25 ? 1 : k < .44 ? 2 : k < .60 ? 3 : k < .74 ? 4 : k < .88 ? 5 : 6,
      side: r() < .5 ? -1 : 1,
      y: r()*FGP_ROW,
      sc: lerp(1.05, 2.0, r()),
      lean: (r()*2-1)*.55,
      hue: lerp(-16, 16, r()),
      seed: (r()*1e9)|0,
      ph: r()*TAU
    });
  }
  c = { seen: frameId, items };
  cells.set(key, c);
  return c;
}

// brambles are their own thing: rare, big, and whole
function brambleCell(ci){
  const key = "bb|" + ci;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(ci, 7717));
  const items = [];
  if (r() < .50) items.push({
    t: 0,
    side: r() < .5 ? -1 : 1,
    y: r()*BRB_ROW,
    sc: lerp(1.35, 2.35, r()),
    lean: (r()*2-1)*.34,
    hue: lerp(-14, 14, r()),
    seed: (r()*1e9)|0,
    ph: r()*TAU
  });
  c = { seen: frameId, items };
  cells.set(key, c);
  return c;
}

function drawFgProps(x, dt){
  const camY = scrollY * FGP_PAR;
  const run = (row, cellFn) => {
    const c0 = Math.floor((camY - 900)/row);
    const c1 = Math.floor((camY + H + 900)/row);
    for (let ci=c0; ci<=c1; ci++){
      for (const it of cellFn(ci).items){
        const sy = ci*row + it.y - camY;
        const reach = 520 * it.sc;
        if (sy < -reach || sy > H + reach) continue;
        if (it.t === 0){                                  // bramble wants long grass
          const wy = (ci*row + it.y) / FGP_PAR;
          if (terAt(wy, "dens") < .84 || hardAt(wy) > .2) continue;
        }
        fgProp(x, it, sy);
      }
    }
  };
  run(FGP_ROW, fgCell);
  run(BRB_ROW, brambleCell);
}

function fgProp(x, it, sy){
  const r = rng(it.seed);
  const px = it.side < 0 ? -40 : W + 40;
  const fade = 1;
  const gst = gustAt(px);
  const sway = Math.sin(time*.75 + it.ph)*.030 + gst*.16 + windAt(px, sy, it.ph)*.06;
  const dk = l => "hsl(" + (136 + it.hue).toFixed(0) + ",25%," + l.toFixed(1) + "%)";

  // every leaf flutters on its own, harder when it gusts
  const wsp = clamp(breeze*2.4 + Math.abs(gst)*2.6, 0, 1.5);
  let li = 0;
  const flut = () => Math.sin(time*5.4 + (li++)*1.87 + gst*6) * wsp * .40;

  x.save();
  x.translate(px, sy);
  const turn = it.side < 0 ? 1 : -1;                 // quarter turn toward the frame
  const rot = turn * (Math.PI*0.5 + it.lean + sway);
  const cosR = Math.cos(rot), sinR = Math.sin(rot);
  let marked = 0;
  const mark = (lx, ly) => {
    if (marked || leafSpots.length > 13) return;
    marked = 1;
    leafSpots.push({
      key: it.seed,
      x: px + it.sc*(lx*cosR - ly*sinR),
      y: sy + it.sc*(lx*sinR + ly*cosR),
      ang: rot, sc: it.sc
    });
  };
  x.rotate(rot);
  x.scale(it.sc, it.sc);

  switch (it.t){

  case 0: {                                        // blackberry bramble
    const canes = 5 + (r()*4|0);
    for (let c=0;c<canes;c++){
      const dir = r() < .5 ? -1 : 1;
      const len = lerp(230, 430, r());
      const arc = lerp(90, 260, r())*dir;
      const cx = arc*.14, cy = -len*.58, ex = arc, ey = -len;
      x.strokeStyle = "hsl(" + (14 + it.hue*.3).toFixed(0) + ",26%," + lerp(9,15,r()).toFixed(1) + "%)";
      x.lineCap = "round";
      x.lineWidth = lerp(5.5, 10, r());
      x.beginPath(); x.moveTo(0,0); x.quadraticCurveTo(cx, cy, ex, ey); x.stroke();

      const nodes = 4 + (r()*4|0);
      for (let i=0;i<nodes;i++){
        const t = lerp(.18, 1, r()), mt = 1 - t;
        const bx = 2*mt*t*cx + t*t*ex;
        const by = 2*mt*t*cy + t*t*ey;

        const lf = 3 + (r()*3|0);                  // compound leaf
        const la = lerp(-2.6, -.5, r());
        x.fillStyle = dk(lerp(9.5, 17, r()));
        for (let k=0;k<lf;k++){
          const a = la + (k - (lf-1)/2)*.72 + flut();
          const ll = lerp(30, 62, r());
          if (k === 1) mark(bx + Math.cos(a)*ll*.6, by + Math.sin(a)*ll*.6);
          x.save(); x.translate(bx, by); x.rotate(a);
          x.beginPath();
          x.moveTo(0,0);
          x.quadraticCurveTo(ll*.44, -ll*.36, ll, 0);
          x.quadraticCurveTo(ll*.44,  ll*.32, 0, 0);
          x.closePath(); x.fill();
          x.restore();
        }

        if (r() < .55){                            // fruit at every stage
          const ripe = r();
          const col = ripe < .46 ? "#120a15" : ripe < .74 ? "#40101f" : "#27350f";
          const bxx = bx + (r()*2-1)*20, byy = by + lerp(8, 26, r());
          const n = 4 + (r()*5|0);
          x.fillStyle = col;
          for (let k=0;k<n;k++){
            const a = r()*TAU, rr = r()*9;
            x.beginPath();
            x.arc(bxx + Math.cos(a)*rr, byy + Math.sin(a)*rr*.9, lerp(5, 8, r()), 0, TAU);
            x.fill();
          }
          if (ripe < .46){
            x.globalAlpha = fade*.55;
            x.fillStyle = "rgba(186,200,220,1)";
            x.beginPath(); x.arc(bxx - 4, byy - 5, 3, 0, TAU); x.fill();
            x.globalAlpha = fade;
          }
        }
      }
    }
    break;
  }

  case 1: {                                        // fern frond
    const len = lerp(230, 400, r());
    const bend = lerp(50, 150, r()) * (r() < .5 ? -1 : 1);
    x.strokeStyle = dk(12); x.lineWidth = 3.6; x.lineCap = "round";
    x.beginPath(); x.moveTo(0,0); x.quadraticCurveTo(bend*.2, -len*.6, bend, -len); x.stroke();
    const n = 12 + (r()*8|0);
    for (let i=1;i<=n;i++){
      const t = i/n, mt = 1 - t;
      const bx = 2*mt*t*(bend*.2) + t*t*bend;
      const by = 2*mt*t*(-len*.6) + t*t*(-len);
      const pl = lerp(66, 14, t) * lerp(.82, 1.18, r());
      x.fillStyle = dk(lerp(9, 15.5, r()));
      for (const sd of [-1, 1]){
        const a = (sd > 0 ? -.72 + t*.32 : Math.PI + .72 - t*.32) + flut()*.6;
        if (sd > 0 && i === (n>>1)) mark(bx + Math.cos(a)*pl*.6, by + Math.sin(a)*pl*.6);
        x.save(); x.translate(bx, by); x.rotate(a);
        x.beginPath();
        x.moveTo(0,0);
        x.quadraticCurveTo(pl*.5, -pl*.24, pl, 0);
        x.quadraticCurveTo(pl*.5,  pl*.20, 0, 0);
        x.closePath(); x.fill();
        x.restore();
      }
    }
    break;
  }

  case 2: {                                        // cow parsley
    const h = lerp(280, 440, r());
    const tipx = lerp(-34, 34, r());
    x.strokeStyle = dk(13.5); x.lineWidth = 2.8; x.lineCap = "round";
    x.beginPath(); x.moveTo(0,0); x.quadraticCurveTo(tipx*.4, -h*.5, tipx, -h); x.stroke();
    mark(tipx, -h);
    const rays = 9 + (r()*8|0);
    x.lineWidth = 1.5;
    for (let i=0;i<rays;i++){
      const a = lerp(-2.55, -.6, i/Math.max(1,rays-1)) + (r()-.5)*.16;
      const rl = lerp(32, 68, r());
      const ex = tipx + Math.cos(a)*rl, ey = -h + Math.sin(a)*rl;
      x.strokeStyle = dk(15);
      x.beginPath(); x.moveTo(tipx, -h); x.lineTo(ex, ey); x.stroke();
      x.fillStyle = "rgba(206,214,190,.42)";
      for (let k=0;k<5;k++){
        x.beginPath();
        x.arc(ex + (r()*2-1)*8, ey + (r()*2-1)*6, lerp(1.8, 3.2, r()), 0, TAU);
        x.fill();
      }
    }
    break;
  }

  case 3: {                                        // teasel
    const h = lerp(250, 380, r());
    const tipx = lerp(-26, 26, r());
    x.strokeStyle = dk(12); x.lineWidth = 3.6; x.lineCap = "round";
    x.beginPath(); x.moveTo(0,0); x.quadraticCurveTo(tipx*.5, -h*.55, tipx, -h); x.stroke();
    const hh = lerp(34, 56, r()), hw = lerp(15, 23, r());
    mark(tipx, -h - hh*.6);
    x.fillStyle = dk(10.5);
    x.beginPath(); x.ellipse(tipx, -h - hh*.6, hw, hh, 0, 0, TAU); x.fill();
    x.strokeStyle = dk(16); x.lineWidth = 1.5;
    const sp = 20 + (r()*14|0);
    for (let i=0;i<sp;i++){
      const a = r()*TAU, rr = lerp(.55, 1, r());
      const bx = tipx + Math.cos(a)*hw*rr, by = -h - hh*.6 + Math.sin(a)*hh*rr;
      x.beginPath(); x.moveTo(bx, by);
      x.lineTo(bx + Math.cos(a)*9, by + Math.sin(a)*9);
      x.stroke();
    }
    break;
  }

  case 4: {                                        // dock, broad leaves
    const n = 3 + (r()*3|0);
    for (let i=0;i<n;i++){
      const a = lerp(-2.5, -.62, r());
      const ll = lerp(130, 250, r());
      const wdt = ll*lerp(.30, .46, r());
      const fa = a + flut()*.5;
      if (i === 0) mark(Math.cos(fa)*ll*.65, Math.sin(fa)*ll*.65);
      x.strokeStyle = dk(11); x.lineWidth = 3.4; x.lineCap = "round";
      x.beginPath(); x.moveTo(0,0);
      x.lineTo(Math.cos(a)*ll*.32, Math.sin(a)*ll*.32);
      x.stroke();
      x.save();
      x.translate(Math.cos(a)*ll*.30, Math.sin(a)*ll*.30);
      x.rotate(fa);
      x.fillStyle = dk(lerp(9, 14.5, r()));
      x.beginPath();
      x.moveTo(0,0);
      x.bezierCurveTo(ll*.30, -wdt, ll*.74, -wdt*.72, ll, 0);
      x.bezierCurveTo(ll*.74,  wdt*.72, ll*.30, wdt, 0, 0);
      x.closePath(); x.fill();
      x.restore();
    }
    break;
  }

  case 5: {                                        // oat-grass seed heads
    const n = 9 + (r()*9|0);
    for (let i=0;i<n;i++){
      const h = lerp(210, 380, r());
      const drift = lerp(-120, 120, r());
      x.strokeStyle = dk(lerp(10, 15, r()));
      x.lineWidth = lerp(1.8, 3, r()); x.lineCap = "round";
      x.beginPath(); x.moveTo(0,0);
      x.quadraticCurveTo(drift*.25, -h*.6, drift, -h);
      x.stroke();
      if (i === 2) mark(drift, -h);
      const seeds = 4 + (r()*5|0);
      const da = Math.atan2(-h - (-h*.6), drift - drift*.25);
      x.fillStyle = dk(lerp(13, 19, r()));
      for (let k=0;k<seeds;k++){
        const t = k/seeds;
        x.save();
        x.translate(drift + Math.cos(da)*t*30, -h + Math.sin(da)*t*30 + t*t*22);
        x.rotate(da + .5);
        x.beginPath(); x.ellipse(0, 0, lerp(4, 7, r()), lerp(1.8, 3, r()), 0, 0, TAU); x.fill();
        x.restore();
      }
    }
    break;
  }

  default: {                                       // a trunk crossing the frame
    const L = lerp(460, 820, r());
    const w0 = lerp(58, 116, r()), w1 = w0*lerp(.55, .78, r());
    const bow = lerp(-90, 90, r());
    x.fillStyle = "hsl(" + (26 + it.hue*.3).toFixed(0) + ",16%," + lerp(6.5, 10, r()).toFixed(1) + "%)";
    x.beginPath();
    x.moveTo(-w0, 0);
    x.bezierCurveTo(-w0*.9 + bow*.3, -L*.45, -w1*1.1 + bow*.8, -L*.75, bow - w1, -L);
    x.lineTo(bow + w1, -L);
    x.bezierCurveTo(w1*1.1 + bow*.8, -L*.75, w0*.9 + bow*.3, -L*.45, w0, 0);
    x.closePath(); x.fill();
    x.strokeStyle = "hsl(" + (24 + it.hue*.3).toFixed(0) + ",14%,14%)";
    x.lineCap = "round";
    for (let i=0;i<7;i++){                          // bark
      const o = lerp(-.72, .72, r());
      x.lineWidth = lerp(2, 6, r());
      x.globalAlpha = lerp(.2, .5, r());
      x.beginPath();
      x.moveTo(w0*o, -L*lerp(.02, .3, r()));
      x.quadraticCurveTo(w0*o*.8 + bow*.4, -L*.55, bow + w1*o*.9, -L*lerp(.7, .98, r()));
      x.stroke();
    }
    x.globalAlpha = 1;
    const stubs = 1 + (r()*3|0);                    // broken branches
    for (let i=0;i<stubs;i++){
      const t = lerp(.2, .85, r()), sd = r() < .5 ? -1 : 1;
      const bx = sd*lerp(w0, w1, t)*.9 + bow*t*t, by = -L*t;
      const sl = lerp(60, 190, r()), sa = sd*lerp(.5, 1.25, r());
      x.strokeStyle = "hsl(" + (26 + it.hue*.3).toFixed(0) + ",16%,8%)";
      x.lineWidth = lerp(10, 26, r());
      x.beginPath();
      x.moveTo(bx, by);
      x.quadraticCurveTo(bx + Math.sin(sa)*sl*.6, by - sl*.45, bx + Math.sin(sa)*sl, by - sl*.8);
      x.stroke();
    }
    const ivy = 6 + (r()*10|0);                     // ivy climbing it
    for (let i=0;i<ivy;i++){
      const t = lerp(.05, .95, r()), sd = r() < .5 ? -1 : 1;
      x.fillStyle = "hsl(" + (132 + it.hue).toFixed(0) + ",24%," + lerp(9, 15, r()).toFixed(1) + "%)";
      const ivx = sd*lerp(w0, w1, t)*lerp(.2, .95, r()) + bow*t*t, ivy2 = -L*t;
      if (i === 2) mark(ivx, ivy2);
      x.save();
      x.translate(ivx, ivy2);
      x.rotate(r()*TAU + flut()*.8);
      const lv = lerp(16, 34, r());
      x.beginPath();
      x.moveTo(0,0);
      x.quadraticCurveTo(lv*.5, -lv*.5, lv, 0);
      x.quadraticCurveTo(lv*.5,  lv*.5, 0, 0);
      x.closePath(); x.fill();
      x.restore();
    }
  }
  }
  x.restore();
  x.globalAlpha = 1;
}

/* ──────────────────  ground foliage across the field  ────────────── */
// Seen from above, a field is not just grass. These are the rosettes and
// leaf clumps between it, drawn under the blades so grass grows in front.
const FOL_ROW = 380;

function folCell(ci){
  const key = "fo|" + ci;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(ci, 1543));
  const items = [];
  const roll = r();
  const n = roll < .34 ? 0 : roll < .80 ? 1 : 2;
  for (let i=0;i<n;i++) items.push({
    t: (r()*8)|0,
    x: r()*1.24 - .12,
    y: r()*FOL_ROW,
    sc: lerp(.7, 1.55, r()),
    rot: r()*TAU,
    hue: lerp(-20, 20, r()),
    pri: r(),
    seed: (r()*1e9)|0,
    ph: r()*TAU
  });
  c = { seen: frameId, items };
  cells.set(key, c);
  return c;
}

function drawFoliage(){
  const c0 = Math.floor((scrollY - 220)/FOL_ROW);
  const c1 = Math.floor((scrollY + H + 220)/FOL_ROW);
  for (let ci=c0; ci<=c1; ci++){
    const wy = ci*FOL_ROW;
    const hard = hardAt(wy);
    if (hard > .55) continue;
    const lush = terAt(wy, "dens");
    for (const it of folCell(ci).items){
      if (it.pri > lush*1.25) continue;
      const sy = wy + it.y - scrollY;
      if (sy < -190 || sy > H + 190) continue;
      folClump(it, sy, 1 - hard);
    }
  }
  ctx.globalAlpha = 1;
}

function folClump(it, sy, a){
  const r = rng(it.seed);
  const px = it.x * W;
  const g = (l, s) => "hsl(" + (118 + it.hue).toFixed(0) + "," + (s||26) + "%," + l.toFixed(1) + "%)";
  const sway = Math.sin(time*.9 + it.ph)*.035 + gustAt(px)*.10;

  // one tapered leaf lying along +x
  const leaf = (L, w) => {
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(L*.42, -w, L, 0);
    ctx.quadraticCurveTo(L*.42,  w, 0, 0);
    ctx.closePath(); ctx.fill();
  };

  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(px, sy);
  ctx.rotate(it.rot + sway);
  ctx.scale(it.sc, it.sc);

  switch (it.t){

  case 0: {                                   // clover
    const groups = 5 + (r()*6|0);
    for (let i=0;i<groups;i++){
      const a2 = r()*TAU, rr = r()*46;
      const cx = Math.cos(a2)*rr, cy = Math.sin(a2)*rr*.8;
      ctx.fillStyle = g(lerp(13, 21, r()), 30);
      for (let k=0;k<3;k++){
        const b = r()*TAU + k*2.094, lr = lerp(6, 11, r());
        ctx.beginPath();
        ctx.ellipse(cx + Math.cos(b)*lr*.85, cy + Math.sin(b)*lr*.7, lr, lr*.82, b, 0, TAU);
        ctx.fill();
      }
    }
    break;
  }

  case 1: {                                   // dandelion rosette
    const n = 7 + (r()*5|0);
    for (let i=0;i<n;i++){
      const a2 = i/n*TAU + r()*.3;
      const L = lerp(44, 92, r()), w = L*lerp(.15, .24, r());
      ctx.save(); ctx.rotate(a2);
      ctx.fillStyle = g(lerp(12, 19, r()), 28);
      leaf(L, w);
      ctx.fillStyle = g(lerp(20, 26, r()), 24);        // the pale midrib
      ctx.beginPath();
      ctx.moveTo(L*.08, 0); ctx.quadraticCurveTo(L*.5, -w*.12, L*.9, 0);
      ctx.quadraticCurveTo(L*.5, w*.12, L*.08, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    break;
  }

  case 2: {                                   // plantain
    const n = 5 + (r()*4|0);
    for (let i=0;i<n;i++){
