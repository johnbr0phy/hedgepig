      const a2 = i/n*TAU + r()*.4;
      const L = lerp(40, 82, r()), w = L*lerp(.30, .42, r());
      ctx.save(); ctx.rotate(a2);
      ctx.fillStyle = g(lerp(13, 20, r()), 24);
      leaf(L, w);
      ctx.strokeStyle = g(lerp(22, 28, r()), 20);
      ctx.lineWidth = 1.1;
      for (const v of [-.5, 0, .5]){
        ctx.beginPath();
        ctx.moveTo(L*.1, 0);
        ctx.quadraticCurveTo(L*.55, w*v*.9, L*.92, 0);
        ctx.stroke();
      }
      ctx.restore();
    }
    break;
  }

  case 3: {                                   // dock
    const n = 3 + (r()*3|0);
    for (let i=0;i<n;i++){
      const a2 = i/n*TAU + r()*.5;
      const L = lerp(74, 150, r()), w = L*lerp(.26, .38, r());
      ctx.save(); ctx.rotate(a2);
      ctx.fillStyle = g(lerp(11, 18, r()), 26);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.bezierCurveTo(L*.28, -w, L*.74, -w*.78, L, 0);
      ctx.bezierCurveTo(L*.74,  w*.78, L*.28, w, 0, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = g(20, 22); ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(L*.06, 0); ctx.lineTo(L*.92, 0); ctx.stroke();
      ctx.restore();
    }
    break;
  }

  case 4: {                                   // nettles
    const n = 4 + (r()*4|0);
    for (let i=0;i<n;i++){
      const a2 = r()*TAU, sl = lerp(34, 76, r());
      ctx.save(); ctx.rotate(a2);
      ctx.strokeStyle = g(15, 28); ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(sl, 0); ctx.stroke();
      for (const sd of [-1, 1]){
        const L = lerp(22, 40, r());
        ctx.save(); ctx.translate(sl*.75, 0); ctx.rotate(sd*1.15);
        ctx.fillStyle = g(lerp(12, 19, r()), 30);
        leaf(L, L*.44);
        ctx.restore();
      }
      ctx.restore();
    }
    break;
  }

  case 5: {                                   // moss
    const n = 7 + (r()*6|0);
    for (let i=0;i<n;i++){
      const a2 = r()*TAU, rr = r()*40;
      ctx.fillStyle = g(lerp(14, 22, r()), 34);
      ctx.beginPath();
      ctx.ellipse(Math.cos(a2)*rr, Math.sin(a2)*rr*.7,
                  lerp(14, 30, r()), lerp(9, 19, r()), r()*TAU, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = g(30, 30);
    for (let i=0;i<14;i++){
      const a2 = r()*TAU, rr = r()*38;
      ctx.beginPath();
      ctx.arc(Math.cos(a2)*rr, Math.sin(a2)*rr*.7, lerp(1, 2.2, r()), 0, TAU);
      ctx.fill();
    }
    break;
  }

  case 6: {                                   // buttercup clump
    const n = 6 + (r()*5|0);
    for (let i=0;i<n;i++){
      const a2 = r()*TAU, rr = r()*40;
      ctx.save(); ctx.translate(Math.cos(a2)*rr, Math.sin(a2)*rr*.8); ctx.rotate(r()*TAU);
      ctx.fillStyle = g(lerp(13, 20, r()), 28);
      for (let k=0;k<3;k++){ ctx.save(); ctx.rotate(k*2.094); leaf(lerp(14,26,r()), 7); ctx.restore(); }
      ctx.restore();
    }
    const fl = 1 + (r()*3|0);
    for (let i=0;i<fl;i++){
      const a2 = r()*TAU, rr = r()*34;
      const fx = Math.cos(a2)*rr, fy = Math.sin(a2)*rr*.8;
      ctx.fillStyle = "rgba(248,214,96,.92)";
      for (let k=0;k<5;k++){
        const b = k/5*TAU + r();
        ctx.beginPath();
        ctx.ellipse(fx + Math.cos(b)*4.6, fy + Math.sin(b)*4.6, 4.4, 3.2, b, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(252,244,200,1)";
      ctx.beginPath(); ctx.arc(fx, fy, 2.2, 0, TAU); ctx.fill();
    }
    break;
  }

  default: {                                  // thistle rosette
    const n = 6 + (r()*4|0);
    for (let i=0;i<n;i++){
      const a2 = i/n*TAU + r()*.25;
      const L = lerp(48, 96, r()), w = L*.19;
      ctx.save(); ctx.rotate(a2);
      ctx.fillStyle = g(lerp(14, 21, r()), 20);
      leaf(L, w);
      ctx.strokeStyle = g(30, 16); ctx.lineWidth = 1;
      for (let k=1;k<5;k++){
        const t = k/5;
        ctx.beginPath();
        ctx.moveTo(L*t, -w*.7*(1-t*.5));
        ctx.lineTo(L*t + 5, -w*1.5*(1-t*.5));
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(L*t, w*.7*(1-t*.5));
        ctx.lineTo(L*t + 5, w*1.5*(1-t*.5));
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  }
  ctx.restore();
}

/* ────────────────────────────  the road  ─────────────────────────── */
const CAR_COLS = ["#8d1f22","#1c3454","#8e9096","#20222a","#5d6a4a","#a8a49c","#2f5d55"];

function roadCell(seg){
  const key = "rd|" + seg;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const e = bandEdges(seg, ROAD);
  c = { seen: frameId, top: e[0], bot: e[1], cars: [], next: Math.random()*1.4, seed: hash2(seg, 811) };
  cells.set(key, c);
  return c;
}

function drawRoad(dt){
  // Cars only move and spawn inside this loop, so it has to cover the road the
  // hedgepig is on even when the camera is somewhere else entirely — otherwise
  // scrolling away from a road empties it of traffic and the culvert is pointless.
  const lo = Math.min(scrollY - 400, hog.wy - 600);
  const hi = Math.max(scrollY + H + 400, hog.wy + 600);
  const s0 = Math.floor(lo/SEG), s1 = Math.floor(hi/SEG);
  for (let sg=s0; sg<=s1; sg++){
    if (segBiome(sg) !== ROAD) continue;
    const R = roadCell(sg);
    const y0 = R.top - scrollY, y1 = R.bot - scrollY;
    const span = y1 - y0;

    if (y1 > -120 && y0 < H + 120){
      const a = Math.max(y0, -60), b = Math.min(y1, H + 60);

      const g = ctx.createLinearGradient(0, y0, 0, y1);
      g.addColorStop(0,   "#26282a");
      g.addColorStop(.16, "#1b1d1f");
      g.addColorStop(.5,  "#212325");
      g.addColorStop(.84, "#1b1d1f");
      g.addColorStop(1,   "#26282a");
      ctx.fillStyle = g;
      ctx.fillRect(0, a, W, b - a);

      if (grainPat){                                  // aggregate
        ctx.save();
        ctx.globalCompositeOperation = "overlay";
        ctx.globalAlpha = .18;
        ctx.translate(0, -mod(scrollY, 128));
        ctx.fillStyle = grainPat;
        ctx.fillRect(0, a, W, b - a + 128);
        ctx.restore();
      }

      // worn markings
      ctx.globalAlpha = .40;
      ctx.fillStyle = "rgba(222,218,200,1)";
      for (const ey of [y0 + span*.10, y1 - span*.10])
        if (ey > -6 && ey < H + 6) ctx.fillRect(0, ey - 3, W, 6);
      ctx.globalAlpha = .52;
      const cy = (y0 + y1)/2;
      if (cy > -10 && cy < H + 10){
        const per = 640, dash = 300;
        const off = mod(-scrollY*0.0 + 0, per);
        for (let x = -off; x < W; x += per) ctx.fillRect(x, cy - 4, dash, 8);
      }
      ctx.globalAlpha = 1;

      // kerbs and gravel
      for (const [ey, dir] of [[y0,-1],[y1,1]]){
        if (ey < -80 || ey > H + 80) continue;
        ctx.fillStyle = "rgba(122,118,110,.85)";
        ctx.fillRect(0, dir < 0 ? ey - 16 : ey, W, 16);
        ctx.fillStyle = "rgba(10,12,12,.5)";
        ctx.fillRect(0, dir < 0 ? ey - 20 : ey + 14, W, 5);
        const rr = rng(R.seed + (dir < 0 ? 1 : 2));
        ctx.fillStyle = "rgba(150,144,132,.5)";
        for (let i=0;i<70;i++){
          const gx = rr()*W, gy = ey + dir*(18 + rr()*54);
          ctx.beginPath(); ctx.arc(gx, gy, lerp(.8, 2.4, rr()), 0, TAU); ctx.fill();
        }
      }
    }

    // traffic
    R.next -= dt;
    if (R.next <= 0 && R.cars.length < 4){
      R.next = lerp(0.7, 2.3, Math.random());
      const near = Math.random() < .5;
      const dir = near ? 1 : -1;
      const len = lerp(900, 1150, Math.random());
      R.cars.push({
        x: dir > 0 ? -len - 80 : W + len + 80,
        wy: R.top + span*(near ? .70 : .30),
        dir, len, wid: len*lerp(.40, .46, Math.random()),
        spd: lerp(3000, 5200, Math.random()),
        col: CAR_COLS[(Math.random()*CAR_COLS.length)|0]
      });
    }
    for (let i=R.cars.length-1;i>=0;i--){
      const c = R.cars[i];
      c.x += c.dir * c.spd * dt;
      if (c.x < -c.len - 300 || c.x > W + c.len + 300){ R.cars.splice(i,1); continue; }
      const cyy = c.wy - scrollY;
      if (cyy < -300 || cyy > H + 300) continue;
      fields.push({ x:c.x, y:cyy, r: 420, s: 2.2 });      // the wake flattens the verge
      if (Math.random() < dt*40)
        sparkle(c.x - c.dir*c.len*.5 + (Math.random()*2-1)*180, cyy + (Math.random()*2-1)*c.wid*.6,
                wet > .3 ? "186,206,214" : "150,142,126");
      drawCar(c, cyy);
    }
  }
}

function drawCar(c, cy){
  const L = c.len, D = c.wid;
  ctx.save();
  ctx.translate(c.x, cy);
  ctx.scale(c.dir, 1);

  // speed smear
  ctx.globalAlpha = .16;
  ctx.strokeStyle = "rgba(206,214,220,1)";
  ctx.lineWidth = 3;
  for (let i=0;i<7;i++){
    const yy = (-.42 + i*.14)*D;
    ctx.beginPath();
    ctx.moveTo(-L*.55 - 120 - i*90, yy);
    ctx.lineTo(-L*.48, yy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const shell = (sx, sy2, k) => {                 // top-down outline
    ctx.beginPath();
    ctx.moveTo(sx - L*.46*k, sy2 - D*.5*k);
    ctx.lineTo(sx + L*.32*k, sy2 - D*.5*k);
    ctx.quadraticCurveTo(sx + L*.5*k, sy2 - D*.46*k, sx + L*.5*k, sy2 - D*.26*k);
    ctx.lineTo(sx + L*.5*k, sy2 + D*.26*k);
    ctx.quadraticCurveTo(sx + L*.5*k, sy2 + D*.46*k, sx + L*.32*k, sy2 + D*.5*k);
    ctx.lineTo(sx - L*.46*k, sy2 + D*.5*k);
    ctx.quadraticCurveTo(sx - L*.5*k, sy2 + D*.42*k, sx - L*.5*k, sy2 + D*.2*k);
    ctx.lineTo(sx - L*.5*k, sy2 - D*.2*k);
    ctx.quadraticCurveTo(sx - L*.5*k, sy2 - D*.42*k, sx - L*.46*k, sy2 - D*.5*k);
    ctx.closePath();
  };

  ctx.globalAlpha = .55; ctx.fillStyle = "#04070a";
  shell(-L*.02, D*.10, 1.02); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = "#0b0d10";                      // tyres
  for (const wx of [-L*.30, L*.31]) for (const wy2 of [-D*.53, D*.53]){
    ctx.beginPath();
    ctx.ellipse(wx, wy2, L*.075, D*.075, 0, 0, TAU);
    ctx.fill();
  }

  ctx.fillStyle = c.col;
  shell(0, 0, 1); ctx.fill();

  const gl = ctx.createLinearGradient(0, -D*.5, 0, D*.5);
  gl.addColorStop(0,   "rgba(255,255,255,.20)");
  gl.addColorStop(.34, "rgba(255,255,255,.04)");
  gl.addColorStop(.72, "rgba(0,0,0,.16)");
  gl.addColorStop(1,   "rgba(0,0,0,.30)");
  ctx.fillStyle = gl;
  shell(0, 0, 1); ctx.fill();

  ctx.fillStyle = "rgba(16,26,34,.88)";           // glasshouse
  ctx.beginPath();
  ctx.moveTo(L*.12, -D*.37);
  ctx.lineTo(L*.29, -D*.27);
  ctx.lineTo(L*.29,  D*.27);
  ctx.lineTo(L*.12,  D*.37);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-L*.24, -D*.36);
  ctx.lineTo(-L*.36, -D*.25);
  ctx.lineTo(-L*.36,  D*.25);
  ctx.lineTo(-L*.24,  D*.36);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(14,22,30,.8)";
  ctx.fillRect(-L*.23, -D*.40, L*.34, D*.055);
  ctx.fillRect(-L*.23,  D*.345, L*.34, D*.055);

  ctx.fillStyle = "rgba(255,255,255,.10)";        // roof
  ctx.beginPath();
  ctx.moveTo(-L*.22, -D*.34);
  ctx.lineTo(L*.11, -D*.34);
  ctx.lineTo(L*.11,  D*.34);
  ctx.lineTo(-L*.22, D*.34);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.16)";
  ctx.fillRect(-L*.20, -D*.24, L*.29, D*.05);

  ctx.strokeStyle = "rgba(0,0,0,.30)";            // panel gaps
  ctx.lineWidth = 2.4;
  for (const px2 of [L*.31, -L*.38]){
    ctx.beginPath(); ctx.moveTo(px2, -D*.44); ctx.lineTo(px2, D*.44); ctx.stroke();
  }

  ctx.fillStyle = c.col;                          // mirrors
  for (const wy2 of [-D*.56, D*.56]){
    ctx.beginPath(); ctx.ellipse(L*.16, wy2, L*.028, D*.045, 0, 0, TAU); ctx.fill();
  }

  ctx.fillStyle = "rgba(255,246,214,.95)";        // lamps
  for (const wy2 of [-D*.32, D*.32]){
    ctx.beginPath(); ctx.ellipse(L*.465, wy2, L*.028, D*.075, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = "rgba(224,60,44,.9)";
  for (const wy2 of [-D*.34, D*.34]){
    ctx.beginPath(); ctx.ellipse(-L*.478, wy2, L*.022, D*.075, 0, 0, TAU); ctx.fill();
  }

  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = .40;
  ctx.drawImage(SP_SUN, L*.34, -D*1.1, D*2.4, D*2.2);
  ctx.globalAlpha = .30;
  ctx.drawImage(glow("226,58,44"), -L*.5 - D*.9, -D*.9, D*1.8, D*1.8);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ─────────────────────  the edge of town  ────────────────────────── */
function townCell(seg){
  const key = "tw|" + seg;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const e = bandEdges(seg, TOWN);
  const r = rng(hash2(seg, 4093));
  const bits = [];
  for (let i=0;i<9;i++) bits.push({
    k: r() < .30 ? 0 : r() < .55 ? 1 : 2,          // drain, litter, light pool
    x: r(), y: lerp(e[0]+120, e[1]-120, r()),
    s: lerp(.7, 1.4, r()), rot: (r()*2-1)*.5, seed: (r()*1e9)|0
  });
  c = { seen: frameId, top: e[0], bot: e[1], bits };
  cells.set(key, c);
  return c;
}

function drawTown(){
  const SLAB = 264;
  const s0 = Math.floor((scrollY - 400)/SEG), s1 = Math.floor((scrollY + H + 400)/SEG);
  for (let sg=s0; sg<=s1; sg++){
    if (segBiome(sg) !== TOWN) continue;
    const T = townCell(sg);
    const y0 = T.top - scrollY, y1 = T.bot - scrollY;
    if (y1 < -120 || y0 > H + 120) continue;
    const a = Math.max(y0, -60), b = Math.min(y1, H + 60);

    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0,  "#3a3a38");
    g.addColorStop(.5, "#303130");
    g.addColorStop(1,  "#3a3a38");
    ctx.fillStyle = g;
    ctx.fillRect(0, a, W, b - a);

    // slabs
    ctx.strokeStyle = "rgba(12,14,14,.55)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let y = T.top - mod(T.top + scrollY, SLAB) - scrollY; y < b + SLAB; y += SLAB){
      if (y < a - 4 || y > b + 4) continue;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    for (let x = 0; x <= W + SLAB; x += SLAB){
      const jitter = ((hash2(x|0, sg) % 40) - 20);
      ctx.moveTo(x + jitter, a); ctx.lineTo(x + jitter, b);
    }
    ctx.stroke();

    // kerb at both edges
    for (const [ey, dir] of [[y0,-1],[y1,1]]){
      if (ey < -60 || ey > H + 60) continue;
      ctx.fillStyle = "rgba(146,142,134,.9)";
      ctx.fillRect(0, dir < 0 ? ey - 18 : ey, W, 18);
      ctx.fillStyle = "rgba(8,10,10,.55)";
      ctx.fillRect(0, dir < 0 ? ey - 23 : ey + 16, W, 6);
    }

    for (const bit of T.bits){
      const by = bit.y - scrollY;
      if (by < -90 || by > H + 90) continue;
      const bx = bit.x * W;
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(bit.rot);
      ctx.scale(bit.s, bit.s);
      if (bit.k === 0){                                  // drain
        ctx.fillStyle = "rgba(24,26,26,.95)";
        ctx.fillRect(-56, -30, 112, 60);
        ctx.fillStyle = "rgba(96,96,92,.8)";
        for (let i=0;i<6;i++) ctx.fillRect(-48 + i*17, -24, 8, 48);
      } else if (bit.k === 1){                           // litter
        const rr = rng(bit.seed);
        ctx.fillStyle = rr() < .5 ? "rgba(190,60,52,.85)" : "rgba(206,200,180,.8)";
        ctx.beginPath();
        ctx.ellipse(0, 0, lerp(10, 20, rr()), lerp(5, 11, rr()), rr()*TAU, 0, TAU);
        ctx.fill();
      } else {                                           // light spilling from somewhere
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = .13 + .03*Math.sin(time*1.4 + bit.x*9);
        ctx.drawImage(glow("250,214,140"), -230, -150, 460, 300);
        ctx.globalCompositeOperation = "source-over";
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

/* ────────────────────────────  birds  ────────────────────────────── */
// A bird flies in, lands on a branch in the foreground, sits a while, then
// leaves. Perched it rides the branch; airborne it carries no scroll term at
// all, so travelling back up the field never runs one in reverse.
const BIRDS = [
  { sz:[140,210], span:2.9, sweep:.30, chord:.40, tail:.46, fork:.30, hz:7.4, crest:0,  beak:.16, legs:0, bound:1, arc:1.15 },
  { sz:[190,280], span:2.5, sweep:.14, chord:.58, tail:.40, fork:0,   hz:3.3, crest:.1, beak:.26, legs:0, bound:0, arc:1.05 },
  { sz:[180,270], span:3.1, sweep:.09, chord:.36, tail:.34, fork:0,   hz:2.6, crest:0,  beak:.22, legs:0, bound:0, arc:.92 },
  { sz:[150,220], span:2.4, sweep:.19, chord:.54, tail:.40, fork:0,   hz:5.6, crest:0,  beak:.13, legs:0, bound:1, arc:1.20 },
  { sz:[230,330], span:3.4, sweep:.07, chord:.48, tail:.26, fork:0,   hz:1.9, crest:.3, beak:.44, legs:1, bound:0, arc:.80 },
];
const birds = [];
let nextBird = 20;

function spawnBird(){
  const water = lakeNow > .4;
  const k = Math.random();
  const t = water ? (k < .5 ? 4 : 2) : (k < .26 ? 0 : k < .54 ? 1 : k < .70 ? 2 : k < .94 ? 3 : 4);
  const B = BIRDS[t];
  const sz = lerp(B.sz[0], B.sz[1], Math.random());
  const perch = perches.length ? perches[(Math.random()*perches.length)|0] : null;
  if (!perch) return;                        // no perch, no bird
  const dir = perch.x < W*.5 ? 1 : -1;
  birds.push({
    t, sz, dir, ph: Math.random()*TAU,
    x: dir > 0 ? -sz*2 : W + sz*2,
    y: perch.y - lerp(160, 340, Math.random()),
    vx: dir*lerp(220, 400, Math.random()), vy: 0,
    state: 0,
    key: perch.key,
    sit: lerp(5, 14, Math.random()),
    look: 0, flick: 0, land: 0,
    wing: Math.random()*TAU, glide: 0, flapT: lerp(.4, .9, Math.random())
  });
}

function findPerch(key){
  for (const p of perches) if (p.key === key) return p;
  return null;
}

function updateBirds(dt){
  nextBird -= dt;
  if (nextBird <= 0 && birds.length < 4){
    if (!perches.length && Math.random() < .93){
      nextBird = 2.2;                       // hold on for somewhere to land
    } else {
      nextBird = lerp(24, 58, Math.random());
      spawnBird();
    }
  }
  for (let i=birds.length-1;i>=0;i--){
    const b = birds[i];
    const B = BIRDS[b.t];
    b.look -= dt; b.flick -= dt;

    if (b.state !== 1){                       // wingbeat and bounding flight
      b.wing += dt*TAU*B.hz*(b.glide > 0 ? .18 : 1);
      if (b.glide > 0){
        b.glide -= dt;
        if (b.state === 2) b.vy += 62*dt;     // sinks on a closed wing
      } else {
        b.flapT -= dt;
        if (b.state === 2) b.vy -= 34*dt;     // climbs on the beat
        if (B.bound && b.flapT <= 0){
          b.glide = lerp(.26, .52, Math.random());
          b.flapT = lerp(.45, .95, Math.random());
        }
      }
    }
    if (b.look < -2.4 && Math.random() < dt*1.2) b.look = lerp(.5, 1.4, Math.random());
    if (b.flick < -3 && Math.random() < dt*.8) b.flick = .34;

    if (b.state === 0){                                   // coming in to land
      let p = findPerch(b.key);
      if (!p && perches.length){                    // that one went, try another
        const q = perches[(Math.random()*perches.length)|0];
        b.key = q.key; p = q;
      }
      if (!p){ b.state = 2; b.vy = -lerp(40, 110, Math.random()); continue; }
      const dx = p.x - b.x, dy = (p.y - b.sz*.36) - b.y;
      const d = Math.hypot(dx, dy) + .001;
      const spd = clamp(d*2.6, 140, 1150);
      const k = 1 - Math.exp(-3.4*dt);
      b.vx = lerp(b.vx, dx/d*spd, k);
      b.vy = lerp(b.vy, dy/d*spd, k);
      b.x += b.vx*dt; b.y += b.vy*dt;
      if (b.dir !== (b.vx < 0 ? -1 : 1) && Math.abs(b.vx) > 60) b.dir = b.vx < 0 ? -1 : 1;
      if (d < 42){ b.state = 1; b.land = 1; b.dir = Math.random() < .5 ? -1 : 1; }
      if (b.x < -b.sz*4 || b.x > W + b.sz*4) birds.splice(i,1);

    } else if (b.state === 1){                            // sitting
      const p = findPerch(b.key);
      b.land = Math.max(0, b.land - dt*2.2);
      b.sit -= dt;
      if (!p || b.sit <= 0 || p.y < 40 || p.y > H - 40){
        b.state = 2;
        b.vx = b.dir*lerp(200, 360, Math.random());
        b.vy = -lerp(120, 240, Math.random());
      } else { b.x = p.x; b.y = p.y - b.sz*.36; }

    } else {                                              // away
      b.x += b.vx*dt;                                     // no scroll term
      b.vy = lerp(b.vy, -18, 1 - Math.exp(-1.2*dt));
      b.y += b.vy*dt + Math.sin(time*.6 + b.ph)*10*dt;
      if (b.x < -b.sz*4 || b.x > W + b.sz*4 || b.y < -b.sz*3) birds.splice(i,1);
    }
  }
}

// Seen from above and behind, a wing on the up or down stroke is foreshortened,
// and the tips rake back. That, not a wobbling outline, is what reads as flight.
function birdFlying(x, B, sz, b){
  const span0 = sz*B.span;
  const th = Math.sin(b.wing) * (b.glide > 0 ? .13 : B.arc);
  const st = Math.sin(th), ct = Math.cos(th);
  const span = span0*ct;
  const w = span*.5;
  const sw = -span0*(B.sweep + Math.abs(st)*.16);
  const ch = span0*B.chord*.5;
  const bend = w*.42 - st*w*.55;
  const hx = span0*.13, tl = -span0*B.tail*.6;
  x.beginPath();
  x.moveTo(hx, 0);
  x.quadraticCurveTo(sw*.35, -bend*.7, sw, -w);
  x.quadraticCurveTo(sw - ch*.9, -bend, -ch*.5, -ch*.22);
  if (B.fork){
    x.lineTo(tl, -span*B.fork*.5); x.lineTo(tl*.55, 0); x.lineTo(tl, span*B.fork*.5);
  } else { x.lineTo(tl, -ch*.30); x.lineTo(tl, ch*.30); }
  x.lineTo(-ch*.5, ch*.22);
  x.quadraticCurveTo(sw - ch*.9, bend, sw, w);
  x.quadraticCurveTo(sw*.35, bend*.7, hx, 0);
  x.closePath(); x.fill();
  if (B.legs){
    x.strokeStyle = x.fillStyle; x.lineWidth = span0*.014;
    x.beginPath(); x.moveTo(tl*.9, 0); x.lineTo(tl*2.2, span0*.02); x.stroke();
  }
  return st;
}

function birdPerched(x, B, sz, b){
  const s = sz, shuffle = b.land*.5 + (b.flick > 0 ? .16 : 0);
  x.beginPath();                                          // legs
  x.strokeStyle = "#0a1410"; x.lineWidth = s*.035; x.lineCap = "round";
  x.moveTo(-s*.04, s*.30); x.lineTo(-s*.02, s*.46);
  x.moveTo( s*.08, s*.30); x.lineTo( s*.10, s*.46);
  x.stroke();

  x.fillStyle = "#0a1410";
  x.beginPath();                                          // tail
  x.moveTo(-s*.16, s*.06);
  x.lineTo(-s*.30 - s*B.tail*.9, s*.30 + shuffle*s*.2);
  x.lineTo(-s*.26 - s*B.tail*.9, s*.44 + shuffle*s*.2);
  x.lineTo(-s*.10, s*.20);
  x.closePath(); x.fill();

  x.beginPath();                                          // body
  x.ellipse(0, s*.06, s*.30, s*.34, -.18, 0, TAU);
  x.fill();

  x.beginPath();                                          // folded wing
  x.moveTo(-s*.02, -s*.10);
  x.quadraticCurveTo(-s*.30, s*.02, -s*.30 - shuffle*s*.2, s*.24 - shuffle*s*.3);
  x.quadraticCurveTo(-s*.06, s*.18, s*.14, -s*.04);
  x.closePath(); x.fill();

  const hx = s*.20 + Math.sin(b.look > 0 ? time*3 : 0)*s*.02;
  const hy = -s*.32;
  x.beginPath(); x.arc(hx, hy, s*.19, 0, TAU); x.fill();   // head
  if (B.crest){
    x.beginPath();
    x.moveTo(hx - s*.06, hy - s*.16);
    x.lineTo(hx - s*.22, hy - s*.16 - s*B.crest*.7);
    x.lineTo(hx + s*.02, hy - s*.19);
    x.closePath(); x.fill();
  }
  x.beginPath();                                          // beak
  x.moveTo(hx + s*.14, hy - s*.04);
  x.lineTo(hx + s*.14 + s*B.beak, hy + s*.02);
  x.lineTo(hx + s*.13, hy + s*.07);
  x.closePath(); x.fill();
}

function drawBirds(){
  for (const b of birds){
    const B = BIRDS[b.t];
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.dir, 1);
    ctx.fillStyle = "#0a1410";
    if (b.state === 1){
      ctx.rotate(Math.sin(time*1.1 + b.ph)*.02 + b.land*.1);
      if (b.look > 0) ctx.rotate(Math.sin(time*2.4)*.05);
      birdPerched(ctx, B, b.sz, b);
    } else {
      const st = Math.sin(Math.sin(b.wing) * (b.glide > 0 ? .13 : B.arc));
      ctx.translate(0, -st*b.sz*.055);          // the body rides the beat
      ctx.rotate(clamp(b.vy*.0012, -.34, .34) - st*.05);
      birdFlying(ctx, B, b.sz, b);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawBirdShadows(){
  ctx.globalCompositeOperation = "multiply";
  for (const b of birds){
    if (b.state === 1) continue;
    const s = b.sz*B_SHADOW;
    ctx.globalAlpha = .16;
    ctx.drawImage(SP_SHADE, b.x - s/2 + b.dir*60, b.y - s/2 + 120, s, s);
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}
const B_SHADOW = 3.2;

/* ─────────────────────────  a caterpillar  ───────────────────────── */
// If you stop moving and a leaf is in frame, something turns up on it.
const leafSpots = [];
const cat = { on:false, key:null, t:0, fade:0, sz:70, ph:0, kind:0, u:0 };
let idleT = 0;

function updateCat(dt, moving){
  idleT = moving ? 0 : idleT + dt;
  if (!cat.on && idleT > 1.7 && leafSpots.length){
    const sp = leafSpots[(Math.random()*leafSpots.length)|0];
    cat.on = true; cat.key = sp.key; cat.t = 0; cat.fade = 0; cat.u = 0;
    cat.sz = lerp(34, 64, Math.random()) * clamp(sp.sc, .8, 2);
    cat.ph = Math.random()*TAU;
    cat.kind = (Math.random()*3)|0;
  }
  if (!cat.on) return;
  cat.t += dt;
  cat.u += dt*.16;
  cat.fade = moving ? cat.fade - dt*1.8 : Math.min(1, cat.fade + dt*1.1);
  if (cat.fade <= 0 && moving) cat.on = false;
}

function drawCat(){
  if (!cat.on || cat.fade <= .01) return;
  let sp = null;
  for (const q of leafSpots) if (q.key === cat.key){ sp = q; break; }
  if (!sp){ cat.fade -= .05; if (cat.fade <= 0) cat.on = false; return; }

  const s = cat.sz;
  const crawl = Math.sin(cat.u)*s*.42;
  const segs = 11;
  const body = cat.kind === 0 ? ["#5f8f3a","#3f6a26"]
             : cat.kind === 1 ? ["#c8a83c","#37312a"]
             : ["#8a6a4c","#5a4232"];

  ctx.save();
  ctx.globalAlpha = cat.fade;
  ctx.translate(sp.x, sp.y);
  ctx.rotate(sp.ang + Math.sin(cat.t*.5 + cat.ph)*.12);
  ctx.translate(crawl, 0);

  ctx.globalAlpha = cat.fade*.35;                 // its own little shadow
  ctx.fillStyle = "#05100a";
  ctx.beginPath(); ctx.ellipse(0, s*.10, s*.46, s*.13, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = cat.fade;

  for (let i=segs-1;i>=0;i--){
    const t = i/(segs-1);
    const wave = Math.sin(cat.t*5.5 - i*.62 + cat.ph);
    const sx = lerp(s*.42, -s*.44, t) + wave*s*.020;
    const sy = Math.sin(t*Math.PI)*s*.03*0 + wave*s*.012;
    const rr = s*(.115 - Math.abs(t - .40)*.085) + wave*s*.008;
    ctx.fillStyle = i % 2 ? body[0] : body[1];
    ctx.beginPath(); ctx.ellipse(sx, sy, rr*1.05, rr, 0, 0, TAU); ctx.fill();
    if (i > 1 && i < segs-1){                     // legs
      ctx.fillStyle = body[1];
      for (const sd of [-1, 1]){
        ctx.beginPath();
        ctx.ellipse(sx - wave*s*.01, sy + sd*rr*1.05, s*.017, s*.026, sd*.4, 0, TAU);
        ctx.fill();
      }
    }
    if (cat.kind === 2 && i % 2 === 0){           // bristles
      ctx.strokeStyle = "rgba(226,206,172,.6)";
      ctx.lineWidth = s*.012;
      for (const sd of [-1, 1]){
        ctx.beginPath();
        ctx.moveTo(sx, sy + sd*rr*.7);
        ctx.lineTo(sx - s*.02, sy + sd*rr*2);
        ctx.stroke();
      }
    }
  }
  const hx = s*.44, wave = Math.sin(cat.t*5.5 + cat.ph);
  ctx.fillStyle = body[1];
  ctx.beginPath(); ctx.ellipse(hx + wave*s*.02, 0, s*.125, s*.115, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#100c08";
  for (const sd of [-1, 1]){
    ctx.beginPath();
    ctx.arc(hx + s*.06 + wave*s*.02, sd*s*.052, s*.022, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ────────────────────  frogs, dragonflies, pads  ─────────────────── */
const padsPlanted = [];
const PAD_MAX = 46;

function plantPad(px, py){
  let live = 0;
  for (const q of padsPlanted) if (!q.dying) live++;
  if (live >= PAD_MAX){ for (const q of padsPlanted) if (!q.dying){ q.dying = 1; break; } }
  padsPlanted.push({
    x: px, wy: py + scrollY, r: lerp(30, 62, Math.random()),
    rot: Math.random()*TAU, sh: lerp(.34, .5, Math.random()),
    t: 0, fade: 1, dying: 0,
    flower: Math.random() < .28,
    fcol: Math.random() < .6 ? "252,246,238" : "246,196,214"
  });
  rings.push({ x:px, y:py, r:4, max:70, a:.6, col:"186,222,222" });
}

function updatePads(dt){
  for (let i=padsPlanted.length-1;i>=0;i--){
    const q = padsPlanted[i];
    q.t += dt;
    if (q.dying) q.fade -= dt*1.5;
    if (q.fade <= 0) padsPlanted.splice(i,1);
  }
}

function padShape(cx, cy, r, rot, sh){
  ctx.beginPath();
  ctx.arc(cx, cy, r, rot + sh, rot + TAU + sh - .5);
  ctx.closePath();
  ctx.fill();
}

function drawPlantedPads(){
  for (const q of padsPlanted){
    const y = q.wy - scrollY;
    if (y < -90 || y > H + 90) continue;
    const g = easeBack(clamp(q.t/0.8, 0, 1), 1.3);
    const r = q.r * g;
    if (r < 1) continue;
    const sway = Math.sin(time*.5 + q.rot)*3;
    ctx.globalAlpha = q.fade;
    ctx.fillStyle = "#0e2a1c";
    padShape(q.x + sway, y, r, q.rot, q.sh);
    ctx.globalAlpha = q.fade*.24;
    ctx.fillStyle = "#3d7a52";
    padShape(q.x + sway - r*.2, y - r*.24, r*.5, q.rot, q.sh);
    ctx.globalAlpha = q.fade;
    if (q.flower && g > .7){
      const fr = r*.30*clamp((q.t-.7)/.7, 0, 1);
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = q.fade*.3;
      ctx.drawImage(SP_BLOOM, q.x + sway - fr*4, y - fr*4, fr*8, fr*8);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = q.fade;
      ctx.fillStyle = "rgba(" + q.fcol + ",.95)";
      for (let i=0;i<8;i++){
        const a = i/8*TAU + q.rot;
        ctx.beginPath();
        ctx.ellipse(q.x + sway + Math.cos(a)*fr*.62, y + Math.sin(a)*fr*.62,
                    fr*.60, fr*.26, a, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(250,222,140,1)";
      ctx.beginPath(); ctx.arc(q.x + sway, y, fr*.28, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFrog(f, sy, dt){
  const JD = .78;
  const jumping = f.jt > 0;
  const u = jumping ? clamp(f.jt/JD, 0, 1) : 0;

  f.cool -= dt;
  if (jumping){
    f.jt += dt;
    f.x += f.vx*dt; f.wy += f.vy*dt;
    if (f.jt >= JD){
      f.jt = 0;
      const wet2 = lakeAt(f.wy) > .5;
      rings.push({ x:f.x, y:f.wy - scrollY, r:3, max: wet2 ? 46 : 26,
                   a: wet2 ? .7 : .3, col: wet2 ? "196,226,226" : "150,142,120" });
      if (wet2) splashDrops(f.x, f.wy - scrollY, 5, 60);
    }
  } else {
    f.idle -= dt;
    if (f.idle <= 0){                                  // a hop of its own accord
      f.idle = lerp(6, 20, Math.random());
      f.jt = .0001;
      const a = Math.random()*TAU;
      f.vx = Math.cos(a)*lerp(60, 150, Math.random());
      f.vy = Math.sin(a)*lerp(30, 80, Math.random());
      f.face = f.vx < 0 ? -1 : 1;
    } else if (f.cool <= 0 && sy > -40 && sy < H + 40){
      const hit = (52 + f.sz) * (52 + f.sz);
      let got = null;
      for (const p of ptrs.values()){
        const dx = f.x - p.x, dy = sy - p.y;
        if (dx*dx + dy*dy < hit){ got = p; break; }
      }
      if (!got) for (const p of taps){
        const dx = f.x - p.x, dy = sy - p.y;
        if (dx*dx + dy*dy < hit){ got = p; break; }
      }
      if (got){
        f.jt = .0001; f.cool = 1.4; f.idle = lerp(6, 20, Math.random());
        const a = Math.atan2(f.wy - scrollY - got.y, f.x - got.x);
        const p2 = lerp(190, 330, Math.random());
        f.vx = Math.cos(a)*p2; f.vy = Math.sin(a)*p2*.6;
        f.face = f.vx < 0 ? -1 : 1;
      }
    }
  }

  if (sy < -80 || sy > H + 80) return;
  const s = f.sz, lift = jumping ? Math.sin(u*Math.PI)*s*1.5 : 0;
  const stretch = jumping ? 1 + Math.sin(u*Math.PI)*.28 : 1;
  const breathe = jumping ? 1 - Math.sin(u*Math.PI)*.16 : 1 + Math.sin(time*2.4 + f.ph)*.035;

  ctx.save();
  ctx.translate(f.x, sy - lift);
  ctx.scale(f.face * stretch, breathe);

  ctx.globalAlpha = jumping ? .34 - lift/(s*9) : .38;
  ctx.fillStyle = "#04120c";
  const shr = 1 - lift/(s*4.2);
  ctx.beginPath();
  ctx.ellipse(0, lift + s*.32, s*.78*shr, s*.22*shr, 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;

  const leg = jumping ? lerp(.6, 1.5, Math.sin(u*Math.PI)) : .6;
  ctx.fillStyle = f.dark;
  for (const sd of [-1, 1]){
    ctx.save();
    ctx.translate(-s*.42, sd*s*.34);
    ctx.rotate(sd*(jumping ? .12 : .55));
    ctx.beginPath();
    ctx.ellipse(-s*.30*leg, 0, s*.46*leg, s*.17, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = f.col;
  ctx.beginPath(); ctx.ellipse(0, 0, s*.72, s*.44, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = f.dark;
  for (let i=0;i<4;i++){
    const a = f.ph + i*1.9;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a)*s*.34, Math.sin(a)*s*.20, s*.11, s*.08, a, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = f.col;
  ctx.beginPath(); ctx.ellipse(s*.56, 0, s*.34, s*.30, 0, 0, TAU); ctx.fill();
  for (const sd of [-1, 1]){
    ctx.fillStyle = f.col;
    ctx.beginPath(); ctx.arc(s*.62, sd*s*.20, s*.16, 0, TAU); ctx.fill();
    ctx.fillStyle = "#100c08";
    ctx.beginPath(); ctx.arc(s*.66, sd*s*.20, s*.09, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.beginPath(); ctx.arc(s*.70, sd*s*.23, s*.033, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawDragon(d, dt){
  // hover, then dart
  d.hold -= dt;
  if (d.hold <= 0){
    d.hold = lerp(.7, 2.4, Math.random());
    d.tx = clamp(d.x + (Math.random()*2-1)*230, -40, W + 40);
    d.ty = d.ty + (Math.random()*2-1)*180;
  }
  for (const p of ptrs.values()){                      // shy of a finger
    const dx = d.x - p.x, dy = (d.ty - scrollY) - p.y;
    if (dx*dx + dy*dy < 19000){
      d.tx = clamp(d.x + dx*2.4, -40, W + 40);
      d.ty = d.ty + dy*1.8;
      d.hold = 1.4;
    }
  }
  const k = 1 - Math.exp(-5.2*dt);
  d.x += (d.tx - d.x)*k*1.5;
  d.ty += ((d.ty2 !== undefined ? d.ty2 : d.ty) - d.ty)*0;
  d.wy += (d.ty - d.wy)*k*1.5;
  const sy = d.wy - scrollY + Math.sin(time*3.1 + d.ph)*3;
  if (sy < -60 || sy > H + 60) return;

  const s = d.sz, ang = Math.atan2(0, 1) + Math.sin(time*1.4 + d.ph)*.25
            + (d.tx - d.x)*.002;
  ctx.save();
  ctx.translate(d.x, sy);
  ctx.rotate(ang);

  const beat = Math.sin(time*46 + d.ph);
  ctx.globalAlpha = .30;
  ctx.fillStyle = "rgba(224,240,246,1)";
  for (const sd of [-1, 1]) for (const off of [s*.16, -s*.10]){
    ctx.save();
    ctx.translate(off, 0);
    ctx.rotate(sd*(.36 + beat*.16));
    ctx.beginPath(); ctx.ellipse(0, sd*s*.42, s*.20, s*.44, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = d.col;
  ctx.beginPath(); ctx.ellipse(s*.10, 0, s*.20, s*.11, 0, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s*.06, -s*.055);
  ctx.quadraticCurveTo(-s*.55, -s*.03, -s*.78, 0);
  ctx.quadraticCurveTo(-s*.55, s*.03, -s*.06, s*.055);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#12262a";
  ctx.beginPath(); ctx.arc(s*.30, 0, s*.115, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(210,240,240,.8)";
  ctx.beginPath(); ctx.arc(s*.33, -s*.04, s*.04, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ─────────────────────  the mushroom garden  ─────────────────────── */
const MUSH = [
  { cap:"#b83a2c", stem:"#f0e6d2", dot:"#f8f2e4", gl:0 },
  { cap:"#c98a3e", stem:"#ecdfc6", dot:null,      gl:0 },
  { cap:"#8a6448", stem:"#e6dac4", dot:null,      gl:0 },
  { cap:"#9a86dc", stem:"#eae4f6", dot:"#e8dfff", gl:1 },
  { cap:"#4fae90", stem:"#e0efe4", dot:null,      gl:1 },
  { cap:"#d9c27a", stem:"#f2ecd8", dot:null,      gl:0 },
];
const MUSH_ROW = 300;

function mushCell(ci){
  const key = "mu|" + ci;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(ci, 6151));
  const items = [];
  const n = r() < .30 ? 0 : r() < .72 ? 1 : 2 + (r()*2|0);
  for (let i=0;i<n;i++) items.push({
    fx: r()*1.2 - .1, x: 0, y: r()*MUSH_ROW,
    r: lerp(17, 54, Math.pow(r(), 1.4)),
    t: (r()*MUSH.length)|0, a: r()*TAU,
    lean: (r()*2-1)*.16, pop: 0, cool: 0
  });
  c = { seen: frameId, items };
  cells.set(key, c);
  return c;
}

function drawMushroom(m, sy, dt, a){
  const M = MUSH[m.t], r = m.r;
  m.cool -= dt; m.pop *= Math.exp(-3.6*dt);
  if (m.cool <= 0 && sy > -50 && sy < H + 50){
    const hit = (44 + r)*(44 + r);
    let got = null;
    for (const p of ptrs.values()){ const dx=m.x-p.x, dy=(sy-r*.9)-p.y; if (dx*dx+dy*dy<hit){got=p;break;} }
    if (!got) for (const p of taps){ const dx=m.x-p.x, dy=(sy-r*.9)-p.y; if (dx*dx+dy*dy<hit){got=p;break;} }
    if (got){
      m.cool = 1.5; m.pop = 1;
      rings.push({ x:m.x, y:sy - r*.95, r:3, max:34 + r, a:.55, col: M.gl ? "206,190,250" : "226,216,190" });
      for (let i=0;i<8 && motes.length<MOTE_MAX;i++){
        const an = Math.random()*TAU;
        motes.push({ x:m.x, y:sy-r*1.1, z:1.2, r:lerp(.8,1.9,Math.random()), a:.75,
          vx:Math.cos(an)*lerp(12,52,Math.random()), vy:-lerp(12,48,Math.random()),
          ph:Math.random()*TAU, life:lerp(1.4,3,Math.random()), sp: M.gl ? SP_MAGIC : SP_MOTEA });
      }
    }
  }
  if (sy < -60 || sy > H + 60) return;

  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(m.x, sy);
  ctx.rotate(m.lean + Math.sin(time*.7 + m.a)*.02);
  ctx.scale(1 + m.pop*.14, 1 - m.pop*.09);

  ctx.globalAlpha = a*.36; ctx.fillStyle = "#03100a";
  ctx.beginPath(); ctx.ellipse(0, 0, r*1.15, r*.28, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = a;

  if (M.gl){
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = a*(.16 + .07*Math.sin(time*1.8 + m.a) + m.pop*.4);
    ctx.drawImage(SP_MAGIC, -r*3, -r*4.1, r*6, r*6);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = a;
  }

  ctx.fillStyle = M.stem;
  ctx.beginPath();
  ctx.moveTo(-r*.23, 0);
  ctx.quadraticCurveTo(-r*.31, -r*.5, -r*.25, -r*.86);
  ctx.lineTo(r*.25, -r*.86);
  ctx.quadraticCurveTo(r*.31, -r*.5, r*.23, 0);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = M.cap;
  ctx.beginPath();
  ctx.moveTo(-r, -r*.84);
  ctx.bezierCurveTo(-r*.95, -r*1.80, r*.95, -r*1.80, r, -r*.84);
  ctx.quadraticCurveTo(0, -r*.50, -r, -r*.84);
  ctx.closePath(); ctx.fill();

  ctx.globalAlpha = a*.34; ctx.fillStyle = "#140c0a";
  ctx.beginPath(); ctx.ellipse(0, -r*.80, r*.93, r*.15, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = a*.26; ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.ellipse(-r*.24, -r*1.30, r*.40, r*.14, -.24, 0, TAU); ctx.fill();
  ctx.globalAlpha = a;

  if (M.dot){
    ctx.fillStyle = M.dot;
    for (let i=0;i<4;i++){
      const an = m.a + i*1.9;
      ctx.beginPath();
      ctx.arc(Math.cos(an)*r*.48, -r*1.14 + Math.sin(an)*r*.15, r*.105, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// mushrooms you plant yourself, anchored to the ground
const mushPlanted = [];
const MUSH_MAX = 50;
function plantMush(px, py){
  let live = 0;
  for (const q of mushPlanted) if (!q.dying) live++;
  if (live >= MUSH_MAX){ for (const q of mushPlanted) if (!q.dying){ q.dying = 1; break; } }
  const t = (Math.random()*MUSH.length)|0;
  mushPlanted.push({
    x: px, wy: py + scrollY, r: lerp(18, 48, Math.random()),
    t, a: Math.random()*TAU, lean: (Math.random()*2-1)*.16,
    grow: 0, fade: 1, dying: 0, pop: 0, cool: 0
  });
  rings.push({ x:px, y:py, r:3, max:52, a:.55, col: MUSH[t].gl ? "206,190,250" : "222,212,186" });
  for (let i=0;i<9 && motes.length<MOTE_MAX;i++){
    const an = Math.random()*TAU;
    motes.push({ x:px, y:py, z:1.2, r:lerp(.8,2,Math.random()), a:.7,
      vx:Math.cos(an)*lerp(16,64,Math.random()), vy:-lerp(14,54,Math.random()),
      ph:Math.random()*TAU, life:lerp(1.2,2.6,Math.random()), sp:SP_MAGIC });
  }
}
function updateMush(dt){
  for (let i=mushPlanted.length-1;i>=0;i--){
    const q = mushPlanted[i];
    q.grow = Math.min(1, q.grow + dt*1.3);
    if (q.dying) q.fade -= dt*1.5;
    if (q.fade <= 0) mushPlanted.splice(i,1);
  }
}
function drawPlantedMush(dt){
  for (const q of mushPlanted){
    const sy = q.wy - scrollY;
    if (sy < -70 || sy > H + 70) continue;
    const g = easeBack(q.grow, 1.4);
    if (g < .04) continue;
    const saved = q.r;
    q.r = saved*g;
    drawMushroom(q, sy, dt, q.fade);
    q.r = saved;
  }
}

// a fallen log, and the house somebody lives in
function gardenCell(seg){
  const key = "gd|" + seg;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(seg, 2749));
  c = {
    seen: frameId,
    log: { x: r(), y: seg*SEG + SEG*lerp(.18, .48, r()), s: lerp(.85, 1.3, r()),
           rot: (r()*2-1)*.20, seed: (r()*1e9)|0 },
    house: { x: lerp(.2, .8, r()), y: seg*SEG + SEG*lerp(.55, .82, r()),
             s: lerp(.9, 1.25, r()), seed: (r()*1e9)|0 }
  };
  cells.set(key, c);
  return c;
}

function drawLog(L2){
  const sy = L2.y - scrollY;
  if (sy < -220 || sy > H + 220) return;
  const r = rng(L2.seed);
  const len = 420*L2.s, th = 82*L2.s;
  ctx.save();
  ctx.translate(L2.x*W, sy);
  ctx.rotate(L2.rot);
  ctx.globalAlpha = .45; ctx.fillStyle = "#03100a";
  ctx.beginPath(); ctx.ellipse(0, th*.45, len*.52, th*.34, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, -th*.5, 0, th*.5);
  g.addColorStop(0, "#4e3a26"); g.addColorStop(.4, "#3a2b1c"); g.addColorStop(1, "#1e160e");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-len*.5, -th*.5); ctx.lineTo(len*.5, -th*.5);
  ctx.quadraticCurveTo(len*.56, 0, len*.5, th*.5);
  ctx.lineTo(-len*.5, th*.5);
  ctx.quadraticCurveTo(-len*.56, 0, -len*.5, -th*.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(16,10,6,.5)"; ctx.lineWidth = 2;
  for (let i=0;i<9;i++){
    const y2 = lerp(-th*.4, th*.4, r());
    ctx.beginPath();
    ctx.moveTo(-len*.46, y2);
    ctx.quadraticCurveTo(0, y2 + lerp(-8, 8, r()), len*.46, y2);
    ctx.stroke();
  }
  ctx.fillStyle = "#2e5a34";                       // moss along the top
  for (let i=0;i<16;i++){
    ctx.globalAlpha = lerp(.25, .6, r());
    ctx.beginPath();
    ctx.ellipse(lerp(-len*.46, len*.46, r()), -th*.42 + lerp(-6, 12, r()),
                lerp(14, 40, r()), lerp(5, 12, r()), 0, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#8d6c32";                       // cut end
  ctx.beginPath(); ctx.ellipse(len*.5, 0, th*.16, th*.5, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(40,28,14,.5)"; ctx.lineWidth = 1.6;
  for (let i=1;i<=3;i++){
    ctx.beginPath(); ctx.ellipse(len*.5, 0, th*.16*i/3.4, th*.5*i/3.4, 0, 0, TAU); ctx.stroke();
  }
  for (let i=0;i<5;i++){                           // bracket fungi
    const bx = lerp(-len*.4, len*.35, r()), sd = r() < .5 ? -1 : 1;
    ctx.fillStyle = ["#c9a05a","#a8763c","#d8bc7e"][(r()*3)|0];
    ctx.beginPath();
    ctx.ellipse(bx, sd*th*.45, lerp(14, 30, r()), lerp(6, 13, r()), sd*.2, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawFairyHouse(hs){
  const sy = hs.y - scrollY;
  if (sy < -420 || sy > H + 160) return;
  const r = rng(hs.seed);
  const s = hs.s, R = 128*s, stemH = 150*s, stemW = 62*s;
  const flick = .82 + .18*Math.sin(time*7.3 + hs.x*9) + .06*Math.sin(time*2.1);

  ctx.save();
  ctx.translate(hs.x*W, sy);

  ctx.globalAlpha = .45; ctx.fillStyle = "#03100a";
  ctx.beginPath(); ctx.ellipse(0, 0, R*1.05, R*.24, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = "rgba(120,116,108,.75)";         // pebble path
  for (let i=0;i<11;i++){
    ctx.beginPath();
    ctx.ellipse(lerp(-R*.2, R*.2, r()), lerp(6, R*.62, r()),
                lerp(5, 11, r()), lerp(3, 6, r()), r()*TAU, 0, TAU);
    ctx.fill();
  }

  ctx.globalCompositeOperation = "lighter";        // warmth from the window
  ctx.globalAlpha = .17*flick;
  ctx.drawImage(glow("252,206,128"), -R*1.7, -stemH - R*1.2, R*3.4, R*2.8);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  const sg = ctx.createLinearGradient(-stemW*.5, 0, stemW*.5, 0);
  sg.addColorStop(0, "#c9bda2"); sg.addColorStop(.42, "#efe6d0"); sg.addColorStop(1, "#a99d84");
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(-stemW*.5, 0);
  ctx.quadraticCurveTo(-stemW*.62, -stemH*.5, -stemW*.44, -stemH);
  ctx.lineTo(stemW*.44, -stemH);
  ctx.quadraticCurveTo(stemW*.62, -stemH*.5, stemW*.5, 0);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#3a2416";                       // door
  ctx.beginPath();
  ctx.moveTo(-stemW*.22, 0);
  ctx.lineTo(-stemW*.22, -stemH*.42);
  ctx.quadraticCurveTo(0, -stemH*.62, stemW*.22, -stemH*.42);
  ctx.lineTo(stemW*.22, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(90,62,34,.8)"; ctx.lineWidth = 1.6;
  for (let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(i*stemW*.11, -stemH*.02); ctx.lineTo(i*stemW*.11, -stemH*.46);
    ctx.stroke();
  }
  ctx.fillStyle = "#d8b25a";
  ctx.beginPath(); ctx.arc(stemW*.13, -stemH*.20, 2.6*s, 0, TAU); ctx.fill();

  ctx.fillStyle = "rgba(252,206,128," + (.85*flick).toFixed(2) + ")";   // window
  ctx.beginPath(); ctx.arc(-stemW*.30, -stemH*.66, stemW*.15, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#3a2416"; ctx.lineWidth = 2.4*s;
  ctx.beginPath(); ctx.arc(-stemW*.30, -stemH*.66, stemW*.15, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-stemW*.45, -stemH*.66); ctx.lineTo(-stemW*.15, -stemH*.66);
  ctx.moveTo(-stemW*.30, -stemH*.81); ctx.lineTo(-stemW*.30, -stemH*.51);
  ctx.stroke();

  ctx.fillStyle = "#8f2f24";                       // cap
  ctx.beginPath();
  ctx.moveTo(-R, -stemH + R*.10);
  ctx.bezierCurveTo(-R*.94, -stemH - R*1.02, R*.94, -stemH - R*1.02, R, -stemH + R*.10);
  ctx.quadraticCurveTo(0, -stemH + R*.42, -R, -stemH + R*.10);
  ctx.closePath(); ctx.fill();
  const cg = ctx.createLinearGradient(0, -stemH - R*.9, 0, -stemH + R*.2);
  cg.addColorStop(0, "rgba(255,255,255,.20)");
  cg.addColorStop(.6, "rgba(255,255,255,0)");
  cg.addColorStop(1, "rgba(0,0,0,.28)");
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(-R, -stemH + R*.10);
  ctx.bezierCurveTo(-R*.94, -stemH - R*1.02, R*.94, -stemH - R*1.02, R, -stemH + R*.10);
  ctx.quadraticCurveTo(0, -stemH + R*.42, -R, -stemH + R*.10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f6efdd";
  for (let i=0;i<7;i++){
    const an = lerp(-2.6, -.5, r()), rr = lerp(.25, .82, r());
    ctx.beginPath();
    ctx.ellipse(Math.cos(an)*R*rr, -stemH - R*.30 + Math.sin(an)*R*.34*rr,
                R*lerp(.06, .13, r()), R*lerp(.04, .09, r()), 0, 0, TAU);
    ctx.fill();
  }

  ctx.fillStyle = "#5a4a3a";                       // chimney
  ctx.fillRect(R*.34, -stemH - R*.98, 15*s, 34*s);
  ctx.fillStyle = "#3a2e22";
  ctx.fillRect(R*.32, -stemH - R*.98 - 5*s, 19*s, 7*s);
  ctx.globalAlpha = .30;
  ctx.fillStyle = "#cfd6cf";
  for (let i=0;i<5;i++){
    const t = mod(time*.35 + i*.2, 1);
    ctx.globalAlpha = .26*(1 - t);
    ctx.beginPath();
    ctx.arc(R*.42 + Math.sin(t*7 + i)*16*s, -stemH - R*1.02 - t*130*s, (5 + t*22)*s, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawGardens(dt){
  const c0 = Math.floor((scrollY - 200)/MUSH_ROW);
  const c1 = Math.floor((scrollY + H + 200)/MUSH_ROW);
  for (let ci=c0; ci<=c1; ci++){
    const wy = ci*MUSH_ROW;
    const seg = Math.floor(wy/SEG);
    if (segBiome(seg) !== MGARD) continue;
    const m = segAt(wy);
    const a = m.a === MGARD ? (m.t ? 1 - m.t : 1) : m.t;
    if (a < .05) continue;
    // fx is a fraction of the width; resolving it here keeps them spread
    // after a resize. Using it raw put every mushroom on the left edge.
    for (const it of mushCell(ci).items){
      it.x = it.fx * W;
      drawMushroom(it, wy + it.y - scrollY, dt, a);
    }
  }
  const s0 = Math.floor((scrollY - 500)/SEG), s1 = Math.floor((scrollY + H + 500)/SEG);
  for (let sg=s0; sg<=s1; sg++){
    if (segBiome(sg) !== MGARD) continue;
    const G = gardenCell(sg);
    drawLog(G.log);
    drawFairyHouse(G.house);
  }
}

/* ─────────────────────  the butterfly garden  ────────────────────── */
const BFLY = [
  { a:"#e08a2a", b:"#6b3c12", e:"#2a1808", s:"#ffe6b0" },
  { a:"#f0e79c", b:"#d8c85e", e:"#9a8630", s:"#fffbe0" },
  { a:"#6786dc", b:"#3b56a8", e:"#1e2c62", s:"#e8eeff" },
  { a:"#c03a30", b:"#4a1a14", e:"#180a08", s:"#f2f0e6" },
  { a:"#b0925e", b:"#6b543a", e:"#33261a", s:"#f6e6b8" },
  { a:"#f4f2e8", b:"#ddd8c6", e:"#a8a290", s:"#ffffff" },
];
const flies = [];
let nextFly = 2;

function spawnFly(inGarden){
  const dir = Math.random() < .5 ? 1 : -1;
  const sz = lerp(34, 62, Math.random()) * (inGarden ? 1.1 : 1);
  flies.push({
    t: (Math.random()*BFLY.length)|0,
    x: dir > 0 ? -60 : W + 60,
    y: lerp(H*.12, H*.9, Math.random()),
    tx: lerp(W*.1, W*.9, Math.random()), ty: lerp(H*.15, H*.85, Math.random()),
    vx: 0, vy: 0, sz, wing: Math.random()*TAU, hz: lerp(7.5, 11, Math.random()),
    head: dir > 0 ? 0 : Math.PI, hold: lerp(.4, 1.2, Math.random()),
    sit: 0, key: null, life: lerp(16, 44, Math.random())
  });
}

const angTo = (a, b, t) => {
  let d = b - a;
  while (d >  Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return a + d*t;
};

function updateFlies(dt){
  const zone = segBiome(Math.floor((scrollY + H*.5)/SEG));
  const inGarden = zone === BGARD;
  const warm = clamp((seaW[0] + seaW[1] + seaW[2]*.45 - .1)*1.4, 0, 1);
  const cap = Math.round((inGarden ? 12 : 3) * warm);
  nextFly -= dt;
  if (nextFly <= 0 && flies.length < cap){
    nextFly = inGarden ? lerp(.35, 1.3, Math.random()) : lerp(9, 26, Math.random());
    spawnFly(inGarden);
  }
  for (let i=flies.length-1;i>=0;i--){
    const f = flies[i];
    f.life -= dt;
    f.wing += dt*TAU*f.hz*(f.sit > 0 ? .18 : 1);

    if (f.sit > 0){
      f.sit -= dt;
      f.head += Math.sin(time*.6 + f.sz)*dt*.5;           // shifts about on the flower
      let b = null;
      for (const q of blooms) if (q.key === f.key){ b = q; break; }
      if (!b || f.sit <= 0){ f.sit = 0; f.key = null; f.hold = 0; }
      else { f.x = b.x; f.y = b.y - f.sz*.16; }
    } else {
      f.hold -= dt;
      if (f.hold <= 0){
        f.hold = lerp(.35, 1.1, Math.random());
        if (blooms.length && Math.random() < (inGarden ? .34 : .18)){
          const b = blooms[(Math.random()*blooms.length)|0];
          f.tx = b.x; f.ty = b.y - f.sz*.16; f.key = b.key;
        } else {
          f.tx = clamp(f.x + (Math.random()*2-1)*230, -50, W + 50);
          f.ty = clamp(f.y + (Math.random()*2-1)*180, H*.06, H*.94);
          f.key = null;
        }
      }
      for (const p of ptrs.values()){                     // shy of a finger
        const dx = f.x - p.x, dy = f.y - p.y;
        if (dx*dx + dy*dy < 17000){
          f.tx = clamp(f.x + dx*2.6, -60, W + 60);
          f.ty = clamp(f.y + dy*2.2, H*.04, H*.96);
          f.key = null; f.hold = 1.1;
        }
      }
      const dx = f.tx - f.x, dy = f.ty - f.y;
      const d = Math.hypot(dx, dy) + .001;
      const spd = clamp(d*2.2, 26, 190);
      const k = 1 - Math.exp(-3.2*dt);
      f.vx = lerp(f.vx, dx/d*spd, k);
      f.vy = lerp(f.vy, dy/d*spd, k);
      f.x += (f.vx + gustAt(f.x)*70)*dt;
      f.y += f.vy*dt - Math.cos(f.wing)*f.sz*1.5*dt;      // bobs with every beat
      const sp2 = Math.hypot(f.vx, f.vy);
      if (sp2 > 14) f.head = angTo(f.head, Math.atan2(f.vy, f.vx), 1 - Math.exp(-7*dt));
      if (f.key && d < 16 && f.life > 4){ f.sit = lerp(1.8, 5, Math.random()); }
    }
    f.y -= (scrollY - lastScroll)*.55;
    if (f.life < 0 || f.x < -140 || f.x > W + 140 || f.y < -140 || f.y > H + 140)
      flies.splice(i,1);
  }
}

function drawFlies(){
  for (const f of flies){
    const B = BFLY[f.t], s = f.sz;
    const open = f.sit > 0 ? .30 + .26*(.5 + .5*Math.sin(time*1.6 + f.wing))
                           : .16 + .84*Math.abs(Math.sin(f.wing));
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.head + Math.sin(f.wing)*.045);

    for (const sd of [-1, 1]){
      ctx.save();
      ctx.scale(1, sd*open);
      ctx.fillStyle = B.b;                                // hindwing
      ctx.beginPath();
      ctx.moveTo(-s*.04, 0);
      ctx.bezierCurveTo(-s*.34, s*.10, -s*.36, s*.42, -s*.10, s*.44);
      ctx.bezierCurveTo(s*.06, s*.44, s*.10, s*.16, s*.02, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = B.a;                                // forewing
      ctx.beginPath();
      ctx.moveTo(s*.02, 0);
      ctx.bezierCurveTo(s*.16, s*.06, s*.42, s*.30, s*.44, s*.52);
      ctx.bezierCurveTo(s*.22, s*.50, s*.02, s*.24, -s*.02, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = B.e;                                // dark margin
      ctx.beginPath();
      ctx.moveTo(s*.42, s*.50);
      ctx.bezierCurveTo(s*.30, s*.56, s*.12, s*.44, s*.06, s*.30);
      ctx.bezierCurveTo(s*.22, s*.36, s*.36, s*.44, s*.44, s*.52);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = B.s;
      for (let i=0;i<3;i++){
        ctx.beginPath();
        ctx.ellipse(s*(.14 + i*.09), s*(.20 + i*.09), s*.035, s*.028, 0, 0, TAU);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.ellipse(-s*.18, s*.30, s*.045, s*.036, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = "#221a12";                            // body
    ctx.beginPath(); ctx.ellipse(0, 0, s*.09, s*.045, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(s*.10, 0, s*.035, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#221a12"; ctx.lineWidth = s*.014; ctx.lineCap = "round";
    for (const sd of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s*.11, sd*s*.012);
      ctx.quadraticCurveTo(s*.20, sd*s*.06, s*.24, sd*s*.10);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(s*.245, sd*s*.105, s*.018, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ══════════════════════  five more places  ══════════════════════════ */
function eachZone(kind, fn){
  const s0 = Math.floor((scrollY - 500)/SEG), s1 = Math.floor((scrollY + H + 500)/SEG);
  for (let sg=s0; sg<=s1; sg++) if (segBiome(sg) === kind) fn(sg);
}
function zoneBandFill(sg, stops){
  const y0 = sg*SEG - scrollY, y1 = (sg+1)*SEG - scrollY;
  if (y1 < -60 || y0 > H + 60) return null;
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  for (const [t, c] of stops) g.addColorStop(t, c);
  ctx.fillStyle = g;
  ctx.fillRect(0, Math.max(y0, -40), W, Math.min(y1, H + 40) - Math.max(y0, -40));
  return [y0, y1];
}
// a thing you make, that stays where you made it
function keeper(list, cap, obj){
  let live = 0;
  for (const q of list) if (!q.dying) live++;
  if (live >= cap){ for (const q of list) if (!q.dying){ q.dying = 1; break; } }
  list.push(obj);
}
function ageKeepers(list, dt){
  for (let i=list.length-1;i>=0;i--){
    const q = list[i];
    q.t += dt;
    if (q.dying) q.fade -= dt*1.5;
    if (q.fade <= 0) list.splice(i,1);
  }
}
function tappedNear(x, y, rad){
  const r2 = rad*rad;
  for (const p of ptrs.values()){ const dx=x-p.x, dy=y-p.y; if (dx*dx+dy*dy<r2) return p; }
  for (const p of taps){ const dx=x-p.x, dy=y-p.y; if (dx*dx+dy*dy<r2) return p; }
  return null;
}

/* ─────────────────────────── 1. snowfield ─────────────────────────── */
const snowmen = [], flakes = [];
function newFlake(z0){
  return {
    x0: lerp(-.3, 1.3, Math.random())*W,
    y0: lerp(-.4, 1.3, Math.pow(Math.random(), 1.35))*H,
    xE: lerp(.14, .86, Math.random())*W,
    yE: lerp(AIR_BAND - .09, AIR_BAND + .10, Math.random())*H,
    x: 0, y: 0, r: lerp(1.5, 3.4, Math.random()),
    z: z0, zv: lerp(.055, .14, Math.random()), ph: Math.random()*TAU
  };
}
function seedFlakes(){
  flakes.length = 0;
  const n = Math.round(clamp(W*H/5200, 60, 200));
  for (let i=0;i<n;i++) flakes.push(newFlake(Math.random()));
}
function drawSnowGround(){
  if (snowCover < .03) return;
  const R0 = 900;
  const c0 = Math.floor((scrollY - 300)/R0), c1 = Math.floor((scrollY + H + 300)/R0);
  ctx.globalAlpha = snowCover;
  ctx.fillStyle = "rgba(224,236,250,.92)";
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  for (let sg=c0; sg<=c1; sg++){
    const yy = [sg*R0 - scrollY, (sg+1)*R0 - scrollY];
    const SEG = R0;
    const r = rng(hash2(sg, 3121));
    for (let i=0;i<16;i++){                                   // drifts
      const dy = yy[0] + r()*SEG - 0;
      if (dy < -80 || dy > H + 80){ r();r();r();r(); continue; }
      ctx.globalAlpha = lerp(.25, .62, r())*snowCover;
      ctx.fillStyle = "#f2f7ff";
      ctx.beginPath();
      ctx.ellipse(r()*W, dy, lerp(70, 230, r()), lerp(16, 46, r()), 0, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let i=0;i<9;i++){                                    // little tracks
      let tx = r()*W, ty = yy[0] + r()*SEG;
      const dir = r() < .5 ? -1 : 1;
      if (ty < -60 || ty > H + 60){ for(let k=0;k<3;k++) r(); continue; }
      ctx.fillStyle = "rgba(150,172,200," + (.5*snowCover).toFixed(2) + ")";
      for (let k=0;k<7;k++){
        ctx.beginPath(); ctx.ellipse(tx, ty, 4.5, 3, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(tx + dir*9, ty + 7, 4.5, 3, 0, 0, TAU); ctx.fill();
        tx += dir*17; ty += 15;
      }
    }
    for (let i=0;i<44;i++){                                   // frost sparkle
      const sx = r()*W, sy2 = yy[0] + r()*SEG, ph = r()*TAU;
      if (sy2 < -20 || sy2 > H + 20) continue;
      ctx.globalAlpha = (.35 + .5*Math.max(0, Math.sin(time*3 + ph)))*snowCover;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(sx, sy2, 1.6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
// Split over the two plates like the leaves: near flakes are big and go on the
// blurred foreground, far ones are small and sharp.
function drawSnowfall(x, nearPass){
  if (snowNow < .02) return;
  const n = Math.floor(flakes.length*snowNow);
  x.fillStyle = "#ffffff";
  for (let i=0;i<n;i++){
    const f = flakes[i];
    const nf = clamp((.56 - f.z)/.18, 0, 1);
    const share = nearPass ? nf : 1 - nf;
    if (share <= .01) continue;
    x.globalAlpha = (.32 + .48*(1 - f.z)) * snowNow * share * (nearPass ? .8 : 1);
    x.beginPath();
    x.arc(f.x, f.y, f.r * airK(f.z), 0, TAU);
    x.fill();
  }
  x.globalAlpha = 1;
}
function updateSnowfall(dt){
  if (snowNow < .02) return;
  const n = Math.floor(flakes.length*snowNow);
  for (let i=0;i<n;i++){
    const f = flakes[i];
    f.z += f.zv*dt;
    if (f.z >= 1){ flakes[i] = newFlake(0); continue; }
    const e = airEase(f.z), k = airK(f.z);
    f.x = lerp(f.x0, f.xE, e) + (Math.sin(time*.7 + f.ph)*20 + gustAt(f.x0)*26) * k;
    f.y = lerp(f.y0, f.yE, e) + Math.sin(time*1.2 + f.ph*1.4)*7 * k;
  }
}
function buildSnowman(px, py){
  keeper(snowmen, 26, {
    x: px, wy: py + scrollY, s: lerp(.8, 1.25, Math.random()),
    t: 0, fade: 1, dying: 0, wob: 0, hat: Math.random() < .5,
    sc: ["#c0392b","#2c6ea8","#c9922f","#4f8b53"][(Math.random()*4)|0]
  });
  rings.push({ x:px, y:py, r:4, max:64, a:.6, col:"226,240,255" });
  for (let i=0;i<12 && motes.length<MOTE_MAX;i++){
    const a = Math.random()*TAU;
    motes.push({ x:px, y:py, z:1.2, r:lerp(1,2.6,Math.random()), a:.8,
      vx:Math.cos(a)*lerp(20,80,Math.random()), vy:-lerp(20,70,Math.random()),
      ph:Math.random()*TAU, life:lerp(.8,1.8,Math.random()), sp:SP_MOTEA });
  }
}
function drawSnowmen(dt){
  for (const q of snowmen){
    const sy = q.wy - scrollY;
    if (sy < -220 || sy > H + 120) continue;
    q.wob *= Math.exp(-3.2*dt);
    const hit = tappedNear(q.x, sy - 60*q.s, 58*q.s);
    if (hit && q.t > 1.4 && q.wob < .1){
      q.wob = 1;
      rings.push({ x:q.x, y:sy - 60*q.s, r:3, max:44, a:.4, col:"226,240,255" });
    }
    const S = 46*q.s;
    const pop = n => easeBack(clamp((q.t - n*.22)/.5, 0, 1), 1.6);
    const p1 = pop(0), p2 = pop(1), p3 = pop(2);
    ctx.save();
    ctx.globalAlpha = q.fade;
    ctx.translate(q.x, sy);
    ctx.rotate(Math.sin(q.wob*14)*q.wob*.09);
    ctx.globalAlpha = q.fade*.36; ctx.fillStyle = "#7d92ad";
    ctx.beginPath(); ctx.ellipse(0, 0, S*.98, S*.26, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = q.fade;
    const ball = (cy, rr, k) => {
      if (k < .02) return;
      const g = ctx.createRadialGradient(-rr*.3, cy - rr*.35, rr*.1, 0, cy, rr*1.15);
      g.addColorStop(0, "#ffffff"); g.addColorStop(.6, "#eef4fc"); g.addColorStop(1, "#c3d3e6");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, cy, rr*k, 0, TAU); ctx.fill();
    };
    ball(-S*.42, S*.72, p1);
    ball(-S*1.32, S*.54, p2);
    ball(-S*2.02, S*.40, p3);
    if (p3 > .9){
      ctx.strokeStyle = "#5a3f28"; ctx.lineWidth = S*.075; ctx.lineCap = "round";
      for (const sd of [-1, 1]){
        ctx.beginPath();
        ctx.moveTo(sd*S*.44, -S*1.34);
        ctx.lineTo(sd*S*1.20, -S*1.72);
        ctx.moveTo(sd*S*.92, -S*1.53);
        ctx.lineTo(sd*S*1.14, -S*1.30);
        ctx.stroke();
      }
      ctx.fillStyle = "#2a2a2e";
      for (const sd of [-1, 1]){
        ctx.beginPath(); ctx.arc(sd*S*.14, -S*2.10, S*.055, 0, TAU); ctx.fill();
      }
      for (let i=0;i<3;i++){
        ctx.beginPath(); ctx.arc(0, -S*1.48 + i*S*.30, S*.062, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = "#e2801f";
      ctx.beginPath();
      ctx.moveTo(0, -S*2.00); ctx.lineTo(S*.46, -S*1.92); ctx.lineTo(0, -S*1.88);
      ctx.closePath(); ctx.fill();
      const fl = Math.sin(time*2.2 + q.x)*.22;
      ctx.fillStyle = q.sc;
      ctx.fillRect(-S*.44, -S*1.78, S*.88, S*.20);
      ctx.save();
      ctx.translate(S*.34, -S*1.66); ctx.rotate(.5 + fl);
      ctx.fillRect(0, 0, S*.20, S*.72);
      ctx.restore();
      if (q.hat){
        ctx.fillStyle = "#26262c";
        ctx.fillRect(-S*.52, -S*2.36, S*1.04, S*.09);
        ctx.fillRect(-S*.32, -S*2.78, S*.64, S*.44);
      }
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function robinCell(sg){
  const key = "rb|" + sg;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(sg, 8821));
  c = { seen: frameId, b: { x: r()*W, wy: sg*SEG + SEG*lerp(.2,.8,r()),
        face: r()<.5?-1:1, hop: 0, wait: r()*2, jt: 0, ph: r()*TAU } };
  cells.set(key, c);
  return c;
}
function drawRobins(dt){
  eachZone(SNOW, sg => {
    const b = robinCell(sg).b;
    const sy = b.wy - scrollY;
    if (b.jt > 0){
      b.jt += dt;
      const u = clamp(b.jt/.42, 0, 1);
      b.x += b.face*90*dt; b.wy += b.hopDy*dt;
      if (u >= 1) b.jt = 0;
    } else {
      b.wait -= dt;
      if (b.wait <= 0){
        b.wait = lerp(.5, 2.6, Math.random());
        if (Math.random() < .7){
          b.jt = .001; b.hopDy = (Math.random()*2-1)*40;
          if (Math.random() < .25) b.face = -b.face;
        }
      }
      const hit = tappedNear(b.x, sy - 16, 60);
      if (hit){ b.jt = .001; b.face = b.x < hit.x ? -1 : 1; b.hopDy = -30; b.wait = 1.2; }
    }
    if (b.x < -40) b.x = W + 40;
    if (b.x > W + 40) b.x = -40;
    if (sy < -60 || sy > H + 60) return;
    const lift = b.jt > 0 ? Math.sin(clamp(b.jt/.42,0,1)*Math.PI)*22 : 0;
    const peck = b.jt > 0 ? 0 : Math.max(0, Math.sin(time*3 + b.ph))*6;
    const s = 15;
    ctx.save();
    ctx.translate(b.x, sy - lift);
    ctx.scale(b.face, 1);
    ctx.globalAlpha = .3; ctx.fillStyle = "#6f8399";
    ctx.beginPath(); ctx.ellipse(0, lift*.4 + s*.9, s*.7, s*.2, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#3a2a1c"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-s*.1, s*.45); ctx.lineTo(-s*.1, s*.88);
    ctx.moveTo(s*.2, s*.45);  ctx.lineTo(s*.2, s*.88);
    ctx.stroke();
    ctx.fillStyle = "#4b3a2a";
    ctx.beginPath(); ctx.ellipse(-s*.72, s*.06, s*.46, s*.20, .35, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, s*.62, s*.55, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#d1552a";
    ctx.beginPath(); ctx.ellipse(s*.24, s*.02, s*.36, s*.40, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#4b3a2a";
    ctx.beginPath(); ctx.arc(s*.46, -s*.42 + peck*.4, s*.36, 0, TAU); ctx.fill();
    ctx.fillStyle = "#d1552a";
    ctx.beginPath(); ctx.arc(s*.58, -s*.34 + peck*.4, s*.22, 0, TAU); ctx.fill();
    ctx.fillStyle = "#2b1d12";
    ctx.beginPath();
    ctx.moveTo(s*.76, -s*.44 + peck*.4);
    ctx.lineTo(s*1.12, -s*.36 + peck*.4);
    ctx.lineTo(s*.76, -s*.28 + peck*.4);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(s*.52, -s*.56 + peck*.4, s*.09, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.beginPath(); ctx.arc(s*.55, -s*.59 + peck*.4, s*.032, 0, TAU); ctx.fill();
    ctx.restore();
  });
}

/* ─────────────────────────── 2. rock pool ─────────────────────────── */
const bubbles = [];
function drawPoolGround(){
  eachZone(POOL, sg => {
    const yy = zoneBandFill(sg, [[0,"rgba(150,136,112,0)"],[.10,"rgba(160,146,120,.95)"],
                                 [.5,"rgba(146,132,108,.97)"],[.90,"rgba(160,146,120,.95)"],
                                 [1,"rgba(150,136,112,0)"]]);
    if (!yy) return;
    const r = rng(hash2(sg, 5441));
    ctx.strokeStyle = "rgba(112,98,78,.45)";            // ridged wet sand
    ctx.lineWidth = 3;
    for (let y = yy[0]; y < yy[1]; y += 26){
      if (y < -20 || y > H + 20) continue;
      ctx.beginPath();
      for (let x=0; x<=W; x+=18){
        const yy2 = y + Math.sin(x*.03 + y*.02)*6;
        x ? ctx.lineTo(x, yy2) : ctx.moveTo(x, yy2);
      }
      ctx.stroke();
    }
    // the pool itself
    const py0 = yy[0] + SEG*.30, py1 = yy[0] + SEG*.70;
    if (py1 > -60 && py0 < H + 60){
      const g = ctx.createLinearGradient(0, py0, 0, py1);
      g.addColorStop(0,  "rgba(46,92,96,0)");
      g.addColorStop(.14,"rgba(30,74,82,.95)");
      g.addColorStop(.5, "rgba(20,58,68,.97)");
      g.addColorStop(.86,"rgba(30,74,82,.95)");
      g.addColorStop(1,  "rgba(46,92,96,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, Math.max(py0,-40), W, Math.min(py1,H+40) - Math.max(py0,-40));
      ctx.strokeStyle = "rgba(184,222,220,1)";
      ctx.globalAlpha = .22; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let y = Math.max(py0,-10); y < Math.min(py1,H+10); y += 11){
        const row = ((y + scrollY)/11)|0;
        const seed = hash2(row, sg)/4294967296;
        const x = mod(seed*W*1.5 + Math.sin(time*.8 + seed*9)*20, W+80) - 40;
        ctx.moveTo(x, y); ctx.lineTo(x + lerp(16, 62, seed), y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      for (let i=0;i<4;i++){                            // anemones in the pool
        const ax = r()*W, ay = lerp(py0+30, py1-30, r()), ar = lerp(11, 20, r());
        if (ay < -30 || ay > H + 30) continue;
        ctx.fillStyle = "#8e3350";
        ctx.beginPath(); ctx.ellipse(ax, ay, ar*.8, ar*.5, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = "#c4526f"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
        for (let k=0;k<12;k++){
          const a = k/12*TAU, wv = Math.sin(time*2 + k + ax)*.3;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(ax + Math.cos(a+wv)*ar*1.15, ay + Math.sin(a+wv)*ar*.72);
          ctx.stroke();
        }
      }
    }
    for (let i=0;i<12;i++){                             // shells and limpets
      const sx = r()*W, sy2 = yy[0] + r()*SEG, k = r();
      if (sy2 < -20 || sy2 > H + 20){ r();r(); continue; }
      const sr = lerp(7, 17, r()), rot = r()*TAU;
      if (k < .4){
        ctx.fillStyle = "#e6d8c2";
        ctx.save(); ctx.translate(sx, sy2); ctx.rotate(rot);
        ctx.beginPath(); ctx.moveTo(0,0);
        for (let a=0;a<=7;a++) ctx.lineTo(Math.cos(-2.4 + a*.34)*sr, Math.sin(-2.4 + a*.34)*sr);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "rgba(170,150,122,.7)"; ctx.lineWidth = 1;
        for (let a=0;a<6;a++){
          ctx.beginPath(); ctx.moveTo(0,0);
          ctx.lineTo(Math.cos(-2.3 + a*.4)*sr, Math.sin(-2.3 + a*.4)*sr); ctx.stroke();
        }
        ctx.restore();
      } else if (k < .72){
        ctx.fillStyle = "#b8a284";
        ctx.beginPath(); ctx.ellipse(sx, sy2, sr*.8, sr*.55, rot, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = "#d4713f";                      // starfish
        ctx.save(); ctx.translate(sx, sy2); ctx.rotate(rot);
        ctx.beginPath();
        for (let a=0;a<5;a++){
          const t1 = a/5*TAU, t2 = (a+.5)/5*TAU;
          ctx.lineTo(Math.cos(t1)*sr*1.5, Math.sin(t1)*sr*1.0);
          ctx.lineTo(Math.cos(t2)*sr*.56, Math.sin(t2)*sr*.38);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  });
}
function blowBubbles(px, py){
  for (let i=0;i<10;i++) bubbles.push({
    x: px + (Math.random()*2-1)*16, wy: py + scrollY + i*Math.random()*10,
    r: lerp(5, 17, Math.random()), t: -i*.09,
    life: lerp(2.2, 4.4, Math.random()), ph: Math.random()*TAU
  });
  rings.push({ x:px, y:py, r:3, max:40, a:.4, col:"196,232,232" });
}
function updateBubbles(dt){
  for (let i=bubbles.length-1;i>=0;i--){
    const b = bubbles[i];
    b.t += dt;
    if (b.t < 0) continue;
    b.wy -= (34 + b.r*2.2)*dt;
    if (b.t > b.life){
      const sy = b.wy - scrollY;
      rings.push({ x:b.x + Math.sin(time*2+b.ph)*10, y:sy, r:b.r*.5, max:b.r*3.4, a:.5, col:"206,240,240" });
      bubbles.splice(i,1);
    }
  }
}
function drawBubbles(){
  for (const b of bubbles){
    if (b.t < 0) continue;
    const sy = b.wy - scrollY;
    if (sy < -40 || sy > H + 40) continue;
    const x = b.x + Math.sin(time*2.2 + b.ph)*11;
    const sq = 1 + Math.sin(time*5 + b.ph)*.09;
    ctx.globalAlpha = clamp((b.life - b.t)/.6, 0, 1)*.8;
    ctx.strokeStyle = "rgba(212,244,244,.9)"; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.ellipse(x, sy, b.r*sq, b.r/sq, 0, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(180,226,230,.16)";
    ctx.beginPath(); ctx.ellipse(x, sy, b.r*sq, b.r/sq, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath(); ctx.arc(x - b.r*.34, sy - b.r*.38, b.r*.20, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function crabCell(sg){
  const key = "cb|" + sg;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(sg, 9137));
  const crabs = [];
  for (let i=0;i<3;i++) crabs.push({
    x: r()*W, wy: sg*SEG + SEG*lerp(.12,.88,r()),
    dir: r()<.5?-1:1, s: lerp(15, 26, r()), ph: r()*TAU,
    freeze: 0, hold: r()*2
  });
  c = { seen: frameId, crabs };
  cells.set(key, c);
  return c;
}
function drawCrabs(dt){
  eachZone(POOL, sg => {
    for (const c of crabCell(sg).crabs){
      const sy = c.wy - scrollY;
      let near = 0;
      for (const p of ptrs.values()){
        const dx = c.x - p.x, dy = sy - p.y;
        if (dx*dx + dy*dy < 26000) near = 1;
      }
      if (near) c.freeze = .9;
      c.freeze = Math.max(0, c.freeze - dt);
      if (c.freeze <= 0){
        c.hold -= dt;
        if (c.hold <= 0){ c.hold = lerp(.6, 2.4, Math.random()); c.dir = Math.random()<.5?-1:1; }
        c.x += c.dir*74*dt;
        if (c.x < -30) c.x = W + 30;
        if (c.x > W + 30) c.x = -30;
      }
      if (sy < -50 || sy > H + 50) continue;
      const s = c.s, step = c.freeze > 0 ? 0 : Math.sin(time*11 + c.ph);
      ctx.save();
      ctx.translate(c.x, sy);
      ctx.globalAlpha = .32; ctx.fillStyle = "#4a4030";
      ctx.beginPath(); ctx.ellipse(0, s*.34, s*.9, s*.22, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#8d2f24"; ctx.lineWidth = s*.11; ctx.lineCap = "round";
      for (const sd of [-1, 1]) for (let k=0;k<3;k++){
        const a = .5 + k*.5, ln = s*(.62 + k*.06);
        const kick = step*sd*(k%2?-1:1)*.18;
        ctx.beginPath();
        ctx.moveTo(sd*s*.45, 0);
        ctx.quadraticCurveTo(sd*(s*.45 + Math.cos(a)*ln*.7), Math.sin(a+kick)*ln*.5,
                             sd*(s*.45 + Math.cos(a)*ln), Math.sin(a+kick)*ln);
        ctx.stroke();
      }
      for (const sd of [-1, 1]){
        ctx.strokeStyle = "#a03a2c"; ctx.lineWidth = s*.14;
        ctx.beginPath();
        ctx.moveTo(sd*s*.4, -s*.1); ctx.lineTo(sd*s*.88, -s*.5);
        ctx.stroke();
        ctx.fillStyle = "#b8402f";
        ctx.save(); ctx.translate(sd*s*.95, -s*.58); ctx.rotate(sd*-.5);
        ctx.beginPath(); ctx.ellipse(0, 0, s*.24, s*.15, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(s*.1, -s*.13, s*.18, s*.08, .4, 0, TAU); ctx.fill();
        ctx.restore();
      }
      const g = ctx.createLinearGradient(0, -s*.4, 0, s*.3);
      g.addColorStop(0, "#c0492f"); g.addColorStop(1, "#7e2a1f");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, 0, s*.56, s*.40, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "#1a0e0a";
      for (const sd of [-1, 1]){
        ctx.beginPath(); ctx.ellipse(sd*s*.2, -s*.3, s*.07, s*.10, 0, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,.7)";
      for (const sd of [-1, 1]){
        ctx.beginPath(); ctx.arc(sd*s*.2 + s*.02, -s*.33, s*.026, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  });
}

/* ────────────────────────── 3. autumn wood ────────────────────────── */
const LEAFC = ["#b4442a","#c96a1e","#d99a2a","#8e3a22","#a8541f","#c98a3a","#7d3520"];
const BLOSSOM = ["#f6dde6","#ffffff","#f2cede","#fdeef2","#efd4de","#ffffff","#f8e2ea"];
const kicked = [], fallLeaves = [];
// A leaf comes off a branch near the lens and drifts away into the field. It is
// the SHRINKING that reads as falling here, not travel down the screen — the
// camera is at grass level, so a leaf on its way down is mostly going away.
// This is the one place depth is faked, and it is legitimate: these leaves are
// between the lens and the field, like the bokeh and the canopy, not in it.
// Anything airborne between the lens and the field uses this. z is 0 at the
// lens and 1 out in the far field.
//
// The thing that makes it read as depth is not the shrinking on its own, it is
// that everything CONVERGES on the same band as it recedes — a vanishing point.
// Spawn all round the frame, close and big and blurred, and let some drift down
// and some drift up into that band while they shrink. A uniform downward sweep
// reads as rain no matter how much you scale it, which is what was wrong before.
const AIR_NEAR = 1.9, AIR_FAR = 0.10;
const airK    = z => lerp(AIR_NEAR, AIR_FAR, z*z*.5 + z*.5);
const airEase = z => z*z*.45 + z*.55;
const AIR_BAND = .40;                   // where the far field sits, as a share of H

function newFallLeaf(z0){
  return {
    x0: lerp(-.3, 1.3, Math.random())*W,
    y0: lerp(-.4, 1.3, Math.pow(Math.random(), 1.35))*H,   // biased above the band
    xE: lerp(.16, .84, Math.random())*W,
    yE: lerp(AIR_BAND - .08, AIR_BAND + .09, Math.random())*H,
    x: 0, y: 0,
    z: z0,
    zv: lerp(.05, .115, Math.random()),           // how fast it recedes
    r: lerp(11, 19, Math.random()),
    rot: Math.random()*TAU, spin: (Math.random()*2-1)*2.4,
    ci: (Math.random()*LEAFC.length)|0, ph: Math.random()*TAU
  };
}
function seedFallLeaves(){
  fallLeaves.length = 0;
  for (let i=0;i<26;i++) fallLeaves.push(newFallLeaf(Math.random()));
}
function leafShape(x, r){
  x.beginPath();
  x.moveTo(-r, 0);
  x.bezierCurveTo(-r*.4, -r*.72, r*.4, -r*.72, r, 0);
  x.bezierCurveTo(r*.4, r*.72, -r*.4, r*.72, -r, 0);
  x.closePath();
  x.fill();
}
const SPRINGC = ["#6a5a2e","#7a6a36","#55602a","#84744a","#4d5824","#6d7a3a","#5c4c26"];
const LEAF_ROW = 190;
function leafCell(ci){
  const key = "lf|" + ci;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(ci, 7723));
  const n = Math.round(152 * W/390);
  const items = [];
  for (let i=0;i<n;i++) items.push({
    x: r()*1.12 - .06, y: r()*LEAF_ROW,
    r: lerp(15, 33, r()), rot: r()*TAU,
    ci: (r()*7)|0, sh: lerp(.55, 1, r()), dk: r() < .34
  });
  const stones = [];
  if (r() < .5) for (let i=0, k=1+(r()*2|0); i<k; i++) stones.push({
    x: r(), y: r()*LEAF_ROW, r: lerp(12, 30, r()),
    rot: r()*TAU, sq: lerp(.5, .78, r()), g: lerp(0, 1, r())
  });
  c = { seen: frameId, items, stones };
  cells.set(key, c);
  return c;
}

function drawAutumnGround(){
  const c0 = Math.floor((scrollY - 240)/LEAF_ROW);
  const c1 = Math.floor((scrollY + H + 240)/LEAF_ROW);
  const spring = seaW[0] > seaW[2];
  const pal = spring ? SPRINGC : LEAFC;
  for (let ci=c0; ci<=c1; ci++){
    const wy = ci*LEAF_ROW;
    const w = zoneAmtAt(wy, WOOD);
    if (w < .03) continue;
    const y0 = wy - scrollY;

    // dark mould underneath, so no ground colour reads through the gaps
    ctx.globalAlpha = w;
    ctx.fillStyle = "#2b1a0e";
    ctx.fillRect(0, y0 - 2, W, LEAF_ROW + 4);
    ctx.globalAlpha = 1;

    for (const st of leafCell(ci).stones){          // the odd stone
      const sy2 = y0 + st.y;
      if (sy2 < -40 || sy2 > H + 40) continue;
      const g0 = 96 + st.g*46;
      ctx.save();
      ctx.globalAlpha = w;
      ctx.translate(st.x*W, sy2);
      ctx.rotate(st.rot);
      ctx.fillStyle = "rgba(16,10,6,.5)";
      ctx.beginPath(); ctx.ellipse(0, st.r*.22, st.r*1.1, st.r*st.sq*.8, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgb(" + (g0|0) + "," + ((g0*.96)|0) + "," + ((g0*.88)|0) + ")";
      ctx.beginPath(); ctx.ellipse(0, 0, st.r, st.r*st.sq, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.16)";
      ctx.beginPath(); ctx.ellipse(-st.r*.22, -st.r*st.sq*.3, st.r*.52, st.r*st.sq*.34, -.3, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(20,14,8,.28)";
      ctx.beginPath(); ctx.ellipse(st.r*.18, st.r*st.sq*.36, st.r*.6, st.r*st.sq*.28, -.2, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    for (const q of leafCell(ci).items){
      const ly = y0 + q.y;
      if (ly < -34 || ly > H + 34) continue;
      ctx.save();
      ctx.translate(q.x*W, ly);
      ctx.rotate(q.rot);
      ctx.scale(1, q.sh);
      ctx.globalAlpha = w * (q.dk ? .74 : 1);
      ctx.fillStyle = q.dk ? "#3c2211" : pal[q.ci % pal.length];
      leafShape(ctx, q.r);
      if (!q.dk){
        ctx.strokeStyle = "rgba(56,26,10,.34)";
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(-q.r*.88, 0); ctx.lineTo(q.r*.88, 0); ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  // acorns and conkers on top
  eachZone(WOOD, sg => {
    const r = rng(hash2(sg, 2287));
    for (let i=0;i<14;i++){
      const ax = r()*W, ay = sg*SEG + r()*SEG - scrollY, s = lerp(9, 15, r()), k = r();
      if (ay < -20 || ay > H + 20) continue;
      if (k < .5){
        ctx.fillStyle = "#c08a44";
        ctx.beginPath(); ctx.ellipse(ax, ay, s*.5, s*.66, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = "#6b4520";
        ctx.beginPath(); ctx.ellipse(ax, ay - s*.5, s*.56, s*.30, 0, 0, TAU); ctx.fill();
        ctx.fillRect(ax - s*.06, ay - s*.98, s*.12, s*.24);
      } else {
        ctx.fillStyle = "#8bab48";
        ctx.beginPath(); ctx.arc(ax, ay, s*.86, 0, TAU); ctx.fill();
        ctx.fillStyle = "#5a2f14";
        ctx.beginPath(); ctx.arc(ax + s*.12, ay, s*.5, 0, TAU); ctx.fill();
        ctx.fillStyle = "#d8c08a";
        ctx.beginPath(); ctx.ellipse(ax + s*.2, ay + s*.14, s*.2, s*.15, 0, 0, TAU); ctx.fill();
      }
    }
  });
}

// They flip up off the leaf litter and drop back onto it. Height is tracked
// separately from world position so they never sail off down the screen —
// `h` lifts them up the frame and puts them nearer the lens, and gravity
// returns them to the exact floor they came from.
function kickLeaves(px, py){
  for (let i=0;i<22;i++){
    const a = Math.random()*TAU;
    const sp = lerp(14, 74, Math.random());
    kicked.push({
      x: px + (Math.random()*2-1)*16,
      wy: py + scrollY + (Math.random()*2-1)*11,
      vx: Math.cos(a)*sp, vwy: Math.sin(a)*sp*.42,
      h: 0, vh: lerp(130, 330, Math.random()),
      r: lerp(10, 22, Math.random()), rot: Math.random()*TAU,
      spin: (Math.random()*2-1)*11, ci: (Math.random()*7)|0, dk: Math.random() < .34,
      t: 0, life: lerp(2.0, 3.8, Math.random()), ph: Math.random()*TAU
    });
  }
  rings.push({ x:px, y:py, r:4, max:74, a:.34, col:"210,150,80" });
}
function updateKicked(dt){
  for (let i=kicked.length-1;i>=0;i--){
    const k = kicked[i];
    k.t += dt;
    k.vh -= 640*dt;                      // straight back down to the litter
    k.h  += k.vh*dt;
    if (k.h <= 0){
      k.h = 0;
      k.vh = Math.abs(k.vh) > 34 ? -k.vh*.30 : 0;   // one small bounce, then rest
      k.spin *= .5;
    }
    const air = k.h > .5 ? 1 : .25;      // it only blows about while airborne
    k.vx  += (gustAt(k.x)*90*air - k.vx*2.4)*dt;
    k.vwy -= k.vwy*2.4*dt;
    k.x += k.vx*dt; k.wy += k.vwy*dt;
    k.rot += k.spin*dt*air;
    k.spin *= 1 - 1.5*dt;
    if (k.t > k.life) kicked.splice(i,1);
  }
}
function drawKicked(){
  const pal = seaW[0] > seaW[2] ? SPRINGC : LEAFC;   // same leaves as the floor
  for (const k of kicked){
    const gy = k.wy - scrollY;
    if (gy < -80 || gy > H + 80) continue;
    const sy = gy - k.h;
    const sc = 1 + k.h/340;                          // up is also nearer the lens
    if (k.h > 2){                                    // its shadow stays on the floor
      ctx.globalAlpha = clamp((k.life - k.t)/.7, 0, 1) * clamp(.32 - k.h/900, 0, .32);
      ctx.fillStyle = "#120a04";
      ctx.beginPath(); ctx.ellipse(k.x, gy, k.r*.8, k.r*.3, 0, 0, TAU); ctx.fill();
    }
    ctx.save();
    ctx.globalAlpha = clamp((k.life - k.t)/.7, 0, 1);
    ctx.translate(k.x, sy);
    ctx.rotate(k.rot);
    ctx.scale(sc, sc*(.35 + .65*Math.abs(Math.cos(k.rot*1.7))));
    ctx.fillStyle = k.dk ? "#3c2211" : pal[k.ci % pal.length];
    leafShape(ctx, k.r);
    if (!k.dk){
