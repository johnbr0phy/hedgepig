<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050d08">
<title>the hedgepig adventure</title>
<meta name="description" content="Guide a hedgehog through an endless procedural meadow. Tap to call him.">
<meta property="og:title" content="the hedgepig adventure">
<meta property="og:description" content="Guide a hedgehog through an endless procedural meadow. Tap to call him.">
<style>
  :root{
    --ink:#eaf6e4;
    --shadow:#050d08;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--shadow);overflow:hidden;overscroll-behavior:none}
  body{
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    font-family:"Helvetica Neue",Inter,-apple-system,system-ui,sans-serif;
  }
  canvas#c{
    position:fixed;inset:0;width:100%;height:100%;display:block;
    touch-action:none;
  }
  .hud{
    position:fixed;left:0;right:0;bottom:max(34px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:10px;
    pointer-events:none;z-index:3;
    transition:opacity 1400ms cubic-bezier(.22,.61,.36,1),transform 1400ms cubic-bezier(.22,.61,.36,1);
  }
  .hud.gone{opacity:0;transform:translateY(10px)}
  .mark{
    font-size:12px;font-weight:300;letter-spacing:.52em;text-indent:.52em;
    color:rgba(234,246,228,.9);
    text-shadow:0 1px 18px rgba(0,0,0,.75);
    mix-blend-mode:screen;
  }
  .mark b{font-weight:300;color:#c9e57a}
  .sub{
    font-size:9.5px;font-weight:400;letter-spacing:.24em;text-indent:.24em;
    text-transform:uppercase;
    color:rgba(206,226,198,.42);
    text-shadow:0 1px 12px rgba(0,0,0,.8);
  }
  .meter{
    position:fixed;top:max(20px,env(safe-area-inset-top));left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    pointer-events:none;z-index:4;
  }
  .meter .num{
    font-size:11px;font-weight:300;letter-spacing:.34em;text-indent:.34em;
    color:rgba(228,242,220,.74);text-shadow:0 1px 14px rgba(0,0,0,.85);
    font-variant-numeric:tabular-nums;mix-blend-mode:screen;
  }
  .meter .num em{font-style:normal;opacity:.42}
  .meter .bar{width:54px;height:1px;background:rgba(220,238,210,.15);overflow:hidden}
  .meter .bar i{display:block;height:100%;width:0;background:rgba(214,236,150,.7)}
  .hearts{display:flex;gap:7px;align-items:center;height:13px}
  .hearts s{
    display:block;width:11px;height:11px;text-decoration:none;
    background:#e8748c;opacity:1;
    transition:opacity 420ms ease,transform 420ms cubic-bezier(.34,1.56,.64,1);
    clip-path:path("M5.5 10.4 1.2 6.1a2.9 2.9 0 0 1 4.3-3.9 2.9 2.9 0 0 1 4.3 3.9z");
    filter:drop-shadow(0 1px 5px rgba(0,0,0,.75));
  }
  .hearts s.spent{opacity:.16;transform:scale(.72);background:#cfe2c6}
  .banner{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    pointer-events:none;z-index:6;text-align:center;
    opacity:0;transition:opacity 700ms ease;
  }
  .banner.on{opacity:1}
  .banner .big{
    font-size:15px;font-weight:300;letter-spacing:.42em;text-indent:.42em;
    text-transform:uppercase;color:rgba(238,248,214,.95);
    text-shadow:0 1px 22px rgba(0,0,0,.9);
  }
  .banner .small{
    font-size:9.5px;font-weight:400;letter-spacing:.28em;text-indent:.28em;
    text-transform:uppercase;color:rgba(206,226,198,.55);
    text-shadow:0 1px 14px rgba(0,0,0,.9);
  }
  .toast{
    position:fixed;left:0;right:0;top:calc(max(20px,env(safe-area-inset-top)) + 48px);
    text-align:center;pointer-events:none;z-index:4;
    font-size:9.5px;font-weight:400;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
    color:rgba(226,242,182,.92);text-shadow:0 1px 16px rgba(0,0,0,.9);
    opacity:0;transform:translateY(-6px);
    transition:opacity 900ms ease,transform 900ms ease;
  }
  .toast.on{opacity:1;transform:none}
  .curtain{
    position:fixed;inset:0;background:#050d08;z-index:9;pointer-events:none;
    transition:opacity 1600ms ease-out;
  }
  .curtain.lift{opacity:0}
  @media (prefers-reduced-motion:reduce){
    .hud{transition:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="meter">
  <div class="hearts" id="hearts"><s></s><s></s><s></s></div>
  <div class="num"><span id="dist">0.0</span><em id="unit">&nbsp;m</em></div>
  <div class="bar"><i id="bar"></i></div>
</div>
<div class="toast" id="toast"></div>
<div class="banner" id="banner">
  <div class="big" id="bannerBig"></div>
  <div class="small" id="bannerSmall"></div>
</div>
<div class="hud" id="hud">
  <div class="mark">the hedgepig<b>·</b>adventure</div>
  <div class="sub">tap ahead to call him &nbsp;·&nbsp; scroll to keep up &nbsp;·&nbsp; find the burrow</div>
</div>
<div class="curtain" id="curtain"></div>
<script>
(() => {
"use strict";

/* ─────────────────────────────  utils  ───────────────────────────── */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a + (b-a)*t;
const mod   = (a,n) => ((a % n) + n) % n;
const hsl   = (h,s,l,a) => "hsla("+h.toFixed(1)+","+clamp(s,0,100).toFixed(1)+"%,"+clamp(l,0,100).toFixed(1)+"%,"+(a===undefined?1:a)+")";

function hash2(a,b){
  let h = (Math.imul(a,374761393) + Math.imul(b,668265263)) | 0;
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return (h ^ (h>>>16)) >>> 0;
}
function rng(seed){
  let t = seed >>> 0;
  return () => {
    t = (t + 0x6D2B79F5) | 0;
    let r = Math.imul(t ^ (t>>>15), 1 | t);
    r ^= r + Math.imul(r ^ (r>>>7), 61 | r);
    return ((r ^ (r>>>14)) >>> 0) / 4294967296;
  };
}

/* ─────────────────────────────  stage  ───────────────────────────── */
const cv   = document.getElementById("c");
const ctx  = cv.getContext("2d", { alpha:false });
const hud  = document.getElementById("hud");
const curtain = document.getElementById("curtain");

// blurred plates (low res -> upscaled = free depth of field)
const FGS = 0.26, CANS = 0.20;
const fgc = document.createElement("canvas");
const fgx = fgc.getContext("2d");
const canc = document.createElement("canvas");
const canx = canc.getContext("2d");
const bl1 = document.createElement("canvas"), bl1x = bl1.getContext("2d");
const bl2 = document.createElement("canvas"), bl2x = bl2.getContext("2d");

const elDist  = document.getElementById("dist");
const elUnit  = document.getElementById("unit");
const elBar   = document.getElementById("bar");
const elToast = document.getElementById("toast");
const elHearts = [...document.getElementById("hearts").children];
const elBanner = document.getElementById("banner");
const elBanBig = document.getElementById("bannerBig");
const elBanSm  = document.getElementById("bannerSmall");

const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

let W = 0, H = 0, DPR = 1;
let scrollY = 0, scrollV = 0, drift = 0;   // the hedgepig drives the camera now
let time = 0, frameId = 0, quality = 1;

/* ────────────────────────────  layers  ───────────────────────────── */
// par  = parallax rate (near planes move faster than the camera)
// gap  = horizontal spacing, drives blade count
// rowH = vertical band height in layer space
const LAYERS = [
  { id:1, par:1.00, gap:13,  rowH:46,  lenMin:44,  lenMax:96,  wr:[.026,.044], touch:.45, detail:0, plate:"main",
    pal:{ h:[118,150], s:[22,34], l:[16,25] }, flower:.006, dew:0 },
  { id:2, par:1.00, gap:21,  rowH:70,  lenMin:92,  lenMax:176, wr:[.021,.037], touch:1.0, detail:1, plate:"main",
    pal:{ h:[92,126],  s:[32,48], l:[24,35] }, flower:.020, dew:.05 },
  { id:3, par:1.00, gap:45,  rowH:150, lenMin:170, lenMax:300, wr:[.019,.033], touch:1.5, detail:2, plate:"main",
    pal:{ h:[74,108],  s:[38,56], l:[31,44] }, flower:.055, dew:.14 },
  { id:4, par:1.62, gap:240, rowH:820, lenMin:420, lenMax:760, wr:[.022,.038], touch:1.1, detail:0, plate:"fg",
    pal:{ h:[128,152], s:[26,42], l:[6,11]  }, flower:0,    dew:0, frame:1 },
];

for (const L of LAYERS) {
  const r = rng(hash2(L.id, 4242));
  L.palette = [];
  for (let i=0;i<12;i++){
    L.palette.push({
      h: lerp(L.pal.h[0], L.pal.h[1], r()),
      s: lerp(L.pal.s[0], L.pal.s[1], r()),
      l: lerp(L.pal.l[0], L.pal.l[1], r()),
    });
  }
}

/* ────────────────────────────  cells  ────────────────────────────── */
const cells = new Map();

function buildCell(L, ci){
  const r = rng(hash2(L.id * 7919 + 17, ci));
  const worldY = ci * L.RH;
  // slow meadow "regions": height and bloom drift as you travel
  const lush  = .5 + .5*Math.sin(worldY*0.00085 + L.id*1.7);
  const bloom = .5 + .5*Math.sin(worldY*0.00042 - L.id*0.9 + 2.1);
  const dom = (r()*SMALL_N)|0;
  const fBoost = segBiome(Math.floor(worldY/SEG)) === BGARD ? 3.6 : 1;
  const blades = [];
  for (let i=0;i<L.perCell;i++){
    const cvIdx = (r()*12)|0;
    const len = lerp(L.LA, L.LB, Math.pow(r(), 1.4)) * lerp(.82, 1.2, lush);
    const b = {
      x: lerp(-40, W+40, r()),
      y: worldY + r()*L.RH,
      len,
      wr: lerp(L.wr[0], L.wr[1], r()) * lerp(1.15,.85,(len-L.LA)/(L.LB-L.LA+1)),
      lean: (r()*2-1) * .28,
      bend: 0, vel: 0, glow: 0,
      stiff: lerp(22, 33, r()),
      damp:  lerp(3.2, 4.6, r()),
      gain:  lerp(.86, 1.16, r()),
      phase: r()*TAU,
      cv: cvIdx,
      pri: r(),
      sun: r() < .22,
      dew: r() < L.dew ? {p: lerp(.42,.78,r()), s: lerp(.7,1.3,r())} : null,
      fl: null,
    };
    if (r() < L.flower * lerp(.35, 2.2, bloom) * fBoost) {
      const big = L.id === 3 && r() < .05;
      b.fl = { t: big ? SMALL_N + ((r()*BIG_N)|0) : (r() < .78 ? dom : (r()*SMALL_N)|0),
               a: r()*TAU, sc: lerp(.82,1.28,r()), pop: 0, cool: 0 };
      b.len *= .92;
    }
    blades.push(b);
  }
  blades.sort((a,b)=>a.y-b.y);
  return { seen:frameId, blades };
}

function getCell(L, ci){
  const key = L.id + "|" + ci;
  let c = cells.get(key);
  if (!c){ c = buildCell(L, ci); cells.set(key, c); }
  c.seen = frameId;
  return c;
}

/* ────────────────────────────  wind  ─────────────────────────────── */
const gusts = [];
let nextGust = 2.4;
const GLUT = new Float32Array(96);   // gust field sampled across the screen

function updateWind(dt){
  nextGust -= dt;
  if (nextGust <= 0 && gusts.length < 3){
    nextGust = lerp(3.4, 9, Math.random());
    const dir = Math.random() < .72 ? 1 : -1;
    gusts.push({
      x: dir>0 ? -320 : W+320,
      vx: dir * lerp(280, 640, Math.random()),
      w: lerp(190, 420, Math.random()),
      a: lerp(.20, .52, Math.random()),
      life: 0, max: lerp(2.6, 5, Math.random()), dir
    });
  }
  for (let i=gusts.length-1;i>=0;i--){
    const g = gusts[i];
    g.x += g.vx*dt; g.life += dt;
    if (g.life > g.max || g.x < -900 || g.x > W+900) gusts.splice(i,1);
  }
  const step = W / (GLUT.length-1);
  for (let i=0;i<GLUT.length;i++){
    const x = i*step;
    let v = 0;
    for (const g of gusts){
      const env = Math.min(1, g.life/.7) * Math.min(1, (g.max-g.life)/1.1);
      const d = x - g.x;
      v += g.a * env * Math.exp(-(d*d)/(2*g.w*g.w)) * g.dir;
    }
    GLUT[i] = v;
  }
}

function gustAt(x){
  const f = clamp(x / W, 0, 1) * (GLUT.length-1);
  const i = f|0, t = f-i;
  return lerp(GLUT[i], GLUT[Math.min(GLUT.length-1,i+1)], t);
}

let breeze = .12;
function windAt(x, y, phase){
  const w1 = Math.sin(x*0.0108 + y*0.0046 - time*1.22 + phase*0.06);
  const w2 = Math.sin(x*0.0049 - y*0.0025 - time*0.76 + 2.1);
  const w3 = Math.sin(x*0.026 + y*0.013 - time*2.5 + phase*0.35);
  return (w1*.56 + w2*.44) * breeze + w3*.010*breeze*4 + gustAt(x);
}

/* ───────────────────────────  pointers  ──────────────────────────── */
const ptrs = new Map();
const taps = [];                    // taps made this frame, however brief
let dragId = null, lastDragY = 0, awake = false;

function wake(){
  if (awake) return;
  awake = true;
  hud.classList.add("gone");
}

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  if (GAME.state === "over"){ startRun(); wake(); return; }   // tap to set out again
  if (!GAME.started) startRun();
  hover = { x:e.clientX, y:e.clientY };
  hoverT = e.pointerType === "mouse" ? 1e9 : 1.4;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY, px:e.clientX, py:e.clientY,
                          vx:0, vy:0, r:118, age:0, sow:0.62 });
  if (dragId === null){ dragId = e.pointerId; lastDragY = e.clientY; scrollV = 0; }
  taps.push({ x:e.clientX, y:e.clientY });
  sow(e.clientX, e.clientY + 6);
  wake();
}, {passive:true});

// He watches your pointer. A mouse hovers and then sits still, so its hold is
// effectively forever; a finger only exists while it is down, so that one
// expires and he goes back to snuffling about.
let hover = null, hoverT = 0;
cv.addEventListener("pointermove", e => {
  hover = { x:e.clientX, y:e.clientY };
  hoverT = e.pointerType === "mouse" ? 1e9 : 1.4;
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (e.pointerId === dragId){
    const dy = e.clientY - lastDragY;
    lastDragY = e.clientY;
    scrollY -= dy;
    scrollV = clamp(lerp(scrollV, -dy*58, .32), -SCROLL_VMAX, SCROLL_VMAX);
  }
}, {passive:true});

function endPtr(e){
  ptrs.delete(e.pointerId);
  if (e.pointerId === dragId) dragId = ptrs.size ? ptrs.keys().next().value : null;
  if (dragId !== null) lastDragY = ptrs.get(dragId).y;
}
cv.addEventListener("pointerup", endPtr, {passive:true});
cv.addEventListener("pointercancel", endPtr, {passive:true});
// A trackpad flick fires ~60 events/sec plus a momentum tail, so the wheel
// needs a ceiling on total velocity, not just on one event's contribution.
// VMAX matches the fastest a drag can throw you: dy 40px/frame * 58 ~ 2320.
const SCROLL_VMAX = 2400;
cv.addEventListener("wheel", e => {
  e.preventDefault();
  // deltaMode 1 is lines (Firefox, some Windows mice), 2 is pages
  const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? H : 1;
  scrollV = clamp(scrollV + clamp(e.deltaY * k, -60, 60) * 3.2,
                  -SCROLL_VMAX, SCROLL_VMAX);
  wake();
}, {passive:false});
document.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
window.addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowDown" || k === "PageDown" || k === " ") scrollV = clamp(scrollV + 1100, -SCROLL_VMAX, SCROLL_VMAX);
  else if (k === "ArrowUp" || k === "PageUp") scrollV = clamp(scrollV - 1100, -SCROLL_VMAX, SCROLL_VMAX);
  else if (k === "Home") { scrollY = 0; scrollV = 0; }
  else return;
  e.preventDefault(); wake();
});

/* ──────────────────────────  particles  ──────────────────────────── */
const motes = [];
const MOTE_MAX = 130;

function seedMotes(){
  motes.length = 0;
  const n = Math.round(clamp(W*H/9000, 26, 64));
  for (let i=0;i<n;i++){
    motes.push({
      x: Math.random()*W, y: Math.random()*H,
      z: lerp(.35,1.5,Math.random()),
      r: lerp(1.1,3.4,Math.random()),
      a: lerp(.16,.62,Math.random()),
      vx: (Math.random()*2-1)*9, vy: -lerp(3,15,Math.random()),
      ph: Math.random()*TAU, life:-1,
      sp: Math.random() < .4 ? SP_MOTEA : SP_MOTEB
    });
  }
}
function puff(x, y, n, force){
  for (let i=0;i<n && motes.length<MOTE_MAX;i++){
    const a = Math.random()*TAU;
    motes.push({
      x: x + Math.cos(a)*18, y: y + Math.sin(a)*18,
      z: lerp(.8,1.5,Math.random()),
      r: lerp(1.2,3.1,Math.random()),
      a: lerp(.5,.95,Math.random()),
      vx: Math.cos(a)*lerp(30,110,Math.random())*force,
      vy: Math.sin(a)*lerp(20,80,Math.random())*force - 26,
      ph: Math.random()*TAU, life: lerp(1.6,3.4,Math.random()),
      sp: SP_MOTEA
    });
  }
}

/* ───────────────────────────  sprites  ───────────────────────────── */
function sprite(size, draw){
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  draw(x, size);
  return c;
}
const glowCache = new Map();
function glow(rgb){
  let c = glowCache.get(rgb);
  if (c) return c;
  c = sprite(128, (x,s) => {
    const g = x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,   "rgba("+rgb+",1)");
    g.addColorStop(.26, "rgba("+rgb+",.44)");
    g.addColorStop(.58, "rgba("+rgb+",.11)");
    g.addColorStop(1,   "rgba("+rgb+",0)");
    x.fillStyle = g; x.fillRect(0,0,s,s);
  });
  glowCache.set(rgb, c);
  return c;
}
const SP_SUN   = glow("222,232,132");
const SP_TOUCH = glow("228,242,176");
const SP_MOTEA = glow("240,248,200");
const SP_MOTEB = glow("202,228,180");
const SP_BLOOM = glow("255,250,226");
const SP_BEE   = glow("250,224,150");
const SP_SHADE = sprite(128, (x,s) => {
  const g = x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,"rgba(2,10,6,.95)");
  g.addColorStop(.55,"rgba(2,10,6,.48)");
  g.addColorStop(1,"rgba(2,10,6,0)");
  x.fillStyle = g; x.fillRect(0,0,s,s);
});
const SP_GRAIN = sprite(128, (x,s) => {
  const img = x.createImageData(s,s);
  for (let i=0;i<img.data.length;i+=4){
    const v = 118 + (Math.random()*74 - 37);
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3]=255;
  }
  x.putImageData(img,0,0);
});
let grainPat = null;

/* ───────────────────  distant grass plate (pre-baked)  ───────────── */
let TILE = null, TW = 0, TH = 1024;

function bakeTile(){
  TW = Math.min(1280, Math.ceil((W + 96)/64)*64);
  const raw = document.createElement("canvas");
  raw.width = TW; raw.height = TH;
  const x = raw.getContext("2d");
  const r = rng(20260728);
  const cols = ["#0d2015","#10281a","#132f1e","#0b1b12","#163523","#0e2417"];
  const n = Math.round(TW*TH/96);
  for (let i=0;i<n;i++){
    const bx = r()*TW, by = r()*TH;
    const len = lerp(9, 30, Math.pow(r(),1.5));
    const w = len*lerp(.05,.09,r());
    const bend = (r()*2-1)*len*.34;
    x.fillStyle = cols[(r()*cols.length)|0];
    for (const dy of (by < 34 ? [0, TH] : by > TH-34 ? [0, -TH] : [0])){
      x.beginPath();
      x.moveTo(bx-w, by+dy);
      x.quadraticCurveTo(bx-w*.4+bend*.5, by+dy-len*.7, bx+bend, by+dy-len);
      x.quadraticCurveTo(bx+w*.4+bend*.5, by+dy-len*.7, bx+w, by+dy);
      x.closePath(); x.fill();
    }
  }
  // soften: downsample then upsample
  const sm = document.createElement("canvas");
  sm.width = Math.max(1, TW*.34|0); sm.height = Math.max(1, TH*.34|0);
  const sx = sm.getContext("2d");
  sx.imageSmoothingQuality = "high";
  sx.drawImage(raw, 0,0, sm.width, sm.height);
  const out = document.createElement("canvas");
  out.width = TW; out.height = TH;
  const ox = out.getContext("2d");
  ox.imageSmoothingQuality = "high";
  ox.drawImage(sm, 0,0, TW, TH);
  ox.globalAlpha = .5;
  ox.drawImage(raw, 0, 0);
  TILE = out;
}

function drawTile(camY, alpha){
  if (!TILE) return;
  const strips = 34, sw = Math.ceil(W/strips) + 2;
  const oy = mod(camY, TH);
  ctx.globalAlpha = alpha;
  for (let i=0;i<strips;i++){
    const dx = i*sw;
    const sway = windAt(dx + sw*.5, camY, 0) * 34;   // same field as the live grass
    const sxp = clamp(dx + 46 + sway, 0, TW - sw);
    for (let y = -oy; y < H; y += TH){
      ctx.drawImage(TILE, sxp, 0, sw, TH, dx, y, sw, TH);
    }
  }
  ctx.globalAlpha = 1;
}

/* ──────────────────────────  gradients  ──────────────────────────── */
// One Path2D per quantised (width, bend) pair. A blade then costs a matrix
// set and a fill instead of rebuilding two beziers every frame.
const bladePaths = new Map();
function bladePath(wr, bend){
  const wb = Math.round(wr*400), bb = Math.round(bend*22);
  const key = wb*128 + bb + 40;
  let pth = bladePaths.get(key);
  if (pth) return pth;
  const w = wb/400, b = bb/22;
  pth = new Path2D();
  pth.moveTo(-w, 0);
  pth.bezierCurveTo(-w*.86 + b*.09, -.44, -w*.30 + b*.57, -.845, b, -1);
  pth.bezierCurveTo( w*.30 + b*.57, -.845,  w*.86 + b*.09, -.44,  w, 0);
  pth.closePath();
  bladePaths.set(key, pth);
  return pth;
}

const gradArr = [];
function bladeGrad(target, L, cvIdx, lightBucket){
  const key = ((((target === "fg" ? 1 : 0)*5 + L.id)*12 + cvIdx)*7 + lightBucket)*36 + gradeB;
  let g = gradArr[key];
  if (g) return g;
  const src = L.palette[cvIdx];
  const dk = (gradeB % 3)/2, sq = ((gradeB/3)|0) % 6, ni = (gradeB/18)|0;
  const sf = sq/6*4, si = sf|0, stt = sf - si;
  const SH = [14, 0, 30, 16], SS = [1.06, 1, .80, .48], SL = [1.05, 1, .95, 1.26];
  const hSh = lerp(SH[si], SH[(si+1)%4], stt);
  const sSh = lerp(SS[si], SS[(si+1)%4], stt);
  const lSh = lerp(SL[si], SL[(si+1)%4], stt);
  let ch = lerp(src.h + hSh, 46, dk*.55);
  let cs = src.s * sSh * lerp(1, .66, dk);
  let cl = src.l * lSh * lerp(1, 1.16, dk);
  if (ni){ ch = lerp(ch, 208, .48); cs *= .46; cl *= .48; }    // moonlit
  const c = { h: ch, s: cs, l: cl };
  const k = (lightBucket - 3) / 3;                 // -1 .. 1
  const lm = 1 + k*0.16;
  const x = target === "fg" ? fgx : ctx;
  g = x.createLinearGradient(0,0,0,-1);            // unit space, follows the CTM
  if (target === "fg"){
    // no visible root: the blade fades up out of darkness
    g.addColorStop(0,    hsl(c.h+10, c.s*.9, c.l*lm*0.40, 0));
    g.addColorStop(0.09, hsl(c.h+9,  c.s*.9, c.l*lm*0.48, .18));
    g.addColorStop(0.20, hsl(c.h+8,  c.s*.9, c.l*lm*0.62, .62));
    g.addColorStop(0.34, hsl(c.h+4,  c.s,    c.l*lm*0.80, 1));
    g.addColorStop(0.62, hsl(c.h,    c.s,    c.l*lm*1.02));
    g.addColorStop(1,    hsl(c.h-16, c.s,    Math.min(60, c.l*lm*1.55)));
    gradArr[key] = g;
    return g;
  }
  if (L.id === 3){
    g.addColorStop(0,    hsl(c.h+12, c.s*.9, c.l*lm*0.40, .22));
    g.addColorStop(0.07, hsl(c.h+10, c.s*.9, c.l*lm*0.48, .72));
    g.addColorStop(0.16, hsl(c.h+6,  c.s,    c.l*lm*0.64, 1));
  } else {
    g.addColorStop(0,    hsl(c.h+10, c.s*.9, c.l*lm*0.46));
  }
  g.addColorStop(0.22, hsl(c.h+4,  c.s,     c.l*lm*0.72));
  g.addColorStop(0.58, hsl(c.h,    c.s*1.04,c.l*lm*1.02));
  g.addColorStop(0.86, hsl(c.h-14, c.s*1.1, Math.min(72, c.l*lm*1.42)));
  g.addColorStop(1,    hsl(c.h-26, c.s*.92, Math.min(84, c.l*lm*1.86)));
  gradArr[key] = g;
  return g;
}

// st: 0 radiating petals · 1 umbel · 2 pom · 3 bell · 4 seed head · 5 spiky ray
const FLOWERS = [
  { st:0, n:7,  r:.052, pw:.58, ph:.25, p:"255,253,246", c:"246,196,86"  }, // oxeye daisy
  { st:0, n:5,  r:.044, pw:.62, ph:.40, p:"252,226,116", c:"254,248,206" }, // buttercup
  { st:0, n:4,  r:.062, pw:.74, ph:.52, p:"233,104,86",  c:"40,26,22"    }, // field poppy
  { st:5, n:9,  r:.058, pw:0,   ph:0,   p:"116,146,232", c:"190,208,250" }, // cornflower
  { st:2, n:14, r:.042, pw:0,   ph:0,   p:"206,182,240", c:"238,230,252" }, // red clover
  { st:1, n:11, r:.050, pw:0,   ph:0,   p:"252,250,240", c:"236,232,206" }, // yarrow
  { st:3, n:0,  r:.050, pw:0,   ph:0,   p:"170,158,236", c:"222,216,250" }, // harebell
  { st:4, n:0,  r:.042, pw:0,   ph:0,   p:"232,222,190", c:"244,238,214" }, // seed head
  { st:0, n:5,  r:.042, pw:.60, ph:.32, p:"228,124,168", c:"250,222,236" }, // ragged robin
  { st:2, n:10, r:.046, pw:0,   ph:0,   p:"158,196,226", c:"228,242,250" }, // scabious
  // rare, much larger
  { st:0, n:12, r:.098, pw:.80, ph:.23, p:"254,252,244", c:"238,180,72"  }, // marguerite
  { st:5, n:15, r:.090, pw:0,   ph:0,   p:"206,88,160",  c:"240,172,212" }, // thistle
];
const SMALL_N = 10, BIG_N = FLOWERS.length - SMALL_N;
for (const f of FLOWERS) f.sp = glow(f.p);

/* ───────────────────────────  blades  ────────────────────────────── */
function drawLayer(x, L, dt){
  const camY = scrollY * L.par;
  const top = -L.LB*1.3 - 40;
  const c0 = Math.floor((camY + top) / L.RH);
  const c1 = Math.floor((camY + H + 60) / L.RH);
  const detail = L.detail;

  for (let ci=c0; ci<=c1; ci++){
    const wy = ci * L.RH / L.par;
    const dens = terAt(wy, "dens") * (1 - hardAt(wy)) * seaMix(wy, SEA_DEN);
    if (dens < .015) continue;
    const lenK = terAt(wy, "len") * seaMix(wy, SEA_LEN);
    const cell = getCell(L, ci);
    const arr = cell.blades;
    for (let i=0;i<arr.length;i++){
      const b = arr[i];
      if (b.pri > quality * dens) continue;
      const sy = b.y - camY;
      if (sy < -20 || sy - b.len > H + 20){ b.vel *= .9; continue; }
      simulate(b, L, sy, dt);
      paint(x, b, L, sy, detail, lenK);
    }
  }
  const base = L.plate === "fg" ? FGS : DPR;
  x.setTransform(base, 0, 0, base, 0, 0);
}

function simulate(b, L, sy, dt){
  const target = b.lean + windAt(b.x, b.y, b.phase) * b.gain;
  let acc = (target - b.bend) * b.stiff;

  if (ptrs.size){
    const mx = b.x + b.bend * b.len * 0.55;
    const my = sy - b.len * 0.55;
    for (const p of ptrs.values()){
      const r = p.r * (0.55 + L.touch*0.62);
      const dx = mx - p.x, dy = my - p.y;
      const d2 = dx*dx + dy*dy;
      if (d2 > r*r) continue;
      const d = Math.sqrt(d2) + .001;
      const f = 1 - d/r, ff = f*f;
      acc += (dx/d) * ff * 46 * L.touch;
      acc += p.vx * ff * 0.19 * L.touch;
      acc -= (dy/d) * ff * 6 * L.touch * Math.sign(b.bend || 1);
      b.glow = Math.min(1, b.glow + ff * dt * 5.5);
    }
  }

  if (b.fl){
    b.fl.cool -= dt;
    b.fl.pop *= Math.exp(-3.1 * dt);
    if (ptrs.size && b.fl.cool <= 0){
      const fx = b.x + b.bend*b.len, fy = sy - b.len;
      for (const p of ptrs.values()){
        const dx = fx - p.x, dy = fy - p.y;
        if (dx*dx + dy*dy < 2600){
          b.fl.cool = 2.0; b.fl.pop = 1;
          b.vel += (Math.random()*2-1) * 1.4;
          burst(fx, fy, FLOWERS[b.fl.t]);
          break;
        }
      }
    }
  }

  if (fields.length){
    const mx = b.x + b.bend * b.len * 0.55;
    const my = sy - b.len * 0.55;
    for (const f of fields){
      const dx = mx - f.x, dy = my - f.y;
      const d2 = dx*dx + dy*dy;
      if (d2 > f.r*f.r) continue;
      const d = Math.sqrt(d2) + .001, t = 1 - d/f.r, ff = t*t;
      acc += (dx/d) * ff * 40 * f.s * L.touch;
      b.glow = Math.min(1, b.glow + ff * dt * 4);
    }
  }

  b.vel += acc * dt;
  b.vel *= Math.exp(-b.damp * dt);
  b.bend += b.vel * dt;
  if (b.bend >  1.15){ b.bend =  1.15; b.vel *= .35; }
  if (b.bend < -1.15){ b.bend = -1.15; b.vel *= .35; }
  b.glow *= Math.exp(-2.4 * dt);
}

function paint(x, b, L, sy, detail, lenK){
  const len = b.len * lenK, w = b.wr, bend = b.bend;
  let fade = 1;
  if (L.frame){
    // a framing blade is only allowed on screen while its base is below the frame
    fade = clamp((sy - H*0.58) / (H*0.42), 0, 1);
    if (fade < 0.02) return;
  }
  const base = L.plate === "fg" ? FGS : DPR, sc = base*len;
  x.setTransform(sc, 0, 0, sc, base*b.x, base*sy);
  if (fade < 1) x.globalAlpha = fade;

  const lb = clamp(Math.round((bend + 1.15) / 2.3 * 6), 0, 6);
  x.fillStyle = bladeGrad(L.plate, L, b.cv, lb);
  x.fill(bladePath(w, bend));

  if (detail){
    // wet specular along the windward edge
    const c = L.palette[b.cv];
    x.globalAlpha = .16 + b.glow*.34;
    x.strokeStyle = hsl(c.h-30, 60, 82);
    x.lineWidth = .013;
    x.lineCap = "round";
    x.beginPath();
    x.moveTo(-w*.46, -.05);
    x.quadraticCurveTo(-w*.16 + bend*.5, -.58, bend*.965, -.965);
    x.stroke();

    if (detail > 1){
      // midrib, only where the blade is wide enough to read it
      x.globalAlpha = .13;
      x.strokeStyle = hsl(c.h+8, c.s, c.l*.42);
      x.lineWidth = .009;
      x.beginPath();
      x.moveTo(0, -.03);
      x.quadraticCurveTo(bend*.5, -.6, bend*.96, -.95);
      x.stroke();
    }
    x.globalAlpha = 1;

    if (b.sun && detail > 1){
      x.globalCompositeOperation = "lighter";
      x.globalAlpha = .10 + b.glow*.2;
      x.fillStyle = "rgba(226,244,150,1)";
      x.beginPath();
      x.moveTo(bend*.55 - w*.30, -.62);
      x.quadraticCurveTo(bend*.8, -.86, bend, -1);
      x.quadraticCurveTo(bend*.8 + w*.26, -.85, bend*.55 + w*.30, -.62);
      x.closePath(); x.fill();
      x.globalCompositeOperation = "source-over";
      x.globalAlpha = 1;
    }

    if (b.dew){
      const p = b.dew.p, dr = .019*b.dew.s;
      const dx = bend*p*p, dy = -p;
      x.globalAlpha = .5;
      x.fillStyle = "rgba(214,244,226,1)";
      x.beginPath(); x.arc(dx + w*.25, dy, dr, 0, TAU); x.fill();
      x.globalAlpha = .9;
      x.fillStyle = "#ffffff";
      x.beginPath(); x.arc(dx + w*.25 - dr*.32, dy - dr*.34, dr*.34, 0, TAU); x.fill();
      x.globalAlpha = 1;
    }
  }

  if (b.fl){
    paintFlower(x, b, bend);
    if (blooms.length < 48) blooms.push({ key: b.x*1000 + b.y, x: b.x + bend*len, y: sy - len });
  }
  x.globalAlpha = 1;
}

function paintFlower(x, b, bend){
  const f = FLOWERS[b.fl.t];
  const r = f.r * b.fl.sc * (1 + b.fl.pop*0.42);
  drawHead(x, f, bend, -1 - r*.32, r, b.fl.a,
           b.fl.pop, Math.sin(time*1.6 + b.phase)*.07 + bend*.22);
}

function drawHead(x, f, cx, cy, r, ang, pop, sw){
  const P = "rgba(" + f.p + ",", C = "rgba(" + f.c + ",";

  // bloom halo, brightest the instant it is touched
  x.globalCompositeOperation = "lighter";
  x.globalAlpha = .17 + pop*.6;
  const hr = r * (3.6 + pop*5);
  x.drawImage(f.sp, cx-hr, cy-hr, hr*2, hr*2);
  x.globalCompositeOperation = "source-over";
  x.globalAlpha = 1;

  switch (f.st){
    case 0: {                                   // radiating petals
      const spread = 1 + pop*.45;
      x.fillStyle = P + ".94)";
      for (let i=0;i<f.n;i++){
        const a = ang + sw + i/f.n*TAU;
        x.beginPath();
        x.ellipse(cx + Math.cos(a)*r*.62*spread, cy + Math.sin(a)*r*.62*spread,
                  r*f.pw, r*f.ph, a, 0, TAU);
        x.fill();
      }
      x.fillStyle = C + "1)";
      x.beginPath(); x.arc(cx, cy, r*.30, 0, TAU); x.fill();
      break;
    }
    case 5: {                                   // spiky rays
      x.strokeStyle = P + ".92)";
      x.lineWidth = r*.15; x.lineCap = "round";
      for (let i=0;i<f.n;i++){
        const a = ang + sw + i/f.n*TAU;
        const L2 = r*(.78 + .34*Math.sin(i*2.3)) * (1 + pop*.4);
        x.beginPath();
        x.moveTo(cx + Math.cos(a)*r*.22, cy + Math.sin(a)*r*.22);
        x.lineTo(cx + Math.cos(a)*L2,    cy + Math.sin(a)*L2);
        x.stroke();
      }
      x.fillStyle = C + ".92)";
      x.beginPath(); x.arc(cx, cy, r*.24, 0, TAU); x.fill();
      break;
    }
    case 2: {                                   // dense pom
      x.fillStyle = P + ".9)";
      for (let i=0;i<f.n;i++){
        const a = ang + i*2.399, rr = r*.60*Math.sqrt((i+.4)/f.n)*(1+pop*.3);
        x.beginPath();
        x.arc(cx + Math.cos(a)*rr, cy + Math.sin(a)*rr - r*.08, r*.23, 0, TAU);
        x.fill();
      }
      x.fillStyle = C + ".85)";
      x.beginPath(); x.arc(cx, cy - r*.08, r*.19, 0, TAU); x.fill();
      break;
    }
    case 1: {                                   // flat umbel
      x.fillStyle = P + ".88)";
      for (let i=0;i<f.n;i++){
        const a = ang + i*2.399, rr = r*.72*Math.sqrt((i+.4)/f.n)*(1+pop*.3);
        x.beginPath();
        x.arc(cx + Math.cos(a)*rr, cy + Math.sin(a)*rr*.52, r*.155, 0, TAU);
        x.fill();
      }
      break;
    }
    case 3: {                                   // nodding bell
      const t = sw*.7;
      x.fillStyle = P + ".93)";
      x.beginPath();
      x.moveTo(cx - r*.03 + t*r, cy - r*.52);
      x.bezierCurveTo(cx - r*.88 + t*r*.4, cy - r*.08, cx - r*.68, cy + r*.70, cx, cy + r*.74);
      x.bezierCurveTo(cx + r*.68, cy + r*.70, cx + r*.88 + t*r*.4, cy - r*.08, cx + r*.03 + t*r, cy - r*.52);
      x.closePath(); x.fill();
      x.fillStyle = C + ".8)";
      x.beginPath(); x.ellipse(cx, cy + r*.62, r*.40, r*.15, 0, 0, TAU); x.fill();
      break;
    }
    default: {                                  // seed head
      x.fillStyle = P + ".9)";
      x.beginPath();
      x.ellipse(cx, cy, r*.44, r*1.05*(1+pop*.2), sw, 0, TAU);
      x.fill();
      x.fillStyle = C + ".55)";
      x.beginPath(); x.ellipse(cx - r*.12, cy - r*.2, r*.14, r*.5, sw, 0, TAU); x.fill();
    }
  }
}

/* ───────────────────  bloom bursts, rings, bees  ─────────────────── */
let blooms = [];
const rings = [];

function burst(x, y, f, k){
  k = k === undefined ? 1 : k;
  rings.push({ x, y, r: 5, max: 72*k, a: .9*k, col: f.p });
  for (let i=0;i<12*k && motes.length<MOTE_MAX;i++){
    const a = Math.random()*TAU, sp = lerp(34, 132, Math.random());
    motes.push({
      x, y, z: 1.3,
      r: lerp(1.0, 2.6, Math.random()),
      a: lerp(.6, 1, Math.random()),
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 26,
      ph: Math.random()*TAU,
      life: lerp(1.5, 3.2, Math.random()),
      sp: glow(i % 3 ? f.p : f.c)
    });
  }
}

function drawRings(dt){
  if (!rings.length) return;
  ctx.globalCompositeOperation = "lighter";
  for (let i=rings.length-1;i>=0;i--){
    const g = rings[i];
    g.r += (g.max - g.r) * (1 - Math.exp(-3.6*dt));
    g.a *= Math.exp(-2.3*dt);
    if (g.a < .02){ rings.splice(i,1); continue; }
    ctx.globalAlpha = g.a * .45;
    ctx.strokeStyle = "rgba(" + g.col + ",1)";
    ctx.lineWidth = Math.max(.7, 3.6 * (1 - g.r/g.max));
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}

const bees = [];
let nextBee = 5;

function beeTarget(b){
  if (b.leaving){
    b.tx = b.dir > 0 ? W + 180 : -180;
    b.ty = lerp(H*.08, H*.5, Math.random());
    b.hold = 6;
    return;
  }
  if (blooms.length && Math.random() < .8){
    const f = blooms[(Math.random()*blooms.length)|0];
    b.tx = f.x + (Math.random()*2-1)*16;
    b.ty = f.y - 10 - Math.random()*12;
    b.hold = lerp(1.5, 3.6, Math.random());
  } else {
    b.tx = clamp(b.x + (Math.random()*2-1)*280, 24, W-24);
    b.ty = clamp(b.y + (Math.random()*2-1)*190, H*.12, H*.92);
    b.hold = lerp(.8, 1.9, Math.random());
  }
}

function updateBees(dt){
  nextBee -= dt;
  if (wet > .3) for (const b of bees) b.leaving = true;
  if (nextBee <= 0 && bees.length < 2 && wet < .22 && seaW[3] < .35){
    nextBee = lerp(16, 38, Math.random());
    const dir = Math.random() < .5 ? 1 : -1;
    const b = {
      x: dir > 0 ? -60 : W+60, y: lerp(H*.25, H*.8, Math.random()),
      tx:0, ty:0, vx:dir*120, vy:0, ph:Math.random()*TAU,
      sc: lerp(.55, .85, Math.random()), dir,
      life: lerp(18, 34, Math.random()), hold: 0, leaving:false
    };
    bees.push(b); beeTarget(b);
  }
  for (let i=bees.length-1;i>=0;i--){
    const b = bees[i];
    b.life -= dt; b.hold -= dt;
    if (b.life < 0 && !b.leaving){ b.leaving = true; b.hold = 0; }
    if (b.hold <= 0) beeTarget(b);
    const dx = b.tx - b.x, dy = b.ty - b.y;
    const d = Math.hypot(dx, dy) + .001;
    const spd = b.leaving ? 210 : (d < 60 ? 34 : 138);
    const k = 1 - Math.exp(-2.5*dt);
    b.vx = lerp(b.vx, dx/d*spd, k);
    b.vy = lerp(b.vy, dy/d*spd, k);
    b.x += (b.vx + Math.sin(time*6.3 + b.ph)*18) * dt;
    b.y += (b.vy + Math.cos(time*8.1 + b.ph*1.7)*15) * dt;
    b.y -= (scrollY - lastScroll);
    if (b.x < -220 || b.x > W+220 || b.y < -240 || b.y > H+240) bees.splice(i,1);
  }
}

function drawBees(){
  for (const b of bees){
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(clamp(Math.atan2(b.vy, b.vx) * .3, -.5, .5) * (b.vx < 0 ? -1 : 1));
    ctx.scale(b.vx < 0 ? -b.sc : b.sc, b.sc);

    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = .14;
    ctx.drawImage(SP_BEE, -28, -28, 56, 56);
    ctx.globalCompositeOperation = "source-over";

    const flut = Math.sin(time*44 + b.ph);
    ctx.globalAlpha = .32;
    ctx.fillStyle = "rgba(228,242,248,1)";
    ctx.beginPath(); ctx.ellipse(-1.4, -4.4, 7.6, 3.0, -.46 + flut*.22, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-1.4,  4.4, 7.6, 3.0,  .46 - flut*.22, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = "#2b2118";
    ctx.beginPath(); ctx.ellipse(0, 0, 6.7, 4.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#eab63f";
    ctx.beginPath(); ctx.ellipse(0.7, 0, 2.9, 3.6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-3.5, 0, 1.6, 2.9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#191410";
    ctx.beginPath(); ctx.ellipse(4.7, 0, 2.1, 3.0, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ─────────────────  close-focus bokeh + canopy  ──────────────────── */
function bokehSprite(rgb){
  return sprite(128, (x,s) => {
    const g = x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,   "rgba("+rgb+",.50)");
    g.addColorStop(.60, "rgba("+rgb+",.58)");
    g.addColorStop(.86, "rgba("+rgb+",.92)");
    g.addColorStop(.97, "rgba("+rgb+",.22)");
    g.addColorStop(1,   "rgba("+rgb+",0)");
    x.fillStyle = g; x.fillRect(0,0,s,s);
  });
}
const SP_BOK_A = bokehSprite("214,236,164");
const SP_BOK_B = bokehSprite("158,206,178");
const SP_MAGIC = glow("238,226,186");

const bokeh = [];
function seedBokeh(){
  bokeh.length = 0;
  for (let i=0;i<6;i++) bokeh.push({
    x: Math.random()*W, y: Math.random()*H*1.4 - H*.2,
    r: lerp(26, 88, Math.random()), a: lerp(.030,.095,Math.random()),
    z: lerp(1.9, 2.9, Math.random()), dx: (Math.random()*2-1)*5,
    sp: Math.random() < .55 ? SP_BOK_A : SP_BOK_B
  });
}
function updateBokeh(dt){
  const ds = scrollY - lastScroll;
  for (const b of bokeh){
    b.y -= ds * b.z;
    b.x += b.dx*dt + gustAt(b.x)*16*dt;
    if (b.y < -b.r-90) b.y = H + b.r + 60 + Math.random()*90;
    if (b.y > H + b.r + 240) b.y = -b.r - 60 - Math.random()*90;
    if (b.x < -b.r-40) b.x = W + b.r + 40;
    if (b.x > W + b.r + 40) b.x = -b.r - 40;
  }
}
function drawBokeh(){
  ctx.globalCompositeOperation = "lighter";
  for (const b of bokeh){
    ctx.globalAlpha = b.a * (1 - wet*.45);
    ctx.drawImage(b.sp, b.x-b.r, b.y-b.r, b.r*2, b.r*2);
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}

const BR_PAR = 2.55, BR_ROW = 3000;
function branchCell(ci){
  const key = "br|" + ci;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(90210, ci));
  const items = [];
  if (r() < .50) items.push({
    side: r()<.5?-1:1, y0: r()*420 - 120, seed: (r()*1e9)|0,
    len: lerp(.55,1.05,r()), sag: lerp(70, 200, r()), pt: lerp(.34, .78, r())
  });
  c = { seen: frameId, items };
  cells.set(key, c);
  return c;
}
function drawBranch(x, it, sy){
  const r = rng(it.seed);
  const dir = it.side;
  const x0 = dir < 0 ? -70 : W+70;
  const x1 = x0 - dir * W * lerp(.55, 1.05, it.len);
  const mx = (x0+x1)/2, sag = it.sag;
  x.strokeStyle = "#09190f";
  x.lineCap = "round"; x.lineJoin = "round";
  x.lineWidth = lerp(22, 44, r());
  x.beginPath();
  x.moveTo(x0, sy);
  x.quadraticCurveTo(mx, sy+sag, x1, sy+sag*1.55);
  x.stroke();
  const n = 9 + (r()*8|0);
  for (let i=0;i<n;i++){
    const t = lerp(.10, 1, r()), mt = 1-t;
    const bx = mt*mt*x0 + 2*mt*t*mx + t*t*x1;
    const by = mt*mt*sy + 2*mt*t*(sy+sag) + t*t*(sy+sag*1.55);
    const ang = lerp(.15, 1.45, r()) * (r()<.5?-1:1);
    const tl = lerp(44, 160, r());
    const lx = bx - dir*Math.cos(ang)*tl, ly = by + Math.abs(Math.sin(ang))*tl + 34;
    x.lineWidth = lerp(4, 12, r());
    x.beginPath(); x.moveTo(bx, by); x.lineTo(lx, ly); x.stroke();
    const lc = 4 + (r()*6|0);
    for (let j=0;j<lc;j++){
      x.fillStyle = ["#0b1c12","#102616","#0d2014","#132c1a"][(r()*4)|0];
      x.beginPath();
      x.ellipse(lx + (r()*2-1)*50, ly + (r()*2-1)*44,
                lerp(14,36,r()), lerp(9,21,r()), r()*TAU, 0, TAU);
      x.fill();
    }
  }
}
const perches = [];
function perchPoint(it, sy){
  const x0 = it.side < 0 ? -70 : W+70;
  const x1 = x0 - it.side * W * lerp(.55, 1.05, it.len);
  const mx = (x0+x1)/2, t = it.pt, mt = 1-t;
  return {
    x: mt*mt*x0 + 2*mt*t*mx + t*t*x1,
    y: sy + 2*mt*t*it.sag + t*t*it.sag*1.55
  };
}
function collectPerches(){
  perches.length = 0;
  const camY = scrollY * BR_PAR;
  const c0 = Math.floor((camY - 760)/BR_ROW);
  const c1 = Math.floor((camY + H + 760)/BR_ROW);
  for (let ci=c0; ci<=c1; ci++){
    for (const it of branchCell(ci).items){
      const sy = ci*BR_ROW + it.y0 - camY;
      const p = perchPoint(it, sy);
      if (p.x > 26 && p.x < W - 26 && p.y > 50 && p.y < H - 50)
        perches.push({ key: it.seed, x: p.x, y: p.y });
    }
  }
  // a bird will just as happily sit on a bramble or a trunk in the foreground
  for (const q of leafSpots)
    if (q.x > 26 && q.x < W - 26 && q.y > 50 && q.y < H - 50)
      perches.push({ key: q.key, x: q.x, y: q.y });
}

function drawCanopy(){
  const camY = scrollY * BR_PAR;
  const c0 = Math.floor((camY - 760)/BR_ROW);
  const c1 = Math.floor((camY + H + 760)/BR_ROW);
  let any = false;
  canx.setTransform(CANS,0,0,CANS,0,0);
  canx.clearRect(0,0,W,H);
  for (let ci=c0; ci<=c1; ci++){
    for (const it of branchCell(ci).items){
      const sy = ci*BR_ROW + it.y0 - camY;
      if (sy < -700 || sy > H+700) continue;
      any = true; drawBranch(canx, it, sy);
    }
  }
  if (any){ ctx.globalAlpha = .95; ctx.drawImage(canc, 0,0,W,H); ctx.globalAlpha = 1; }
}

/* ─────────────────────────────  weather  ─────────────────────────── */
let wet = 0, wetTarget = 0, weatherT = 42;
const rain = [];
function seedRain(){
  rain.length = 0;
  const n = Math.round(clamp(W*H/3600, 90, 300));
  for (let i=0;i<n;i++) rain.push({
    x: Math.random()*(W+240)-120, y: Math.random()*H, z: lerp(.4,1.6,Math.random())
  });
}
function updateWeather(dt){
  weatherT -= dt;
  if (weatherT <= 0){
    if (wetTarget > .05){ wetTarget = 0; weatherT = lerp(140, 300, Math.random()); }
    else { wetTarget = lerp(.5, 1, Math.random()); weatherT = lerp(38, 80, Math.random()); }
  }
  wet = lerp(wet, wetTarget, 1 - Math.exp(-0.22*dt));
  if (wetTarget < .01 && wet < .004) wet = 0;
  if (wet < .02) return;
  const n = Math.floor(rain.length*wet);
  for (let i=0;i<n;i++){
    const d = rain[i];
    d.y += (900*d.z + 320)*dt;
    d.x += (120*(gustAt(d.x) + breeze*1.6) + 46)*d.z*dt;
    if (d.y > H+40){ d.y = -40 - Math.random()*90; d.x = Math.random()*(W+240)-120; }
    if (d.x >  W+120) d.x -= W+240;
    if (d.x < -120)   d.x += W+240;
  }
}
function drawRain(){
  if (wet < .02) return;
  const n = Math.floor(rain.length*wet);
  ctx.lineCap = "round";
  for (let i=0;i<n;i++){
    const d = rain[i];
    const len = (900*d.z + 320)*0.017;
    const dx  = (120*(gustAt(d.x) + breeze*1.6) + 46)*d.z*0.017;
    ctx.globalAlpha = (.09 + .21*d.z) * wet;
    ctx.strokeStyle = d.z > 1.15 ? "rgba(212,234,242,1)" : "rgba(160,194,208,1)";
    ctx.lineWidth = .7 + d.z*.9;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - dx*3, d.y - len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ────────────────────────  sown flowers  ─────────────────────────── */
const sprouts = [];
const SPROUT_MAX = 60;

function easeBack(t, c1){
  if (t >= 1) return 1;
  if (t <= 0) return 0;
  c1 = c1 === undefined ? 1.70158 : c1;
  const c3 = c1 + 1, p = t - 1;
  return 1 + c3*p*p*p + c1*p*p;
}
const easeOut = t => 1 - Math.pow(1 - clamp(t,0,1), 3);

// which species is in season depends on how far you have walked
function speciesHere(){
  if (Math.random() < .05) return SMALL_N + ((Math.random()*BIG_N)|0);
  const band = Math.floor(mod(scrollY*0.00008, 1) * SMALL_N);
  return Math.random() < .74 ? band % SMALL_N : (Math.random()*SMALL_N)|0;
}

function plant(px, py, fi){
  let live = 0;
  for (const q of sprouts) if (!q.dying) live++;
  if (live >= SPROUT_MAX){
    for (const q of sprouts) if (!q.dying){ q.dying = 1; break; }
  }
  const idx = fi === undefined ? speciesHere() : fi;
  const f = FLOWERS[idx], big = idx >= SMALL_N;
  sprouts.push({
    x: px, y: py, wy: py + scrollY, f, t: 0, fade: 1, dying: 0,
    h: lerp(62, 132, Math.random()) * (big ? 1.4 : 1),
    r: lerp(9.5, 15, Math.random()) * (big ? 1.85 : 1),
    a: Math.random()*TAU,
    lean: (Math.random()*2-1)*.26,
    ph: Math.random()*TAU
  });
  burst(px, py - 8, f, .55);
}

// on open water a touch makes a splash, not a flower
function sow(px, py){
  const wy = py + scrollY;
  dropCrumb(px, py);       // whatever gets sown, it also says "come this way"
  const z = segBiome(Math.floor(wy/SEG));
  if (z === MGARD){ plantMush(px, py);     return; }
  if (z === WOOD) { kickLeaves(px, py);    return; }
  if (z === HENS) { layEgg(px, py);        return; }
  if (winterAt(wy) > .52){ buildSnowman(px, py);   return; }   // deep winter
  if (nightAt(wy)  > .50){ releaseFireflies(px, py); return; } // after dark
  if (roadAt(wy) > .55){
    for (let i=0;i<7 && motes.length<MOTE_MAX;i++){
      const a = Math.random()*TAU;
      motes.push({ x:px, y:py, z:1.1, r:lerp(1,2.6,Math.random()), a:.5,
        vx:Math.cos(a)*lerp(20,70,Math.random()), vy:-lerp(10,40,Math.random()),
        ph:Math.random()*TAU, life:lerp(.6,1.4,Math.random()), sp:SP_MOTEB });
    }
    return;
  }
  if (lakeAt(py + scrollY) > .55){
    plantPad(px, py);
    for (let i=0;i<8 && motes.length<MOTE_MAX;i++){
      const a = Math.random()*TAU;
      motes.push({ x:px, y:py, z:1.2, r:lerp(.9,2.2,Math.random()), a:.85,
        vx:Math.cos(a)*lerp(30,110,Math.random()), vy:-lerp(30,90,Math.random()),
        ph:Math.random()*TAU, life:lerp(.7,1.5,Math.random()), sp:SP_MOTEB });
    }
    return;
  }
  plant(px, py);
}

function updateSprouts(dt){
  for (let i=sprouts.length-1;i>=0;i--){
    const q = sprouts[i];
    q.t += dt;
    q.y = q.wy - scrollY;
    if (q.dying) q.fade -= dt*1.4;
    if (q.fade <= 0) sprouts.splice(i,1);
  }
}

function drawSprouts(){
  for (const q of sprouts){
    if (q.y < -120 || q.y > H + 140) continue;

    const shoot = easeBack(q.t/1.15, 1.0);          // stem pushes up
    const leaf  = easeOut((q.t - .26)/0.55);        // leaves unfurl
    const bud   = easeOut((q.t - .34)/0.60);        // bud swells at the tip
    const open  = clamp((q.t - .82)/0.90, 0, 1);    // petals open
    const openE = easeBack(open, 1.55);

    const wind = windAt(q.x, q.y, q.ph) * 15;
    const h = q.h * shoot;
    const tx = q.x + q.lean*h*.5 + wind;
    const ty = q.y - h;

    ctx.save();
    ctx.globalAlpha = q.fade;

    ctx.strokeStyle = "rgba(124,168,94,.92)";
    ctx.lineWidth = .8 + 1.4*shoot;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(q.x, q.y);
    ctx.quadraticCurveTo(q.x + q.lean*h*.18 + wind*.3, q.y - h*.55, tx, ty);
    ctx.stroke();

    if (leaf > .01){
      ctx.fillStyle = "rgba(110,154,84,.85)";
      const lx = q.x + q.lean*h*.1 + wind*.16, ly = q.y - h*.44;
      for (let i=0;i<2;i++){
        const sd = i ? 1 : -1;
        ctx.beginPath();
        ctx.ellipse(lx + sd*6.5*leaf, ly, 8*leaf, 2.9*leaf, sd*.5, 0, TAU);
        ctx.fill();
      }
    }

    const hr = q.r * (0.30*bud + 0.70*openE);
    if (hr > .3){
      ctx.translate(tx, ty);
      if (open < .96){                              // green calyx while still a bud
        ctx.fillStyle = "rgba(98,140,76," + (.9*(1-open)).toFixed(3) + ")";
        ctx.beginPath();
        ctx.ellipse(0, hr*.22, hr*.64, hr*.78, 0, 0, TAU);
        ctx.fill();
      }
      drawHead(ctx, q.f, 0, 0, hr, q.a,
               -0.62*(1 - open), wind*.02 + Math.sin(time*1.5 + q.ph)*.08);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ────────────────────  the hedgepig adventure  ────────────────────
   He walks down the field at a constant speed and cannot be stopped or
   turned round. You tap ahead of him to leave something worth walking
   to — a flower, a mushroom, whatever the place and season give you —
   and he steers for the nearest one. Thorns and the road hurt. Reach
   the burrow at the end of the leg and the next leg starts, longer odds.

   Water is deliberately NOT a hazard: lake bands run the full width of
   the field, so a lake would be an unavoidable wall. He takes his boat.
*/
const PX_PER_M = 220;
const LEG_LEN  = 13200;              // 3 segments, 60m on the meter
const LEG_GAP  = 1400;               // quiet ground after a burrow
const NAMES = ["first clearing","the long meadow","bramble line","the far field",
               "hollow country","wild acre","the far burrow"];
let travelled = 0, toastT = 0;

const GAME = {
  state:"walk",                      // walk | hurt | leg | over
  leg:1, hearts:3, stateT:0, invuln:0, flash:0,
  startWy:0, goalWy:LEG_LEN, goalX:0.5, started:false
};

const HOG_SPD0  = 300;               // world px/s — about 1.36 m/s on the meter
const HOG_TURN  = 4.2;               // rad/s — he can turn right round now
const HOG_R     = 24;                // collision radius, before scale
const wrapAng = a => Math.atan2(Math.sin(a), Math.cos(a));

const hog = {
  on:true, x:0, wy:0, hd:0, walk:0, fade:1,   // no `dir`: see updateGame
  curl:0, shiver:0, breathT:0, blink:0, blinkT:2.4,
  dip:0, gait:0, arrive:0, puffT:0, trackT:0, foot:0,
  under:0, underT:0, underX:0, warned:0, sniff:0,
  yaw:0, pitch:0, yawT:0, pitchT:0, lookT:0,       // the head rig, below
  yawV:0, pitchV:0, hlag:0, hlagV:0, lag:0, lagV:0, turn:0, acc:0, spdPrev:0, flick:0, earT:1.2, lookLock:0,
  act:0, actT:0, actLen:1, actP:0, idleT:3
};
const hogK    = () => clamp(H/844, .85, 1.4) * 2.1;
const hogSpd  = () => HOG_SPD0 * (1 + (GAME.leg - 1) * .06);
const hogY    = () => hog.wy - scrollY;

/* ── the head rig ──────────────────────────────────────────────────────
   Ported from hog-lab.html. His features sit on a head sphere rather than
   being painted flat on a profile. `az` runs round the vertical axis: 0
   points straight along his snout, +90° points straight out at the camera.
   Adding the head's yaw to every feature turns the whole face on the front
   of the head — the snout swings round and foreshortens, the far eye comes
   into view, the near one slides across. The body never has to move for him
   to look at something.

   z is the camera-facing component: positive is the near side, negative is
   round the back and hidden.

   Keep this in sync with the lab. Iterate there, port back here.
   ────────────────────────────────────────────────────────────────────── */
// Proportions taken from a real hedgehog: the spine dome is most of the animal
// and hoods forward over a SMALL pale face tucked underneath it. The face is
// cream, the short muzzle is dark, and the ears sit low at the sides of the
// head near eye level — not up on top.
const HEAD = { x:15.5, y:8, rx:9.6, ry:8.6 };

/* Taken off assets/logo/hedgepig-logo-badge.jpg, which is the character.
   Two masses only: a DARK spiny mantle over the back, and ONE cream mass
   that is face, chest and belly together. The cream is not a head — give
   him a pale sphere for a head and he reads as a seal in a wig. */
const C = {
  creamHi: "#f8f2e4",     // lit top of the cream mass
  cream:   "#ecdfc8",
  creamLo: "#d2bc9b",     // where the belly turns under
  mantleHi:"#4b3623",     // the mass under the coat. It is the SHADOW between
  mantleLo:"#221809",     // the quills, so it must be DARKER than they are —
                          // lighter, and every gap in the coat reads as bald.
  quillDk: "#46331f",     // the needles. Mostly dark — the mass reads brown
  quillLt: "#dccdae",     // and only a minority are tipped pale
  muzzle:  "#e7d4b5",     // pale, barely warmer than the face
  nose:    "#241b19",     // the only dark thing on his face
  blush:   "rgba(224,146,134,.30)",
  ear:     "#4a3628",
  limb:    "#bda07c",     // short pale legs, as the underside is pale
  paw:     "#8b6e50",
};

function facePt(az, el, yaw, pitch, rr){
  const A = az + yaw, E = el + pitch, ce = Math.cos(E);
  return {
    x: HEAD.x + HEAD.rx * (rr||1) * ce * Math.cos(A),
    y: HEAD.y - HEAD.ry * (rr||1) * Math.sin(E),
    z: ce * Math.sin(A)
  };
}
// How visible a feature is as it comes round the edge of the head. This MUST
// start at z = 0: anything on the far hemisphere is behind the head, and a ramp
// that reaches into negative z draws it straight through his skull.
const faceVis = z => clamp(z/.26, 0, 1);
/* faceVis is for features on the SIDES of his head — an eye, an ear — which
   come into view as they swing round toward the lens. Features on the FRONT of
   his face (the snout, and the mouth under it) are a different case: side-on
   their normals point straight across the view, depth 0, and they are perfectly
   visible. Gating those on faceVis put his nose at 40% and lost his mouth
   entirely in profile, which is the commonest view there is. They hide only
   once they have turned AWAY. */
const frontVis = z => clamp((z + .55)/.40, 0, 1);

const AZ_EYE = 1.30, EL_EYE = .52;      // well above and behind the muzzle, on the cream
const RR_EYE = .80;
const AZ_EAR = 1.95, EL_EAR = .62;      // top-BACK of the head. Near 90° it projects
                                        // onto the middle of his face beside the eye.
const RR_EAR = 1.50;                    // OUTSIDE the head, and drawn BEFORE it, so the
                                        // sphere buries all but the tip. An ear reads as an
                                        // ear by poking out of the head's outline; sitting
                                        // whole on the cream it is just a second eye.
const SNOUT_R = 1.12;                   // SHORT. Past about 1.25 he reads as an anteater.

/* ═══ the hedgepig in three dimensions ═════════════════════════════════════
   He is geometry now rather than an arrangement of shapes. A body ellipsoid,
   a head sphere, and a coat of quills rooted on the ellipsoid's surface with
   real outward normals — projected orthographically and drawn back to front,
   painter's algorithm.

   Why bother:

   - Every 2D version only worked from one angle. The mantle's front edge had
     to be hand-drawn as a diagonal that is only right in profile; here it is
     a PLANE through his body, and correct from everywhere for nothing.
   - Quills pointing at the lens foreshorten to stubs while the ones on the
     rim stay long spikes. That contrast is what makes a quill coat read at
     all, and it is the one thing a 2D fan of triangles can never do — it can
     only ever draw the rim and then paint "texture" on the middle, which is
     precisely why he kept reading as a smooth loaf with a fringe.
   - Turning is free and continuous. `ctx.scale(dir,1)` and its instant
     mirror flip are gone, which was improvement #1 on the list.
   - Real normals mean real shading, so he has form instead of a gradient.

   Orthographic on purpose: §1 of the handover says the field has no
   perspective falloff, so neither does he.

   Model space: +x along his snout, +y up, +z across him. Canvas y is down,
   so screen y = -y. Ground is y = -20.5.
   ═════════════════════════════════════════════════════════════════════════ */
const BODY = { a:26, b:16.5, c:19.5 };       // semi-axes: fore-aft, up, across
const HD_R = 9.4;                            // head sphere radius. Bigger than
                                             // this and nose-on he is all head.
const HD_C = { x:20.0, y:-1.7, z:0 };        // where the head sits on him
const GROUND = -20.5;

// The mantle boundary is a plane cutting forward-and-down. Quills root
// OUTSIDE it; the cream face-chest-belly is the part inside. This single
// constant replaces the hand-tuned diagonal path of the 2D version.
const MN = { x:.821, y:-.571, z:0 };
const MK0 = .30;                             // 0 = half of him, higher = more coat

// A golden-angle spiral over the sphere: even, deterministic, and it never
// tiles — which §5 of the handover asks of anything procedural.
const QUILLS = (() => {
  const out = [], N = 500, ga = Math.PI*(3 - Math.sqrt(5));
  for (let i=0;i<N;i++){
    const ny = 1 - (i/(N-1))*2, rr = Math.sqrt(Math.max(0, 1 - ny*ny));
    const th = ga*i;
    const n = { x:Math.cos(th)*rr, y:ny, z:Math.sin(th)*rr };
    const jit = (Math.sin(i*12.9898)*.5 + .5);
    out.push({
      n,
      d: n.x*MN.x + n.y*MN.y + n.z*MN.z,     // which side of the mantle plane
      lf: (.78 + jit*.46),                    // length jitter
      // a tone offset per quill. Without it every quill at the same angle to
      // the light is the same flat value, and the coat reads as a field of
      // identical shards rather than as separate needles.
      // Math.round, NOT |0: truncation toward zero maps all of (-1,1) to 0,
      // so 77% of quills got no offset and the coat stayed flat
      tn: Math.round((Math.sin(i*31.7)*.5 + .5)*2.6 - 1.3),
      // thinning priority: the radical inverse of i, which is equidistributed
      // and — unlike anything built on phi — uncorrelated with the golden-angle
      // ordering these are generated in
      pri: (() => { let r = 0, b = 1;
                    for (let k=0;k<10;k++) r += ((i >> k) & 1) * (1/(b *= 2));
                    return r; })(),
      // Do NOT pick these off i: a regular pick over a golden-angle spiral IS
      // phyllotaxis, and it drew a pinecone. Hashed, so they scatter.
      pale: (Math.sin(i*78.233)*.5 + .5) < .62,
      wob: (Math.sin(i*4.1)*.5 + .5) * 6.3     // phase, so the coat is not one mass
    });
  }
  return out;
})();

/* Shading is precomputed into a small table. Building a colour string per
   quill per frame would be ~250 string allocations a frame, and §6 of the
   handover records killing exactly that pattern for a real win. */
const QSHADE = 10;
const QCOL = [[70,51,31], [214,199,168], [124,104,76], [58,42,26]].map(rgb =>
  Array.from({length:QSHADE}, (_, s) => {
    const k = .52 + .48*(s/(QSHADE-1));
    return "rgb(" + Math.round(rgb[0]*k) + "," + Math.round(rgb[1]*k) + "," +
                    Math.round(rgb[2]*k) + ")";
  }));
const L3 = { x:-.30, y:.86, d:.41 };          // light: up, a little front-left

// a point on the head sphere. az 0 is along the snout, +az swings toward the
// lens; el is up. Returns a UNIT direction in model space, so it doubles as
// the outward normal for visibility.
function hRot(v, hy, hp){
  const cp = Math.cos(hp), sp = Math.sin(hp);
  const px = v.x*cp - v.y*sp, py = v.x*sp + v.y*cp;
  const cy = Math.cos(hy), sy = Math.sin(hy);
  return { x: px*cy - v.z*sy, y: py, z: px*sy + v.z*cy };
}

/* The badge has spines over the crown of his head, not just on his back, and
   a bald cream head with one dark ear on it is most of what still read as
   wrong. These root on the HEAD sphere and ride its yaw and pitch. */
const HQUILLS = (() => {
  const out = [], N = 110, ga = Math.PI*(3 - Math.sqrt(5));
  for (let i=0;i<N;i++){
    const ny = 1 - (i/(N-1))*2, rr = Math.sqrt(Math.max(0, 1 - ny*ny));
    const th = ga*i;
    const n = { x:Math.cos(th)*rr, y:ny, z:Math.sin(th)*rr };
    if (n.x*MN.x + n.y*MN.y + n.z*MN.z > -.34) continue;  // crown and nape ONLY:
                                                          // past this it rakes his face
    let dx = n.x - .40, dy = n.y - .06, dz = n.z;         // raked back off the brow
    const dl = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
    const jit = Math.sin(i*12.9898)*.5 + .5;
    out.push({ n, dir:{ x:dx/dl, y:dy/dl, z:dz/dl },
               len: (3.2 + jit*2.2),
               pale: (Math.sin(i*78.233)*.5 + .5) < .30 });
  }
  return out;
})();

function headDir(az, el, hy, hp){
  const ce = Math.cos(el);
  const lx = ce*Math.cos(az), ly = Math.sin(el), lz = ce*Math.sin(az);
  const cp = Math.cos(hp), sp = Math.sin(hp);          // pitch, about across
  const px = lx*cp - ly*sp, py = lx*sp + ly*cp;
  const cy = Math.cos(hy), sy = Math.sin(hy);          // yaw, about up
  return { x: px*cy - lz*sy, y: py, z: px*sy + lz*cy };
}

/* ── the head on its own spring ─────────────────────────────────────────
   The head is not welded to the body. It has mass, so it lags a turn, and
   it overshoots on the way back. That last part is the whole point: an
   exponential lerp cannot overshoot, and the difference between "smoothly
   interpolated" and "alive" is almost entirely the settle.

   Two springs and one trailing mass:
     yaw   — where he is looking, round the vertical axis
     pitch — nose up or down
     hlag  — how far the head sits behind or ahead of where the body has
             got to, in hog-local px along his snout

   The caller sets two inputs before calling, and updateLook consumes both:
     h.turn — radians the BODY rotated this frame
     h.acc  — change in his speed, px/s²
   ────────────────────────────────────────────────────────────────────── */
const HEAD_K = 78, HEAD_D = 11;    // ~1.4Hz, damping ratio .62 — a visible settle
const PITCH_K = 54, PITCH_D = 10;
const LAG_S = .088, LG_K = 90, LG_D = 12;   // turn lag: 22° behind at full turn rate
const HL_K = 120, HL_D = 13, HL_F = .14;

/* ── idle variety ──────────────────────────────────────────────────────
   Standing still he only ever snuffled, which after a few seconds reads as
   a loop. He now breaks it with one of three things, on a slow timer:

     1  a SHAKE — the whole body buzzes and the coat fluffs out, the way a
        hedgehog shakes off wet or dust. Short and sharp.
     2  a SNIFF UP — nose lifted high off the ground, holding, testing the
        air rather than the earth.
     3  a STRETCH — a long slow arch, head down and haunches up.

   `act` is which one, `actT` counts it down, and `actP` is 0..1 through it
   so the drawing can shape it. It only fires while he is standing still, and
   any of it is abandoned the moment he sets off — improvement #9.
   ────────────────────────────────────────────────────────────────────── */
const IDLE_ACTS = 3;
function updateIdle(h, dt){
  if (h.gait > .12 || h.curl > .2){          // moving or hurt: no idling
    h.actT = 0; h.act = 0; h.actP = 0;
    h.idleT = lerp(2.5, 6, Math.random());
    return;
  }
  if (h.actT > 0){
    h.actT -= dt;
    h.actP = clamp(1 - h.actT/h.actLen, 0, 1);
    if (h.actT <= 0){ h.act = 0; h.actP = 0; h.idleT = lerp(3.5, 9, Math.random()); }
    return;
  }
  h.idleT -= dt;
  if (h.idleT <= 0){
    h.act = 1 + ((Math.random()*IDLE_ACTS)|0);
    h.actLen = h.act === 1 ? .55 : h.act === 2 ? 1.7 : 2.1;
    h.actT = h.actLen;
    if (h.act === 1) h.flick = 1;            // a shake rattles his ears too
  }
}

/* ── he watches your pointer ───────────────────────────────────────────
   Given where the pointer is relative to him, in his own units, this is the
   head yaw that puts his snout on it. The snout's screen-x component is
   cos(hy + th) and its depth is sin(hy + th); the pointer is effectively at
   the camera plane, so we want the solution with depth >= 0, and acos
   returns exactly that branch.

   The clamp is his neck. Past about 1.35 rad he cannot follow, and what he
   does instead is strain as far round as he can, which is the right thing
   for him to do anyway.

   It sets only the spring TARGETS, so he still lags, overshoots and settles
   onto you rather than snapping to you.
   ────────────────────────────────────────────────────────────────────── */
function lookAt(h, dx, dy, th){
  const r = Math.hypot(dx, dy);
  if (r < 6) return;                // pointer on top of him: no direction to aim
  h.pitchT = clamp(Math.atan2(-dy, Math.max(7, Math.abs(dx))), -.50, .55);
  /* The projected snout is (cos(pitch)*cos(hy + th), sin(pitch)), so the yaw
     solves cos(hy + th) = (dx/r)/cos(pitch). Dropping the cos(pitch) aimed him
     12° too steep for a pointer up and to the side.

     Then: resolve the answer relative to where his head ALREADY is before
     clamping. acos returns [0, PI], so for any th < 0 — that is, any heading
     past 90° — the top of `want`'s range crosses +PI and wrapAng threw it to
     -PI. Both ends clamp to the same physical strain, but the target jumped
     2.7 rad between adjacent frames, and the spring took his head through it
     at 665°/s while his face was still 94% opaque. The handover records
     measuring and fixing a 17-22° whip on the turn lag; this was 155°. */
  const cp   = Math.max(.35, Math.cos(h.pitchT));
  const want = Math.acos(clamp((dx/r)/cp, -1, 1)) - th;
  h.yawT = clamp(h.yaw + wrapAng(want - h.yaw), -1.35, 1.35);
  h.lookLock = .5;                  // and he stops glancing idly about
}

function updateLook(h, dt){
  h.lookLock = Math.max(0, (h.lookLock || 0) - dt);
  h.lookT -= dt;
  if (h.lookT <= 0 && h.lookLock <= 0){    // not while he is watching you
    h.lookT = lerp(.9, 2.8, Math.random());
    const r = Math.random();
    /* Head yaw is BODY-relative — 0 is straight along his own snout. To look
       at the lens he must turn his head by his own heading, which is why the
       first branch reads h.hd: a hedgehog walking at you is already looking
       at you and need not turn at all. Camera-relative gaze was wrong; it
       counter-rotated his head every time his body turned. */
    h.yawT   = r < .26 ? clamp(wrapAng(h.hd), -1.35, 1.35)  // straight at you
             : r < .52 ? lerp(-.85, -.25, Math.random())    // away, over his shoulder
             :           lerp(-.45,  .45, Math.random());   // a glance round
    h.pitchT = h.dip > .5 ? lerp(-.44, -.10, Math.random()) // nose in the grass
                          : lerp(-.22,  .40, Math.random());
  }

  /* The body swings under the head and the head holds its bearing, so a body
     turn shows up as the OPPOSITE turn in his head's body-relative yaw. The
     dir term is because his rig azimuth is measured camera-ward, not
     screen-ward: turning toward the lens is a falling heading when he faces
     right and a rising one when he faces left.

     The lag is its own spring, and it is driven by the turn RATE rather than
     by adding the turn straight onto the yaw. Added as a position the spring
     ends a sustained turn carrying the whole restoring velocity, and the head
     whipped 17-22° PAST where it should have stopped — a wobble, not a settle.
     Driven as a rate target it holds 22° behind through the turn and comes
     back overshooting by about a degree. */
  const rate = (h.turn || 0) / Math.max(dt, 1/240);
  h.turn = 0;
  const lagT = clamp(-rate * LAG_S, -.62, .62);
  h.lagV += (LG_K*(lagT - h.lag) - LG_D*h.lagV) * dt;
  h.lag  += h.lagV * dt;

  // the ears flick: occasional and fast. Anything else can poke h.flick to 1
  // (being called, taking a hit) and it will read as the ear reacting.
  h.earT -= dt;
  if (h.earT <= 0){ h.earT = lerp(1.4, 4.5, Math.random()); h.flick = 1; }
  h.flick = Math.max(0, h.flick - dt*6.5);

  h.yawV   += (HEAD_K *(h.yawT   - h.yaw)   - HEAD_D *h.yawV)   * dt;
  h.yaw    += h.yawV * dt;
  h.pitchV += (PITCH_K*(h.pitchT - h.pitch) - PITCH_D*h.pitchV) * dt;
  h.pitch  += h.pitchV * dt;

  // A mass on a spring inside an accelerating body: it falls behind as he
  // sets off and carries on forward as he pulls up.
  h.hlagV += (-(h.acc || 0)*HL_F - HL_K*h.hlag - HL_D*h.hlagV) * dt;
  h.hlag   = clamp(h.hlag + h.hlagV*dt, -4, 4);
  h.acc = 0;
}

function sparkle(x, y, col){
  if (motes.length >= MOTE_MAX) return;
  motes.push({
    x, y, z:1.35, r:lerp(.9,2.4,Math.random()), a:lerp(.6,1,Math.random()),
    vx:(Math.random()*2-1)*28, vy:-lerp(10,54,Math.random()),
    ph:Math.random()*TAU, life:lerp(.9,2.2,Math.random()), sp:glow(col)
  });
}

function snuffle(x, y){
  if (motes.length >= MOTE_MAX) return;
  motes.push({
    x, y, z:1.1, r:lerp(.8,1.8,Math.random()), a:lerp(.30,.62,Math.random()),
    vx: Math.sin(hog.hd)*lerp(24,66,Math.random()) + (Math.random()*2-1)*14,
    vy: lerp(-10,16,Math.random()),
    ph:Math.random()*TAU, life:lerp(.45,1.05,Math.random()), sp:SP_MOTEB
  });
}

function say(msg, secs){
  elToast.textContent = msg;
  elToast.classList.add("on");
  toastT = secs;
}

function banner(big, small){

  elBanSm.textContent = small;
  elBanner.classList.add("on");
}
function clearBanner(){ elBanner.classList.remove("on"); }

/* ─────────────────────────  breadcrumbs  ─────────────────────────── */
// Whatever you sow is the marker. He walks to the nearest one still ahead.
const crumbs = [];
const CRUMB_MAX = 30;

// Only ever one live target: the last place you called him.
function dropCrumb(px, py){
  crumbs.length = 0;
  crumbs.push({ x:px, wy:py + scrollY, t:0, eaten:0 });
  hog.flick = 1;                      // he pricks his ears when you call him
}

function updateCrumbs(dt){
  for (let i=crumbs.length-1;i>=0;i--){
    const c = crumbs[i];
    c.t += dt;
    if (c.eaten) crumbs.splice(i,1);
  }
}

// a soft ring on the ground where he is headed
function drawCrumbs(){
  for (const c of crumbs){
    if (c.eaten) continue;
    const sy = c.wy - scrollY;
    if (sy < -60 || sy > H + 60) continue;
    for (let r=0;r<2;r++){
      const p = ((time*1.5 + c.t + r*.5) % 1);
      ctx.globalAlpha = .32 * (1 - p);
      ctx.strokeStyle = "rgba(236,246,178,1)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(c.x, sy, 10 + p*30, (10 + p*30)*.34, 0, 0, TAU);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/* ───────────────────────────  footprints  ────────────────────────── */
const tracks = [];
const TRACK_MAX = 90;

function dropTrack(){
  hog.foot ^= 1;
  const k = hogK();
  const side = (hog.foot ? 1 : -1) * 8.5 * k;
  // perpendicular to his heading, which points down-field
  tracks.push({
    x:  hog.x  + Math.cos(hog.hd) * side,
    wy: hog.wy - Math.sin(hog.hd) * side,
    a:  hog.hd, t:0,
    life: lerp(6, 9, Math.random()) + snowCover * 9,
    snow: snowCover, k
  });
  if (tracks.length > TRACK_MAX) tracks.shift();
}

function updateTracks(dt){
  for (let i=tracks.length-1;i>=0;i--){
    const t = tracks[i];
    t.t += dt;
    if (t.t > t.life || t.wy < scrollY - 400) tracks.splice(i,1);
  }
}

// drawn on the ground, under the grass, so blades still pass over them
function drawTracks(){
  for (const t of tracks){
    const sy = t.wy - scrollY;
    if (sy < -40 || sy > H + 40) continue;
    const a = clamp(1 - t.t/t.life, 0, 1) * clamp(t.t/.18, 0, 1);
    const r = 5.2 * t.k;
    ctx.save();
    ctx.translate(t.x, sy);
    ctx.rotate(-t.a);
    if (t.snow > .25){
      // a dent in the snow: cool shadow with a bright lip on the far side
      ctx.globalAlpha = a * .5 * t.snow;
      ctx.fillStyle = "rgba(126,150,186,1)";
      ctx.beginPath(); ctx.ellipse(0, 0, r, r*.62, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = a * .42 * t.snow;
      ctx.fillStyle = "rgba(244,250,255,1)";
      ctx.beginPath(); ctx.ellipse(0, -r*.42, r*.86, r*.3, 0, 0, TAU); ctx.fill();
    } else {
      ctx.globalAlpha = a * .34;
      ctx.fillStyle = "rgba(12,20,12,1)";
      ctx.beginPath(); ctx.ellipse(0, 0, r, r*.6, 0, 0, TAU); ctx.fill();
      // three little toes
      ctx.globalAlpha = a * .26;
      for (let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.ellipse(i*r*.42, -r*.62, r*.2, r*.24, 0, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ─────────────────────────────  thorns  ──────────────────────────── */
// The one hazard that is everywhere. Density climbs with the leg number.
const THORN_ROW = 860;

function thornCell(ci){
  const key = "th|" + ci;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(ci, 9377));
  const items = [];
  const n = r() < .34 ? 0 : 1 + (r()*2|0);
  for (let i=0;i<n;i++) items.push({
    fx: r(), y: r()*THORN_ROW,
    r: lerp(52, 96, r()),
    a: (r()*2-1)*.5, seed: r()*1000, mirror: r() < .5 ? 1 : -1
  });
  c = { seen: frameId, items };
  cells.set(key, c);
  return c;
}

// how many of a cell's thorns are live at this leg
const thornTake = it => (it.seed % 100) / 100 < clamp(.18 + GAME.leg*.11, 0, .88);

function drawThorns(dt){
  const c0 = Math.floor((scrollY - 160)/THORN_ROW);
  const c1 = Math.floor((scrollY + H + 160)/THORN_ROW);
  for (let ci=c0; ci<=c1; ci++){
    const cell = thornCell(ci);
    for (const it of cell.items){
      if (!thornTake(it)) continue;
      const wy = ci*THORN_ROW + it.y;
      if (hardAt(wy) > .5) continue;               // not on the road or the lake
      const sy = wy - scrollY;
      if (sy < -140 || sy > H + 140) continue;
      const x = it.fx * W;
      const r = it.r;

      ctx.save();
      ctx.translate(x, sy);
      ctx.scale(it.mirror, 1);
      ctx.rotate(it.a * .16);

      // shadow pool
      ctx.globalAlpha = .40;
      ctx.fillStyle = "#040c08";
      ctx.beginPath(); ctx.ellipse(0, 4, r*.86, r*.3, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;

      const rr = rng(it.seed | 0);
      // three arching canes
      for (let c2=0;c2<3;c2++){
        const sx = lerp(-r*.7, r*.5, rr()), h = r*lerp(.62, 1.0, rr());
        const ex = sx + lerp(r*.5, r*1.1, rr());
        ctx.strokeStyle = c2 === 1 ? "#2a1f16" : "#38291c";
        ctx.lineWidth = lerp(3.2, 5, rr());
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(sx, 2);
        ctx.quadraticCurveTo((sx+ex)/2, -h, ex, -h*.18);
        ctx.stroke();
        // thorns along the cane
        ctx.lineWidth = 1.7;
        ctx.strokeStyle = "#6b5334";
        for (let t=.16;t<.94;t+=.17){
          const mx = lerp(lerp(sx,(sx+ex)/2,t), lerp((sx+ex)/2,ex,t), t);
          const my = lerp(lerp(2,-h,t), lerp(-h,-h*.18,t), t);
          const up = rr() < .5 ? -1 : 1;
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + up*5.5, my - 7.5);
          ctx.stroke();
        }
        // a few dark leaves
        ctx.fillStyle = "#20361f";
        for (let l=0;l<3;l++){
          const t = .3 + l*.24;
          const mx = lerp(sx, ex, t), my = lerp(2, -h*.5, Math.sin(t*Math.PI));
          ctx.save();
          ctx.translate(mx, my); ctx.rotate(rr()*TAU);
          ctx.beginPath(); ctx.ellipse(0, 0, 8.5, 4.2, 0, 0, TAU); ctx.fill();
          ctx.restore();
        }
      }
      // blackberries
      for (let b=0;b<3;b++){
        if (rr() < .45) continue;
        const bx = lerp(-r*.3, r*.6, rr()), by = -r*lerp(.25, .6, rr());
        ctx.fillStyle = "#241428";
        ctx.beginPath(); ctx.arc(bx, by, 3.6, 0, TAU); ctx.fill();
        ctx.fillStyle = "rgba(120,90,150,.6)";
        ctx.beginPath(); ctx.arc(bx - 1, by - 1.2, 1.3, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

/* ──────────────────────  the road, and under it  ─────────────────── */
// A road band is 2288px of tarmac — eighteen seconds at his pace — and a car
// is wider than the screen, so there is no dodging one. Every road therefore
// carries a culvert. Steer him to the mouth or he goes across the top.
const crossX = seg => lerp(.22, .78, rng(hash2(seg, 5501))());

function drawCulvert(x, sy, k, flip){
  const w = 46*k, h = 34*k;
  ctx.save();
  ctx.translate(x, sy);
  ctx.scale(1, flip);
  // worn path leading in
  ctx.globalAlpha = .5;
  ctx.fillStyle = "#3b3524";
  ctx.beginPath(); ctx.ellipse(0, h*.42, w*.72, h*.44, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  // concrete surround
  ctx.fillStyle = "#6e6a5e";
  ctx.beginPath();
  ctx.moveTo(-w*.68, h*.30);
  ctx.quadraticCurveTo(-w*.68, -h*.52, 0, -h*.52);
  ctx.quadraticCurveTo(w*.68, -h*.52, w*.68, h*.30);
  ctx.closePath(); ctx.fill();
  // the mouth
  ctx.fillStyle = "#05090a";
  ctx.beginPath();
  ctx.moveTo(-w*.46, h*.30);
  ctx.quadraticCurveTo(-w*.46, -h*.30, 0, -h*.30);
  ctx.quadraticCurveTo(w*.46, -h*.30, w*.46, h*.30);
  ctx.closePath(); ctx.fill();
  // mossy lip
  ctx.globalAlpha = .55;
  ctx.fillStyle = "#4d5a30";
  ctx.beginPath(); ctx.ellipse(0, h*.30, w*.66, h*.09, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawCrossings(){
  const k = hogK();
  const s0 = Math.floor((scrollY - 400)/SEG), s1 = Math.floor((scrollY + H + 400)/SEG);
  for (let sg=s0; sg<=s1; sg++){
    if (segBiome(sg) !== ROAD) continue;
    const e = bandEdges(sg, ROAD), x = crossX(sg)*W;
    const y0 = e[0] - scrollY, y1 = e[1] - scrollY;
    if (y0 > -80 && y0 < H + 80) drawCulvert(x, y0,  k,  1);
    if (y1 > -80 && y1 < H + 80) drawCulvert(x, y1,  k, -1);
  }
}

/* ────────────────────────────  hazards  ──────────────────────────── */
const hazBuf = [];

// Collected around the hedgepig, NOT around the camera. With a free camera,
// ranging these off scrollY meant scrolling away from him made him invincible.
function collectHazards(){
  hazBuf.length = 0;

  const c0 = Math.floor((hog.wy - 400)/THORN_ROW);
  const c1 = Math.floor((hog.wy + 400)/THORN_ROW);
  for (let ci=c0; ci<=c1; ci++)
    for (const it of thornCell(ci).items){
      if (!thornTake(it)) continue;
      const wy = ci*THORN_ROW + it.y;
      if (hardAt(wy) > .5) continue;
      hazBuf.push({ x: it.fx*W, wy, rx: it.r*.62, ry: it.r*.26, kind:"thorn" });
    }

  const s0 = Math.floor((hog.wy - 600)/SEG), s1 = Math.floor((hog.wy + 600)/SEG);
  for (let sg=s0; sg<=s1; sg++){
    if (segBiome(sg) !== ROAD) continue;
    for (const c of roadCell(sg).cars)
      hazBuf.push({ x:c.x, wy:c.wy, rx:c.len*.46, ry:c.wid*.54, kind:"car" });
  }
}

function hurt(kind){
  if (GAME.state !== "walk" || GAME.invuln > 0) return;
  GAME.hearts--;
  GAME.invuln = 2.4;
  GAME.flash  = 1;
  GAME.state  = "hurt";
  GAME.stateT = kind === "car" ? 1.5 : 1.15;
  crumbs.length = 0;                               // he forgets where he was going
  hog.wy -= kind === "car" ? 150 : 96;             // knocked back out of it
  const k = hogK();
  for (let i=0;i<14;i++) sparkle(hog.x + (Math.random()*2-1)*34*k, hogY() - 10*k, "246,180,170");
  rings.push({ x:hog.x, y:hogY(), r:8, max:150, a:.6, col:"244,170,160" });
  if (GAME.hearts <= 0){
    GAME.state = "over"; GAME.stateT = 0;
    banner("the hedgepig is tired", "tap anywhere to set out again");
  } else {
    say(kind === "car" ? "mind the road!" : "ouch — thorns", 2.0);
  }
  paintHearts();
}

function paintHearts(){
  for (let i=0;i<elHearts.length;i++)
    elHearts[i].classList.toggle("spent", i >= GAME.hearts);
}

/* ─────────────────────────  legs + burrow  ───────────────────────── */
function newLeg(first){
  if (first){ GAME.leg = 1; GAME.hearts = 3; }
  GAME.startWy = hog.wy;
  GAME.goalWy  = hog.wy + LEG_LEN;
  GAME.goalX   = lerp(.24, .76, rng(hash2(GAME.leg, 4231))());
  while (hardAt(GAME.goalWy) > .05) GAME.goalWy += 400;   // never on road or water
  paintHearts();
}

function startRun(){
  GAME.started = true;
  GAME.state = "walk"; GAME.stateT = 0; GAME.invuln = 1.6; GAME.flash = 0;
  crumbs.length = 0; tracks.length = 0;
  scrollY = 0; scrollV = 0;
  hog.x = W*.5; hog.wy = H*.30; hog.hd = 0;
  /* The head rig has to go back to rest too. `updateGame` returns early while
     the state is "over", and `updateLook` — the only thing that zeroes `turn`
     and `acc` — sits behind that return. So a death at full pace leaves
     spdPrev at ~300 and, on the first frame of the next run, acc differences
     300 against 0 for about -18,000 px/s². That drove hlag to 1.99 units, 69%
     bigger than a real setting-off, with the sign of a hard brake, on a
     hedgehog standing still having just respawned. A death mid-turn likewise
     left up to 0.21 rad of turn banked, worth 5° of phantom head lag. */
  hog.spdPrev = 0; hog.turn = 0; hog.acc = 0;
  hog.yawV = hog.pitchV = hog.lagV = hog.hlagV = 0;
  hog.lag = hog.hlag = 0;
  hog.act = 0; hog.actT = 0; hog.actP = 0;
  hog.curl = 0; hog.gait = 0; hog.walk = 0; hog.arrive = 0;
  newLeg(true);
  clearBanner();
  say(NAMES[0], 3.4);
}

function drawBurrow(){
  const sy = GAME.goalWy - scrollY;
  if (sy < -200 || sy > H + 200) return;
  const x = GAME.goalX * W, k = hogK(), r = 62*k;
  const near = clamp(1 - Math.abs(hog.wy - GAME.goalWy)/2600, 0, 1);

  ctx.save();
  ctx.translate(x, sy);
  // mound
  ctx.fillStyle = "#2b2a1c";
  ctx.beginPath(); ctx.ellipse(0, 0, r*1.5, r*.66, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#3a3826";
  ctx.beginPath(); ctx.ellipse(0, -r*.12, r*1.34, r*.54, 0, 0, TAU); ctx.fill();
  // the hole itself
  ctx.fillStyle = "#050a06";
  ctx.beginPath();
  ctx.moveTo(-r*.62, r*.10);
  ctx.quadraticCurveTo(-r*.62, -r*.72, 0, -r*.72);
  ctx.quadraticCurveTo(r*.62, -r*.72, r*.62, r*.10);
  ctx.closePath(); ctx.fill();
  // warm light inside, brighter as he closes
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = .18 + .3*near + .05*Math.sin(time*2.2);
  ctx.drawImage(SP_BLOOM, -r*1.1, -r*1.3, r*2.2, r*2.2);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  // a couple of stones and a tuft on the lip
  ctx.fillStyle = "#4a4632";
