      ctx.strokeStyle = "rgba(56,26,10,.34)";
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(-k.r*.88, 0); ctx.lineTo(k.r*.88, 0); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function updateFallLeaves(dt){
  if (leafFall < .02) return;
  for (let i=0;i<fallLeaves.length;i++){
    const f = fallLeaves[i];
    f.z += f.zv*dt;
    if (f.z >= 1){ fallLeaves[i] = newFallLeaf(0); continue; }
    const e = airEase(f.z), k = airK(f.z);
    // it falls toward the band, and flutters as it goes — the flutter is scaled
    // by nearness too, so a distant leaf barely stirs
    f.x = lerp(f.x0, f.xE, e) + (Math.sin(time*.9 + f.ph)*24 + gustAt(f.x0)*30) * k;
    f.y = lerp(f.y0, f.yE, e) + Math.sin(time*1.6 + f.ph*1.7)*9 * k;
    f.rot += f.spin * dt * (.35 + .65*k);
  }
}
// Drawn twice: the near end of the run goes on the blurred foreground plate so
// it is genuinely out of focus, the far end on the sharp main pass, crossfading
// between the two. That is where the sense of distance actually comes from.
function drawFallLeaves(x, nearPass){
  if (leafFall < .02) return;
  const pal = leafSpring ? BLOSSOM : LEAFC;
  for (const f of fallLeaves){
    const nf = clamp((.56 - f.z)/.18, 0, 1);
    const share = nearPass ? nf : 1 - nf;
    if (share <= .01) continue;
    const k = airK(f.z);
    x.save();
    x.globalAlpha = leafFall * .95 * share * (nearPass ? .72 : 1);
    x.translate(f.x, f.y);
    x.rotate(f.rot);
    x.scale(1, .3 + .7*Math.abs(Math.cos(f.rot*1.4)));
    x.fillStyle = pal[f.ci % pal.length];
    leafShape(x, f.r * k);
    x.restore();
  }
  x.globalAlpha = 1;
}
function squirrelCell(sg){
  const key = "sq|" + sg;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(sg, 4457));
  c = { seen: frameId, s: { x: -60, wy: sg*SEG + SEG*lerp(.2,.8,r()),
        dir: r()<.5?-1:1, t: 0, mode: 0, hold: r()*3, bury: 0 } };
  if (c.s.dir < 0) c.s.x = W + 60;
  cells.set(key, c);
  return c;
}
function drawSquirrels(dt){
  eachZone(AUTUMN, sg => {
    const q = squirrelCell(sg).s;
    const sy = q.wy - scrollY;
    q.hold -= dt;
    if (q.mode === 0){                             // bounding
      q.t += dt*3.2;
      q.x += q.dir*150*dt;
      if (q.hold <= 0){ q.mode = 1; q.hold = lerp(1.4, 3.2, Math.random()); q.bury = 0; }
      if (q.x < -110){ q.x = W + 110; q.dir = -1; }
      if (q.x > W + 110){ q.x = -110; q.dir = 1; }
    } else {                                       // stopped, burying
      q.bury = Math.min(1, q.bury + dt*1.6);
      if (q.hold <= 0){ q.mode = 0; q.hold = lerp(2, 5, Math.random()); }
    }
    const hit = tappedNear(q.x, sy - 22, 70);
    if (hit){ q.mode = 0; q.hold = 2.4; q.dir = q.x < hit.x ? -1 : 1; }
    if (sy < -80 || sy > H + 80) return;
    const bound = q.mode === 0 ? Math.abs(Math.sin(q.t))*26 : 0;
    const dig = q.mode === 1 ? Math.max(0, Math.sin(time*8))*7*q.bury : 0;
    const s = 26;
    ctx.save();
    ctx.translate(q.x, sy - bound);
    ctx.scale(q.dir, 1);
    ctx.globalAlpha = .32; ctx.fillStyle = "#3a2414";
    ctx.beginPath(); ctx.ellipse(0, bound*.5 + s*.62, s*.8, s*.2, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#9a6236";                     // tail
    ctx.beginPath();
    ctx.moveTo(-s*.5, s*.2);
    ctx.bezierCurveTo(-s*1.5, s*.2, -s*1.7, -s*1.1, -s*.6, -s*.9);
    ctx.bezierCurveTo(-s*1.1, -s*.6, -s*.9, -s*.05, -s*.3, s*.2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#7d4f2a";
    ctx.beginPath(); ctx.ellipse(0, 0, s*.55, s*.42, -.16, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#7d4f2a"; ctx.lineWidth = s*.13; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-s*.2, s*.3); ctx.lineTo(-s*.34, s*.62);
    ctx.moveTo(s*.22, s*.28); ctx.lineTo(s*.30, s*.60);
    ctx.stroke();
    ctx.fillStyle = "#7d4f2a";
    ctx.beginPath(); ctx.arc(s*.5, -s*.34 + dig, s*.30, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s*.34, -s*.56 + dig); ctx.lineTo(s*.40, -s*.86 + dig); ctx.lineTo(s*.58, -s*.58 + dig);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e2c9a4";
    ctx.beginPath(); ctx.ellipse(s*.72, -s*.24 + dig, s*.14, s*.10, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1d1209";
    ctx.beginPath(); ctx.arc(s*.60, -s*.42 + dig, s*.075, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath(); ctx.arc(s*.63, -s*.45 + dig, s*.026, 0, TAU); ctx.fill();
    if (q.mode === 1 && q.bury > .3){
      ctx.fillStyle = "#c08a44";
      ctx.beginPath(); ctx.ellipse(s*.62, s*.42, s*.13, s*.17, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
  });
}

/* ────────────────────────── 4. night meadow ───────────────────────── */
const fireflies = [];
function releaseFireflies(px, py){
  for (let i=0;i<14;i++){
    const a = Math.random()*TAU;
    fireflies.push({
      x: px + Math.cos(a)*16, wy: py + scrollY + Math.sin(a)*16,
      vx: Math.cos(a)*lerp(10,50,Math.random()), vy: -lerp(14,54,Math.random()),
      t: 0, life: lerp(5, 11, Math.random()), ph: Math.random()*TAU,
      hz: lerp(1.1, 2.4, Math.random()), r: lerp(2, 3.6, Math.random())
    });
  }
  rings.push({ x:px, y:py, r:3, max:56, a:.4, col:"236,244,168" });
}
function updateFireflies(dt){
  for (let i=fireflies.length-1;i>=0;i--){
    const f = fireflies[i];
    f.t += dt;
    f.vx += (Math.sin(time*1.7 + f.ph)*26 - f.vx*.9)*dt;
    f.vy += (-14 + Math.cos(time*1.3 + f.ph*2)*24 - f.vy*.9)*dt;
    f.x += f.vx*dt; f.wy += f.vy*dt;
    if (f.t > f.life) fireflies.splice(i,1);
  }
}
function drawFireflies(){
  if (!fireflies.length) return;
  ctx.globalCompositeOperation = "lighter";
  for (const f of fireflies){
    const sy = f.wy - scrollY;
    if (sy < -60 || sy > H + 60) continue;
    const pulse = .35 + .65*Math.pow(Math.max(0, Math.sin(time*f.hz*TAU*.5 + f.ph)), 2);
    const fade = clamp((f.life - f.t)/1.4, 0, 1)*clamp(f.t*3, 0, 1);
    const R = f.r*(9 + pulse*16);
    ctx.globalAlpha = .34*pulse*fade;
    ctx.drawImage(glow("232,246,150"), f.x - R, sy - R, R*2, R*2);
    ctx.globalAlpha = .95*pulse*fade;
    ctx.fillStyle = "rgba(246,252,196,1)";
    ctx.beginPath(); ctx.arc(f.x, sy, f.r*pulse, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}
function drawNightGround(){
  if (nightNow < .05) return;
  const R0 = 1400;
  const s0 = Math.floor((scrollY - 400)/R0), s1 = Math.floor((scrollY + H + 400)/R0);
  for (let sg=s0; sg<=s1; sg++){
    const y0 = sg*R0 - scrollY, y1 = (sg+1)*R0 - scrollY;
    const SEG = R0;
    if (y1 < -60 || y0 > H + 60) continue;
    const r = rng(hash2(sg, 6229));
    ctx.globalCompositeOperation = "lighter";
    for (let i=0;i<5;i++){                        // pools of moonlight
      const mx = r()*W, my = y0 + r()*SEG, mr = lerp(120, 300, r());
      if (my < -mr || my > H + mr) continue;
      ctx.globalAlpha = (.06 + .02*Math.sin(time*.4 + i))*nightNow;
      ctx.drawImage(glow("170,206,255"), mx - mr, my - mr*.6, mr*2, mr*1.2);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    for (let i=0;i<4;i++){                        // dew on a web
      const wx = r()*W, wy2 = y0 + r()*SEG, wr = lerp(38, 74, r());
      if (wy2 < -80 || wy2 > H + 80) continue;
      ctx.strokeStyle = "rgba(178,206,236," + (.30*nightNow).toFixed(2) + ")"; ctx.lineWidth = 1;
      for (let k=1;k<=4;k++){
        ctx.beginPath();
        for (let a=0;a<=8;a++){
          const t = a/8*TAU, rr = wr*k/4*(1 + Math.sin(t*4)*.06);
          const px2 = wx + Math.cos(t)*rr, py2 = wy2 + Math.sin(t)*rr*.6;
          a ? ctx.lineTo(px2, py2) : ctx.moveTo(px2, py2);
        }
        ctx.stroke();
      }
      for (let a=0;a<8;a++){
        const t = a/8*TAU;
        ctx.beginPath(); ctx.moveTo(wx, wy2);
        ctx.lineTo(wx + Math.cos(t)*wr, wy2 + Math.sin(t)*wr*.6); ctx.stroke();
      }
      ctx.fillStyle = "rgba(214,236,255,.6)";
      for (let a=0;a<7;a++){
        const t = r()*TAU, rr = wr*lerp(.3, 1, r());
        ctx.beginPath();
        ctx.arc(wx + Math.cos(t)*rr, wy2 + Math.sin(t)*rr*.6, 1.7, 0, TAU);
        ctx.fill();
      }
    }
  }
}

/* ─────────────────────────── 5. hen run ───────────────────────────── */

function layEgg(px, py){
  keeper(eggs, 14, {
    x: px, wy: py + scrollY, t: 0, fade: 1, dying: 0,
    s: lerp(.85, 1.2, Math.random()), hatched: 0, ph: Math.random()*TAU
  });
  rings.push({ x:px, y:py, r:3, max:38, a:.35, col:"246,238,220" });
}
function updateEggs(dt){
  for (let i=eggs.length-1;i>=0;i--){
    const e = eggs[i];
    e.t += dt;
    if (!e.hatched && e.t > 2.4){
      e.hatched = 1;
      chicks.push({
        x: e.x, wy: e.wy, t: 0, s: e.s, dir: Math.random()<.5?-1:1,
        hold: .4, ph: Math.random()*TAU, hop: 0
      });
      for (let k=0;k<8 && motes.length<MOTE_MAX;k++){
        const a = Math.random()*TAU;
        motes.push({ x:e.x, y:e.wy - scrollY, z:1.2, r:lerp(1,2.2,Math.random()), a:.8,
          vx:Math.cos(a)*lerp(20,70,Math.random()), vy:-lerp(20,60,Math.random()),
          ph:Math.random()*TAU, life:lerp(.8,1.6,Math.random()), sp:SP_MOTEA });
      }
      rings.push({ x:e.x, y:e.wy - scrollY, r:3, max:50, a:.5, col:"250,244,226" });
    }
    if (e.dying) e.fade -= dt*1.5;
    if (e.t > 5.2 && !e.dying) e.dying = 1;
    if (e.fade <= 0) eggs.splice(i,1);
  }
  for (let i=chicks.length-1;i>=0;i--){
    const c = chicks[i];
    c.t += dt;
    c.hold -= dt;
    if (c.hold <= 0){
      c.hold = lerp(.35, 1.1, Math.random());
      c.hop = .3;
      if (Math.random() < .3) c.dir = -c.dir;
    }
    c.hop = Math.max(0, c.hop - dt);
    c.x += c.dir*(c.hop > 0 ? 52 : 12)*dt;
    if (c.x < -30) c.x = W + 30;
    if (c.x > W + 30) c.x = -30;
    if (c.t > 26) chicks.splice(i,1);
  }
}

    ctx.beginPath(); ctx.ellipse(0, s*.9, s*.7, s*.2, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = e.fade;

      g.addColorStop(0, "#fdf6e6"); g.addColorStop(1, "#ddc8a4");

    ctx.moveTo(s*.16, s*.45); ctx.lineTo(s*.20, s*.76);

    ctx.fillStyle = "#f6d24e";
    ctx.beginPath(); ctx.ellipse(0, 0, s*.52, s*.46, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(s*.34, -s*.42, s*.34, 0, TAU); ctx.fill();
    ctx.fillStyle = "#e8a02a";
    ctx.beginPath();
    ctx.moveTo(s*.62, -s*.44); ctx.lineTo(s*.92, -s*.36); ctx.lineTo(s*.62, -s*.28);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#20180c";

function henCell(sg){

    x: r()*W, wy: sg*SEG + SEG*lerp(.1,.9,r()),
    dir: r()<.5?-1:1, s: lerp(.85, 1.25, r()), ph: r()*TAU,
    hold: r()*2, mode: 0, col: ["#a8452c","#d8d2c4","#3c3630","#c98a3e"][(r()*4)|0]

function drawHens(dt){

      ctx.fillRect(-s*.7, -s*.86, s*1.4, s*.86);
      ctx.strokeStyle = "rgba(48,30,16,.45)"; ctx.lineWidth = 2;
      for (let i=-2;i<=2;i++){

      }
      ctx.fillStyle = "#8e3a2a";

      ctx.bezierCurveTo(-s*.36, s*.36, -s*.52, s*.20, -s*.46, -s*.02);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(-s*.46, -s*.02);
      ctx.bezierCurveTo(-s*.44, -s*.52, s*.20, -s*.62, s*.44, -s*.22);
      ctx.bezierCurveTo(s*.62, s*.10, s*.30, s*.40, -s*.06, s*.38);
      ctx.bezierCurveTo(-s*.36, s*.36, -s*.52, s*.20, -s*.46, -s*.02);

      ctx.moveTo(-s*.30, -s*.14);
      ctx.bezierCurveTo(s*.02, -s*.34, s*.26, -s*.14, s*.20, s*.12);
      ctx.bezierCurveTo(-s*.02, s*.24, -s*.26, s*.14, -s*.30, -s*.14);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = s*.03;

      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(s*.50, -s*.86 + peck, s*.25, 0, TAU); ctx.fill();

      ctx.fillStyle = "#c0362a";                       // comb
      for (let i=0;i<3;i++){

      ctx.moveTo(s*.70, -s*.92 + peck);

      ctx.fillStyle = "#1a120a";

function updateFeathers(dt){

function zoneAmtAt(wy, kind){
  const m = segAt(wy);
  if (!m.t) return m.a === kind ? 1 : 0;
  return (m.a === kind ? 1 - m.t : 0) + (m.b === kind ? m.t : 0);
}
function zoneAmt(kind){ return zoneAmtAt(scrollY + H*.5, kind); }

// blurred foreground plate additions
function drawZoneFgPlate(x){
  if (henNow > .02){                     // wire, soft and out of focus
    const camY = scrollY * FGP_PAR;
    const cw = 30, ch = 17, off = mod(-camY, ch*2);
    x.globalAlpha = henNow*.17;
    x.strokeStyle = "#9aa4ac";
    x.lineWidth = 2.4;
    x.beginPath();
    for (let y = -off - ch*2; y < H + ch*2; y += ch*2){
      for (let px2 = -cw; px2 < W + cw; px2 += cw){
        x.moveTo(px2, y);
        x.lineTo(px2 + cw*.5, y + ch);
        x.lineTo(px2 + cw*.5, y + ch*2);
        x.moveTo(px2 + cw*.5, y + ch);
        x.lineTo(px2 + cw, y);
      }
    }
    x.stroke();
    x.globalAlpha = henNow*.5;           // a straining post now and then
    x.strokeStyle = "#2a2f2c";
    x.lineWidth = 15;
    for (let i=-1;i<=2;i++){
      const pxp = mod(i*420 - camY*.06, W + 500) - 120;
      x.beginPath(); x.moveTo(pxp, -60); x.lineTo(pxp + 6, H + 60); x.stroke();
    }
    x.globalAlpha = 1;
  }
  if (snowNow > .02){
    const camY = scrollY * FGP_PAR;
    const c0 = Math.floor((camY - 600)/2400), c1 = Math.floor((camY + H + 600)/2400);
    for (let ci=c0; ci<=c1; ci++){
      const r = rng(hash2(ci, 1811));
      if (r() > .7) continue;
      const sy = ci*2400 + r()*900 - camY;
      if (sy < -500 || sy > H + 500) continue;
      const side = r() < .5 ? -1 : 1, px = side < 0 ? -50 : W + 50;
      const len = W*lerp(.7, 1.15, r()), sag = lerp(90, 200, r());
      x.strokeStyle = "#0d1a16"; x.lineCap = "round"; x.lineWidth = lerp(24, 44, r());
      x.beginPath();
      x.moveTo(px, sy);
      x.quadraticCurveTo(px - side*len*.5, sy + sag, px - side*len, sy + sag*1.5);
      x.stroke();
      x.strokeStyle = "#e8f2ff"; x.lineWidth = lerp(16, 30, r());
      x.beginPath();
      x.moveTo(px, sy - 14);
      x.quadraticCurveTo(px - side*len*.5, sy + sag - 16, px - side*len, sy + sag*1.5 - 12);
      x.stroke();
      x.fillStyle = "#cfe2f6";
      for (let i=0;i<9;i++){                       // icicles
        const t = lerp(.15, 1, r()), mt = 1 - t;
        const bx = px*mt*mt + 2*mt*t*(px - side*len*.5) + t*t*(px - side*len);
        const by = sy*mt*mt + 2*mt*t*(sy + sag) + t*t*(sy + sag*1.5);
        const il = lerp(26, 76, r());
        x.beginPath();
        x.moveTo(bx - 9, by + 8); x.lineTo(bx + 9, by + 8); x.lineTo(bx, by + 8 + il);
        x.closePath(); x.fill();
      }
    }
  }
  if (poolNow > .02){                              // wet rock shelves
    const camY = scrollY * FGP_PAR;
    const c0 = Math.floor((camY - 600)/1500), c1 = Math.floor((camY + H + 600)/1500);
    for (let ci=c0; ci<=c1; ci++){
      const r = rng(hash2(ci, 3931));
      if (r() > .78) continue;
      const sy = ci*1500 + r()*700 - camY;
      if (sy < -600 || sy > H + 600) continue;
      const side = r() < .5 ? -1 : 1, px = side < 0 ? -30 : W + 30;
      const reach = W*lerp(.35, .72, r()), tall = lerp(240, 520, r());
      x.fillStyle = "#0a1417";
      x.beginPath();
      x.moveTo(px, sy - tall*.5);
      x.lineTo(px - side*reach*.5, sy - tall*.36 + lerp(-40,40,r()));
      x.lineTo(px - side*reach, sy + lerp(-30,60,r()));
      x.lineTo(px - side*reach*.72, sy + tall*.55);
      x.lineTo(px, sy + tall*.62);
      x.closePath(); x.fill();
      x.strokeStyle = "rgba(120,158,164,.30)"; x.lineWidth = 7;
      for (let i=0;i<4;i++){
        const t = lerp(.15, .85, r());
        x.beginPath();
        x.moveTo(px, sy - tall*.4 + t*tall);
        x.lineTo(px - side*reach*lerp(.4,.95,r()), sy - tall*.3 + t*tall + lerp(-20,20,r()));
        x.stroke();
      }
      x.strokeStyle = "#12301f"; x.lineWidth = 10; x.lineCap = "round";
      for (let i=0;i<5;i++){                       // kelp
        const kx = px - side*reach*lerp(.2,.9,r()), ky = sy + tall*.4;
        const kl = lerp(120, 300, r()), sw = Math.sin(time*.9 + i)*40;
        x.beginPath();
        x.moveTo(kx, ky);
        x.quadraticCurveTo(kx + sw, ky - kl*.5, kx + sw*1.6, ky - kl);
        x.stroke();
      }
    }
  }
}

// crisp foreground, drawn over the blurred plate
const moths = [];
function drawZoneFgSharp(dt){
  if (nightNow > .02){                             // a lantern, and moths at it
    const camY = scrollY * FGP_PAR;
    const c0 = Math.floor((camY - 500)/2600), c1 = Math.floor((camY + H + 500)/2600);
    for (let ci=c0; ci<=c1; ci++){
      const r = rng(hash2(ci, 6607));
      if (r() > .68) continue;
      const sy = ci*2600 + r()*1100 - camY;
      if (sy < -300 || sy > H + 300) continue;
      const lx = lerp(.18, .82, r())*W, s = lerp(34, 54, r());
      const swing = Math.sin(time*.8 + ci)*.05;
      const flick = .84 + .16*Math.sin(time*8.3 + ci*3) + .06*Math.sin(time*2.7);
      ctx.save();
      ctx.globalAlpha = nightNow;
      ctx.translate(lx, sy - s*4.4);
      ctx.rotate(swing);
      ctx.strokeStyle = "#161c18"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -s*3.2); ctx.lineTo(0, -s*.9); ctx.stroke();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = nightNow*.34*flick;
      ctx.drawImage(glow("255,206,120"), -s*5, -s*5, s*10, s*10);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = nightNow;
      ctx.fillStyle = "#1b2220";
      ctx.beginPath();
      ctx.moveTo(-s*.34, -s*.9); ctx.lineTo(s*.34, -s*.9);
      ctx.lineTo(s*.46, -s*.62); ctx.lineTo(-s*.46, -s*.62); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,206,120," + (.92*flick).toFixed(2) + ")";
      ctx.fillRect(-s*.36, -s*.62, s*.72, s*.9);
      ctx.fillStyle = "#1b2220";
      ctx.fillRect(-s*.46, s*.28, s*.92, s*.16);
      ctx.lineWidth = 2.4; ctx.strokeStyle = "#1b2220";
      ctx.beginPath();
      ctx.moveTo(-s*.36, -s*.62); ctx.lineTo(-s*.36, s*.28);
      ctx.moveTo(s*.36, -s*.62);  ctx.lineTo(s*.36, s*.28);
      ctx.stroke();
      ctx.restore();
      // moths
      while (moths.length < 5) moths.push({
        a: Math.random()*TAU, rr: lerp(40, 120, Math.random()),
        sp: lerp(.7, 2, Math.random())*(Math.random()<.5?-1:1),
        ph: Math.random()*TAU, s: lerp(9, 16, Math.random())
      });
      for (const m of moths){
        m.a += m.sp*dt;
        const rr = m.rr + Math.sin(time*1.7 + m.ph)*26;
        const mx = lx + Math.cos(m.a)*rr;
        const my = sy - s*4.4 + Math.sin(m.a)*rr*.55 + Math.sin(time*3 + m.ph)*8;
        const flap = Math.abs(Math.sin(time*13 + m.ph));
        ctx.save();
        ctx.globalAlpha = nightNow*.9;
        ctx.translate(mx, my);
        ctx.rotate(m.a + Math.PI*.5);
        ctx.fillStyle = "#cbbfa6";
        for (const sd of [-1, 1]){
          ctx.beginPath();
          ctx.ellipse(0, sd*m.s*.34*(.3 + .7*flap), m.s*.34, m.s*.44*(.3 + .7*flap), 0, 0, TAU);
          ctx.fill();
        }
        ctx.fillStyle = "#6d6252";
        ctx.beginPath(); ctx.ellipse(0, 0, m.s*.11, m.s*.30, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  }
}

/* ── muddy puddles ── */
const PUD_ROW = 520;
const puddles = [];
function pudCell(ci){
  const key = "pd|" + ci;
  let c = cells.get(key);
  if (c){ c.seen = frameId; return c; }
  const r = rng(hash2(ci, 8837));
  const items = [];
  const n = r() < .45 ? 0 : r() < .85 ? 1 : 2;
  for (let i=0;i<n;i++) items.push({
    x: r()*1.1 - .05, y: r()*PUD_ROW,
    rx: lerp(48, 128, r()), ry: lerp(16, 42, r()),
    rot: (r()*2-1)*.5, ph: r()*TAU, wob: 0, cool: 0
  });
  c = { seen: frameId, items };
  cells.set(key, c);
  return c;
}
function puddleHere(wy){
  const z = segBiome(Math.floor(wy/SEG));
  const base = z === MUD ? 1 : (z === FARM || z === TOWN || z === HENS || z === DRY) ? .8 : 0;
  if (!base) return 0;
  return z === MUD ? clamp(.45 + wet*1.2, 0, 1) : clamp(wet*1.7 - .15, 0, 1)*base;
}
function drawPuddles(dt){
  const c0 = Math.floor((scrollY - 200)/PUD_ROW), c1 = Math.floor((scrollY + H + 200)/PUD_ROW);
  for (let ci=c0; ci<=c1; ci++){
    const wy = ci*PUD_ROW;
    const amt = puddleHere(wy);
    if (amt < .04) continue;
    for (const p of pudCell(ci).items){
      const sy = wy + p.y - scrollY;
      if (sy < -70 || sy > H + 70) continue;
      const px = p.x*W;
      p.cool -= dt; p.wob *= Math.exp(-2.6*dt);
      const rx = p.rx*amt*(1 + p.wob*.10), ry = p.ry*amt*(1 - p.wob*.14);
      ctx.save();
      ctx.translate(px, sy);
      ctx.rotate(p.rot);
      ctx.fillStyle = "rgba(38,30,22,.75)";                 // wet rim
      ctx.beginPath(); ctx.ellipse(0, 0, rx*1.12, ry*1.16, 0, 0, TAU); ctx.fill();
      const g = ctx.createLinearGradient(0, -ry, 0, ry);
      g.addColorStop(0,  "rgba(74,72,64,.95)");
      g.addColorStop(.5, "rgba(44,44,42,.97)");
      g.addColorStop(1,  "rgba(58,56,50,.95)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = .22 + .07*Math.sin(time*1.3 + p.ph);
      ctx.fillStyle = "rgba(178,204,220,1)";                // sky in it
      ctx.beginPath(); ctx.ellipse(-rx*.16, -ry*.22, rx*.48, ry*.30, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      if (wet > .25 && Math.random() < dt*wet*10)
        rings.push({ x:px + (Math.random()*2-1)*rx*.8, y:sy + (Math.random()*2-1)*ry*.6,
                     r:2, max:16, a:.35, col:"170,190,196" });
      ctx.restore();
      if (p.cool <= 0){
        const hit = tappedNear(px, sy, Math.max(rx, 46));
        if (hit){
          p.cool = .9; p.wob = 1;
          rings.push({ x:px, y:sy, r:4, max:rx*2.2, a:.7, col:"150,132,104" });
          for (let i=0;i<16 && motes.length<MOTE_MAX;i++){
            const a = -Math.PI*.5 + (Math.random()*2-1)*1.2;
            motes.push({
              x:px + (Math.random()*2-1)*rx*.5, y:sy, z:1.25,
              r:lerp(1.2,3,Math.random()), a:lerp(.6,1,Math.random()),
              vx:Math.cos(a)*lerp(50,190,Math.random()),
              vy:Math.sin(a)*lerp(70,220,Math.random()),
              ph:Math.random()*TAU, life:lerp(.5,1.2,Math.random()),
              sp: glow(Math.random()<.6 ? "108,88,60" : "146,124,92")
            });
          }
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}

/* ────────────────────────────  render  ───────────────────────────── */
let vignette = null, skyGrad = null, topScrim = null, botScrim = null, toneGrad = null;

function buildGrads(){
  topScrim = ctx.createLinearGradient(0,0,0,H*.24);
  topScrim.addColorStop(0,"rgba(3,10,7,.62)"); topScrim.addColorStop(1,"rgba(3,10,7,0)");
  botScrim = ctx.createLinearGradient(0,H*.72,0,H);
  botScrim.addColorStop(0,"rgba(2,8,5,0)"); botScrim.addColorStop(1,"rgba(2,8,5,.55)");
  skyGrad = ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,    "#030b07");
  skyGrad.addColorStop(0.34, "#05130c");
  skyGrad.addColorStop(0.72, "#071a10");
  skyGrad.addColorStop(1,    "#040b07");
  toneGrad = ctx.createLinearGradient(W, 0, 0, H);
  toneGrad.addColorStop(0,   "rgba(255,206,132,1)");
  toneGrad.addColorStop(.55, "rgba(128,128,128,1)");
  toneGrad.addColorStop(1,   "rgba(72,118,164,1)");
  const R = Math.hypot(W,H)*.72;
  vignette = ctx.createRadialGradient(W*.5, H*.44, R*.30, W*.5, H*.5, R);
  vignette.addColorStop(0,   "rgba(0,0,0,0)");
  vignette.addColorStop(.62, "rgba(2,8,5,.26)");
  vignette.addColorStop(1,   "rgba(1,5,3,.80)");
}

function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  blooms = [];
  updateSeasonGlobals();
  dryNow    = terAt(scrollY + H*.5, "dry");
  dryB      = Math.round(dryNow*2);
  poolNow   = zoneAmt(POOL);
  woodNow   = zoneAmt(WOOD);
  leafFall  = woodNow * Math.max(seaW[2], seaW[0]*.75);   // only under the trees
  henNow    = zoneAmt(HENS);
  autumnNow = leafFall;
  gradeB    = dryB + 3*seasonQ + 18*(nightNow > .5 ? 1 : 0);
  lakeNow   = hardAt(scrollY + H*.5);

  // ground + air
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,W,H);

  // late sun, upper right
  ctx.globalCompositeOperation = "lighter";
  const pulse = (.10 + .022*Math.sin(time*.34)) * (1 - wet*.62) * (1 - nightNow*.85) * (1 - seaW[3]*.4);
  ctx.globalAlpha = pulse;
  ctx.drawImage(SP_SUN, W*.52, -H*.30, W*1.1, H*1.0);
  ctx.globalAlpha = .05;
  ctx.drawImage(SP_MOTEB, -W*.3, H*.42, W*1.2, H*.9);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  // distant mass
  drawTile(scrollY, .94 * (1 - lakeNow*.92));
  if (dryNow > .02){
    ctx.globalCompositeOperation = "overlay";
    ctx.globalAlpha = .30 * dryNow;
    ctx.fillStyle = "rgba(158,126,64,1)";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
  drawSoil();
  drawLake(dt);
  drawRoad(dt);
  drawTown();
  drawFarmGround();
  drawSnowGround();
  drawPoolGround();
  drawAutumnGround();
  drawHenGround();
  drawNightGround();
  drawPuddles(dt);
  drawTracks();            // pressed into the ground, so grass still passes over
  drawCrumbs();
  drawPlantedPads();
  drawFoliage();
  drawBirdShadows();

  // haze between the far plate and the field
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = .055;
  ctx.fillStyle = "rgba(150,196,140,1)";
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  drawMotes(dt, 0);

  for (const L of LAYERS) if (L.plate === "main"){
    if (L.id === 3){ drawStanding(dt); drawSprouts(); drawFlies(); drawBees(); drawHog(); }

    drawLayer(ctx, L, dt);
  }

  // drifting cloud shadow
  ctx.globalCompositeOperation = "multiply";
  for (let i=0;i<3;i++){
    const t = time*.035 + i*2.1;
    const sx = (mod(t*0.34 + i*0.37, 1.6) - .3) * W;
    const sy = mod(-scrollY*0.16 + i*640, H + 900) - 450;
    const rr = W*(1.1 + i*0.35);
    ctx.globalAlpha = .30 + .07*Math.sin(time*.2 + i);
    ctx.drawImage(SP_SHADE, sx - rr/2, sy - rr/2, rr, rr);
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  if (wet > .02){
    ctx.fillStyle = "rgba(88,116,132," + (0.19*wet).toFixed(3) + ")";
    ctx.fillRect(0,0,W,H);
  }
  if (nightNow > .02){
    ctx.globalCompositeOperation = "multiply";
    ctx.globalAlpha = nightNow*.74;
    ctx.fillStyle = "rgba(56,70,108,1)";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
  if (seaW[3] > .04){
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = seaW[3]*.09;
    ctx.fillStyle = "rgba(150,182,224,1)";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
  drawBubbles();
  drawKicked();
  drawFireflies();

  // blurred foreground plate
  fgx.setTransform(FGS,0,0,FGS,0,0);
  fgx.clearRect(0,0,W,H);
  leafSpots.length = 0;
  for (const L of LAYERS) if (L.plate === "fg") drawLayer(fgx, L, dt);
  drawFgProps(fgx, dt);
  drawSnowfall(fgx, 1);      // the near, out-of-focus end of the drift
  drawFallLeaves(fgx, 1);
  drawZoneFgPlate(fgx);
  ctx.imageSmoothingQuality = "high";
  ctx.globalAlpha = .96;
  ctx.drawImage(fgc, 0,0,W,H);
  ctx.globalAlpha = 1;

  drawRain();
  drawSnowfall(ctx, 0);      // and the far, sharp, small end
  drawFallLeaves(ctx, 0);
  drawFeathers();
  drawCanopy();
  drawZoneFgSharp(dt);
  drawBirds();
  drawCat();
  drawBokeh();
  drawMotes(dt, 1);
  drawRings(dt);
  drawHogMark();

  // touch bloom
  if (ptrs.size){
    ctx.globalCompositeOperation = "lighter";
    for (const p of ptrs.values()){
      const r = 190 + Math.sin(time*3.4)*10;
      ctx.globalAlpha = .12;
      ctx.drawImage(SP_TOUCH, p.x-r, p.y-r, r*2, r*2);
      ctx.globalAlpha = .09;
      const r2 = 62;
      ctx.drawImage(SP_TOUCH, p.x-r2, p.y-r2, r2*2, r2*2);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  // Optical diffusion: take the frame, square it so only the bright parts
  // survive, blur it by downsampling twice, and add it back. Light bleeds.
  if (bl2.width > 2){
    bl1x.setTransform(1,0,0,1,0,0);
    bl1x.globalCompositeOperation = "source-over";
    bl1x.imageSmoothingQuality = "high";
    bl1x.clearRect(0, 0, bl1.width, bl1.height);
    bl1x.drawImage(cv, 0, 0, bl1.width, bl1.height);

    bl2x.setTransform(1,0,0,1,0,0);
    bl2x.globalCompositeOperation = "source-over";
    bl2x.imageSmoothingQuality = "high";
    bl2x.clearRect(0, 0, bl2.width, bl2.height);
    bl2x.drawImage(bl1, 0, 0, bl2.width, bl2.height);
    bl2x.globalCompositeOperation = "multiply";
    bl2x.drawImage(bl1, 0, 0, bl2.width, bl2.height);
    bl2x.globalCompositeOperation = "source-over";

    ctx.imageSmoothingQuality = "high";
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = .62;
    ctx.drawImage(bl2, 0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  // warm light, cool shadow
  ctx.globalCompositeOperation = "soft-light";
  ctx.globalAlpha = .34;
  ctx.fillStyle = toneGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  // frame scrims
  ctx.fillStyle = topScrim; ctx.fillRect(0,0,W,H*.24);
  ctx.fillStyle = botScrim; ctx.fillRect(0,H*.72,W,H*.28);

  ctx.fillStyle = vignette;
  ctx.fillRect(0,0,W,H);

  // grain
  if (grainPat){
    ctx.save();
    ctx.globalCompositeOperation = "overlay";
    ctx.globalAlpha = .055;
    ctx.translate(-(Math.random()*128|0), -(Math.random()*128|0));
    ctx.fillStyle = grainPat;
    ctx.fillRect(0,0,W+128,H+128);
    ctx.restore();
  }
}

function drawMotes(dt, near){
  ctx.globalCompositeOperation = "lighter";
  for (let i=motes.length-1;i>=0;i--){
    const m = motes[i];
    if (near ? m.z < 1 : m.z >= 1) continue;
    ctx.globalAlpha = m.a * (m.life > 0 ? clamp(m.life,0,1) : .55 + .45*Math.sin(time*1.6+m.ph));
    const r = m.r * m.z * 4.2;
    ctx.drawImage(m.sp, m.x-r, m.y-r, r*2, r*2);
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}

function updateMotes(dt){
  for (let i=motes.length-1;i>=0;i--){
    const m = motes[i];
    const wnd = gustAt(m.x)*90 + Math.sin(time*.7 + m.ph)*7;
    m.x += (m.vx + wnd) * dt;
    m.y += m.vy * dt;
    m.y -= (scrollY - lastScroll) * (0.92 + m.z*0.30);
    m.vx *= Math.exp(-1.1*dt);
    m.vy = lerp(m.vy, -lerp(3,14,m.z*.5), 1-Math.exp(-1.4*dt));
    if (m.life > 0){ m.life -= dt; if (m.life <= 0){ motes.splice(i,1); continue; } }
    if (m.x < -40) m.x = W+40; if (m.x > W+40) m.x = -40;
    if (m.y < -40) m.y = H+40; if (m.y > H+40) m.y = -40;
  }
}

/* ────────────────────────────  loop  ─────────────────────────────── */
let last = performance.now(), lastScroll = 0, fpsAcc = 0, fpsN = 0;

function tick(now){
  const dt = clamp((now - last)/1000, 0.0005, 0.05);
  last = now; time += dt; frameId++;

  // adaptive quality
  fpsAcc += dt; fpsN++;
  if (fpsN >= 40){
    const avg = fpsAcc/fpsN; fpsAcc = 0; fpsN = 0;
    if (avg > 1/44) quality = clamp(quality - .10, .42, 1);
    else if (avg < 1/57) quality = clamp(quality + .05, .42, 1);
  }

  breeze = (.10 + .055*Math.sin(time*.19) + .04*Math.sin(time*.071 + 1.7))
           * (REDUCED ? .45 : 1) * (1 + wet*.55);
  updateWind(dt);

  // pointer velocity
  for (const p of ptrs.values()){
    p.vx = lerp(p.vx, (p.x - p.px)/dt, .4);
    p.vy = lerp(p.vy, (p.y - p.py)/dt, .4);
    p.px = p.x; p.py = p.y;
    p.age += dt;
    p.sow -= dt;
    if (p.sow <= 0){
      p.sow = lerp(.60, .19, clamp(p.age/6.5, 0, 1));
      sow(p.x + (Math.random()*2-1)*24, p.y + 6 + (Math.random()*2-1)*12);
    }
    if (Math.hypot(p.vx,p.vy) > 480 && Math.random() < dt*14) puff(p.x, p.y, 2, .7);
  }

  lastScroll = scrollY;
  if (dragId === null){
    scrollY += scrollV * dt;
    scrollV *= Math.exp(-2.1*dt);
    if (Math.abs(scrollV) < 6) scrollV = 0;
    scrollY += drift * dt;
  }

  updateWeather(dt);
  updateMotes(dt);
  updateBokeh(dt);
  updateSprouts(dt);
  updateBees(dt);
  collectPerches();
  updateBirds(dt);
  updatePads(dt);
  updateMush(dt);
  updateFlies(dt);
  updateSnowfall(dt);
  updateFallLeaves(dt);
  updateKicked(dt);
  updateBubbles(dt);
  updateFireflies(dt);
  updateEggs(dt);
  updateFeathers(dt);
  ageKeepers(snowmen, dt);
  updateZone(dt);
  updateCat(dt, ptrs.size > 0 || Math.abs(scrollV) > 26 || Math.abs(scrollY - lastScroll) > 1.4);
  updateGame(dt);
  updateMeter(dt);
  render(dt);
  taps.length = 0;

  if (frameId % 90 === 0){
    for (const [k,c] of cells) if (frameId - c.seen > 130) cells.delete(k);
  }
  requestAnimationFrame(tick);
}

/* ───────────────────────────  resize  ────────────────────────────── */
let resizeT = 0;
function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  fgc.width = Math.max(1, Math.round(W*FGS)); fgc.height = Math.max(1, Math.round(H*FGS));
  canc.width = Math.max(1, Math.round(W*CANS)); canc.height = Math.max(1, Math.round(H*CANS));
  bl1.width = Math.max(1, Math.round(W*.26));  bl1.height = Math.max(1, Math.round(H*.26));
  bl2.width = Math.max(1, Math.round(W*.085)); bl2.height = Math.max(1, Math.round(H*.085));
  const sizeK = clamp(H/844, .8, 1.35);
  const dens  = clamp(Math.pow((390*844)/(W*H), .28), .55, 1.15);
  for (const L of LAYERS){
    L.RH = L.rowH * sizeK;
    L.LA = L.lenMin * sizeK;
    L.LB = L.lenMax * sizeK;
    L.perCell = Math.max(3, Math.round(W / (L.gap * sizeK) * dens));
  }
  cells.clear();
  gradArr.length = 0;
  bladePaths.clear();
  buildGrads();
  grainPat = ctx.createPattern(SP_GRAIN, "repeat");
  seedMotes(); seedBokeh(); seedRain(); seedFlakes(); seedFallLeaves();
  clearTimeout(resizeT);
  resizeT = setTimeout(bakeTile, 90);
}
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 140); });
window.addEventListener("orientationchange", () => setTimeout(resize, 260));

resize();
clearTimeout(resizeT);
bakeTile();
requestAnimationFrame(t => { last = t; tick(t); });
setTimeout(() => curtain.classList.add("lift"), 60);
setTimeout(() => { if (!awake) hud.classList.add("gone"); }, 9000);
})();
</script>
